name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  commit-identity:
    uses: X-DSI/agent-workflow/.github/workflows/commit-identity.yml@v0.0.1-alpha
    with:
      agent-workflow-ref: v0.0.1-alpha

  content:
    name: Validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml
      - run: python tools/validate.py --strict

  engine:
    name: Lint and test engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Build content
        run: python -m engine.build
