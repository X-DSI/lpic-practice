[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lpic-practice"
version = "0.1.0"
description = "Practice suite for the LPIC exams: question bank, engine, CLI and mock exams."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.18",
  "pyyaml>=6.0",
  "textual>=8.0",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "uvicorn>=0.30",
]

[project.scripts]
lpic = "cli.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["engine*", "cli*", "web*"]

[tool.setuptools.package-data]
web = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
