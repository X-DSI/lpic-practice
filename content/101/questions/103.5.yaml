  - id: 101-103.5-0055
    type: single_choice
    difficulty: 4
    pool: practice
    stem: Based on the output below, which job does `fg` resume when you type it without arguments?
    exhibit: |
      $ jobs
      [1]   Running                 sleep 300 &
      [2]-  Running                 sleep 400 &
      [3]+  Stopped                 sleep 500
    options:
      - id: a
        text: "`sleep 300`, because it is job number 1"
        rationale: Wrong. fg does not pick the lowest job number; it picks the current job.
      - id: b
        text: "`sleep 400`, because it is marked -"
        rationale: Wrong. - marks the previous job, which becomes current only when the + job ends.
      - id: c
        text: "`sleep 500`, because it is marked +"
        rationale: Correct. + marks the current job, the default for fg and bg.
      - id: d
        text: None; fg prints an error without a job specification
        rationale: Wrong. fg and bg default to the current job; it is kill that needs an explicit job or PID.
    answer: [c]
    explanation: >
      The current job (+) is the one most recently stopped or started in the background. fg and bg
      act on it when no job is named; %+ and %% name it explicitly.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: Job Specification }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [fg, jobspec]

  - id: 101-103.5-0056
    type: multi_choice
    difficulty: 4
    pool: practice
    stem: >
      You must start a three-hour job over an SSH connection that may drop. Which **TWO** approaches
      keep the job running if the connection is lost?
    select_count: 2
    options:
      - id: a
        text: Run `./job.sh &`, then check it with `jobs -l`
        rationale: Wrong. The job is still tied to the session and can be ended by SIGHUP when the connection drops.
      - id: b
        text: Run `nohup ./job.sh &`
        rationale: Correct. The job ignores SIGHUP, and its output goes to nohup.out.
      - id: c
        text: Run `./job.sh`, then press Ctrl+Z
        rationale: Wrong. Ctrl+Z stops the job; it would not even be running.
      - id: d
        text: Start it inside a tmux or screen session and detach
        rationale: Correct. The multiplexer server keeps the session and its programs alive without the SSH connection.
    answer: [b, d]
    explanation: >
      nohup protects a single command from the hangup signal. A terminal multiplexer goes further:
      you can reattach later (tmux attach, screen -r) and work with the program interactively again.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 2, section: Features of Terminal Multiplexers }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [nohup, screen, tmux]

