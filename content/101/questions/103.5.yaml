  - id: 101-103.5-0058
    type: single_choice
    difficulty: 4
    pool: practice
    stem: The summary area of `top` reports `1 zombie`. What is a zombie process?
    options:
      - id: a
        text: A process stopped with Ctrl+Z or SIGSTOP
        rationale: Wrong. Stopped processes are counted under "stopped" and shown with state T.
      - id: b
        text: A process waiting for disk I/O that cannot be interrupted
        rationale: Wrong. That is uninterruptible sleep, state D.
      - id: c
        text: A process that keeps running after its terminal was closed
        rationale: Wrong. That describes a process started with nohup or in a detached multiplexer session.
      - id: d
        text: A process that has exited but has not been reaped by its parent
        rationale: Correct. Its entry stays in the process table, with state Z, until the parent reaps it.
    answer: [d]
    explanation: >
      A zombie has exited and uses no CPU or memory beyond its process table entry. It disappears
      when its parent waits for it or when the parent itself exits. Sending it signals does nothing.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: An Explanation of the output of top }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: fixed, notes: "Correct option shortened; it was the longest option." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [top, zombie]

  - id: 101-103.5-0059
    type: single_choice
    difficulty: 4
    pool: practice
    stem: >
      You run `watch free` and want each refresh to highlight the values that changed since the
      previous one. Which `watch` option adds this?
    options:
      - id: a
        text: "`-n`"
        rationale: Wrong. -n sets the interval between runs.
      - id: b
        text: "`-t`"
        rationale: Wrong. -t hides the header line.
      - id: c
        text: "`-d`"
        rationale: Correct. -d (--differences) highlights what changed between updates.
      - id: d
        text: "`-g`"
        rationale: Wrong. -g makes watch exit when the output changes.
    answer: [c]
    explanation: >
      watch -d highlights changes between two refreshes; `-d=permanent` keeps highlighting everything
      that has changed since watch started.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: Process Monitoring }
    review:
      status: pass2
      history:
