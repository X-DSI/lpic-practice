  - id: 101-103.5-0041
    type: single_choice
    difficulty: 1
    pool: practice
    stem: Which command shows a continuously updated, interactive list of running processes?
    options:
      - id: a
        text: "`ps`"
        rationale: Wrong. ps prints a one-time snapshot and exits.
      - id: b
        text: "`top`"
        rationale: Correct. top refreshes its display every few seconds and accepts interactive keys.
      - id: c
        text: "`pgrep`"
        rationale: Wrong. pgrep prints the PIDs of matching processes once.
      - id: d
        text: "`uptime`"
        rationale: Wrong. uptime prints one line with uptime, users and load averages.
    answer: [b]
    explanation: >
      top is dynamic: it keeps refreshing and lets you sort, filter, renice and signal processes with
      single keys. ps is static: it reports the state at the moment you run it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: top and ps }
    review:
      status: pass2
