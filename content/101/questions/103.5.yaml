  - id: 101-103.5-0001
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      A long `tar` command is running in the foreground of your shell. You want your prompt back
      without ending the command, so that you can decide later what to do with it. Which key
      combination do you press?
    options:
      - id: a
        text: Ctrl+C
        rationale: Wrong. Ctrl+C sends SIGINT, which normally ends the program.
      - id: b
        text: Ctrl+Z
        rationale: Correct. Ctrl+Z sends SIGTSTP; the shell reports the job as Stopped and gives back the prompt.
      - id: c
        text: Ctrl+D
        rationale: Wrong. Ctrl+D signals end of input to a program reading the terminal; it does not suspend anything.
      - id: d
        text: Ctrl+\
        rationale: Wrong. Ctrl+\ sends SIGQUIT, which ends the program (and may dump core).
    answer: [b]
    explanation: >
      Ctrl+Z suspends the foreground job. It stays in the shell's job table as Stopped, and you can
      later resume it with fg (foreground) or bg (background), or end it with kill.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: Job Control }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [job-control, ctrl-z]

  - id: 101-103.5-0002
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      Which shell builtin lists the jobs started from the current shell, each with its job number
      and state (for example Running or Stopped)?
    options:
      - id: a
        text: "`ps`"
        rationale: Wrong. ps lists processes by PID; it knows nothing about the shell's job numbers.
      - id: b
        text: "`bg`"
        rationale: Wrong. bg resumes a stopped job in the background; it does not list jobs.
      - id: c
        text: "`top`"
        rationale: Wrong. top shows a live view of all processes, not the current shell's jobs.
      - id: d
        text: "`jobs`"
        rationale: Correct. jobs prints each job as [n], a +/- marker, its state and its command line.
    answer: [d]
    explanation: >
      Job numbers belong to the shell that started the jobs, so only shell builtins such as jobs, fg,
      bg and kill understand them. Tools like ps and top work with process IDs instead.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: Job Control }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [jobs]

  - id: 101-103.5-0003
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: You run `kill 2345` without naming a signal. Which signal does process 2345 receive?
    options:
      - id: a
        text: SIGHUP (1)
        rationale: Wrong. SIGHUP must be requested explicitly, for example with kill -HUP.
      - id: b
        text: SIGKILL (9)
        rationale: Wrong. SIGKILL must be requested explicitly, for example with kill -9.
      - id: c
        text: SIGTERM (15)
        rationale: Correct. SIGTERM is the default signal of kill, pkill and killall.
      - id: d
        text: SIGSTOP (19)
        rationale: Wrong. SIGSTOP pauses a process and is only sent when you ask for it.
    answer: [c]
    explanation: >
      kill, pkill and killall all send SIGTERM (15) unless told otherwise. SIGTERM asks the process to
      terminate and lets it clean up first; a process may catch or ignore it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "Sending Signals to Processes: kill" }
    verify:
      command: bash -c 'sleep 30 & p=$!; kill $p; wait $p; echo "status=$?"'
      expect: { exit_code: 0, stdout_contains: "status=143" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [kill, signals, sigterm]

  - id: 101-103.5-0004
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: What information does the `free` command display?
    options:
      - id: a
        text: How much RAM and swap space is used and available
        rationale: Correct. free shows total, used, free, shared, buff/cache and available memory, plus swap.
      - id: b
        text: How much space is left on each mounted filesystem
        rationale: Wrong. That is df.
      - id: c
        text: Which processes are using the least CPU time
        rationale: Wrong. Per-process CPU usage is shown by top or ps.
      - id: d
        text: How many inodes are still unused on each filesystem
        rationale: Wrong. That is df -i.
    answer: [a]
    explanation: >
      free gives a snapshot of memory use: a Mem line for physical RAM and a Swap line. The available
      column estimates how much memory new programs can get without swapping.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: Process Monitoring }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [free, memory]

  - id: 101-103.5-0005
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      With GNU Screen's default settings, which key combination do you press before a command key
      such as `c` or `d`?
    options:
      - id: a
        text: Ctrl+a
        rationale: Correct. Screen's default command prefix (escape key) is Ctrl+a.
      - id: b
        text: Ctrl+b
        rationale: Wrong. Ctrl+b is tmux's default prefix.
      - id: c
        text: Ctrl+x
        rationale: Wrong. Ctrl+x is not screen's prefix; it is better known as an Emacs prefix key.
      - id: d
        text: Ctrl+Space
        rationale: Wrong. Ctrl+Space is not a multiplexer prefix by default.
    answer: [a]
    explanation: >
      Every screen command starts with the prefix Ctrl+a followed by another key, for example Ctrl+a c
      for a new window or Ctrl+a d to detach. The prefix can be changed with the escape directive in
      ~/.screenrc.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 2, section: GNU Screen }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [screen, prefix]

  - id: 101-103.5-0006
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      Which character, added at the end of a command line, starts the command as a background job
      so that the prompt comes back immediately?
    options:
      - id: a
        text: "`|`"
        rationale: Wrong. The pipe sends one command's output into another command.
      - id: b
        text: "`;`"
        rationale: Wrong. The semicolon separates commands that run one after the other in the foreground.
      - id: c
        text: "`&`"
        rationale: Correct. A trailing & runs the command in the background; the shell prints its job number and PID.
      - id: d
        text: "`>`"
        rationale: Wrong. > redirects standard output to a file.
    answer: [c]
    explanation: >
      `command &` starts the command as a background job. The shell prints something like `[1] 4252`
      (job number and PID) and is ready for the next command at once.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "Job Status: Suspension, Foreground and Background" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [background, ampersand]

  - id: 101-103.5-0007
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: What is the default prefix key of tmux?
    options:
      - id: a
        text: Ctrl+a
        rationale: Wrong. Ctrl+a is GNU Screen's default prefix.
      - id: b
        text: Ctrl+t
        rationale: Wrong. Ctrl+t is not bound as a prefix in tmux.
      - id: c
        text: Alt+b
        rationale: Wrong. tmux uses a Ctrl combination, not Alt, as its default prefix.
      - id: d
        text: Ctrl+b
        rationale: Correct. tmux commands are typed as Ctrl+b followed by a key.
    answer: [d]
    explanation: >
      tmux's prefix is Ctrl+b, so for example Ctrl+b c opens a new window and Ctrl+b d detaches. It
      can be changed in the tmux configuration file with `set -g prefix`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 2, section: tmux }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [tmux, prefix]

  - id: 101-103.5-0008
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      While a large copy runs, you want the output of `df -h` redrawn on the screen every couple of
      seconds until you press Ctrl+C. Which command does this?
    options:
      - id: a
        text: "`watch df -h`"
        rationale: Correct. watch runs the command repeatedly (every 2 seconds by default) and shows its latest output full-screen.
      - id: b
        text: "`top df -h`"
        rationale: Wrong. top displays processes; it does not run another command repeatedly.
      - id: c
        text: "`nohup df -h`"
        rationale: Wrong. nohup runs the command once, immune to hangups; it does not repeat it.
      - id: d
        text: "`tail -f df -h`"
        rationale: Wrong. tail -f follows files; here it would look for files named df and -h.
    answer: [a]
    explanation: >
      watch re-runs a command at a fixed interval and redraws its output, with a header line showing
      the interval and command. The default interval is 2 seconds; -n changes it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: Process Monitoring }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [watch]

  - id: 101-103.5-0009
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      Over SSH you need to start `./import.sh`, which runs for hours. It must ignore the hangup
      signal (SIGHUP) it would get if the SSH connection drops, and you want your prompt back
      straight away. Which command line does this?
    options:
      - id: a
        text: "`./import.sh &`"
        rationale: Wrong. The job runs in the background, but if the connection drops the shell passes SIGHUP on to its jobs and this one ends.
      - id: b
        text: "`bg ./import.sh`"
        rationale: Wrong. bg takes a job specification of an existing stopped job, not a command to start.
      - id: c
        text: "`nohup ./import.sh &`"
        rationale: Correct. nohup makes the command ignore SIGHUP, and & puts it in the background.
      - id: d
        text: "`nohup fg ./import.sh`"
        rationale: Wrong. fg resumes an existing job of the current shell; it does not start a command, so nohup has nothing useful to run.
    answer: [c]
    explanation: >
      nohup starts a command with SIGHUP ignored, so it survives the end of the login session. Adding
      & frees the terminal. If standard output is a terminal, nohup appends the output to nohup.out.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "Detached Jobs: nohup" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Stem names SIGHUP from a dropped connection; rationales a and d reworded per reviewer." }
    tags: [nohup, sighup]

  - id: 101-103.5-0010
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      Before restarting a database, you want a list of the PIDs of all running `postgres` processes,
      one per line, without disturbing them. Which command gives it?
    options:
      - id: a
        text: "`pkill postgres`"
        rationale: Wrong. pkill sends SIGTERM to the matching processes instead of printing their PIDs.
      - id: b
        text: "`pgrep postgres`"
        rationale: Correct. pgrep prints one PID per line for each process whose name matches the pattern.
      - id: c
        text: "`killall postgres`"
        rationale: Wrong. killall sends SIGTERM to every process named postgres.
      - id: d
        text: "`jobs -p postgres`"
        rationale: Wrong. jobs only knows the current shell's jobs; it would report that no such job exists.
    answer: [b]
    explanation: >
      pgrep looks up processes by name (or by user, terminal and so on) and prints their PIDs. pkill
      takes the same selection options but signals the processes instead.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "Sending Signals to Processes: kill" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Scenario reworded (postgres, pre-restart check) away from the lesson's Guided step; key unchanged." }
    tags: [pgrep]

  - id: 101-103.5-0011
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: In the output below, what does the last number, `0.27`, show?
    exhibit: |
      $ uptime
       13:15:30 up 19 min,  0 user,  load average: 0.26, 0.34, 0.27
    options:
      - id: a
        text: The average system load over the last minute
        rationale: Wrong. The 1-minute average is the first of the three numbers (0.26).
      - id: b
        text: The average system load over the last 5 minutes
        rationale: Wrong. The 5-minute average is the middle number (0.34).
      - id: c
        text: The share of CPU time in use, as a fraction (27%)
        rationale: Wrong. Load average counts runnable and waiting processes; it is not a CPU percentage.
      - id: d
        text: The average system load over the last 15 minutes
        rationale: Correct. The three load averages cover the last 1, 5 and 15 minutes, in that order.
    answer: [d]
    explanation: >
      uptime shows the current time, how long the system has been up, the number of logged-in users
      and the load averages for the last 1, 5 and 15 minutes. The same line heads top's output.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: Process Monitoring }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [uptime, load-average]

  - id: 101-103.5-0012
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      You are inside a GNU Screen session. You want to leave it running with all its windows and
      return to the shell you started screen from. Which key sequence do you use?
    options:
      - id: a
        text: Ctrl+a k
        rationale: Wrong. Ctrl+a k kills the current window, after a confirmation.
      - id: b
        text: Ctrl+a c
        rationale: Wrong. Ctrl+a c creates a new window inside the session.
      - id: c
        text: Ctrl+a d
        rationale: Correct. Ctrl+a d detaches the session; screen prints "[detached from ...]".
      - id: d
        text: Ctrl+a w
        rationale: Wrong. Ctrl+a w only shows the list of windows at the bottom of the display.
    answer: [c]
    explanation: >
      Detaching leaves the session and everything running in it alive. You get back to it later with
      screen -r, from the same or another terminal.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 2, section: "GNU Screen: Session Detachment" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [screen, detach]

  - id: 101-103.5-0013
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: From an ordinary shell prompt, which command lists the existing tmux sessions?
    options:
      - id: a
        text: "`screen -ls`"
        rationale: Wrong. This lists GNU Screen sessions, not tmux sessions.
      - id: b
        text: "`tmux ls`"
        rationale: Correct. tmux ls (short for list-sessions) prints each session with its window count and state.
      - id: c
        text: "`tmux -ls`"
        rationale: Wrong. tmux has no -s option; this fails with "unknown option".
      - id: d
        text: "`tmux list-panes`"
        rationale: Wrong. list-panes lists the panes of a window, not the sessions.
    answer: [b]
    explanation: >
      `tmux ls` (or `tmux list-sessions`) shows lines such as
      `LPI: 2 windows (created ...)`, with `(attached)` for sessions that have a client attached.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 2, section: "tmux: Sessions" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [tmux, sessions]

  - id: 101-103.5-0014
    type: multi_choice
    difficulty: 2
    pool: holdout
    stem: >
      Several `ffmpeg` encodes are overloading the host. Which **TWO** commands pause all of them at
      once (SIGSTOP), selecting them by name rather than by PID?
    select_count: 2
    options:
      - id: a
        text: "`kill -STOP ffmpeg`"
        rationale: 'Wrong. kill needs PIDs or job specs ("arguments must be process or job IDs").'
      - id: b
        text: "`pkill -STOP ffmpeg`"
        rationale: Correct. pkill sends the given signal to every process whose name matches.
      - id: c
        text: "`pgrep -r T ffmpeg`"
        rationale: Wrong. This only lists matching processes that are already stopped.
      - id: d
        text: "`killall -STOP ffmpeg`"
        rationale: Correct. killall sends the given signal to every process with that name.
    answer: [b, d]
    explanation: >
      pkill and killall select processes by name and accept a signal option such as -STOP (resume
      them later with -CONT). With plain kill you would first need the PIDs, for example
      `kill -STOP $(pgrep ffmpeg)`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "Sending Signals to Processes: kill" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Replaced: restated Guided Ex. 3. New SIGSTOP-by-name question; text from the reviewer, tested live." }
    tags: [pkill, killall, sigstop]

  - id: 101-103.5-0015
    type: fill_in
    difficulty: 2
    pool: holdout
    stem: >
      Based on the output below, type the command that brings `sleep 400` back to the foreground
      of this shell.
    exhibit: |
      $ jobs
      [1]   Running                 sleep 300 &
      [2]-  Running                 sleep 400 &
      [3]+  Stopped                 sleep 500
    fill_in:
      accepted: ['fg\s+%?2', 'fg\s+%(-|\?(4|40|400))', '%(2|-|\?(4|40|400))']
      match: regex
      case_sensitive: true
    explanation: >
      fg takes a job specification: %2 (or just 2 in bash) for job number 2. %- (the previous job)
      and %?400 (the job whose command contains "400") also point to it here, and in bash typing the
      job specification alone, such as %2, also resumes it in the foreground. Plain fg would pick the
      current job, [3].
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "Job Status: Suspension, Foreground and Background" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [fg, jobspec]

  - id: 101-103.5-0016
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      A hung process ignores `kill 4100`. Which signal can a process neither catch nor ignore, so
      that sending it ends the process?
    options:
      - id: a
        text: SIGINT
        rationale: Wrong. SIGINT (what Ctrl+C sends) can be caught or ignored by the program.
      - id: b
        text: SIGKILL
        rationale: Correct. SIGKILL (9) cannot be caught, blocked or ignored; the kernel ends the process.
      - id: c
        text: SIGTERM
        rationale: Wrong. SIGTERM is what kill sent already; a process can catch or ignore it.
      - id: d
        text: SIGHUP
        rationale: Wrong. SIGHUP can be caught or ignored; many daemons treat it as "reload configuration".
    answer: [b]
    explanation: >
      Try SIGTERM first so the program can clean up. If it does not react, `kill -9 PID`
      (or -KILL, -SIGKILL, -s KILL) ends it unconditionally.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "Sending Signals to Processes: kill" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [kill, signals, sigkill]

  - id: 101-103.5-0017
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: In the BSD-style command `ps aux`, what does the `x` contribute?
    options:
      - id: a
        text: It adds processes with no controlling terminal
        rationale: Correct. x lifts the restriction to processes attached to a terminal.
      - id: b
        text: It adds processes belonging to all users, not only your own
        rationale: Wrong. That is what a does (all processes with a terminal, from every user).
      - id: c
        text: It adds user-oriented columns such as USER, %CPU and %MEM
        rationale: Wrong. That is the u option.
      - id: d
        text: It shows the process tree as ASCII art
        rationale: Wrong. That is f (BSD) or --forest.
    answer: [a]
    explanation: >
      In ps aux, a lists processes with a terminal from every user, x adds processes without a
      terminal, and u selects the user-oriented output format. Together they show every process.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "An Explanation of ps Option Syntax and Output" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Correct option shortened to avoid a length giveaway." }
    tags: [ps]

  - id: 101-103.5-0018
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: "`top` is running. Which key re-sorts the task list by memory usage?"
    options:
      - id: a
        text: "`P`"
        rationale: Wrong. P sorts by CPU usage, which is also the default.
      - id: b
        text: "`T`"
        rationale: Wrong. T sorts by accumulated CPU time (TIME+).
      - id: c
        text: "`N`"
        rationale: Wrong. N sorts by process ID.
      - id: d
        text: "`M`"
        rationale: Correct. M sorts by %MEM.
    answer: [d]
    explanation: >
      top's sort keys are upper case: M (memory), P (CPU), T (time) and N (PID). R reverses the
      order. To start top already sorted by memory, use `top -o %MEM`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: Interacting with top }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [top, sorting]

  - id: 101-103.5-0019
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      Which `jobs` option keeps the usual job number, state and command for each job and adds the
      process ID?
    options:
      - id: a
        text: "`-p`"
        rationale: Wrong. -p prints only the process IDs, without job numbers, states or commands.
      - id: b
        text: "`-l`"
        rationale: Correct. jobs -l prints the PID between the job marker and the state.
      - id: c
        text: "`-r`"
        rationale: Wrong. -r restricts the list to running jobs; it adds no PIDs.
      - id: d
        text: "`-n`"
        rationale: Wrong. -n shows only jobs whose status changed since the last notification.
    answer: [b]
    explanation: >
      A job has both a job number (for fg, bg, kill %n) and a PID (for tools such as ps and top).
      jobs -l shows both; jobs -p is handy in scripts because it prints only the PIDs.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: Job Control }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: fixed, notes: "Rationale no longer quotes a hand-spaced output line." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [jobs]

  - id: 101-103.5-0020
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: In tmux, which key sequence prompts you for a new name for the current window?
    options:
      - id: a
        text: Ctrl+b ,
        rationale: Correct. Ctrl+b , opens the (rename-window) prompt.
      - id: b
        text: Ctrl+b $
        rationale: Wrong. Ctrl+b $ renames the current session, not the window.
      - id: c
        text: Ctrl+b w
        rationale: Wrong. Ctrl+b w shows a list of windows to choose from.
      - id: d
        text: Ctrl+b A
        rationale: Wrong. Ctrl+b A is not bound in tmux; Ctrl+a A is GNU Screen's rename-window key.
    answer: [a]
    explanation: >
      By default tmux names a window after the program running in it and updates the name
      automatically. Ctrl+b , sets a name of your own. Sessions are renamed with Ctrl+b $.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 2, section: "tmux: Windows" }
    review:
      status: pass2
