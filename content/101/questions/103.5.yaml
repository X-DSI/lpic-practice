        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [kill, signals, sighup]

  - id: 101-103.5-0022
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: Which **TWO** statements about splitting the display in GNU Screen and tmux are true?
    select_count: 2
    options:
      - id: a
        text: In GNU Screen, Ctrl+a Q removes every region except the current one, and the windows they showed keep running.
        rationale: Correct. Regions are only views; removing them does not end any window.
      - id: b
        text: In tmux, Ctrl+b x closes the current pane but leaves its program running in the background.
        rationale: Wrong. kill-pane ends the pane's programs.
      - id: c
        text: In tmux, Ctrl+b z zooms the current pane to fill the window, and pressing it again restores the layout.
        rationale: Correct. Ctrl+b z runs resize-pane -Z, which toggles zoom.
      - id: d
        text: A new GNU Screen region made with Ctrl+a S starts a new shell automatically.
        rationale: Wrong. The new region is empty until you pick a window or press Ctrl+a c.
    answer: [a, c]
    explanation: >
      Screen regions are views onto windows: Ctrl+a S or Ctrl+a | adds an empty one, Ctrl+a X
      removes the current one and Ctrl+a Q all others, without closing windows. tmux panes are
      separate terminals: Ctrl+b x kills one with its programs, and Ctrl+b z zooms one.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 2, section: "tmux: Panes" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Replaced: restated lesson-2 Guided table rows. New region/pane statements (Ctrl+a Q, Ctrl+b z); text from the reviewer, tested live. Key now a,c." }
    tags: [screen, tmux, regions, panes]

  - id: 101-103.5-0023
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: With tmux's default key bindings, which **TWO** key sequences split the current window into two panes?
    select_count: 2
    options:
      - id: a
        text: 'Ctrl+b "'
        rationale: Correct. Ctrl+b " runs split-window and puts the new pane below the current one.
      - id: b
        text: Ctrl+b S
        rationale: Wrong. Ctrl+a S splits a region in GNU Screen; Ctrl+b S is not bound in tmux.
      - id: c
        text: Ctrl+b |
        rationale: Wrong. Ctrl+a | is GNU Screen's vertical split; Ctrl+b | is not bound in tmux.
      - id: d
        text: Ctrl+b %
        rationale: Correct. Ctrl+b % runs split-window -h and puts the new pane beside the current one.
    answer: [a, d]
    explanation: >
      tmux splits with Ctrl+b " (one pane above the other) and Ctrl+b % (side by side). Ctrl+b
      arrow moves between panes, Ctrl+b z zooms one, and Ctrl+b x kills it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 2, section: "tmux: Panes" }
    review:
