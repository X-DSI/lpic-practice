  - id: 101-103.5-0037
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      A host runs both `cron` and `anacron`. Which command prints the PID of the `cron` process
      only?
    options:
      - id: a
        text: "`pgrep cron`"
        rationale: Wrong. The pattern also matches inside "anacron", so both PIDs are printed.
      - id: b
        text: "`pgrep -l cron`"
        rationale: Wrong. -l adds the process name to each line but still matches both processes.
      - id: c
        text: "`pgrep -x cron`"
        rationale: Correct. -x requires the whole process name to match the pattern.
      - id: d
        text: "`pgrep -n cron`"
        rationale: Wrong. -n picks the most recently started match, which could be anacron.
    answer: [c]
    explanation: >
      pgrep and pkill treat their argument as a regular expression matched anywhere in the process
      name. Use -x (or anchors such as '^cron$') for an exact name, so that pkill does not hit a
      process you did not mean.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "Sending Signals to Processes: kill" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [pgrep]

  - id: 101-103.5-0038
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: Based on the output below, which command terminates `sleep 400` and nothing else?
    exhibit: |
      $ jobs
      [1]   Running                 sleep 300 &
      [2]-  Running                 sleep 400 &
      [3]+  Running                 sleep 500 &
    options:
      - id: a
        text: "`kill %sl`"
        rationale: 'Wrong. All three jobs start with "sl", so bash refuses with "sl: ambiguous job spec".'
      - id: b
        text: "`kill %+`"
        rationale: Wrong. %+ is the current job, [3] (sleep 500).
      - id: c
        text: "`kill 2`"
        rationale: Wrong. Without % the number is a PID, not a job number; PID 2 is not this job.
      - id: d
        text: "`kill %?400`"
        rationale: Correct. %?400 selects the one job whose command line contains "400", job [2].
    answer: [d]
    explanation: >
      Job specifications start with %: %n (number), %str (command starts with str), %?str (command
      contains str), %+ or %% (current) and %- (previous). %str and %?str must match exactly one
      job. A bare number given to kill is a PID.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: Job Specification }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [kill, jobspec]

  - id: 101-103.5-0039
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      Which command lists every process on the system with its PID, user, %MEM and command name,
      highest memory use first?
    options:
      - id: a
        text: "`ps -eo pid,user,%mem,comm --sort=%mem`"
        rationale: Wrong. Without a leading - the sort is ascending, so the lowest memory users come first.
      - id: b
        text: "`ps -eo pid,user,%mem,comm --sort=-%mem`"
        rationale: Correct. -e selects all processes, -o picks the columns and --sort=-%mem sorts by memory, descending.
      - id: c
        text: "`ps -o pid,user,%mem,comm --sort=-%mem`"
        rationale: Wrong. Without -e (or ax), ps shows only processes of your user on the current terminal.
      - id: d
        text: "`ps -e --sort=-%mem`"
        rationale: Wrong. The order is right, but the default columns (PID TTY TIME CMD) show neither user nor %MEM.
    answer: [b]
    explanation: >
      ps -o (BSD style: o) chooses output columns, and --sort orders the rows by one or more keys; a
      leading - means descending. For a live view sorted by memory, use top and press M, or start
      it with `top -o %MEM`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "An Explanation of ps Option Syntax and Output" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [ps, sorting]

  - id: 101-103.5-0040
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      Your screen session `work` is still attached to a terminal at the office. Over SSH from home
      you want it on your terminal, and it should be detached from the office terminal first.
      Which command do you run?
    options:
      - id: a
        text: "`screen -d -r work`"
        rationale: Correct. -d detaches the session where it is attached, then -r reattaches it here.
      - id: b
        text: "`screen -r work`"
        rationale: Wrong. -r only resumes detached sessions; screen answers "There is no screen to be resumed matching work."
      - id: c
        text: "`screen -x work`"
        rationale: Wrong. -x attaches as an additional display; the office terminal stays attached.
      - id: d
        text: "`screen -d -m work`"
        rationale: Wrong. -d -m starts a new detached session that runs a command called work.
    answer: [a]
    explanation: >
      screen -d -r first detaches the session from wherever it is attached and then attaches it to
      the current terminal. -D -r goes further and also logs out the other side. -d -m is for
      starting new sessions in the background.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 2, section: "GNU Screen: Session Detachment" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [screen, attach]

