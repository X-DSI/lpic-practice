  - id: 101-103.5-0035
    type: multi_choice
    difficulty: 5
    pool: holdout
    stem: >
      User `carol` is in a directory she cannot write to and runs `nohup ./job.sh &` from her
      terminal. Which **TWO** statements are true?
    select_count: 2
    options:
      - id: a
        text: nohup refuses to start the job because it cannot create nohup.out there.
        rationale: Wrong. nohup falls back to $HOME/nohup.out when the current directory is not writable.
      - id: b
        text: The job's output is appended to nohup.out in carol's home directory.
        rationale: Correct. nohup reports "appending output to '/home/carol/nohup.out'".
      - id: c
        text: The job ignores SIGHUP, so closing the terminal does not end it.
        rationale: Correct. Ignoring the hangup signal is nohup's purpose.
      - id: d
        text: The job also ignores SIGTERM, so a plain `kill PID` cannot stop it.
        rationale: Wrong. nohup only sets SIGHUP to be ignored; SIGTERM still ends the job.
    answer: [b, c]
    explanation: >
      nohup ignores SIGHUP for the command and, when output would go to the terminal, appends it to
      nohup.out in the current directory, or in $HOME if that is not writable. Other signals are
      untouched, so kill PID still works.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "Detached Jobs: nohup" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [nohup]

  - id: 101-103.5-0036
    type: multi_choice
    difficulty: 5
    pool: holdout
    stem: You want to get back into your `work` session. Given the output below, which **TWO** commands do that?
    exhibit: |
      $ screen -r
      There are several suitable screens on:
              267.backup      (10/25/26 20:05:42)     (Detached)
              272.work        (10/25/26 20:05:42)     (Detached)
      Type "screen [-d] -r [pid.]tty.host" to resume one of them.
    select_count: 2
    options:
      - id: a
        text: "`screen -S work`"
        rationale: Wrong. -S names a new session; this starts a second session called work.
      - id: b
        text: "`screen -ls`"
        rationale: Wrong. This only lists the sessions again.
      - id: c
        text: "`screen -r 272`"
        rationale: Correct. A session can be named by the PID part of its identifier.
      - id: d
        text: "`screen -r work`"
        rationale: Correct. A session can also be named by its name.
    answer: [c, d]
    explanation: >
      With only one detached session, `screen -r` alone reattaches it. With several, screen lists them
      and you must say which one: by PID (272), by name (work) or by the full identifier
      (272.work).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 2, section: "GNU Screen: Session Detachment" }
