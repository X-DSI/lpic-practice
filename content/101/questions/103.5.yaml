        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [watch]

  - id: 101-103.5-0060
    type: multi_choice
    difficulty: 5
    pool: practice
    stem: >
      Which **TWO** commands send SIGTERM to every `httpd` process run by the user `apache`, and to
      no other processes?
    select_count: 2
    options:
      - id: a
        text: "`pkill -x -u apache httpd`"
        rationale: Correct. -u limits the match to apache's processes and -x to the exact name httpd.
      - id: b
        text: "`pgrep -u apache httpd`"
        rationale: Wrong. This selects the right processes but only prints their PIDs.
      - id: c
        text: "`killall -u apache httpd`"
        rationale: Correct. killall -u limits the named processes to those run by that user.
      - id: d
        text: "`kill -u apache httpd`"
        rationale: Wrong. kill has no user option; it needs PIDs or job specifications.
    answer: [a, c]
    explanation: >
      pkill and killall both send SIGTERM by default and can restrict matches to one user with -u.
      pgrep with the same options shows you first which processes would be hit.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "Sending Signals to Processes: kill" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Option a now pkill -x -u apache httpd so it matches httpd exactly, like killall." }
    tags: [pkill, killall]
