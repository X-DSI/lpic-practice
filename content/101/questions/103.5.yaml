  - id: 101-103.5-0031
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      Based on the `top` summary below, about how much memory can newly started programs get
      without the system starting to swap?
    exhibit: |
      top - 13:14:59 up 19 min,  0 user,  load average: 0.31, 0.36, 0.28
      Tasks:  74 total,   1 running,  72 sleeping,   0 stopped,   1 zombie
      %Cpu(s):  0.0 us,  0.0 sy,  0.0 ni,100.0 id,  0.0 wa,  0.0 hi,  0.0 si,  0.0 st
      MiB Mem :   8027.6 total,   6681.6 free,    716.4 used,    867.1 buff/cache
      MiB Swap:      0.0 total,      0.0 free,      0.0 used.   7311.2 avail Mem
    options:
      - id: a
        text: 6681.6 MiB
        rationale: Wrong. free counts only completely unused memory; reclaimable cache is left out.
      - id: b
        text: 867.1 MiB
        rationale: Wrong. This is the memory used for buffers and page cache.
      - id: c
        text: 7311.2 MiB
        rationale: Correct. avail Mem estimates the memory available to new programs without swapping, including reclaimable cache.
      - id: d
        text: 8027.6 MiB
        rationale: Wrong. This is total RAM, part of which is already in use.
    answer: [c]
    explanation: >
      The fifth line of top's summary ends with avail Mem, the same estimate as the available column
      of free. It is larger than free because most buffer and cache memory can be reclaimed.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: An Explanation of the output of top }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [top, memory]

  - id: 101-103.5-0032
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: Based on the session below, where do the error messages of `export.sh` go?
    exhibit: |
      $ nohup ./export.sh > /tmp/export.log &
      [1] 4245
      $ nohup: ignoring input and redirecting stderr to stdout
    options:
      - id: a
        text: To `nohup.out` in the current directory
        rationale: Wrong. nohup only creates nohup.out when standard output is a terminal; here it was redirected.
      - id: b
        text: To the terminal the command was started from
        rationale: Wrong. nohup says it redirects stderr to stdout, and stdout is the file.
      - id: c
        text: Nowhere; nohup discards them
        rationale: Wrong. nohup redirects error output; it does not throw it away.
      - id: d
        text: To `/tmp/export.log`
        rationale: Correct. Standard error follows standard output, which the shell sent to /tmp/export.log.
    answer: [d]
    explanation: >
      nohup checks where output goes. If standard output is a terminal, it appends output to
      nohup.out (or $HOME/nohup.out). If only standard error is a terminal, as here, it sends
      standard error to wherever standard output goes.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "Detached Jobs: nohup" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: fixed, notes: "Correct option shortened; it was the longest option." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [nohup, redirection]

  - id: 101-103.5-0033
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      Two `sleep` processes are running as your user. Based on the session below, why did the two
      commands behave differently?
    exhibit: |
      $ killall sle
      sle: no process found
      $ pkill sle
      [1]-  Terminated              sleep 801
      [2]+  Terminated              sleep 802
    options:
      - id: a
        text: killall needs the exact name; pkill matches a pattern
        rationale: Correct. "sle" is not the name of any process, but it matches part of "sleep", which is enough for pkill.
      - id: b
        text: killall needs root to signal processes, while pkill does not
        rationale: Wrong. Both can signal your own processes without root; killall reported no match, not a permission error.
      - id: c
        text: pkill sends SIGKILL by default, while killall sends SIGTERM
        rationale: Wrong. Both send SIGTERM by default, and the signal does not affect which processes match.
      - id: d
        text: killall only looks at jobs of the current shell
        rationale: Wrong. killall looks at all processes on the system; the jobs were reported only because they belonged to this shell.
    answer: [a]
    explanation: >
      pkill (like pgrep) matches an extended regular expression against process names, so a
      fragment matches. killall needs the exact name (unless -r is used). pgrep -x and pkill -x
      demand an exact name too.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "Sending Signals to Processes: kill" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Correct option shortened to avoid a length giveaway." }
    tags: [pkill, killall]

  - id: 101-103.5-0034
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      You left the tmux session `ops` attached in a terminal window on your desktop and now sit at a
      laptop logged in to the same host. You want `ops` on the laptop only, with the desktop's
      client cut off as you join. Which command does this?
    options:
      - id: a
        text: "`tmux attach -t ops`"
        rationale: Wrong. This attaches a second client; the desktop stays attached too.
      - id: b
        text: "`tmux attach -d -t ops`"
        rationale: Correct. -d detaches any other clients from the session as you attach.
      - id: c
        text: "`tmux new -s ops`"
        rationale: 'Wrong. tmux refuses with "duplicate session: ops"; it does not attach.'
      - id: d
        text: "`tmux kill-session -t ops`"
        rationale: Wrong. This destroys the session and everything running in it.
    answer: [b]
    explanation: >
      A tmux session can have several clients at once. `tmux attach -t NAME` adds one;
      `tmux attach -d -t NAME` also detaches the others. attach can be shortened to at or a.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 2, section: "tmux: Sessions Detachment" }
