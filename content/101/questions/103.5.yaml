  - id: 101-103.5-0027
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: >
      Based on the output below, which **TWO** commands let `sleep 200` continue running in the
      background?
    exhibit: |
      $ jobs
      [1]+  Stopped                 sleep 200
      [2]-  Stopped                 sleep 201
    select_count: 2
    options:
      - id: a
        text: "`bg %-`"
        rationale: Wrong. %- is the previous job, which is [2] (sleep 201).
      - id: b
        text: "`bg`"
        rationale: Correct. Without an argument bg acts on the current job, marked + (job 1).
      - id: c
        text: "`fg %1`"
        rationale: Wrong. This resumes job 1 in the foreground, not the background.
      - id: d
        text: "`bg %1`"
        rationale: Correct. %1 names job number 1 explicitly.
    answer: [b, d]
    explanation: >
      The + marks the current job, which fg and bg use when no job is named; - marks the previous
      one. %n, %+ (or %%), %-, %string and %?string are all valid job specifications.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: Job Specification }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [bg, jobspec]

  - id: 101-103.5-0028
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: Based on the `ps` output below, which **TWO** statements are true?
    exhibit: |
      $ ps -o pid,ppid,stat,ni,cmd --ppid 2240,2243
        PID  PPID STAT  NI CMD
       2241  2240 T      0 sleep 300
       2242  2240 SN    15 sleep 301
       2243  2240 S      0 sleep 302
       2245  2243 Z      0 [sleep] <defunct>
       2247  2240 R      0 ps -o pid,ppid,stat,ni,cmd --ppid 2240,2243
    select_count: 2
    options:
      - id: a
        text: Process 2241 is stopped and runs again when it receives SIGCONT.
        rationale: Correct. T means stopped by a job-control signal; SIGCONT (or bg/fg) resumes it.
      - id: b
        text: Process 2241 is in uninterruptible sleep, waiting for disk I/O.
        rationale: Wrong. Uninterruptible sleep is shown as D, not T.
      - id: c
        text: Running `kill -9 2245` removes process 2245 from the list.
        rationale: Wrong. 2245 is a zombie; it has already exited, and only its parent (2243) reaping it, or the parent's exit, removes the entry.
      - id: d
        text: Process 2242 runs with a lower scheduling priority than normal.
        rationale: Correct. The N flag and the nice value 15 mean a low-priority ("nice") process.
    answer: [a, d]
    explanation: >
      Common STAT codes: R running or runnable, S interruptible sleep, D uninterruptible sleep
      (usually I/O), T stopped, Z zombie. Extra flags include N (low priority), < (high priority)
      and + (foreground process group).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "An Explanation of ps Option Syntax and Output" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [ps, stat, zombie]

  - id: 101-103.5-0029
    type: fill_in
    difficulty: 4
    pool: holdout
    stem: >
      Every job started from your current shell must be ended immediately, even those that ignore
      SIGTERM. Type one `kill` command line that sends them SIGKILL, using `jobs -p` in a command
      substitution to supply their PIDs.
    fill_in:
      accepted: ['(sudo\s+)?((/usr)?/bin/)?kill\s+(-9|-KILL|-SIGKILL|-s\s*(9|KILL|SIGKILL))\s+(\$\(\s*jobs\s+-p\s*\)|`\s*jobs\s+-p\s*`)']
      match: regex
      case_sensitive: true
    explanation: >
      `kill -9 $(jobs -p)` runs jobs -p first and passes the PIDs of all the shell's jobs to kill.
      Backquotes do the same as $( ). The signal can also be written -KILL, -SIGKILL or -s KILL.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "Sending Signals to Processes: kill" }
