  - id: 101-103.5-0053
    type: multi_choice
    difficulty: 3
    pool: practice
    stem: Which **TWO** statements about GNU Screen windows are true?
    select_count: 2
    options:
      - id: a
        text: The first window is number 0.
        rationale: Correct. Screen numbers windows from 0, so Ctrl+a 0 goes to the first one.
      - id: b
        text: A program pauses while its window is not being displayed.
        rationale: Wrong. Programs keep running in hidden windows and in detached sessions.
      - id: c
        text: 'Ctrl+a " shows a list of windows to choose from.'
        rationale: Correct. Arrow keys and Enter select a window from the list.
      - id: d
        text: Ctrl+a k ends the whole session at once.
        rationale: Wrong. Ctrl+a k kills only the current window; screen exits when the last window is gone.
    answer: [a, c]
    explanation: >
      Windows in a screen session run independently and keep running when hidden. Ctrl+a w prints
      the window list in the message line, Ctrl+a " opens an interactive list, and Ctrl+a A renames
      the current window.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 2, section: "GNU Screen: Windows" }
    review:
      status: pass2
      history:
