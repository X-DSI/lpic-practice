  - id: 101-103.5-0047
    type: single_choice
    difficulty: 2
    pool: practice
    stem: A monitoring script needs the PIDs of all running `rsyslogd` processes, given only the program name. Apart from `pgrep`, which command provides them?
    options:
      - id: a
        text: "`killall`"
        rationale: Wrong. killall signals the processes; it does not print their PIDs.
      - id: b
        text: "`watch`"
        rationale: Wrong. watch re-runs a command at intervals.
      - id: c
        text: "`pidof`"
        rationale: Correct. pidof prints the PIDs of processes running the named program, e.g. pidof sshd.
      - id: d
        text: "`pkill`"
        rationale: Wrong. pkill signals the matching processes instead of listing them.
    answer: [c]
    explanation: >
      pidof and pgrep both turn a name into PIDs. pidof expects the exact program name and prints the
      PIDs on one line; pgrep matches a pattern and prints one PID per line.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "Sending Signals to Processes: kill" }
