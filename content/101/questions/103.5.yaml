    tags: [top, ps]

  - id: 101-103.5-0042
    type: single_choice
    difficulty: 1
    pool: practice
    stem: What does `bg` do with a job that you have just suspended with Ctrl+Z?
    options:
      - id: a
        text: It resumes the job in the background
        rationale: Correct. bg continues the stopped job without giving it the terminal.
      - id: b
        text: It resumes the job in the foreground
        rationale: Wrong. That is fg.
      - id: c
        text: It terminates the job
        rationale: Wrong. Ending a job is done with kill.
      - id: d
        text: It lists all background jobs
        rationale: Wrong. That is jobs.
    answer: [a]
    explanation: >
      After Ctrl+Z the job is stopped. bg lets it continue in the background (the shell shows it
      with a trailing &), and fg brings it back to the foreground.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "Job Status: Suspension, Foreground and Background" }
