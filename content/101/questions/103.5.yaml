    tags: [tmux, windows]

  - id: 101-103.5-0021
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: Which **TWO** commands send SIGHUP to the process with PID 4321?
    select_count: 2
    options:
      - id: a
        text: "`kill -HUP 4321`"
        rationale: Correct. The signal can be given by name, with or without the SIG prefix.
      - id: b
        text: "`kill -9 4321`"
        rationale: Wrong. Signal 9 is SIGKILL; SIGHUP is signal 1.
      - id: c
        text: "`kill -s 1 4321`"
        rationale: Correct. -s takes a signal name or number, and SIGHUP is number 1.
      - id: d
        text: "`kill -l 1 4321`"
        rationale: Wrong. -l lists signal names; it sends nothing.
    answer: [a, c]
    explanation: >
      kill accepts a signal as a name (-HUP, -SIGHUP), as a number (-1) or through -s (-s HUP,
      -s 1). `kill -l` prints the table of signal names and numbers, and `kill -l 1` prints HUP.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.5", lesson: 1, section: "Sending Signals to Processes: kill" }
    verify:
      command: bash -c 'kill -l 1'
      expect: { exit_code: 0, stdout_contains: "HUP" }
