# 101.2 Boot the system — weight 3 → 30 holdout + 15 practice.
# Original questions written from LPI Learning Materials 101-500, objective 101.2, lesson 1.
schema_version: 1
exam: "101"
objective: "101.2"
questions:
  # ---------------------------------------------------------------- holdout (mock exams only)

  - id: 101-101.2-0001
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: What is the main job of the initramfs during a Linux boot?
    options:
      - id: a
        text: It stores the boot entries that the firmware reads to find the bootloader
        rationale: Wrong. UEFI boot entries live in the firmware's NVRAM, not in the initramfs.
      - id: b
        text: It acts as a temporary root filesystem holding what the kernel needs to reach the real root filesystem
        rationale: Correct. The initramfs is unpacked into RAM and supplies modules and tools (storage drivers, LVM, decryption) needed to mount the real root filesystem.
      - id: c
        text: It keeps the kernel's boot messages after the system is switched off
        rationale: Wrong. Boot messages are kept in the kernel ring buffer (lost at power-off) and in log files or the systemd journal.
      - id: d
        text: It holds the bootloader's menu and its list of installed kernels
        rationale: Wrong. That is the bootloader's configuration file, for example /boot/grub/grub.cfg for GRUB.
    answer: [b]
    explanation: >
      The bootloader loads the kernel and an initramfs image. The kernel uses the initramfs as an
      interim root filesystem so it can load whatever drivers it needs to find and mount the real
      root filesystem, then hands over to init on that real root.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: System Initialization }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [initramfs]

  - id: 101-101.2-0002
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      Once the kernel has its root filesystem available, it starts one program that is in charge of
      running the startup scripts and services. What is that program generically called?
    options:
      - id: a
        text: The bootloader
        rationale: Wrong. The bootloader runs before the kernel and loads it; it is finished by this point.
      - id: b
        text: The initramfs
        rationale: Wrong. The initramfs is an archive used as a temporary root filesystem, not the program that manages services.
      - id: c
        text: The firmware
        rationale: Wrong. BIOS or UEFI firmware runs before the bootloader and plays no part once the kernel is running.
      - id: d
        text: init
        rationale: Correct. The first user-space program the kernel runs is called init; SysVinit, Upstart and systemd are implementations of it.
    answer: [d]
    explanation: >
      The kernel's last boot step is to start init (PID 1). Whichever implementation a distribution
      uses — SysVinit, Upstart or systemd — it then runs the initialization scripts and starts the
      system daemons.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: System Initialization }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [init]

  - id: 101-101.2-0003
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      A graphical splash screen hid the kernel's messages while a laptop booted. Which command
      prints the messages currently held in the kernel ring buffer?
    options:
      - id: a
        text: "`dmesg`"
        rationale: Correct. Without options, dmesg prints the contents of the kernel ring buffer, boot messages included.
      - id: b
        text: "`lsmod`"
        rationale: Wrong. lsmod lists the kernel modules currently loaded, not kernel messages.
      - id: c
        text: "`uname -a`"
        rationale: Wrong. uname prints kernel name, release, version and architecture, not its messages.
      - id: d
        text: "`cat /proc/cmdline`"
        rationale: Wrong. That shows the parameters the kernel was booted with, not the messages it logged.
    answer: [a]
    explanation: >
      The kernel writes its messages to the kernel ring buffer whether or not they were shown on the
      console. dmesg reads that buffer, so the messages hidden by the splash screen are still there.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: Initialization Inspection }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [dmesg, ring-buffer]

  - id: 101-101.2-0004
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: Which UEFI feature refuses to run EFI applications that are not signed with a trusted key?
    options:
      - id: a
        text: Legacy (CSM) boot
        rationale: Wrong. The Compatibility Support Module emulates BIOS booting; it does not check signatures.
      - id: b
        text: POST
        rationale: Wrong. The power-on self-test checks for basic hardware faults; it does not check software signatures.
      - id: c
        text: Secure Boot
        rationale: Correct. With Secure Boot enabled, the firmware only executes EFI applications carrying a trusted signature.
      - id: d
        text: The EFI System Partition
        rationale: Wrong. The ESP is where EFI applications are stored; it does not decide which may run.
    answer: [c]
    explanation: >
      Secure Boot makes UEFI firmware check the signature of each EFI application before running it.
      This blocks unsigned (possibly malicious) bootloaders, but can make installing an operating
      system that the manufacturer did not plan for more difficult.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: BIOS or UEFI }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [uefi, secure-boot]

  - id: 101-101.2-0005
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: Which statement best describes Upstart?
    options:
      - id: a
        text: A bootloader that replaced GRUB on Ubuntu systems
        rationale: Wrong. Upstart never was a bootloader; Ubuntu has used GRUB throughout.
      - id: b
        text: A replacement for init that started services in parallel, used by older Ubuntu releases
        rationale: Correct. Upstart replaced the traditional init to speed up boot by starting services in parallel; Ubuntu later moved to systemd.
      - id: c
        text: The systemd component that collects boot messages into the journal
        rationale: Wrong. That component is systemd-journald.
      - id: d
        text: A firmware standard that superseded BIOS
        rationale: Wrong. That describes UEFI.
    answer: [b]
    explanation: >
      Upstart is an init replacement whose main aim was a faster boot through parallel service
      start-up. Ubuntu shipped it in earlier releases and switched to systemd, as most major
      distributions have.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: System Initialization }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [upstart, init]

  - id: 101-101.2-0006
    type: fill_in
    difficulty: 2
    pool: holdout
    stem: >
      Someone edited a GRUB entry at the boot menu before the server came up, and you want to know
      exactly which parameters the running kernel received. Type the full path of the file that
      shows them.
    fill_in:
      accepted: ['((sudo\s+)?((/usr)?/bin/)?(cat|less|more)\s+)?/proc/cmdline']
      match: regex
      case_sensitive: true
    explanation: >
      /proc/cmdline holds the command line the current kernel was booted with, including any
      changes typed at the bootloader menu. /etc/default/grub only shows what future generated
      entries will use.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: The Bootloader }
    verify:
      command: test -r /proc/cmdline && cat /proc/cmdline
      expect: { exit_code: 0 }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [proc-cmdline, kernel-parameters]

  - id: 101-101.2-0007
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      To repair a broken service configuration, you want the kernel to start a plain Bash shell
      instead of the normal service manager. Which kernel parameter do you add at the boot menu?
    options:
      - id: a
        text: "`root=/bin/bash`"
        rationale: Wrong. root= names the device holding the root filesystem, not the program to run.
      - id: b
        text: "`systemd.unit=bash.target`"
        rationale: Wrong. There is no bash.target unit; systemd.unit= selects a systemd target, and systemd would still be PID 1.
      - id: c
        text: "`init=/bin/bash`"
        rationale: Correct. init= tells the kernel which program to run as the first process, here a Bash shell.
      - id: d
        text: "`rootflags=/bin/bash`"
        rationale: Wrong. rootflags= passes mount options for the root filesystem.
    answer: [c]
    explanation: >
      The init= parameter replaces the program the kernel starts as PID 1. With init=/bin/bash you
      get a root shell as soon as the kernel has mounted the root filesystem, with no services
      started.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: The Bootloader }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [kernel-parameters, init]

  - id: 101-101.2-0008
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      Distributions using SysVinit decide for themselves what most runlevels mean. Which runlevels
      have the same meaning on all of them?
    options:
      - id: a
        text: 0, 1 and 6
        rationale: Correct. 0 (halt), 1 (single-user) and 6 (reboot) are common to all; 2 to 5 vary between distributions.
      - id: b
        text: 1, 3 and 5
        rationale: Wrong. 3 and 5 are a common convention (text and graphical multi-user) but not universal.
      - id: c
        text: 0 to 6, all of them
        rationale: Wrong. Runlevels 2 to 5 are defined by each distribution's maintainers.
      - id: d
        text: 2, 3 and 4
        rationale: Wrong. These are among the runlevels whose meaning differs between distributions.
    answer: [a]
    explanation: >
      SysV runlevels are numbered 0 to 6. Only three are shared everywhere: 0 halts the system,
      1 is single-user (maintenance) mode and 6 reboots. The rest are up to the distribution.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: System Initialization }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [sysvinit, runlevels]

  - id: 101-101.2-0009
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: On a UEFI machine, where does the firmware look to find out which EFI application to start automatically?
    options:
      - id: a
        text: The first 440 bytes of the first disk in the boot order
        rationale: Wrong. That is where BIOS firmware expects the first stage of the bootloader; UEFI does not use the MBR.
      - id: b
        text: The file /etc/default/grub on the root filesystem
        rationale: Wrong. The firmware cannot read the Linux root filesystem's settings; that file only feeds grub-mkconfig.
      - id: c
        text: The initramfs image in /boot
        rationale: Wrong. The initramfs is loaded later, by the bootloader, for the kernel.
      - id: d
        text: The boot entries stored in the firmware's NVRAM
        rationale: Correct. UEFI keeps its boot entries in non-volatile memory on the motherboard; each points to an EFI application on the ESP.
    answer: [d]
    explanation: >
      UEFI ignores the MBR. Its NVRAM holds boot entries that point to EFI applications (usually a
      bootloader) on the EFI System Partition; the firmware runs the default entry or offers a menu.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: BIOS or UEFI }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [uefi, nvram]

  - id: 101-101.2-0010
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      A systemd server with a persistent journal hung during the night and was power-cycled. Which
      command shows the log messages from the boot session that hung, the one before the current
      boot?
    options:
      - id: a
        text: "`journalctl -b`"
        rationale: Wrong. Without a value, -b means the current boot.
      - id: b
        text: "`journalctl -b -1`"
        rationale: Correct. A boot offset of -1 selects the boot before the current one.
      - id: c
        text: "`journalctl -b 1`"
        rationale: Wrong. Positive offsets count from the oldest boot in the journal, so 1 is the first recorded boot.
      - id: d
        text: "`dmesg`"
        rationale: Wrong. The kernel ring buffer only holds messages from the current boot; it was emptied at power-off.
    answer: [b]
    explanation: >
      journalctl -b takes a boot offset: 0 (or nothing) is the current boot, -1 the previous one,
      -2 the one before that. Positive numbers count forward from the oldest boot kept.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: Initialization Inspection }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [journalctl, boot-offset]

  - id: 101-101.2-0011
    type: multi_choice
    difficulty: 2
    pool: holdout
    stem: >
      You are creating an EFI System Partition on a new disk. Which **TWO** filesystems does the UEFI
      standard support for it?
    select_count: 2
    options:
      - id: a
        text: FAT32
        rationale: Correct. FAT32 is the usual choice for an ESP and is supported by the UEFI standard.
      - id: b
        text: ext4
        rationale: Wrong. ext4 is a common Linux root filesystem, but UEFI firmware is not required to read it.
      - id: c
        text: XFS
        rationale: Wrong. UEFI firmware is not required to read XFS.
      - id: d
        text: FAT16
        rationale: Correct. The UEFI standard supports FAT12, FAT16 and FAT32 on block devices.
    answer: [a, d]
    explanation: >
      UEFI firmware must be able to read the ESP itself, so the standard fixes the filesystems:
      FAT12, FAT16 and FAT32 for disks (and ISO-9660 for optical media). In practice ESPs are
      almost always FAT32.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: BIOS or UEFI }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [uefi, esp]

  - id: 101-101.2-0012
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      The GRUB menu is on screen. You want to add a kernel parameter for this one boot only, without
      changing any file. What do you do?
    options:
      - id: a
        text: Press `c`, type `grub-mkconfig`, then press Enter
        rationale: Wrong. c opens the GRUB command line, and grub-mkconfig is a Linux command, not a GRUB command.
      - id: b
        text: Boot normally, add the parameter to `/etc/default/grub`, then reboot
        rationale: Wrong. That changes a file, and it has no effect until grub-mkconfig regenerates the configuration.
      - id: c
        text: Highlight the entry, press `e`, add the parameter to the `linux` line, then press Ctrl+X
        rationale: Correct. e opens the entry for editing; the change is used for this boot (Ctrl+X or F10) and is not saved.
      - id: d
        text: Highlight the entry, press `e`, add the parameter to the `linux` line, then press Esc
        rationale: Wrong. Esc in the GRUB editor discards the edit and returns to the menu instead of booting.
    answer: [c]
    explanation: >
      In the GRUB menu, e opens the selected entry in an editor. Append the parameter to the line that
      starts with linux (the kernel command line) and boot with Ctrl+X or F10. The edit only lasts
      for that boot.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: The Bootloader }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Distractor used Tab, whose GRUB menu behaviour is unclear; replaced with e + edit + Esc (discards edit)." }
    tags: [grub, kernel-parameters]

  - id: 101-101.2-0013
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      Before reproducing a hardware fault you want to empty the kernel ring buffer, so that later
      output only shows new messages. You do not need to see the current messages. Which command
      does exactly that?
    options:
      - id: a
        text: "`dmesg -c`"
        rationale: Wrong. -c also clears the buffer, but prints all its messages first.
      - id: b
        text: "`dmesg -w`"
        rationale: Wrong. -w (--follow) waits for and prints new messages; it clears nothing.
      - id: c
        text: "`dmesg -k`"
        rationale: Wrong. -k only restricts output to kernel messages; it clears nothing.
      - id: d
        text: "`dmesg -C`"
        rationale: Correct. -C (--clear) clears the ring buffer without printing it.
    answer: [d]
    explanation: >
      dmesg -C, or dmesg --clear, empties the kernel ring buffer silently. dmesg -c (--read-clear)
      prints the buffer and then clears it. Both need root privileges.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: Initialization Inspection }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [dmesg, ring-buffer]

  - id: 101-101.2-0014
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: On a systemd system, which `journalctl` option limits the output to kernel messages from the current boot?
    options:
      - id: a
        text: "`-k`"
        rationale: Correct. -k (--dmesg) shows only kernel messages and implies the current boot.
      - id: b
        text: "`-x`"
        rationale: Wrong. -x (--catalog) adds explanatory text to messages; it does not filter by source.
      - id: c
        text: "`-r`"
        rationale: Wrong. -r (--reverse) shows the newest entries first.
      - id: d
        text: "`-u`"
        rationale: Wrong. -u filters by systemd unit and needs a unit name; the kernel is not a unit.
    answer: [a]
    explanation: >
      journalctl -k (long form --dmesg) shows the same kind of messages as dmesg, taken from the
      journal, for the current boot. Combine it with -b to choose another boot.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: Initialization Inspection }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [journalctl, kernel-messages]

  - id: 101-101.2-0015
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      You changed `/etc/default/grub` on a machine whose GRUB configuration file is
      `/boot/grub/grub.cfg`. Type the full command that regenerates that file so the change takes
      effect at the next boot.
    fill_in:
      accepted:
        - '(sudo\s+)?((/usr)?/s?bin/)?grub2?-mkconfig\s+(-o\s*|--output(=|\s+))/boot/grub/grub\.cfg'
        - '((/usr)?/s?bin/)?grub2?-mkconfig\s*>\s*/boot/grub/grub\.cfg'
        - '(sudo\s+)?((/usr)?/s?bin/)?update-grub2?'
      match: regex
      case_sensitive: true
    explanation: >
      grub-mkconfig -o /boot/grub/grub.cfg reads /etc/default/grub and the scripts in /etc/grub.d/
      and writes a new configuration. On Debian and Ubuntu, update-grub is a wrapper that runs
      exactly that command. Some distributions name the tool grub2-mkconfig and keep the file in
      /boot/grub2/.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: The Bootloader }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [grub, grub-mkconfig]

  - id: 101-101.2-0016
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: >
      On a large server you want one boot to behave like a small machine with only 2 processors and
      4 GiB of RAM, to test an application. Which **TWO** kernel parameters do you add?
    select_count: 2
    options:
      - id: a
        text: "`nosmp`"
        rationale: Wrong. nosmp disables multi-processor support, leaving one processor, not two.
      - id: b
        text: "`mem=4G`"
        rationale: Correct. mem= limits the amount of RAM the kernel will use.
      - id: c
        text: "`maxcpus=2`"
        rationale: Correct. maxcpus= limits how many processors the kernel brings up at boot.
      - id: d
        text: "`acpi=off`"
        rationale: Wrong. acpi=off disables ACPI support; it does not set a number of CPUs or amount of memory.
    answer: [b, c]
    explanation: >
      mem= caps usable memory and maxcpus= caps the processors brought online at boot. Both are
      handy for testing and for virtual machines. maxcpus=0 has the same effect as nosmp.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: The Bootloader }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [kernel-parameters, mem, maxcpus]

  - id: 101-101.2-0017
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      A disk uses the DOS (MBR) partition scheme. How many bytes at the very start of the disk does a
      BIOS treat as the first stage of the bootloader?
    options:
      - id: a
        text: "64"
        rationale: Wrong. 64 bytes is the size of the MBR's partition table (four 16-byte entries).
      - id: b
        text: "440"
        rationale: Correct. BIOS runs the first 440 bytes as the bootstrap code; the rest of the MBR holds the disk signature, partition table and boot signature.
      - id: c
        text: "512"
        rationale: Wrong. 512 bytes is the whole MBR, which also contains the partition table.
      - id: d
        text: "4096"
        rationale: Wrong. That is a common sector or block size, not the size of the bootstrap area.
    answer: [b]
    explanation: >
      The MBR is the first 512 bytes of the disk. The first 440 bytes are the bootstrap code that
      BIOS executes; the partition table and the 0x55AA boot signature follow. A damaged MBR leaves a
      BIOS machine unable to boot from that disk.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: BIOS or UEFI }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [bios, mbr]

  - id: 101-101.2-0018
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: Which **TWO** statements about systemd are true?
    select_count: 2
    options:
      - id: a
        text: It can only start services one after another, in the order of their script numbers
        rationale: Wrong. systemd starts services concurrently, ordered by their declared dependencies.
      - id: b
        text: It cannot understand SysV runlevels in any form
        rationale: Wrong. systemd has a compatibility layer that maps SysV runlevels to targets.
      - id: c
        text: It can start a daemon on demand, when its socket or D-Bus name is first used
        rationale: Correct. Socket and D-Bus activation let systemd start services only when something needs them.
      - id: d
        text: It tracks the processes of each service using control groups
        rationale: Correct. systemd places each service in its own cgroup, so it knows every process the service starts.
    answer: [c, d]
    explanation: >
      systemd is a dependency-based system and service manager. It starts units in parallel,
      supports socket and D-Bus activation, follows service processes through cgroups, manages
      mount points and still accepts SysV runlevels through compatibility targets.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: System Initialization }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [systemd]

  - id: 101-101.2-0019
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      A kernel parameter you added at the GRUB menu fixed a boot problem, and you want GRUB to pass
      it on every future boot. Type the full path of the file where you add it before regenerating
      the GRUB configuration.
    fill_in:
      accepted: [/etc/default/grub]
      match: normalized
      case_sensitive: true
    explanation: >
      Persistent kernel parameters go into /etc/default/grub (the GRUB_CMDLINE_LINUX line). The
      generated /boot/grub/grub.cfg should not be edited by hand; run grub-mkconfig after changing
      /etc/default/grub.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: The Bootloader }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [grub, kernel-parameters]

  - id: 101-101.2-0020
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: Which conclusion is supported by this excerpt of `dmesg` output?
    exhibit: |
      [    0.000000] Linux version 6.8.0-45-generic (buildd@lcy02-amd64-075) ...
      [    2.913407] EXT4-fs (nvme0n1p2): mounted filesystem with ordered data mode.
      [    4.118230] systemd[1]: systemd 255.4-1ubuntu8 running in system mode
      [    4.302871] systemd[1]: Detected architecture x86-64.
    options:
      - id: a
        text: The firmware and the bootloader together took about 2.9 seconds
        rationale: Wrong. The timestamps start when the kernel starts, so firmware and bootloader time is not included at all.
      - id: b
        text: systemd was started at about 04:11 local time
        rationale: Wrong. The bracketed values are seconds, not a time of day.
      - id: c
        text: systemd started roughly 1.2 seconds after the root filesystem was mounted
        rationale: Correct. Both values count seconds from kernel start, so the gap is 4.118 - 2.913, about 1.2 seconds.
      - id: d
        text: The machine had been powered on for about 4.1 seconds when systemd started
        rationale: Wrong. Power-on also includes POST, firmware and bootloader time, which happen before the kernel's clock starts.
    answer: [c]
    explanation: >
      By default dmesg prefixes each message with the number of seconds since the kernel started.
      That makes it easy to measure gaps between kernel boot events, but it says nothing about the
      time spent before the kernel ran or about the wall-clock time.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: Initialization Inspection }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [dmesg, timestamps]

  - id: 101-101.2-0021
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      This is `/etc/default/grub` on a Debian-based system. A new kernel parameter must be used by
      every Linux entry GRUB generates, including the recovery-mode entries. What do you do?
    exhibit: |
      GRUB_DEFAULT=0
      GRUB_TIMEOUT=5
      GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
      GRUB_CMDLINE_LINUX=""
    options:
      - id: a
        text: Add it to `GRUB_CMDLINE_LINUX`, then run `grub-mkconfig -o /boot/grub/grub.cfg`
        rationale: Correct. GRUB_CMDLINE_LINUX is added to both normal and recovery entries, and the configuration must be regenerated.
      - id: b
        text: Add it to `GRUB_CMDLINE_LINUX_DEFAULT`, then run `grub-mkconfig -o /boot/grub/grub.cfg`
        rationale: Wrong. GRUB_CMDLINE_LINUX_DEFAULT is only added to the normal entries, not the recovery ones.
      - id: c
        text: Add it to `GRUB_CMDLINE_LINUX`; GRUB reads the file at the next boot
        rationale: Wrong. GRUB reads grub.cfg, not /etc/default/grub; nothing changes until grub-mkconfig is run.
      - id: d
        text: Append it to `/proc/cmdline`, then run `grub-mkconfig -o /boot/grub/grub.cfg`
        rationale: Wrong. /proc/cmdline only reports the running kernel's parameters; grub-mkconfig never reads it.
    answer: [a]
    explanation: >
      grub-mkconfig builds normal entries from GRUB_CMDLINE_LINUX plus GRUB_CMDLINE_LINUX_DEFAULT,
      and recovery entries from GRUB_CMDLINE_LINUX plus the recovery options. A parameter needed
      everywhere therefore belongs in GRUB_CMDLINE_LINUX, followed by regenerating grub.cfg.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: The Bootloader }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [grub, kernel-parameters, GRUB_CMDLINE_LINUX]

  - id: 101-101.2-0022
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      A system booted with the kernel command line shown. Its `/etc/fstab` mounts `/` with the
      `defaults` option. What does the `ro` parameter mean here?
    exhibit: |
      $ cat /proc/cmdline
      BOOT_IMAGE=/vmlinuz-6.8.0-45-generic root=UUID=2f6c1d0e-8a4b-4e1f-9c3d-5b7a6e2d1f90 ro quiet splash
    options:
      - id: a
        text: The root filesystem stays read-only for the whole session, so nothing can be written to it
        rationale: Wrong. ro only governs the initial mount; the boot process remounts / using the options from /etc/fstab.
      - id: b
        text: The kernel image is protected against changes while the system runs
        rationale: Wrong. ro concerns the root filesystem mount, not the kernel image file.
      - id: c
        text: Only the root user may write to the root filesystem
        rationale: Wrong. ro is not a permission setting for users; file permissions are unchanged.
      - id: d
        text: The kernel first mounts the root filesystem read-only; it is remounted read-write later in the boot
        rationale: Correct. ro sets the initial mount read-only (so it can be checked safely); the init system then remounts it as /etc/fstab says.
    answer: [d]
    explanation: >
      ro makes the kernel's initial mount of the root filesystem read-only, which allows a
      filesystem check before anything writes to it. Later in the boot the init system remounts /
      read-write according to /etc/fstab. rw would make the initial mount writable instead.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: The Bootloader }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [kernel-parameters, ro, proc-cmdline]

  - id: 101-101.2-0023
    type: fill_in
