  - id: 101-101.2-0024
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: Which **TWO** statements correctly compare booting with BIOS and with UEFI?
    select_count: 2
    options:
      - id: a
        text: UEFI firmware loads the bootloader's first stage from the first 440 bytes of the boot disk
        rationale: Wrong. That is how BIOS works; UEFI ignores the MBR and uses its NVRAM entries.
      - id: b
        text: BIOS firmware cannot read filesystems; it simply runs the code found at the start of the boot disk
        rationale: Correct. BIOS just executes the bootstrap code in the MBR, which then loads the next stage.
      - id: c
        text: BIOS firmware reads its boot entries from the EFI System Partition
        rationale: Wrong. BIOS knows nothing about the ESP; it follows the disk order set in its configuration utility.
      - id: d
        text: UEFI firmware can read a FAT filesystem and run a program stored as a file on it
        rationale: Correct. UEFI reads the ESP's FAT filesystem and runs EFI applications stored there.
    answer: [b, d]
    explanation: >
      Both start with POST and basic hardware set-up. BIOS then runs the bootstrap code in the MBR of
      the first disk in its boot order. UEFI reads its NVRAM boot entries and runs the EFI
      application they point to, as a file on the FAT-formatted ESP.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: BIOS or UEFI }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [bios, uefi]

  - id: 101-101.2-0025
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: >
      Which **TWO** commands show all journal entries, from every source, for the current boot
      only?
    select_count: 2
    options:
      - id: a
        text: "`journalctl -b`"
        rationale: Correct. -b with no value selects the current boot.
      - id: b
        text: "`journalctl -k`"
        rationale: Wrong. -k covers the current boot but shows kernel messages only.
      - id: c
        text: "`journalctl --boot=0`"
        rationale: Correct. Boot offset 0 is the current boot.
      - id: d
        text: "`journalctl -b 1`"
        rationale: Wrong. Positive offsets count from the oldest recorded boot; 1 is the first boot in the journal.
    answer: [a, c]
    explanation: >
      journalctl -b, -b 0 and --boot=0 all mean the current boot. -k narrows that to kernel messages,
      and -b 1 is a common mistake: it selects the oldest boot kept, not the latest.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: Initialization Inspection }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [journalctl, boot-offset]

  - id: 101-101.2-0026
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: Which sequence correctly orders the boot of a BIOS-based Linux system?
    options:
      - id: a
        text: POST → bootloader second stage → bootloader first stage from MBR → kernel → init → initramfs
        rationale: Wrong. The first stage runs before the second stage, and the initramfs is used before init starts.
      - id: b
        text: POST → bootloader first stage from MBR → kernel → init → initramfs mounted → real root filesystem
        rationale: Wrong. The initramfs is needed to reach the real root filesystem, which must happen before init runs from it.
      - id: c
        text: Bootloader first stage from MBR → POST → bootloader second stage → initramfs → kernel → init
        rationale: Wrong. POST runs first, and the kernel is started before it opens the initramfs.
      - id: d
        text: POST → bootloader first stage from MBR → bootloader second stage → kernel → initramfs → init
        rationale: Correct. Firmware self-test, two bootloader stages, then the kernel uses the initramfs to reach the real root and starts init.
    answer: [d]
    explanation: >
      On BIOS hardware: POST and hardware set-up, the bootstrap code from the MBR, the second-stage
      bootloader (menu, kernel loading), the kernel with its initramfs as a temporary root, and
      finally init on the real root filesystem, which starts the services.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: System Initialization }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [boot-sequence, bios]

  - id: 101-101.2-0027
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      You need the log of the boot that ended on Monday evening. Based on the output below, which
      command shows it?
    exhibit: |
      $ journalctl --list-boots
      IDX BOOT ID                          FIRST ENTRY                 LAST ENTRY
       -3 4c1e9a0b7d2f4e6a8b3c5d7e9f1a2b3c Sat 2026-10-17 09:12:40 IST Sat 2026-10-17 22:05:13 IST
       -2 9d3f6a1c2b8e4f7d9a0b1c2d3e4f5a6b Mon 2026-10-19 08:47:02 IST Mon 2026-10-19 19:31:55 IST
       -1 1a2b3c4d5e6f47a8b9c0d1e2f3a4b5c6 Tue 2026-10-20 08:55:21 IST Thu 2026-10-22 18:02:44 IST
        0 7f8e9d0c1b2a43f4e5d6c7b8a9f0e1d2 Fri 2026-10-23 08:30:09 IST Fri 2026-10-23 11:14:37 IST
    options:
      - id: a
        text: "`journalctl -b -2`"
        rationale: Correct. The boot whose last entry is Monday 19:31 has offset -2.
      - id: b
        text: "`journalctl -b 3`"
        rationale: Wrong. Positive offsets count from the oldest boot in the journal, so 3 is the third oldest, the boot that started on Tuesday.
      - id: c
        text: "`journalctl -b -1`"
        rationale: Wrong. Offset -1 is the boot that started on Tuesday and ended on Thursday.
      - id: d
        text: "`journalctl -b 9d3f6a1c`"
        rationale: Wrong. journalctl does not accept a shortened boot ID; it needs the full 32-character ID.
    answer: [a]
    explanation: >
      In the IDX column, 0 is the current boot and negative numbers count backwards from it. The
      boot that ended on Monday evening is -2. The full 32-character boot ID would also select it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: Initialization Inspection }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Distractor -b 2 also selected the Monday boot (oldest listed is -3, so +2 = -2); replaced with -b 3. Boot-ID rationale reworded." }
    tags: [journalctl, list-boots, boot-offset]

  - id: 101-101.2-0028
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      On a systemd machine with default journal settings, `journalctl -b -1` prints the message
      shown. What is the most likely reason?
    exhibit: |
      $ journalctl -b -1
      Specifying boot ID or boot offset has no effect, no persistent journal was found.
    options:
      - id: a
        text: The kernel ring buffer was cleared with `dmesg -C` during the previous boot
        rationale: Wrong. Clearing the ring buffer does not remove journal entries, and does not make the journal non-persistent.
      - id: b
        text: The system was booted with the `quiet` kernel parameter
        rationale: Wrong. quiet only reduces console output; messages are still logged.
      - id: c
        text: The directory `/var/log/journal` does not exist, so the journal is only kept in `/run/log/journal` and lost at reboot
        rationale: Correct. With the default Storage=auto, journald writes to disk only if /var/log/journal exists; otherwise logs live in RAM under /run.
      - id: d
        text: The option needs root privileges; run it again with `sudo`
        rationale: Wrong. Missing privileges limit which entries you can read; they do not produce this message.
    answer: [c]
    explanation: >
      journald's default Storage=auto keeps logs persistently in /var/log/journal only when that
      directory exists. Without it the journal is volatile, in /run/log/journal, and earlier boots
      cannot be selected. Creating /var/log/journal (or setting Storage=persistent) fixes it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: Initialization Inspection }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [journalctl, journald, persistent-journal]

  - id: 101-101.2-0029
    type: multi_choice
    difficulty: 5
    pool: holdout
    stem: >
      A systemd server with a persistent journal rebooted unexpectedly. Which **TWO** commands show
      only the kernel's messages from the boot before the current one?
    select_count: 2
    options:
      - id: a
        text: "`journalctl -k -b -1`"
        rationale: Correct. -k restricts to kernel messages and -b -1 selects the previous boot.
      - id: b
        text: "`journalctl --dmesg --boot=-1`"
        rationale: Correct. These are the long forms of -k and -b -1.
      - id: c
        text: "`journalctl -k -b 1`"
        rationale: Wrong. -b 1 is the oldest boot in the journal, not the previous one.
      - id: d
        text: "`dmesg -k`"
        rationale: Wrong. dmesg reads the current kernel ring buffer, which does not survive a reboot.
    answer: [a, b]
    explanation: >
      Only the journal keeps kernel messages across reboots. journalctl -k (--dmesg) filters for
      kernel messages, and -b -1 (--boot=-1) picks the previous boot. dmesg cannot look back past
      the current boot.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: Initialization Inspection }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [journalctl, kernel-messages, boot-offset]

  - id: 101-101.2-0030
    type: fill_in
    difficulty: 5
    pool: holdout
    stem: >
      Type a `dmesg` command that prints only kernel ring buffer messages of the levels `err` and
      `warn`, and nothing else.
    fill_in:
      accepted: ['((sudo\s+)?((/usr)?/bin/)?dmesg\s+)?(-l\s*|--level(=|\s+))(err,warn|warn,err)']
      match: regex
