    tags: [dmesg, log-levels]

  # --------------------------------------------------------------------------- practice (CLI)

  - id: 101-101.2-0031
    type: single_choice
    difficulty: 1
    pool: practice
    stem: Where is a PC's BIOS stored?
    options:
      - id: a
        text: In a non-volatile memory chip on the motherboard
        rationale: Correct. BIOS is firmware kept in its own chip, separate from the system's storage devices.
      - id: b
        text: In the first partition of the boot disk
        rationale: Wrong. The firmware must run before any disk is read, so it cannot live on a disk partition.
      - id: c
        text: In the initramfs image
        rationale: Wrong. The initramfs is loaded by the bootloader long after the firmware has run.
      - id: d
        text: In /boot on the root filesystem
        rationale: Wrong. /boot holds the kernel, initramfs and bootloader files, not the firmware.
    answer: [a]
    explanation: >
      BIOS (Basic Input/Output System) is firmware: a program stored in non-volatile memory on the
      motherboard that runs each time the machine is powered on.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: BIOS or UEFI }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [bios, firmware]

  - id: 101-101.2-0032
    type: single_choice
    difficulty: 1
    pool: practice
    stem: What is the purpose of POST, the first step after a computer is powered on?
    options:
      - id: a
        text: Loading the kernel into memory
        rationale: Wrong. The bootloader loads the kernel, much later.
      - id: b
        text: Choosing which operating system to start
        rationale: Wrong. The bootloader menu does that.
      - id: c
        text: Detecting simple hardware failures
        rationale: Correct. The power-on self-test checks basic hardware before anything is loaded.
      - id: d
        text: Mounting the root filesystem
        rationale: Wrong. The kernel mounts the root filesystem after it has started.
    answer: [c]
    explanation: >
      POST (power-on self-test) is run by BIOS or UEFI firmware as soon as the machine powers on,
      to catch basic hardware faults before the boot continues.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: BIOS or UEFI }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [post, firmware]

  - id: 101-101.2-0033
    type: single_choice
    difficulty: 2
    pool: practice
    stem: On a system using SysVinit, what does switching to runlevel 6 do?
    options:
      - id: a
        text: Halts the system
        rationale: Wrong. Halting is runlevel 0.
      - id: b
        text: Starts single-user maintenance mode
        rationale: Wrong. Single-user mode is runlevel 1.
      - id: c
        text: Starts the graphical desktop
        rationale: Wrong. A graphical runlevel (often 5) is distribution-specific; 6 is not one.
      - id: d
        text: Reboots the system
        rationale: Correct. Runlevel 6 reboots on every SysVinit distribution.
    answer: [d]
    explanation: >
      Runlevels 0 (halt), 1 (single-user) and 6 (reboot) mean the same everywhere. Runlevels 2 to 5
      are defined by the distribution.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: System Initialization }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [sysvinit, runlevels]

  - id: 101-101.2-0034
    type: single_choice
    difficulty: 2
    pool: practice
    stem: >
      An old laptop hangs during boot, and you suspect its power-management firmware tables. Which
      kernel parameter disables ACPI support for a test boot?
    options:
      - id: a
        text: "`nosmp`"
        rationale: Wrong. nosmp disables multi-processor support, not ACPI.
      - id: b
        text: "`acpi=off`"
        rationale: Correct. acpi=off turns ACPI support off.
      - id: c
        text: "`quiet`"
        rationale: Wrong. quiet hides most boot messages; ACPI is still used.
      - id: d
        text: "`maxcpus=0`"
        rationale: Wrong. maxcpus=0 acts like nosmp; it has nothing to do with ACPI.
    answer: [b]
    explanation: >
      Many kernel parameters use the option=value form; acpi=off disables ACPI. It is a
      troubleshooting setting, not something to leave on permanently.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: The Bootloader }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [kernel-parameters, acpi]

  - id: 101-101.2-0035
    type: single_choice
    difficulty: 2
    pool: practice
    stem: >
      A machine stops booting after the kernel and initramfs load. You start it from a live USB stick
      and mount its root filesystem. Under which directory of that filesystem do you look for its
      log files?
    options:
      - id: a
        text: "`/var/log/`"
        rationale: Correct. System and boot logs, including a persistent systemd journal, are kept under /var/log/.
      - id: b
        text: "`/proc/`"
        rationale: Wrong. /proc is a virtual filesystem of the running kernel; it holds nothing on disk.
      - id: c
        text: "`/boot/`"
        rationale: Wrong. /boot holds kernels, initramfs images and bootloader files, not logs.
      - id: d
        text: "`/etc/`"
        rationale: Wrong. /etc holds configuration files, not logs.
    answer: [a]
    explanation: >
      Logs are written below /var/log/. Text logs can be read with any pager; systemd journal files
      in /var/log/journal/ are binary and must be read with journalctl.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: Initialization Inspection }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [logs, var-log]

  - id: 101-101.2-0036
    type: single_choice
    difficulty: 2
    pool: practice
    stem: What does the `-D` (`--directory`) option of `journalctl` do?
    options:
      - id: a
        text: Shows only entries logged by daemons
        rationale: Wrong. Filtering by service is done with -u; -D does not filter by source.
      - id: b
        text: Deletes journal files older than a given date
        rationale: Wrong. Old journal files are removed with options such as --vacuum-time.
      - id: c
        text: Prints the directory where the journal is stored
        rationale: Wrong. -D takes a directory as input; it does not print one.
      - id: d
        text: Reads journal files from the given directory instead of the default location
        rationale: Correct. -D PATH makes journalctl read the journal files found in PATH.
    answer: [d]
    explanation: >
      Journal files are binary, so they must be read with journalctl even when they come from
      another system. -D (--directory) points journalctl at a directory of journal files instead of
      the default /var/log/journal (or /run/log/journal).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: Initialization Inspection }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [journalctl]

  - id: 101-101.2-0037
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      The root filesystem is a Btrfs subvolume named `@`. Which kernel parameter passes the mount
      option needed to mount that subvolume as root?
    options:
      - id: a
        text: "`root=subvol=@`"
        rationale: Wrong. root= takes the device that holds the root filesystem, not mount options.
      - id: b
        text: "`init=subvol=@`"
        rationale: Wrong. init= names the first program to run.
      - id: c
        text: "`rootflags=subvol=@`"
        rationale: Correct. rootflags= passes mount options for the root filesystem.
      - id: d
        text: "`rw=subvol=@`"
        rationale: Wrong. rw is a plain flag that makes the initial mount writable; it takes no value.
    answer: [c]
    explanation: >
      root= says which device to mount as /, rootflags= adds mount options for it, and ro or rw
      decides whether the initial mount is read-only or writable. GRUB's own scripts add
      rootflags=subvol=... for Btrfs roots.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: The Bootloader }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [kernel-parameters, rootflags]

  - id: 101-101.2-0038
    type: single_choice
    difficulty: 2
    pool: practice
    stem: Which kernel parameter hides most of the messages the kernel prints while booting?
    options:
      - id: a
        text: "`ro`"
        rationale: Wrong. ro makes the initial root mount read-only.
      - id: b
        text: "`quiet`"
        rationale: Correct. quiet suppresses most kernel boot messages on the console.
      - id: c
        text: "`vga=ask`"
        rationale: Wrong. vga=ask asks for a video mode at boot.
      - id: d
        text: "`acpi=off`"
        rationale: Wrong. acpi=off disables ACPI support.
    answer: [b]
    explanation: >
      quiet only hides the messages from the console. They are still stored in the kernel ring
      buffer and can be read later with dmesg or journalctl -k.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: The Bootloader }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [kernel-parameters, quiet]

  - id: 101-101.2-0039
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      Which kernel parameter makes systemd boot straight into the graphical desktop target,
      whatever the default target is?
    options:
      - id: a
        text: "`init=graphical.target`"
        rationale: Wrong. init= expects the path of a program to run, not a unit name.
      - id: b
        text: "`runlevel=graphical`"
        rationale: Wrong. There is no runlevel= kernel parameter.
      - id: c
        text: "`systemd.target=graphical`"
        rationale: Wrong. The parameter is called systemd.unit, and it takes a full unit name.
      - id: d
        text: "`systemd.unit=graphical.target`"
        rationale: Correct. systemd.unit= picks the unit (normally a target) to activate at boot.
    answer: [d]
    explanation: >
      systemd.unit=<name>.target overrides the default target for one boot, for example
      graphical.target, multi-user.target or rescue.target.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: The Bootloader }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [systemd, kernel-parameters]

  - id: 101-101.2-0040
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      GRUB on a UEFI machine is set up to hide its menu and boot straight away. Which key do you
      press while GRUB starts to make the menu appear?
    options:
      - id: a
        text: Esc
        rationale: Correct. On UEFI systems Esc brings up a hidden GRUB menu.
      - id: b
        text: Ctrl+X
        rationale: Wrong. Ctrl+X boots the entry being edited in the GRUB editor.
      - id: c
        text: e
        rationale: Wrong. e edits the selected entry once the menu is visible; it does not reveal the menu.
      - id: d
        text: Delete
        rationale: Wrong. Delete is a common key for the firmware setup utility, not for GRUB.
    answer: [a]
    explanation: >
      When GRUB's menu is hidden, holding Shift shows it on BIOS machines and pressing Esc shows it
      on UEFI machines.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: The Bootloader }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [grub, uefi]

  - id: 101-101.2-0041
    type: multi_choice
    difficulty: 3
    pool: practice
    stem: For each recorded boot, which **TWO** of these does `journalctl --list-boots` show?
    select_count: 2
    options:
      - id: a
        text: The kernel version that was booted
        rationale: Wrong. The kernel version is not part of the list; it is in the boot's log messages.
      - id: b
        text: The boot ID
        rationale: Correct. Each line shows the boot's 32-character ID.
      - id: c
        text: The number of errors logged
        rationale: Wrong. --list-boots does not count messages of any priority.
      - id: d
        text: The times of the first and last entries
        rationale: Correct. Each line shows when that boot's first and last journal entries were written.
    answer: [b, d]
    explanation: >
      journalctl --list-boots prints one line per boot: its offset relative to the current boot,
      its boot ID and the timestamps of its first and last entries. The offset or ID can then be
      given to -b.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: Initialization Inspection }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [journalctl, list-boots]

  - id: 101-101.2-0042
    type: multi_choice
    difficulty: 4
    pool: practice
    stem: Which **TWO** statements about the initramfs are true?
    select_count: 2
    options:
      - id: a
        text: It is an archive that the kernel uses as a temporary root filesystem in RAM
        rationale: Correct. The initramfs is unpacked into memory and serves as an interim root filesystem.
      - id: b
        text: It stays mounted as / for the whole session, with the disk mounted beneath it
        rationale: Wrong. The system switches to the real root filesystem, and the initramfs is freed from RAM.
      - id: c
        text: It can supply kernel modules needed to access the disk holding the real root filesystem
        rationale: Correct. That is its main purpose, for example storage, LVM or encryption support.
      - id: d
        text: It is stored in the firmware's NVRAM so that the bootloader can find it
        rationale: Wrong. The initramfs is a file, usually in /boot, loaded by the bootloader with the kernel.
    answer: [a, c]
    explanation: >
      The bootloader loads the kernel and the initramfs file. The kernel unpacks the initramfs into
      RAM, uses it to load whatever it needs to reach the real root filesystem, then switches to that
      root and starts init; the initramfs is released.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: System Initialization }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [initramfs]

  - id: 101-101.2-0043
    type: multi_choice
    difficulty: 1
    pool: practice
    stem: Which **TWO** of these are types of firmware that start a PC's boot process?
    select_count: 2
    options:
      - id: a
        text: BIOS
        rationale: Correct. BIOS is the traditional PC firmware.
      - id: b
        text: GRUB
        rationale: Wrong. GRUB is a bootloader, started by the firmware.
      - id: c
        text: systemd
        rationale: Wrong. systemd is an init system, started by the kernel.
      - id: d
        text: UEFI
        rationale: Correct. UEFI is the firmware interface that superseded BIOS.
    answer: [a, d]
    explanation: >
      The boot chain is firmware (BIOS or UEFI), bootloader (such as GRUB), kernel with its
      initramfs, and finally init (such as systemd).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.2", lesson: 1, section: BIOS or UEFI }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [bios, uefi, firmware]

