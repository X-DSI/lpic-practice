        bash -c 'type -t cd history'
      expect: { exit_code: 0, stdout_regex: "^builtin\\nbuiltin\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [builtin, type]

  - id: 101-103.1-0057
    type: multi_choice
    difficulty: 4
    pool: practice
    stem: Which **TWO** commands print the literal text `$PATH` rather than its value?
    select_count: 2
    options:
      - id: a
        text: "`echo \"$PATH\"`"
        rationale: Wrong. Double quotes still expand variables.
      - id: b
        text: "`echo ${PATH}`"
        rationale: Wrong. Braces just mark where the name ends; the variable is still expanded.
      - id: c
        text: "`echo '$PATH'`"
        rationale: Correct. Nothing is expanded inside single quotes.
      - id: d
        text: "`echo \\$PATH`"
        rationale: Correct. The backslash removes the special meaning of the $.
    answer: [c, d]
    explanation: >
      Single quotes or a backslash before the $ stop expansion. Double quotes and braces do not.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Quoting to Escape Special Characters }
    verify:
      command: >-
        bash -c 'echo '"'"'$PATH'"'"' \$PATH'
      expect: { exit_code: 0, stdout_contains: "$PATH $PATH" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [quoting, escaping]

