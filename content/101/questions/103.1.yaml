  - id: 101-103.1-0039
    type: multi_choice
    difficulty: 5
    pool: holdout
    stem: >
      You ran `cnt=42` in your shell and nothing else. Which **TWO** commands print the value `42`?
    select_count: 2
    options:
      - id: a
        text: "`env | grep cnt`"
        rationale: Wrong. cnt was not exported, so it is not in the environment that env prints.
      - id: b
        text: "`set | grep cnt`"
        rationale: Correct. set lists all shell variables, exported or not, so it prints cnt=42.
      - id: c
        text: "`echo \"$cnt\"`"
        rationale: Correct. The current shell expands its own variable, exported or not.
      - id: d
        text: "`printenv cnt`"
        rationale: Wrong. printenv reads its own environment, which does not contain the unexported cnt.
      - id: e
        text: "`bash -c 'echo $cnt'`"
        rationale: Wrong. The child bash expands $cnt, and it did not inherit the unexported variable.
    answer: [b, c]
    explanation: >
      Unexported variables exist only inside the shell that created them. Commands the shell handles
      itself (echo with expansion, set) can see them; separate programs such as env, printenv or a child
      bash cannot.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Deleting Environment Variables }
    verify:
      command: >-
        bash -c 'cnt=42; set | grep "^cnt="; echo "$cnt"; env | grep -c "^cnt=" || true' | tr '\n' ' '
      expect: { exit_code: 0, stdout_contains: "cnt=42 42 0" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [set, env, export]

  - id: 101-103.1-0040
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      The `report` script was moved from `/tmp/old` to `/tmp/new`; both directories are in `PATH`. In
      the same shell, you then see the exhibit. Which command makes `report` work again in this shell?
    exhibit: |
      $ report
      report done
      $ mv /tmp/old/report /tmp/new/report
      $ report
      bash: /tmp/old/report: No such file or directory
      $ which report
      /tmp/new/report
    options:
      - id: a
        text: "`type report`"
        rationale: Wrong. type only reports the location; here it would show "report is hashed (/tmp/old/report)".
      - id: b
        text: "`unset report`"
        rationale: Wrong. unset removes variables and functions; it does not touch the table of remembered command paths.
      - id: c
        text: "`history -c`"
        rationale: Wrong. This clears the command history list, which has nothing to do with locating programs.
      - id: d
        text: "`hash -r`"
        rationale: Correct. hash -r empties Bash's table of remembered paths, so the next run searches PATH again.
    answer: [d]
    explanation: >
      Bash remembered the old path of report in its hash table and keeps using it. which does its own PATH
      search and so finds the new file. hash -r forgets all remembered paths; hash -d report would forget
      just this one.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Getting Command Information }
    verify:
      setup:
        - mkdir -p /tmp/old /tmp/new && printf '#!/bin/sh\necho report done\n' > /tmp/old/report && chmod +x /tmp/old/report
      command: >-
        bash -c 'PATH=/tmp/old:/tmp/new:$PATH; report >/dev/null; mv /tmp/old/report /tmp/new/report; hash -r; report'
      expect: { exit_code: 0, stdout_contains: "report done" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [hash, PATH]

