  - id: 101-103.1-0027
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      There is a `passwd` command and a `passwd` file. Which command opens the manual page that describes
      the format of the `/etc/passwd` file?
    options:
      - id: a
        text: "`man 5 passwd`"
        rationale: Correct. Section 5 of the manual holds file formats.
      - id: b
        text: "`man passwd`"
        rationale: Wrong. Without a section, man shows the first match in section order, which is the passwd(1) command.
      - id: c
        text: "`man -k passwd`"
        rationale: Wrong. This searches for pages mentioning passwd and lists them; it does not open one.
      - id: d
        text: "`man 8 passwd`"
        rationale: Wrong. Section 8 is for system administration commands, not file formats.
    answer: [a]
    explanation: >
      Manual pages are grouped in numbered sections: 1 user commands, 5 file formats, 8 administration
      commands, among others. Giving the section number picks the right page when a name exists in
      several sections.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Getting Command Information }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [man, man-sections]

  - id: 101-103.1-0028
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: What does the last command in the exhibit print?
    exhibit: |
      $ a=1
      $ export b=2
      $ bash -c 'echo "[$a][$b]"'
    options:
      - id: a
        text: "`[1][2]`"
        rationale: Wrong. a was never exported, so the child bash cannot see it.
      - id: b
        text: "`[1][]`"
        rationale: Wrong. This reverses which variable was exported.
      - id: c
        text: "`[][2]`"
        rationale: Correct. Only the exported b reaches the child shell; a expands to nothing there.
      - id: d
        text: "`[][]`"
        rationale: Wrong. export b=2 puts b into the environment of every later child process.
    answer: [c]
    explanation: >
      The single quotes stop the current shell from expanding $a and $b, so the child bash expands them.
      The child only has the variables it received in its environment, which here means b.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Creating New Environment Variables }
    verify:
      command: >-
        bash -c 'a=1; export b=2; bash -c '"'"'echo "[$a][$b]"'"'"''
      expect: { exit_code: 0, stdout_contains: "[][2]" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [export, quoting, subshell]

  - id: 101-103.1-0029
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: Which **TWO** statements are consistent with the exhibit?
    exhibit: |
      $ set | grep '^mydir='
      mydir=/srv/data
      $ env | grep '^mydir='
      $
    select_count: 2
    options:
      - id: a
        text: mydir is passed to every program started from this shell
        rationale: Wrong. env shows the environment that programs receive, and mydir is not in it.
      - id: b
        text: mydir is a shell variable that has not been exported
        rationale: Correct. set lists all shell variables; env lists only the exported environment.
      - id: c
        text: env leaves out variables whose names are in lower case
        rationale: Wrong. env lists every exported variable regardless of the case of its name.
      - id: d
        text: A child shell started by typing bash would not see mydir
        rationale: Correct. Unexported variables are not copied into child processes.
    answer: [b, d]
    explanation: >
      set (no arguments) prints all shell variables and functions; env prints only the environment. A
      variable that set shows but env does not is a local shell variable. export mydir would make it
      appear in both.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Deleting Environment Variables }
    verify:
      command: >-
        bash -c 'mydir=/srv/data; set | grep -c "^mydir="; env | grep -c "^mydir=" || true' | tr -d '\n'
      expect: { exit_code: 0, stdout_contains: "10" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [set, env]

  - id: 101-103.1-0030
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: The exhibit was taken on a system where `/bin` is a symbolic link to `usr/bin`. Which **TWO** statements are true?
    exhibit: |
      $ type -a echo
      echo is a shell builtin
      echo is /usr/bin/echo
      echo is /bin/echo
    select_count: 2
    options:
      - id: a
        text: Typing `echo hi` runs the builtin, not a file on disk
        rationale: Correct. type -a lists matches in the order Bash would use them, and builtins come before PATH.
      - id: b
        text: "`which echo` prints nothing, because echo is a builtin"
        rationale: Wrong. which only searches PATH, so it prints /usr/bin/echo; it never reports builtins.
      - id: c
        text: The two paths show that two separate echo programs are installed
        rationale: Wrong. With /bin linked to usr/bin, both paths lead to the same file; PATH just contains both directories.
      - id: d
        text: Typing `/usr/bin/echo hi` runs the external program instead
        rationale: Correct. A name containing a slash is run from that path, bypassing builtins and the PATH search.
    answer: [a, d]
    explanation: >
      Bash checks aliases, keywords, functions and builtins before searching PATH. type -a shows every
      candidate in that order. To force the external program, give its path (or use command -p / env).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Getting Command Information }
    verify:
      command: >-
        bash -c 'type -a echo; which echo'
      expect: { exit_code: 0, stdout_regex: "(?s)echo is a shell builtin.*\\n/(usr/)?bin/echo\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [type, which, builtin]

  - id: 101-103.1-0031
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      You want the shell to search `$HOME/bin` before all the directories already in `PATH`, for this
      session and the programs it starts. Which command does that?
    options:
      - id: a
        text: "`export PATH=$HOME/bin`"
        rationale: Wrong. This replaces PATH, so every other directory is lost and most commands stop being found.
      - id: b
        text: "`export PATH=\"$HOME/bin:$PATH\"`"
        rationale: Correct. The new directory goes first, followed by the old value of PATH.
      - id: c
        text: "`export PATH='$HOME/bin:$PATH'`"
        rationale: Wrong. Single quotes stop expansion, so PATH would contain the literal text $HOME/bin:$PATH.
      - id: d
        text: "`export $PATH=\"$HOME/bin:$PATH\"`"
        rationale: Wrong. $PATH on the left is expanded first, so export receives an invalid name instead of PATH.
    answer: [b]
    explanation: >
      To extend PATH, include the old value: NEW:$PATH puts the new directory first, $PATH:NEW puts it
      last. Double quotes let both variables expand. The change lasts until the shell exits.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Finding Your Environment Variables }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [PATH, export, quoting]

  - id: 101-103.1-0032
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: >
      After `unset PATH`, typing `ls` fails. Which **TWO** command lines still run the `ls` program
      from the same shell?
    select_count: 2
    options:
      - id: a
        text: "`/bin/ls`"
        rationale: Correct. A command given with a path is run directly, without a PATH search.
      - id: b
        text: "`which ls`"
        rationale: Wrong. which is itself an external program, so it cannot be found either, and it would only print a path.
      - id: c
        text: "`PATH=/usr/bin:/bin ls`"
        rationale: Correct. The temporary PATH assignment is used to find ls for this one command.
      - id: d
        text: "`export PATH; ls`"
        rationale: Wrong. Exporting an unset variable gives it no value, so ls is still not found.
    answer: [a, c]
    explanation: >
      Without PATH the shell cannot locate external programs by name. Giving the full path, or a PATH
      value for a single command, still works. Setting PATH again (or opening a new shell) restores
      normal behaviour.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Finding Your Environment Variables }
    verify:
      command: >-
        bash -c 'unset PATH; /bin/ls -d / && PATH=/usr/bin:/bin ls -d /'
      expect: { exit_code: 0, stdout_contains: "/" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [PATH, invoking-commands]

  - id: 101-103.1-0033
    type: fill_in
    difficulty: 4
    pool: holdout
    stem: >
      Write a single `export` command that adds `/opt/tools/bin` to the **end** of the existing `PATH`
      and exports the result.
    fill_in:
      accepted:
        - 'export\s+PATH=(?P<q>"?)\$(PATH|\{PATH\}):/opt/tools/bin/?(?P=q)'
        - 'export\s+PATH\+=(?P<q>"?):/opt/tools/bin/?(?P=q)'
      match: regex
      case_sensitive: true
    explanation: >
      export PATH=$PATH:/opt/tools/bin keeps the old value and appends the new directory, so it is
      searched last. Double quotes around the value are fine; single quotes are not, because they stop
      $PATH from expanding. Bash's += form (export PATH+=:/opt/tools/bin) does the same.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Finding Your Environment Variables }
    verify:
      command: >-
        bash -c 'export PATH=$PATH:/opt/tools/bin; bash -c "echo \$PATH"'
      expect: { exit_code: 0, stdout_regex: ":/opt/tools/bin\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [PATH, export]

  - id: 101-103.1-0034
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: The user's home directory is `/home/ana`. What does the command in the exhibit print?
    exhibit: |
      $ echo '$HOME' "\$HOME" "$HOME"
    options:
      - id: a
        text: "`/home/ana /home/ana /home/ana`"
        rationale: Wrong. The first two words are protected from expansion, by single quotes and by a backslash.
      - id: b
        text: "`$HOME \\$HOME /home/ana`"
        rationale: Wrong. Inside double quotes a backslash before $ is removed after it does its job.
      - id: c
        text: "`$HOME /home/ana /home/ana`"
        rationale: Wrong. The backslash in the second word stops the expansion of $HOME.
      - id: d
        text: "`$HOME $HOME /home/ana`"
        rationale: Correct. Single quotes and a backslash both keep $HOME literal; only the last word expands.
    answer: [d]
    explanation: >
      Within double quotes the backslash still escapes $, `, " and \, and is then removed. Single quotes
      need no escaping because nothing inside them is special.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Quoting to Escape Special Characters }
    verify:
      command: >-
        HOME=/home/ana bash -c 'echo '"'"'$HOME'"'"' "\$HOME" "$HOME"'
      expect: { exit_code: 0, stdout_contains: "$HOME $HOME /home/ana" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [quoting, escaping]

  - id: 101-103.1-0035
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: The user's home directory is `/home/ana`. What does the last command in the exhibit print?
    exhibit: |
      $ x='$HOME'
      $ echo "$x" $x
    options:
      - id: a
        text: "`/home/ana /home/ana`"
        rationale: Wrong. The value of x is expanded once; the $HOME it contains is not expanded a second time.
      - id: b
        text: "`$HOME /home/ana`"
        rationale: Wrong. Leaving $x unquoted adds word splitting and globbing, not another variable expansion.
      - id: c
        text: "`$HOME $HOME`"
        rationale: Correct. x holds the literal text $HOME, and both forms print that text unchanged.
      - id: d
        text: "`/home/ana $HOME`"
        rationale: Wrong. Double quotes do not cause the expanded value to be expanded again.
    answer: [c]
    explanation: >
      The single quotes store the literal string $HOME in x. Bash expands $x to that string and stops:
      the result of a variable expansion is not scanned for further variables, quoted or not.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Quoting to Escape Special Characters }
    verify:
      command: >-
        HOME=/home/ana bash -c 'x='"'"'$HOME'"'"'; echo "$x" $x'
      expect: { exit_code: 0, stdout_contains: "$HOME $HOME" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [quoting, variables]

  - id: 101-103.1-0036
    type: multi_choice
    difficulty: 5
    pool: holdout
    stem: >
      Given the exhibit, which **TWO** of these, typed as the very next command, run `uname -r` again?
    exhibit: |
      $ history 4
        102  uname -r
        103  cat /etc/hostname
        104  uptime
        105  history 4
    select_count: 2
    options:
      - id: a
        text: "`!-2`"
        rationale: Wrong. Counting back from the new entry 106, two back is 104, which is uptime.
      - id: b
        text: "`!102`"
        rationale: Correct. !N runs history entry number N, which is uname -r.
      - id: c
        text: "`!u`"
        rationale: Wrong. !string uses the most recent command starting with the string, which is uptime.
      - id: d
        text: "`!un`"
        rationale: Correct. The most recent command starting with un is uname -r.
      - id: e
        text: "`!?name?`"
        rationale: Wrong. !?string? uses the most recent command containing name anywhere, which is cat /etc/hostname.
    answer: [b, d]
    explanation: >
      !N picks an entry by number, !-N counts back from the current command, !string matches the start of
      the most recent command and !?string? matches anywhere in it. The history command itself is entry
      105, which shifts relative references.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Using Your Command History }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [history, history-expansion]

  - id: 101-103.1-0037
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: What does the last command in the exhibit print?
    exhibit: |
      $ stage=build
      $ bash
      $ export stage=deploy
      $ exit
      $ echo $stage
    options:
      - id: a
        text: "`build`"
        rationale: Correct. The parent's stage was never changed; the export happened only in the child shell.
      - id: b
        text: "`deploy`"
        rationale: Wrong. A child process cannot change its parent's variables, exported or not.
      - id: c
        text: An empty line
        rationale: Wrong. stage is still set in the parent shell, even though it was never exported there.
      - id: d
        text: "`$stage`"
        rationale: Wrong. The variable is unquoted and set, so it expands to its value.
    answer: [a]
    explanation: >
      Environment variables flow one way: from a parent to the children it starts. The child shell got no
      copy of stage (it was not exported), created its own, and that copy disappeared with exit.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Creating New Environment Variables }
    verify:
      command: >-
        bash -c 'stage=build; bash -c "export stage=deploy"; echo $stage'
      expect: { exit_code: 0, stdout_contains: "build" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [export, subshell]

  - id: 101-103.1-0038
    type: fill_in
    difficulty: 5
