  - id: 101-103.1-0001
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      After changing directories several times, you want to confirm which directory a new file
      would be created in if you gave no path. Which command tells you?
    options:
      - id: a
        text: "`uname`"
        rationale: Wrong. uname reports system information such as the kernel name, not your location.
      - id: b
        text: "`pwd`"
        rationale: Correct. pwd prints the absolute path of the current working directory.
      - id: c
        text: "`which`"
        rationale: Wrong. which looks up the path of a command in PATH; it says nothing about where you are.
      - id: d
        text: "`type`"
        rationale: Wrong. type describes how a command name would be interpreted, not the current directory.
    answer: [b]
    explanation: >
      pwd ("print working directory") shows the directory the shell is in. Relative paths, including a
      bare file name given to touch, are resolved against it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Getting System Information }
    verify:
      command: >-
        cd /usr/share && pwd
      expect: { exit_code: 0, stdout_contains: "/usr/share" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [pwd]

  - id: 101-103.1-0002
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: What does `uname` print when you run it with no options at all?
    options:
      - id: a
        text: The network host name of the machine
        rationale: Wrong. That is uname -n.
      - id: b
        text: The kernel release, such as `6.8.0-45-generic`
        rationale: Wrong. That is uname -r.
      - id: c
        text: The kernel name, such as `Linux`
        rationale: Correct. With no option, uname behaves as uname -s and prints the kernel name.
      - id: d
        text: Every field it knows, as with `-a`
        rationale: Wrong. uname only prints everything when given -a (--all).
    answer: [c]
    explanation: >
      Without options uname is the same as uname -s, the kernel name. Other options select other fields
      (-r release, -n host name, -m machine hardware), and -a prints them all on one line.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Getting Command Information }
    verify:
      command: >-
        uname
      expect: { exit_code: 0, stdout_contains: "Linux" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [uname]

  - id: 101-103.1-0003
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: In which file does Bash keep a user's saved command history by default?
    options:
      - id: a
        text: "`/etc/bash.bashrc`"
        rationale: Wrong. This is a system-wide start-up file for interactive shells on Debian-based systems.
      - id: b
        text: "`~/.bashrc`"
        rationale: Wrong. This is the user's start-up file for interactive shells, not the history store.
      - id: c
        text: "`/var/log/bash.log`"
        rationale: Wrong. Bash does not log commands to a file under /var/log.
      - id: d
        text: "`~/.bash_history`"
        rationale: Correct. HISTFILE defaults to .bash_history in the user's home directory.
    answer: [d]
    explanation: >
      Bash saves the history list to ~/.bash_history (the default value of HISTFILE). The leading dot
      makes it a hidden file, so plain ls does not show it; ls -a does.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Using Your Command History }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [history, .bash_history]

  - id: 101-103.1-0004
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: Which command removes a variable from the current shell completely?
    options:
      - id: a
        text: "`unset`"
        rationale: Correct. unset NAME deletes the variable, so it no longer has any value.
      - id: b
        text: "`env`"
        rationale: Wrong. env lists the environment or runs a program with a modified environment; it does not change the shell.
      - id: c
        text: "`set`"
        rationale: Wrong. Without arguments set lists variables and functions; it does not delete them.
      - id: d
        text: "`export`"
        rationale: Wrong. export marks a variable for passing to child processes.
    answer: [a]
    explanation: >
      unset followed by the variable name (no $) removes the variable. After that, $NAME expands to an
      empty string and child processes no longer receive it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Deleting Environment Variables }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [unset]

  - id: 101-103.1-0005
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      You cannot remember the name of a tool, but you know its manual page mentions "partition" in its
      short description. Which command searches manual page names and descriptions for a keyword?
    options:
      - id: a
        text: "`which partition`"
        rationale: Wrong. which only looks for an executable named exactly partition in PATH.
      - id: b
        text: "`apropos partition`"
        rationale: Correct. apropos searches the names and one-line descriptions of the installed manual pages.
      - id: c
        text: "`type partition`"
        rationale: Wrong. type only says how the shell would interpret a command named partition.
      - id: d
        text: "`man partition`"
        rationale: Wrong. man needs the exact name of a page; it does not search descriptions.
    answer: [b]
    explanation: >
      apropos (also available as man -k) matches a keyword against manual page names and their short
      descriptions and lists every match with its section number.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Getting Command Information }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [apropos, man]

  - id: 101-103.1-0006
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      Which variable holds the colon-separated list of directories the shell searches when you type a
      command name without a path?
    options:
      - id: a
        text: "`HOME`"
        rationale: Wrong. HOME is the user's home directory.
      - id: b
        text: "`PWD`"
        rationale: Wrong. PWD is the current working directory.
      - id: c
        text: "`SHELL`"
        rationale: Wrong. SHELL names the user's login shell program.
      - id: d
        text: "`PATH`"
        rationale: Correct. The shell looks for commands in the directories listed in PATH, in order.
    answer: [d]
    explanation: >
      PATH lists directories separated by colons. A command typed without a slash is looked for in each
      of them in turn; the first match runs.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Finding Your Environment Variables }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [PATH, environment]

  - id: 101-103.1-0007
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: Which command prints the value of the variable `EDITOR`?
    options:
      - id: a
        text: "`echo EDITOR`"
        rationale: Wrong. Without the $ the shell does not expand anything; echo prints the word EDITOR.
      - id: b
        text: "`env EDITOR`"
        rationale: Wrong. env treats EDITOR as the name of a program to run, and fails because there is none.
      - id: c
        text: "`echo $EDITOR`"
        rationale: Correct. The $ makes the shell replace the name with the variable's value before echo runs.
      - id: d
        text: "`set EDITOR`"
        rationale: Wrong. This sets the positional parameter $1 to the word EDITOR and prints nothing.
    answer: [c]
    explanation: >
      Prefixing a variable name with $ tells the shell to expand it. echo then simply prints the
      resulting value.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Finding Your Environment Variables }
    verify:
      command: >-
        bash -c 'EDITOR=nano; echo $EDITOR'
      expect: { exit_code: 0, stdout_contains: "nano" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [echo, variables]

  - id: 101-103.1-0008
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: Which command tells you whether `cd` is built into Bash or is a program on disk?
    options:
      - id: a
        text: "`which cd`"
        rationale: Wrong. which only searches PATH for executable files, so it cannot report that cd is a builtin.
      - id: b
        text: "`hash cd`"
        rationale: Wrong. hash manages the remembered locations of external programs; it does not describe a command.
      - id: c
        text: "`type cd`"
        rationale: Correct. type reports whether a name is a builtin, alias, function, keyword or file, and prints "cd is a shell builtin".
      - id: d
        text: "`apropos cd`"
        rationale: Wrong. apropos searches manual page descriptions; it knows nothing about Bash builtins.
    answer: [c]
    explanation: >
      type is itself a Bash builtin and knows everything the shell does: aliases, functions, keywords,
      builtins and files found in PATH. For cd it reports "cd is a shell builtin".
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Getting Command Information }
    verify:
      command: >-
        bash -c 'type cd'
      expect: { exit_code: 0, stdout_contains: "cd is a shell builtin" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [type, builtin]

  - id: 101-103.1-0009
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: Which line correctly creates a shell variable `project` with the value `alpha`?
    options:
      - id: a
        text: "`project=alpha`"
        rationale: Correct. An assignment is NAME=value with no spaces around the equals sign.
      - id: b
        text: "`project = alpha`"
        rationale: Wrong. With spaces, Bash tries to run a command called project with the arguments = and alpha.
      - id: c
        text: "`$project=alpha`"
        rationale: Wrong. The $ expands the (empty) variable first, and the result is run as a command, not an assignment.
      - id: d
        text: "`set project=alpha`"
        rationale: Wrong. This sets the positional parameter $1 to the string project=alpha.
    answer: [a]
    explanation: >
      Variable assignment in Bash is written NAME=value with nothing around the =. The $ is used only
      when reading the value back.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Creating New Environment Variables }
    verify:
      command: >-
        bash -c 'project=alpha; echo "[$project]"'
      expect: { exit_code: 0, stdout_contains: "[alpha]" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [variables]

  - id: 101-103.1-0010
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      You set `LOGLEVEL=debug` in your shell. A program you start next from the same shell has to see
      that value. What do you run first?
    options:
      - id: a
        text: "`set LOGLEVEL`"
        rationale: Wrong. This replaces the positional parameters; it does not pass anything to programs.
      - id: b
        text: "`echo $LOGLEVEL`"
        rationale: Wrong. This only prints the value.
      - id: c
        text: "`unset LOGLEVEL`"
        rationale: Wrong. This deletes the variable, so no program can see it.
      - id: d
        text: "`export LOGLEVEL`"
        rationale: Correct. export puts the variable in the environment that is copied to child processes.
    answer: [d]
    explanation: >
      A plain assignment creates a shell variable that only the current shell sees. export marks it for
      the environment, and every process started afterwards from that shell receives a copy.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Creating New Environment Variables }
    verify:
      command: >-
        bash -c 'LOGLEVEL=debug; export LOGLEVEL; bash -c "echo [\$LOGLEVEL]"'
      expect: { exit_code: 0, stdout_contains: "[debug]" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [export]

  - id: 101-103.1-0011
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      Which command shows the 15 most recent entries of the current shell's history list, including
      commands typed in this session?
    options:
      - id: a
        text: "`tail -n 15 ~/.bash_history`"
        rationale: Wrong. By default the current session's commands are only written to the file when the shell exits.
      - id: b
        text: "`history 15`"
        rationale: Correct. A numeric argument makes history list only that many of the most recent entries.
      - id: c
        text: "`history -c 15`"
        rationale: Wrong. -c clears the history list instead of showing it.
      - id: d
        text: "`head -n 15 ~/.bash_history`"
        rationale: Wrong. This shows the oldest saved entries, and misses this session's commands.
    answer: [b]
    explanation: >
      history N prints the last N entries of the in-memory history list, newest last. The history file is
      only updated when the shell exits (or on history -a / -w), so reading it misses recent commands.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Using Your Command History }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [history]

  - id: 101-103.1-0012
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      `backup.sh` is an executable script in your current directory, which is not listed in `PATH`.
      Typing `backup.sh` gives "command not found". Which command runs the script?
    options:
      - id: a
        text: "`./backup.sh`"
        rationale: Correct. A name containing a slash is run from that path directly, without a PATH search.
      - id: b
        text: "`export backup.sh`"
        rationale: Wrong. export works on variable names, and backup.sh is not a valid one.
      - id: c
        text: "`which backup.sh`"
        rationale: Wrong. which searches PATH too, so it finds nothing, and it never runs the file anyway.
      - id: d
        text: "`type backup.sh`"
        rationale: Wrong. type only describes how a name would be interpreted; here it reports that it is not found.
    answer: [a]
    explanation: >
      The shell only searches PATH for names without a slash. Giving a relative path such as ./backup.sh
      or an absolute path runs a program that is not in PATH.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Finding Your Environment Variables }
    verify:
      command: >-
        cd /tmp && printf '#!/bin/sh\necho ran-ok\n' > backup.sh && chmod +x backup.sh && ./backup.sh
      expect: { exit_code: 0, stdout_contains: "ran-ok" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [PATH, invoking-commands]

  - id: 101-103.1-0013
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      A script needs only the absolute path of the `rsync` executable that `PATH` would find, with no
      other words in the output. Which command gives exactly that?
    options:
      - id: a
        text: "`type rsync`"
        rationale: Wrong. type prints a sentence such as "rsync is /usr/bin/rsync", not just the path.
      - id: b
        text: "`apropos rsync`"
        rationale: Wrong. apropos lists manual pages whose names or descriptions match.
      - id: c
        text: "`which rsync`"
        rationale: Correct. which prints just the full path of the first matching executable in PATH.
      - id: d
        text: "`man -w rsync`"
        rationale: Wrong. man -w prints the location of the manual page file, not the program.
    answer: [c]
    explanation: >
      which searches PATH and prints only the full path of the executable it finds, which makes its output
      easy to use in scripts. type gives richer information, but phrased as a sentence.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Getting Command Information }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [which]

  - id: 101-103.1-0014
    type: multi_choice
    difficulty: 2
    pool: holdout
    stem: Which **TWO** commands create a single file named `q3 report.txt` (with the space)?
    select_count: 2
    options:
      - id: a
        text: "`touch \"q3 report.txt\"`"
        rationale: Correct. Inside double quotes the space is part of the word, so touch gets one argument.
      - id: b
        text: "`touch q3 report.txt`"
        rationale: Wrong. The unquoted space splits the name, so two files called q3 and report.txt are created.
      - id: c
        text: "`touch q3/ report.txt`"
        rationale: Wrong. A forward slash is a path separator, not an escape; this names a directory q3/ and a file report.txt.
      - id: d
        text: "`touch q3\\ report.txt`"
        rationale: Correct. A backslash makes the following space literal, so the name stays one argument.
    answer: [a, d]
    explanation: >
      Bash splits words on unquoted spaces. Double quotes, single quotes or a backslash before the space
      all stop that split, so the whole name reaches touch as one argument.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Quoting to Escape Special Characters }
    verify:
      command: >-
        cd "$(mktemp -d)" && touch "q3 report.txt" && touch q3\ report.txt && ls | wc -l
      expect: { exit_code: 0, stdout_regex: "^1\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [quoting, escaping]

  - id: 101-103.1-0015
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: Which command displays Bash's own built-in documentation for the `cd` builtin?
    options:
      - id: a
        text: "`which cd`"
        rationale: Wrong. which looks for an executable in PATH and prints nothing for cd.
      - id: b
        text: "`help cd`"
        rationale: Correct. help prints Bash's documentation for its builtin commands.
      - id: c
        text: "`type -a cd`"
        rationale: Wrong. type -a lists every way the name could be interpreted, without any usage text.
      - id: d
        text: "`apropos cd`"
        rationale: Wrong. apropos searches manual page descriptions; it does not show builtin help.
    answer: [b]
    explanation: >
      Builtins such as cd, export or history are part of Bash, so they often have no manual page of their
      own. The help builtin prints their synopsis and options.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Getting Command Information }
    verify:
      command: >-
        bash -c 'help cd'
      expect: { exit_code: 0, stdout_contains: "Change the shell working directory" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [help, builtin]

  - id: 101-103.1-0016
    type: fill_in
    difficulty: 2
    pool: holdout
    stem: >
      Type the complete command, including its argument, that deletes the variable `TMPDIR` from your
      current shell.
    fill_in:
      accepted: ['unset(\s+-v)?\s+TMPDIR']
      match: regex
      case_sensitive: true
    explanation: >
      unset TMPDIR removes the variable (unset -v TMPDIR says explicitly that a variable, not a
      function, is meant). The name is given without a $; with a $ the shell would expand it first and
      unset whatever name the value happens to be.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Deleting Environment Variables }
    verify:
      command: >-
        bash -c 'TMPDIR=/x; unset TMPDIR; echo "[${TMPDIR-unset}]"'
      expect: { exit_code: 0, stdout_contains: "[unset]" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [unset]

  - id: 101-103.1-0017
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      Which command prints only the release of the running kernel, for example
      `6.8.0-45-generic`?
    options:
      - id: a
        text: "`uname -s`"
        rationale: Wrong. -s prints the kernel name, such as Linux.
      - id: b
        text: "`uname -m`"
        rationale: Wrong. -m prints the machine hardware name, such as x86_64.
      - id: c
        text: "`uname -v`"
        rationale: Wrong. -v prints the kernel version string (build number and date), not the release.
      - id: d
        text: "`uname -r`"
        rationale: Correct. -r (--kernel-release) prints the kernel release.
    answer: [d]
    explanation: >
      uname -r gives the release, the string used for /lib/modules/<release>. uname -v is easy to confuse
      with it, but it prints the build string such as "#45-Ubuntu SMP PREEMPT_DYNAMIC ...".
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Getting Command Information }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [uname]

  - id: 101-103.1-0018
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: What does the second command in the exhibit print?
    exhibit: |
      $ price=40
      $ echo "Total: $price" 'Total: $price'
    options:
      - id: a
        text: "`Total: 40 Total: 40`"
        rationale: Wrong. Single quotes stop variable expansion, so the second $price stays literal.
      - id: b
        text: "`Total: 40 Total: $price`"
        rationale: Correct. Double quotes still expand $price; single quotes keep every character literal.
      - id: c
        text: "`Total: $price Total: 40`"
        rationale: Wrong. This swaps the behaviour of the two kinds of quotes.
      - id: d
        text: "`Total: $price Total: $price`"
        rationale: Wrong. Double quotes do not stop $ expansion.
    answer: [b]
    explanation: >
      Single quotes make everything between them literal. Double quotes protect spaces and most special
      characters but still allow $ (variable and command substitution), backticks and backslash escapes.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Quoting to Escape Special Characters }
    verify:
      command: >-
        bash -c 'price=40; echo "Total: $price" '"'"'Total: $price'"'"''
      expect: { exit_code: 0, stdout_contains: "Total: 40 Total: $price" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [quoting]

  - id: 101-103.1-0019
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: Which **TWO** characters keep their special meaning inside double quotes in Bash?
    select_count: 2
    options:
      - id: a
        text: "`*`"
        rationale: Wrong. Filename expansion does not happen inside double quotes; "*" is a literal asterisk.
      - id: b
        text: "`$`"
        rationale: Correct. Variable expansion and $( ) command substitution still work inside double quotes.
      - id: c
        text: "`` ` `` (backtick)"
        rationale: Correct. Backtick command substitution still works inside double quotes.
      - id: d
        text: "`~`"
        rationale: Wrong. Tilde expansion does not happen inside double quotes; "~" stays a literal tilde.
    answer: [b, c]
    explanation: >
      Inside double quotes, $, the backtick and the backslash stay special (and ! when interactive history
      expansion is on). Globbing characters, ~, spaces and redirection symbols are taken literally.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Quoting to Escape Special Characters }
    verify:
      command: >-
        bash -c 'v=1; echo "~ * $v `echo bt`"'
      expect: { exit_code: 0, stdout_contains: "~ * 1 bt" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [quoting]

  - id: 101-103.1-0020
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      Type the `uname` command, with its option, that prints every piece of information uname can
      report (kernel name, host name, release, version, hardware and operating system) on one line.
    fill_in:
      accepted: ['(((/usr)?/bin/)?uname\s+)?(-a|--all)']
      match: regex
      case_sensitive: true
    explanation: >
      uname -a (long form --all) prints all fields in a fixed order, leaving out the processor and
      hardware platform fields when they are unknown.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Getting System Information }
