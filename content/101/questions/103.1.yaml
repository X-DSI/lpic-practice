  - id: 101-103.1-0021
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: In the exhibit, what does the word "hashed" tell you about `uname`?
    exhibit: |
      $ type uname
      uname is hashed (/usr/bin/uname)
    options:
      - id: a
        text: Bash found it via PATH earlier in this shell and remembered the path
        rationale: Correct. Bash keeps a hash table of programs it has located, so it can skip the PATH search next time.
      - id: b
        text: It is a shell builtin, with a cached copy also kept in /usr/bin
        rationale: Wrong. A builtin is reported as "a shell builtin"; uname here is an external program.
      - id: c
        text: Its checksum was verified against the package database when you logged in
        rationale: Wrong. "hashed" refers to Bash's lookup table, not to a file checksum.
      - id: d
        text: It is an alias that the shell expands to /usr/bin/uname
        rationale: Wrong. Aliases are reported by type as "aliased to ...".
    answer: [a]
    explanation: >
      When Bash finds an external command through PATH, it records the location in its hash table. type
      then reports the command as hashed. A new shell starts with an empty table; hash lists it and
      hash -r clears it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Getting Command Information }
    verify:
      command: >-
        bash -c 'uname >/dev/null; type uname'
      expect: { exit_code: 0, stdout_contains: "uname is hashed" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Option lengths rebalanced; the correct option was the longest." }
    tags: [type, hash]

  - id: 101-103.1-0022
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      Type the `man` option that makes man search manual page names and short descriptions for a
      keyword, exactly as `apropos` does.
    fill_in:
      accepted: ['(((/usr)?/bin/)?man\s+)?(-k|--apropos)(\s+(?!-)\S+)*']
      match: regex
      case_sensitive: true
    explanation: >
      man -k KEYWORD (long form --apropos) is the same search as apropos KEYWORD. Its sibling man -f
      matches whole page names only, like whatis.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Getting Command Information }
    review:
      status: pass1
      history:
