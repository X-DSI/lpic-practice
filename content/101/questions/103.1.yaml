    tags: [man, apropos]

  - id: 101-103.1-0023
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: What does the last command in the exhibit print?
    exhibit: |
      $ color=red
      $ bash
      $ echo "[$color]"
    options:
      - id: a
        text: "`[red]`"
        rationale: Wrong. color was never exported, so the new shell does not inherit it.
      - id: b
        text: "`red`"
        rationale: Wrong. The brackets are literal text and would be printed in any case.
      - id: c
        text: "An error saying that `color` is not set"
        rationale: Wrong. By default Bash expands an unset variable to an empty string without complaint.
      - id: d
        text: "`[]`"
        rationale: Correct. The child shell has no variable named color, so it expands to nothing.
    answer: [d]
    explanation: >
      Typing bash starts a child shell. Only exported variables are copied into a child's environment, so
      the unexported color does not exist there. Running exit returns to the parent, where it still does.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Creating New Environment Variables }
    verify:
      command: >-
        bash -c 'color=red; bash -c "echo [\$color]"'
      expect: { exit_code: 0, stdout_contains: "[]" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [variables, export, subshell]

  - id: 101-103.1-0024
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: Which **TWO** commands show the location of the program that runs when you type `uname`?
    select_count: 2
    options:
      - id: a
        text: "`which uname`"
        rationale: Correct. which prints the full path of the uname executable found in PATH.
      - id: b
        text: "`apropos uname`"
        rationale: Wrong. apropos lists matching manual pages and their sections, not program locations.
      - id: c
        text: "`type uname`"
        rationale: Correct. type reports "uname is /usr/bin/uname" (or "is hashed" with the path).
      - id: d
        text: "`uname -p`"
        rationale: Wrong. -p prints the processor type, not where uname is installed.
    answer: [a, c]
    explanation: >
      which prints only the path; type gives the same path as part of a sentence and also knows about
      builtins, aliases and functions.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Getting Command Information }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [which, type]

  - id: 101-103.1-0025
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      You want `date` to run once with `TZ=UTC`, leaving the variables of your current shell exactly as
      they were. Which command line does that?
    options:
      - id: a
        text: "`export TZ=UTC; date`"
        rationale: Wrong. date sees UTC, but TZ stays set and exported in your shell afterwards.
      - id: b
        text: "`TZ=UTC date`"
        rationale: Correct. An assignment placed before a command goes only into that command's environment.
      - id: c
        text: "`TZ=UTC; date`"
        rationale: Wrong. The semicolon makes this a separate assignment that stays in the shell; date only sees it if TZ was already exported.
      - id: d
        text: "`set TZ=UTC; date`"
        rationale: Wrong. set makes the string TZ=UTC the positional parameter $1; it sets no variable.
    answer: [b]
    explanation: >
      NAME=value command puts the variable in the environment of that one command only. env NAME=value
      command does the same through the env program. Either way the shell itself is unchanged.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 2, section: Finding Your Environment Variables }
    verify:
      command: >-
        bash -c 'unset TZ; TZ=UTC date +%Z; echo "[${TZ-none}]"'
      expect: { exit_code: 0, stdout_contains: "[none]" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [env, variables]

  - id: 101-103.1-0026
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      Type the Bash history expansion that runs the previous command again, exactly as it was typed.
    fill_in:
      accepted: ['!!|!-1']
      match: regex
      case_sensitive: true
    explanation: >
      !! refers to the previous history entry (it is shorthand for !-1). Bash prints the expanded command
      and runs it. A common use is sudo !! to repeat a command that needed root.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Using Your Command History }
