    fill_in:
      accepted: ['(history\s+)?-d\s*42']
      match: regex
      case_sensitive: true
    explanation: >
      history -d 42 removes entry 42 from the in-memory list; history -c would clear everything. If the
      entry has already been saved to ~/.bash_history, run history -w afterwards to rewrite the file.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Using Your Command History }
