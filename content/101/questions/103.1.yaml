  - id: 101-103.1-0055
    type: multi_choice
    difficulty: 3
    pool: practice
    stem: Which **TWO** command lines print `done` only if `cp a b` succeeded?
    select_count: 2
    options:
      - id: a
        text: "`cp a b || echo done`"
        rationale: Wrong. || runs the second command only when the first one fails.
      - id: b
        text: "`cp a b && echo done`"
        rationale: Correct. && runs the second command only when the first exits with status 0.
      - id: c
        text: "`cp a b; echo done`"
        rationale: Wrong. ; runs the second command whatever the first one's result.
      - id: d
        text: "`if cp a b; then echo done; fi`"
        rationale: Correct. if tests the exit status of cp and runs echo only on success.
    answer: [b, d]
    explanation: >
      On one line, ; simply sequences commands, && continues on success and || continues on failure.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.1", lesson: 1, section: Introduction }
    verify:
      command: >-
