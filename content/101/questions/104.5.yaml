  - id: 101-104.5-0035
    type: single_choice
    difficulty: 2
    pool: practice
    stem: What is `rwxr-xr-x` in octal?
    options:
      - id: a
        text: "`775`"
        rationale: Wrong. 775 gives the group write as well (rwxrwxr-x).
      - id: b
        text: "`644`"
        rationale: Wrong. 644 is rw-r--r--, with no execute at all.
      - id: c
        text: "`755`"
        rationale: Correct. 7 = rwx, 5 = r-x, 5 = r-x.
      - id: d
        text: "`557`"
        rationale: Wrong. The digits go user, group, others; this would be r-xr-xrwx.
    answer: [c]
    explanation: rwx is 4+2+1 = 7 and r-x is 4+1 = 5, so the mode is 755.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.5", lesson: 1, section: Octal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [octal]

  - id: 101-104.5-0036
    type: single_choice
    difficulty: 2
    pool: practice
    stem: What does the sticky bit do when set on a world-writable directory?
    options:
      - id: a
        text: New files in the directory inherit its group
        rationale: Wrong. That is the SGID bit on a directory.
      - id: b
        text: Users can delete or rename only their own files in it
        rationale: Correct. The sticky bit (restricted deletion flag) protects each user's files from the others; only the directory's owner and root are exempt.
      - id: c
        text: Files in the directory cannot be modified by anyone except root
        rationale: Wrong. Writing to files still follows each file's own permissions.
      - id: d
        text: Programs in the directory run with the directory owner's privileges
        rationale: Wrong. Nothing like that exists; SUID applies to executable files, not directories.
    answer: [b]
    explanation: >
      /tmp is the usual example (mode 1777). Everyone may create files there, but the sticky bit stops
      users removing or renaming each other's files.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.5", lesson: 1, section: Sticky Bit }
    verify:
      command: stat -c %a /tmp
      expect: { exit_code: 0, stdout_contains: "1777" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: fixed, notes: "Correct option shortened (length giveaway); exemptions moved to the rationale. Reproduced as a non-root user: rename of another user's file in a 1777 directory gave Operation not permitted." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [sticky-bit]

  - id: 101-104.5-0037
    type: multi_choice
    difficulty: 2
    pool: practice
    stem: Which **TWO** characters at the start of an `ls -l` line indicate a device file?
    select_count: 2
    options:
      - id: a
        text: "`b`"
        rationale: Correct. b is a block device, such as a disk or loop device.
      - id: b
        text: "`d`"
        rationale: Wrong. d is a directory.
      - id: c
        text: "`s`"
        rationale: Wrong. s is a socket, a communication endpoint between programs, not a device.
      - id: d
        text: "`c`"
        rationale: Correct. c is a character device, such as a terminal or /dev/null.
    answer: [a, d]
    explanation: Device files are either block (b) or character (c) devices; they live mostly under /dev.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.5", lesson: 1, section: Understanding Filetypes }
