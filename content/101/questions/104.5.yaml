    tags: [chmod]

  - id: 101-104.5-0032
    type: single_choice
    difficulty: 1
    pool: practice
    stem: Which first character in `ls -l` output marks a symbolic link?
    options:
      - id: a
        text: "`s`"
        rationale: Wrong. s marks a socket.
      - id: b
        text: "`-`"
        rationale: Wrong. - marks a regular file.
      - id: c
        text: "`p`"
        rationale: Wrong. p marks a named pipe (FIFO).
      - id: d
        text: "`l`"
        rationale: Correct. Symbolic links are shown with l, and ls -l adds -> and the target.
    answer: [d]
    explanation: >
      The type characters are - (regular), d (directory), l (symbolic link), b and c (block and
      character devices), s (socket) and p (named pipe).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.5", lesson: 1, section: Understanding Filetypes }
    review:
      status: pass2
