  # --------------------------------------------------------------------------- practice (CLI)

  - id: 101-104.5-0031
    type: single_choice
    difficulty: 1
    pool: practice
    stem: Which command changes the permission bits of a file?
    options:
      - id: a
        text: "`chown`"
        rationale: Wrong. chown changes the user and group owners.
      - id: b
        text: "`chmod`"
        rationale: Correct. chmod changes a file's mode (its permission bits).
      - id: c
        text: "`chgrp`"
        rationale: Wrong. chgrp changes only the group owner.
      - id: d
        text: "`getent`"
        rationale: Wrong. getent looks up entries in databases such as group or passwd.
    answer: [b]
    explanation: chmod ("change mode") sets read, write, execute and the special bits, in symbolic or octal form.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.5", lesson: 1, section: Modifying File Permissions }
    review:
      status: pass2
