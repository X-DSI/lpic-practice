    tags: [ls, file-types]

  - id: 101-104.5-0033
    type: single_choice
    difficulty: 1
    pool: practice
    stem: Which octal value represents the read permission?
    options:
      - id: a
        text: "4"
        rationale: Correct. r = 4, w = 2, x = 1.
      - id: b
        text: "2"
        rationale: Wrong. 2 is write.
      - id: c
        text: "1"
        rationale: Wrong. 1 is execute.
      - id: d
        text: "7"
        rationale: Wrong. 7 is read, write and execute together.
    answer: [a]
    explanation: Each octal digit adds up r (4), w (2) and x (1) for one class of users.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.5", lesson: 1, section: Octal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [octal]

  - id: 101-104.5-0034
    type: fill_in
    difficulty: 1
    pool: practice
    stem: Type the name of the command that changes the user owner of a file.
    fill_in:
      accepted: ['((/usr)?/bin/)?chown']
      match: regex
      case_sensitive: true
    explanation: chown changes the user owner, and optionally the group owner with USER:GROUP.
