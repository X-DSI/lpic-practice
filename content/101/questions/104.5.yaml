    tags: [file-types, ls]

  - id: 101-104.5-0038
    type: single_choice
    difficulty: 2
    pool: practice
    stem: Which command shows the groups that the user `carol` belongs to?
    options:
      - id: a
        text: "`chgrp carol`"
        rationale: Wrong. chgrp changes a file's group; with only one argument it fails.
      - id: b
        text: "`umask carol`"
        rationale: Wrong. umask sets or shows the file creation mask; carol is not a valid mask.
      - id: c
        text: "`getent passwd carol`"
        rationale: Wrong. This prints carol's account line, which holds only the numeric ID of her primary group, not her other groups.
      - id: d
        text: "`groups carol`"
        rationale: Correct. groups prints a user's group memberships (id carol shows them too).
    answer: [d]
    explanation: >
      Before choosing a group owner it helps to check memberships: groups USER (or id USER) lists a
      user's groups, and getent group lists all groups and their members.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.5", lesson: 1, section: Querying Groups }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: fixed, notes: "Distractor ls -l carol replaced with getent passwd carol so the correct option is not the longest." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [groups]

  - id: 101-104.5-0039
    type: single_choice
    difficulty: 3
    pool: practice
    stem: With umask `002`, what permissions does a new directory created with `mkdir` get?
    options:
      - id: a
        text: "`rwxrwxr-x`"
        rationale: Correct. 777 minus write for others leaves rwxrwxr-x (775).
      - id: b
        text: "`rw-rw-r--`"
        rationale: Wrong. That is what a new regular file gets; directories start from 777.
      - id: c
        text: "`rwxr-xr-x`"
        rationale: Wrong. That needs umask 022.
      - id: d
        text: "`-------w-`"
        rationale: Wrong. The umask lists bits to take away, not the resulting permissions.
    answer: [a]
    explanation: >
      Directories start at 777 and files at 666; the umask bits are removed. 002 removes only write
      for others, a common setting where every user has a private group.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.5", lesson: 1, section: Default Permissions }
    verify:
      command: sh -c 'umask 002; d=$(mktemp -d); mkdir "$d/x"; stat -c %A "$d/x"'
      expect: { exit_code: 0, stdout_contains: "drwxrwxr-x" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [umask]

  - id: 101-104.5-0040
    type: fill_in
    difficulty: 3
    pool: practice
    stem: >
      Type the `chmod` option that applies a permission change to a directory and everything below
      it.
    fill_in:
      accepted: ['((sudo\s+)?((/usr)?/bin/)?chmod\s+)?(-R|--recursive)']
      match: regex
      case_sensitive: true
    explanation: >
      chmod -R (--recursive) walks the whole tree. Take care with it: an octal mode such as 644 would
      also strip execute from every subdirectory, so symbolic modes (or X) are often safer.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.5", lesson: 1, section: Symbolic Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok, notes: "Matching tested: -R, --recursive, chmod -R, sudo chmod --recursive accepted; -r, --recurse, -R 755, chown -R, -Rv rejected." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [chmod]

  - id: 101-104.5-0041
    type: single_choice
    difficulty: 3
    pool: practice
    stem: "A file has mode `644`. What is its mode after `chmod o=u file`?"
    options:
      - id: a
        text: "`rw-r--r--`"
        rationale: Wrong. o=u copies the owner's rw- to others, so others change.
      - id: b
        text: "`rw-rw-rw-`"
        rationale: Wrong. Only others are named; the group keeps r--.
      - id: c
        text: "`rw-r--rw-`"
        rationale: Correct. Others get a copy of the owner's bits (rw-); owner and group stay the same.
      - id: d
        text: "`rw-r--r-x`"
        rationale: Wrong. The owner has no execute bit to copy.
    answer: [c]
    explanation: >
      In symbolic mode the right-hand side can be another class (u, g or o) instead of letters, which
      copies that class's current bits.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.5", lesson: 1, section: Symbolic Mode }
    verify:
      command: f=$(mktemp) && chmod 644 "$f" && chmod o=u "$f" && stat -c %A "$f"
      expect: { exit_code: 0, stdout_contains: "-rw-r--rw-" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [chmod, symbolic-mode]

  - id: 101-104.5-0042
    type: single_choice
    difficulty: 3
    pool: practice
    stem: The umask is `0027`. What does `umask -S` print?
    options:
      - id: a
        text: "`u=,g=w,o=rwx`"
        rationale: Wrong. -S shows the permissions the mask allows, not the bits it removes.
      - id: b
        text: "`u=rw,g=r,o=`"
        rationale: Wrong. umask -S reports in terms of directory-style permissions, including x.
      - id: c
        text: "`u=rwx,g=rwx,o=rx`"
        rationale: Wrong. That corresponds to umask 0002.
      - id: d
        text: "`u=rwx,g=rx,o=`"
        rationale: Correct. 0 removes nothing from the owner, 2 removes group write, 7 removes everything from others.
    answer: [d]
    explanation: >
      umask -S shows the complement of the mask: the permissions a new directory would get. Regular
      files additionally never get x by default.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.5", lesson: 1, section: Default Permissions }
    verify:
      command: bash -c 'umask 0027; umask -S'
      expect: { exit_code: 0, stdout_contains: "u=rwx,g=rx,o=" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [umask]

  - id: 101-104.5-0043
    type: single_choice
    difficulty: 4
    pool: practice
    stem: >
      `carl` is not a member of `team`. What may carl do with `report`, based on the output below?
    exhibit: |
      $ ls -l report
      -rw-rw-r-- 1 alice team 2 Oct 26 11:07 report
    options:
      - id: a
        text: Read and modify it
        rationale: Wrong. rw- for the group applies only to members of team.
      - id: b
        text: Read it, but not modify it
        rationale: Correct. carl is neither the owner nor in team, so the others triplet (r--) applies.
      - id: c
        text: Nothing at all
        rationale: Wrong. Others have read permission.
      - id: d
        text: Change its permissions with chmod
        rationale: Wrong. Only the owner (alice) or root can change a file's mode.
    answer: [b]
    explanation: >
      carl matches neither the owner nor the owning group, so only the last triplet counts. Whether he
      could delete it depends on the directory's permissions, not on this file.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.5", lesson: 1, section: Understanding Permissions }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [permissions, ls]

  - id: 101-104.5-0044
    type: single_choice
    difficulty: 4
    pool: practice
    stem: >
      A directory `upload` has mode `733` (`drwx-wx-wx`) and is owned by alice. What can another
      ordinary user do there?
    options:
      - id: a
        text: Create files in it, but not list its contents
        rationale: Correct. w plus x allows adding entries; without r the names cannot be listed.
      - id: b
        text: List its contents, but not create files
        rationale: Wrong. Listing needs r, which others do not have.
      - id: c
        text: Nothing, because without read permission the directory cannot be used
        rationale: Wrong. x lets users reach entries by name, and w plus x lets them create entries.
      - id: d
        text: List and create files, but not enter it with cd
        rationale: Wrong. Others have x, so cd works; it is listing that fails.
    answer: [a]
    explanation: >
      A directory with -wx for others works as a drop box: users can put files in it (and open files
      whose names they know) but cannot see what is there.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.5", lesson: 1, section: Permissions on Directories }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok, notes: "Reproduced as a non-root user: touch succeeded, ls gave Permission denied." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [directories, permissions]

  - id: 101-104.5-0045
    type: multi_choice
    difficulty: 4
    pool: practice
    stem: Which **TWO** statements about the program below are true when `bob` runs it?
    exhibit: |
      $ ls -l prog
      -rwsr-sr-x 1 root staff 26936 Oct 26 11:07 prog
    select_count: 2
    options:
      - id: a
        text: Only root and members of staff can run it
        rationale: Wrong. Others have x, so any user can run it.
      - id: b
        text: The process runs with root as its effective user
        rationale: Correct. The s in the owner triplet is SUID, and the owner is root.
      - id: c
        text: The process runs with staff as its effective group
        rationale: Correct. The s in the group triplet is SGID, and the group is staff.
      - id: d
        text: The sticky bit is set, so the program stays in memory
        rationale: Wrong. There is no t; and Linux ignores the sticky bit on files.
    answer: [b, c]
    explanation: >
      This file has mode 6755. SUID makes the effective UID that of the owner and SGID makes the
      effective GID that of the group, regardless of who starts the program.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.5", lesson: 1, section: Set UID }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [suid, sgid]
