  - id: 101-104.6-0028
    type: multi_choice
    difficulty: 3
    pool: practice
    stem: >
      Which **TWO** commands create `b.txt` as a new name that shares the inode of the existing
      `a.txt`?
    select_count: 2
    options:
      - id: a
        text: "`cp a.txt b.txt`"
        rationale: Wrong. A plain copy gets a new inode and its own copy of the data.
      - id: b
        text: "`cp -s a.txt b.txt`"
        rationale: Wrong. cp -s creates a symbolic link, which has its own inode.
      - id: c
        text: "`ln a.txt b.txt`"
        rationale: Correct. ln without options adds a hard link, a second directory entry for the same inode.
      - id: d
        text: "`cp -l a.txt b.txt`"
        rationale: Correct. cp -l makes hard links instead of copying file data.
    answer: [c, d]
    explanation: >
      Copying duplicates the data into a new inode, so later changes to one file do not affect the
      other. Hard linking (ln, or cp -l) adds a name for the existing inode, so both names always show
      the same data and the link count goes up.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Creating Hard Links }
    verify:
      setup:
        - cd /tmp && echo a > a.txt
      command: cd /tmp && cp -l a.txt b.txt && test "$(stat -c %i a.txt)" = "$(stat -c %i b.txt)" && echo same
      expect: { exit_code: 0, stdout_contains: "same" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [cp, ln, hard-link]

  - id: 101-104.6-0029
    type: single_choice
    difficulty: 4
    pool: practice
    stem: >
      One of the two links below is broken. Which command lists only symbolic links whose target does
      not exist?
    exhibit: |
      $ ls -l shared
      total 0
      lrwxrwxrwx 1 root root 11 Oct 26 11:22 old.pdf -> missing.pdf
      lrwxrwxrwx 1 root root 18 Oct 26 11:22 policy-link.pdf -> ../2025/policy.pdf
      $ find . -type l
      ./shared/policy-link.pdf
      ./shared/old.pdf
    options:
      - id: a
        text: "`find . -lname '*.pdf'`"
        rationale: Wrong. -lname matches the stored target text; both targets end in .pdf, so both links are listed.
      - id: b
        text: "`find . -type l -size 0`"
        rationale: Wrong. A symbolic link's size is the length of its stored path, which is never 0, so nothing is listed.
      - id: c
        text: "`find . -xtype l`"
        rationale: Correct. -xtype checks the type after following the link; only a link that cannot be followed is still of type l.
      - id: d
        text: "`find . -type l -links 0`"
        rationale: Wrong. Every existing link has a link count of at least 1, broken or not, so nothing is listed.
    answer: [c]
    explanation: >
      -type l matches all symbolic links. -xtype applies the type test to what the link points to;
      for a dangling link there is nothing to follow, so its type stays l. find . -xtype l is a common
      way to hunt for broken links.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Moving and Removing Symbolic Links }
    verify:
      setup:
        - mkdir -p /tmp/xt/2025 /tmp/xt/shared && touch /tmp/xt/2025/policy.pdf && ln -s ../2025/policy.pdf /tmp/xt/shared/policy-link.pdf && ln -s missing.pdf /tmp/xt/shared/old.pdf
      command: cd /tmp/xt && find . -xtype l
      expect: { exit_code: 0, stdout_regex: "^\\./shared/old\\.pdf\\n?$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [find, dangling-link]

  - id: 101-104.6-0030
    type: single_choice
    difficulty: 4
    pool: practice
    stem: >
      Based on the output below, why does `cat motd` print `v2` after the copy?
    exhibit: |
      $ ls -li
      total 12
      1426118 -rw-r--r-- 2 root root 3 Oct 26 11:20 motd
      1426118 -rw-r--r-- 2 root root 3 Oct 26 11:20 motd.hard
      1426119 -rw-r--r-- 1 root root 3 Oct 26 11:20 motd.new
      $ cp motd.new motd.hard
      $ cat motd
      v2
    options:
      - id: a
        text: cp noticed the hard link and then updated every other name that shares the inode of `motd.hard`
        rationale: Wrong. cp knows nothing about other names; it simply wrote into the file it was given.
      - id: b
        text: cp wrote the new data into the existing file, and `motd` is another name for that same inode
        rationale: Correct. When the destination exists, cp truncates and rewrites it in place, keeping the inode that both names share.
      - id: c
        text: "`motd.hard` is a symbolic link, so the write went through to `motd`"
        rationale: Wrong. The listing shows a regular file (-) with the same inode as motd, which is a hard link, not a symbolic link.
      - id: d
        text: cp replaced both names with a new inode, 1426119, shared with `motd.new`
        rationale: Wrong. cp copies data; it does not make names share an inode, and motd keeps inode 1426118.
    answer: [b]
    explanation: >
      Overwriting an existing file with cp (or with shell redirection) keeps its inode, so every hard
      link to it sees the new data. Tools that write a new file and rename it into place behave
      differently: the name gets a new inode and other hard links keep the old data.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Managing Hard Links }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: fixed, notes: "Option a lengthened so the key is not the longest option." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [cp, hard-link, inode]
