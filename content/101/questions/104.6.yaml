# 104.6 Create and change hard and symbolic links — weight 2 → 20 holdout + 10 practice.
# Original questions written from LPI Learning Materials 101-500, objective 104.6, lesson 1.
schema_version: 1
exam: "101"
objective: "104.6"
questions:
  # ---------------------------------------------------------------- holdout (mock exams only)

  - id: 101-104.6-0001
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: In the output of `ls -l`, what does the number right after the permission string count for a regular file?
    options:
      - id: a
        text: The symbolic links that point to the file
        rationale: Wrong. Symbolic links are separate files with their own inodes; creating one does not change this number.
      - id: b
        text: The directory entries (names) that refer to the file's inode
        rationale: Correct. This is the hard link count; every extra hard link adds one, and removing a name subtracts one.
      - id: c
        text: The processes that currently have the file open
        rationale: Wrong. ls does not report open file handles; tools such as lsof or fuser do that.
      - id: d
        text: The data blocks the file occupies on disk
        rationale: Wrong. Block usage is shown by ls -s or du, not by this column.
    answer: [b]
    explanation: >
      The second column of a long listing is the link count: how many names in the filesystem
      point at the same inode. A new regular file starts at 1, and each hard link raises it by
      one. The data is only freed when the count reaches zero and no process holds the file open.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Managing Hard Links }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [ls, link-count, hard-link]

  - id: 101-104.6-0002
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: Which first character of the mode string in `ls -l` output marks an entry as a symbolic link?
    options:
      - id: a
        text: "`s`"
        rationale: Wrong. A leading s marks a socket; inside the permission bits, s marks setuid or setgid.
      - id: b
        text: "`-`"
        rationale: Wrong. A leading dash marks a regular file, which is also what a hard link is.
      - id: c
        text: "`l`"
        rationale: Correct. Symbolic links are listed with l as the file type, followed by the target after an arrow.
      - id: d
        text: "`h`"
        rationale: Wrong. ls has no h file type; hard links appear as ordinary regular files.
    answer: [c]
    explanation: >
      ls -l shows the file type as the first character: - for regular files, d for directories,
      l for symbolic links. A symbolic link's line also shows "name -> target". Hard links have no
      special marker because every hard link is just another regular-file name.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Managing Symbolic Links }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [ls, symbolic-link]

  - id: 101-104.6-0003
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: What does a symbolic link itself store?
    options:
      - id: a
        text: A copy of the target file's data
        rationale: Wrong. That would be a copy made with cp; a symbolic link holds no file data of its target.
      - id: b
        text: The inode number of the target file
        rationale: Wrong. Referring to an inode directly is what a hard link (a directory entry) does.
      - id: c
        text: The device number and inode number of the target
        rationale: Wrong. Symbolic links do not record device or inode numbers, which is why they can point to other filesystems and can dangle.
      - id: d
        text: The path name of the target, as text
        rationale: Correct. The link holds a path string that is resolved each time the link is used.
    answer: [d]
    explanation: >
      A symbolic link is a small file of its own (own inode, type l) whose content is a path.
      The kernel follows that path every time the link is accessed. That is why it can point at
      directories or other filesystems, and why it breaks when nothing exists at that path any more.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Understanding Links }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [symbolic-link, inode]

  - id: 101-104.6-0004
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      A tool is installed as `/opt/tool/bin/tool`, and `/opt` is a separate filesystem from `/usr`.
      Which command makes the tool also available as `/usr/local/bin/tool`?
    options:
      - id: a
        text: "`ln -s /opt/tool/bin/tool /usr/local/bin/tool`"
        rationale: Correct. A symbolic link may point to a file on another filesystem; the existing file comes first, the new name second.
      - id: b
        text: "`ln /opt/tool/bin/tool /usr/local/bin/tool`"
        rationale: Wrong. Without -s, ln makes a hard link, which fails across filesystems with "Invalid cross-device link".
      - id: c
        text: "`ln -s /usr/local/bin/tool /opt/tool/bin/tool`"
        rationale: Wrong. The arguments are reversed; ln reports "File exists" because /opt/tool/bin/tool is already there.
      - id: d
        text: "`cp -l /opt/tool/bin/tool /usr/local/bin/tool`"
        rationale: Wrong. cp -l makes hard links instead of copies, so it fails across filesystems just like plain ln.
    answer: [a]
    explanation: >
      ln takes the existing target first and the new link name second. Because the two paths are on
      different filesystems, only a symbolic link (ln -s) can join them; hard links, whether made by
      ln or cp -l, must stay inside one filesystem.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Creating Symbolic Links }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [ln, symbolic-link, cross-device]

  - id: 101-104.6-0005
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      `~/bin/backup` is a symbolic link. Which command prints the path stored in the link, exactly as
      it was given when the link was created?
    options:
      - id: a
        text: "`realpath ~/bin/backup`"
        rationale: Wrong. realpath resolves the whole chain and prints an absolute canonical path, which can differ from the stored text.
      - id: b
        text: "`ls -L ~/bin/backup`"
        rationale: Wrong. -L makes ls describe the file the link points to; it does not print the stored path.
      - id: c
        text: "`stat -L ~/bin/backup`"
        rationale: Wrong. -L makes stat report on the target's inode, not on the link's contents.
      - id: d
        text: "`readlink ~/bin/backup`"
        rationale: Correct. Without options, readlink prints the link's stored value, relative or absolute, unchanged.
    answer: [d]
    explanation: >
      readlink with no options prints the value of a symbolic link exactly as stored. realpath and
      readlink -f instead follow every link and print a canonical absolute path. ls -L and stat -L
      describe the target file.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Managing Symbolic Links }
    verify:
      setup:
        - mkdir -p /tmp/rl && touch /tmp/rl/data && ln -s ../rl/data /tmp/rl/link
      command: readlink /tmp/rl/link
      expect: { exit_code: 0, stdout_regex: "^\\.\\./rl/data\\n?$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [readlink, symbolic-link]

  - id: 101-104.6-0006
    type: multi_choice
    difficulty: 2
    pool: holdout
    stem: Which **TWO** things can a symbolic link do that a hard link cannot?
    select_count: 2
    options:
      - id: a
        text: Refer to a directory
        rationale: Correct. ln refuses to hard-link directories ("hard link not allowed for directory"), but ln -s accepts them.
      - id: b
        text: Keep giving access to the data after the original name is deleted
        rationale: Wrong. That is a property of hard links; a symbolic link breaks when the name it points to disappears.
      - id: c
        text: Refer to a file on a different filesystem
        rationale: Correct. A symbolic link stores only a path, so it can cross filesystems; a hard link cannot.
      - id: d
        text: Share the inode number of the file it refers to
        rationale: Wrong. Sharing the inode is what makes a hard link; a symbolic link has an inode of its own.
    answer: [a, c]
    explanation: >
      Hard links are extra directory entries for one inode, so they only work for non-directories on
      the same filesystem. Symbolic links store a path, so they can point to directories and across
      filesystems, at the cost of breaking when that path no longer exists.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Managing Symbolic Links }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [hard-link, symbolic-link]

  - id: 101-104.6-0007
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      `notes.lnk` is a symbolic link to `/data/notes.txt`. A user runs `rm notes.lnk`. What is the
      result?
    options:
      - id: a
        text: "`/data/notes.txt` is deleted and `notes.lnk` is left dangling"
        rationale: Wrong. rm acts on the name it is given; it does not follow a symbolic link to delete the target.
      - id: b
        text: "`notes.lnk` is removed and `/data/notes.txt` is unchanged"
        rationale: Correct. Removing a symbolic link removes only the link file.
      - id: c
        text: Both `notes.lnk` and `/data/notes.txt` are removed
        rationale: Wrong. rm never removes the target of a symbolic link it is asked to delete.
      - id: d
        text: rm refuses, and the link has to be removed with `unlink`
        rationale: Wrong. rm removes symbolic links normally; unlink is just a simpler alternative for one name.
    answer: [b]
    explanation: >
      rm deletes directory entries. For a symbolic link, the entry is the link itself, so the file it
      points to is not touched. The reverse case is the risky one: deleting the target leaves every
      symbolic link to it dangling.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Moving and Removing Symbolic Links }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [rm, symbolic-link]

  - id: 101-104.6-0008
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: Which command lists every symbolic link under `/etc`, and nothing else?
    options:
      - id: a
        text: "`find /etc -type s`"
        rationale: Wrong. Type s selects sockets, not symbolic links.
      - id: b
        text: "`find /etc -links +1`"
        rationale: Wrong. This selects entries whose hard link count is above 1, such as directories with subdirectories and hard-linked files.
      - id: c
        text: "`find /etc -type l`"
        rationale: Correct. Type l selects symbolic links, whether or not their targets exist.
      - id: d
        text: "`find /etc -xtype l`"
        rationale: Wrong. -xtype tests the type after following each link, so only dangling links still count as type l; working links are left out.
    answer: [c]
    explanation: >
      find -type l tests the file type of each entry without following links, so it returns symbolic
      links only. -type f, d, s and so on select regular files, directories and sockets.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Managing Symbolic Links }
    verify:
      setup:
        - mkdir -p /tmp/fl && touch /tmp/fl/f && ln -s f /tmp/fl/l
      command: find /tmp/fl -type l
      expect: { exit_code: 0, stdout_regex: "^/tmp/fl/l\\n?$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: fixed, notes: "Option d replaced (-perm 777 could list exactly the symlinks on a real /etc) with -xtype l." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [find, symbolic-link]

  - id: 101-104.6-0009
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      Working from `/root`, an admin runs `ln -s /srv/app/releases/2.1 /srv/app/current`. They want
      `ln` to store the target as `releases/2.1`, computed relative to the link's own directory,
      without typing that path by hand. Type the `ln` option to add.
    fill_in:
      accepted:
        - '((sudo\s+)?((/usr)?/bin/)?ln\s+)?((-s|--symbolic)\s+)?(-r|--relative|-(sr|rs))(\s+(-s|--symbolic))?'
      match: regex
      case_sensitive: true
    explanation: >
      With -s, the -r (--relative) option makes ln work out a target path relative to the directory
      that will hold the link, so `ln -sr /srv/app/releases/2.1 /srv/app/current` stores
      releases/2.1. Relative links keep working when the whole tree is moved or mounted elsewhere.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Moving and Removing Symbolic Links }
    verify:
      setup:
        - mkdir -p /tmp/app/releases/2.1
      command: cd / && ln -sr /tmp/app/releases/2.1 /tmp/app/current && readlink /tmp/app/current
      expect: { exit_code: 0, stdout_regex: "^releases/2\\.1\\n?$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Fill-in now also accepts -s -r without the ln prefix. Pattern supplied by the reviewer; tested by the reviewer and the writer." }
    tags: [ln, relative-link]

  - id: 101-104.6-0010
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: >
      In the directory listed below, a user runs `echo 'power 70' >> budget.txt`. Which **TWO** of
      the other names show the new line when read with `cat`?
    exhibit: |
      $ ls -li
      total 12
      1426107 -rw-r--r-- 2 root root  9 Oct 26 11:20 budget-2026.txt
      1426108 -rw-r--r-- 1 root root  9 Oct 26 11:20 budget.bak
      1426107 -rw-r--r-- 2 root root  9 Oct 26 11:20 budget.txt
      1426109 lrwxrwxrwx 1 root root 10 Oct 26 11:20 current.txt -> budget.txt
      1426110 lrwxrwxrwx 1 root root 10 Oct 26 11:20 previous.txt -> budget.bak
    select_count: 2
    options:
      - id: a
        text: "`budget.bak`"
        rationale: Wrong. It has its own inode (1426108), so it is an independent copy that keeps the old content.
      - id: b
        text: "`budget-2026.txt`"
        rationale: Correct. It shares inode 1426107 with budget.txt, so both names show the same data.
      - id: c
        text: "`previous.txt`"
        rationale: Wrong. It is a symbolic link to budget.bak, the separate copy, which did not change.
      - id: d
        text: "`current.txt`"
        rationale: Correct. It is a symbolic link to budget.txt, so reading it reads the changed file.
    answer: [b, d]
    explanation: >
      Matching inode numbers in ls -li reveal hard links: budget.txt and budget-2026.txt are one file.
      A symbolic link shows whatever its target name currently holds. A copy made with cp has its own
      inode and data, so later changes to the original do not reach it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Managing Hard Links }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [ls, inode, hard-link, symbolic-link, cp]

  - id: 101-104.6-0011
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      Type the `find` test that matches every name referring to the same inode as a file you give
      by path (rather than by inode number), as in `find /srv ____ /srv/data/master.db`.
    fill_in:
      accepted: ['(((/usr)?/bin/)?find(\s+(?!-)\S+)+\s+)?-samefile(\s+(?!-)\S+)?']
      match: regex
      case_sensitive: true
    explanation: >
      `find /srv -samefile /srv/data/master.db` lists every hard link to that file below /srv.
      Unlike -inum, -samefile takes a file name, and it compares the device as well as the inode
      number. Symbolic links pointing to the file are not listed unless find is run with -L.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Managing Hard Links }
    verify:
      setup:
        - mkdir -p /tmp/sf/a && echo x > /tmp/sf/f && ln /tmp/sf/f /tmp/sf/a/g && ln -s ../f /tmp/sf/a/s
      command: find /tmp/sf -samefile /tmp/sf/f | sort
      expect: { exit_code: 0, stdout_regex: "^/tmp/sf/a/g\\n/tmp/sf/f\\n?$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [find, hard-link, inode]

  - id: 101-104.6-0012
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: In the listing below, what does the number `27` represent?
    exhibit: |
      $ ls -l /etc/localtime
      lrwxrwxrwx 1 root root 27 Oct 20 14:25 /etc/localtime -> /usr/share/zoneinfo/Etc/UTC
    options:
      - id: a
        text: The length, in bytes, of the target path stored in the link
        rationale: Correct. A symbolic link's size is the length of the path it stores; /usr/share/zoneinfo/Etc/UTC has 27 characters.
      - id: b
        text: The size, in bytes, of the time zone file the link points to
        rationale: Wrong. ls -l reports the link itself; ls -lL would show the target's size (114 bytes on this system).
      - id: c
        text: The number of 1 KiB blocks used by the target file
        rationale: Wrong. This column is a size in bytes, and it belongs to the link, not to the target.
      - id: d
        text: The inode number of the target file
        rationale: Wrong. Inode numbers are only shown with -i, and a symbolic link does not record its target's inode.
    answer: [a]
    explanation: >
      ls -l describes the link, not the file it points to. A symbolic link's size is the number of
      bytes in its stored path. Use ls -lL (or stat -L) to see the target's attributes.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Managing Symbolic Links }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [ls, symbolic-link]

  - id: 101-104.6-0013
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      Given the links below, which command prints `/usr/bin/mawk` when run against `/usr/bin/awk`?
    exhibit: |
      $ ls -l /usr/bin/awk /etc/alternatives/awk
      lrwxrwxrwx 1 root root 13 Sep 30 14:11 /etc/alternatives/awk -> /usr/bin/mawk
      lrwxrwxrwx 1 root root 21 Apr  8  2024 /usr/bin/awk -> /etc/alternatives/awk
    options:
      - id: a
        text: "`readlink /usr/bin/awk`"
        rationale: Wrong. Plain readlink prints only the first link's stored value, /etc/alternatives/awk.
      - id: b
        text: "`realpath /usr/bin/awk`"
        rationale: Correct. realpath follows every symbolic link in the chain and prints the final canonical path.
      - id: c
        text: "`ls -l /usr/bin/awk`"
        rationale: Wrong. ls -l shows one level only, /usr/bin/awk -> /etc/alternatives/awk.
      - id: d
        text: "`stat -c %N /usr/bin/awk`"
        rationale: Wrong. %N prints the quoted name with the link's own stored target, again only one level deep.
    answer: [b]
    explanation: >
      Links can point to other links, as in the Debian alternatives system. readlink and ls -l show one
      hop at a time. realpath (or readlink -f) resolves the whole chain to an absolute path.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Managing Symbolic Links }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [realpath, readlink, symbolic-link]

  - id: 101-104.6-0014
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      An admin creates a link from `/tmp/q104-6/srv`, but it does not work. Run from the same
      directory, which command replaces it with a working link?
    exhibit: |
      $ pwd
      /tmp/q104-6/srv
      $ ls shared
      db.conf
      $ ln -s shared/db.conf www/site/db.conf
      $ cat www/site/db.conf
      cat: www/site/db.conf: No such file or directory
      $ ls -l www/site/db.conf
      lrwxrwxrwx 1 root root 14 Oct 26 11:18 www/site/db.conf -> shared/db.conf
    options:
      - id: a
        text: "`ln -sf ./shared/db.conf www/site/db.conf`"
        rationale: Wrong. ./shared/db.conf is still relative to the link's directory, so it means www/site/shared/db.conf, which does not exist.
      - id: b
        text: "`ln -sf www/site/db.conf shared/db.conf`"
        rationale: Wrong. The arguments are reversed; this replaces the real shared/db.conf with a link to the broken link.
      - id: c
        text: "`ln -sr shared/db.conf www/site/db.conf`"
        rationale: Wrong. -r would compute the right path, but without -f ln stops with "File exists" because the broken link is still there.
      - id: d
        text: "`ln -sf ../../shared/db.conf www/site/db.conf`"
        rationale: Correct. A relative target is resolved from the link's directory, www/site, and ../../shared/db.conf leads back to the real file; -f replaces the broken link.
    answer: [d]
    explanation: >
      A relative symbolic link target is resolved from the directory that contains the link, not from
      the directory where ln was run. Write the target relative to the link's location, use an absolute
      path, or let ln -sr work it out (adding -f when a link already exists).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Moving and Removing Symbolic Links }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [ln, relative-link, dangling-link]

  - id: 101-104.6-0015
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: >
      The current directory is `/tmp/q104-6`. `work/plan.txt` is a file and `work/old/` is a directory.
      Based on the output below, which **TWO** commands succeed?
    exhibit: |
      $ df --output=source,fstype,target /tmp/q104-6/work /tmp/q104-6/archive
      Filesystem     Type Mounted on
      /dev/vda       ext4 /
      /dev/loop0     ext4 /tmp/q104-6/archive
    select_count: 2
    options:
      - id: a
        text: "`ln work/plan.txt archive/plan.txt`"
        rationale: Wrong. work is on /dev/vda and archive is on /dev/loop0; a hard link across them fails with "Invalid cross-device link".
      - id: b
        text: "`ln -s /tmp/q104-6/work/plan.txt archive/plan.lnk`"
        rationale: Correct. A symbolic link stores only a path, so it can live on a different filesystem from its target.
      - id: c
        text: "`ln work/plan.txt work/old/plan.txt`"
        rationale: Correct. Both names are on the same filesystem, so the hard link is allowed even though the directories differ.
      - id: d
        text: "`cp -l work/plan.txt archive/`"
        rationale: Wrong. cp -l creates hard links instead of copying, so it fails across filesystems in the same way as ln.
    answer: [b, c]
    explanation: >
      df shows that archive is a separate filesystem mounted inside /tmp/q104-6. Hard links (ln or
      cp -l) can be made between any directories of one filesystem, but never across a mount point.
      Symbolic links have no such limit.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Managing Hard Links }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [ln, cp, cross-device, hard-link]

  - id: 101-104.6-0016
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      An admin keeps a hard link as a cheap backup before editing a file. Based on the output below,
      why does `app.conf.keep` still contain the old port?
    exhibit: |
      $ ln app.conf app.conf.keep
      $ ls -li
      total 8
      1426164 -rw-r--r-- 2 root root 10 Oct 26 11:18 app.conf
      1426164 -rw-r--r-- 2 root root 10 Oct 26 11:18 app.conf.keep
      $ sed -i 's/8080/9090/' app.conf
      $ ls -li
      total 8
      1426184 -rw-r--r-- 1 root root 10 Oct 26 11:18 app.conf
      1426164 -rw-r--r-- 1 root root 10 Oct 26 11:18 app.conf.keep
      $ cat app.conf.keep
      port=8080
    options:
      - id: a
        text: A hard link keeps its own copy of the data, taken when the link was created
        rationale: Wrong. Hard links share one inode and one set of data blocks; there is no copy.
      - id: b
        text: The filesystem copies the shared data on write, so each name gets its own blocks
        rationale: Wrong. ext4 does no copy-on-write for hard links; an in-place write through either name is seen by both.
      - id: c
        text: "`sed -i` wrote the result to a new file and renamed it to `app.conf`, so that name now has a new inode"
        rationale: Correct. The listing shows app.conf moving to inode 1426184 while app.conf.keep keeps 1426164, now with a link count of 1.
      - id: d
        text: "`sed -i` refuses to change a file whose link count is above 1, so it silently edited a separate copy instead"
        rationale: Wrong. sed has no such check; it always writes to a temporary file and renames it, whatever the link count.
    answer: [c]
    explanation: >
      A hard link only shares data with names that still point at the same inode. Tools that save by
      writing a new file and renaming it over the old name (sed -i, many editors, package managers)
      give that name a new inode and leave the other links on the old data. Checking ls -li before and
      after shows exactly what happened.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Managing Hard Links }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: fixed, notes: "Option d lengthened so the key is not the longest option." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [hard-link, inode, ls]

  - id: 101-104.6-0017
    type: fill_in
    difficulty: 4
    pool: holdout
    stem: >
      `/tmp/q104-6/archive` is an ext4 filesystem. Besides subdirectories, the directory below
      contains two regular files and one symbolic link. How many subdirectories does it contain
      directly? Type a number.
    exhibit: |
      $ ls -ld /tmp/q104-6/archive/projects
      drwxr-xr-x 5 root root 4096 Oct 26 11:19 /tmp/q104-6/archive/projects
    fill_in:
      accepted: ['3', 'three']
      match: normalized
      case_sensitive: false
    explanation: >
      On ext4 a directory's link count is 2 (its entry in the parent plus its own ".") plus one for
      the ".." entry of each subdirectory. 5 - 2 = 3. Regular files and symbolic links inside it do
      not change the directory's link count. (Some filesystems, such as btrfs, do not follow this rule.)
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Managing Hard Links }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [link-count, ls, directory]

  - id: 101-104.6-0018
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      `latest` is a symbolic link to the directory `backups`, which held `index` and a subdirectory
      `2026`. An admin wants to delete only the link and types the command shown. What is the state
      afterwards?
    exhibit: |
      $ ls -l
      total 4
      drwxr-xr-x 3 root root 4096 Oct 26 11:20 backups
      lrwxrwxrwx 1 root root    7 Oct 26 11:20 latest -> backups
      $ rm -r latest/
      rm: cannot remove 'latest/': Not a directory
    options:
      - id: a
        text: "`latest` and the now-empty `backups` directory still exist; everything inside `backups` was deleted"
        rationale: Correct. The trailing slash makes rm -r resolve the link to the directory and delete its contents; the final removal fails because latest itself is not a directory.
      - id: b
        text: Nothing was removed at all, because rm stopped at the error before it had deleted any file
        rationale: Wrong. The error is reported last, after the recursive pass through the directory's contents has already deleted them.
      - id: c
        text: Only `latest` was removed; the message is just a harmless warning caused by the trailing slash on the name
        rationale: Wrong. rm returned an error for latest/, and the link is still there; the slash is what made rm descend into the target.
      - id: d
        text: Both `latest` and `backups` were removed entirely
        rationale: Wrong. rm cannot remove latest/ as a directory, and it never removes the target directory itself through the link.
    answer: [a]
    explanation: >
      A trailing slash makes the path name the directory a symbolic link points to. rm -r then walks
      that directory and deletes its contents before failing on the link itself. To remove only the
      link, name it without the slash: rm latest (or unlink latest).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Moving and Removing Symbolic Links }
    verify:
      setup:
        - mkdir -p /tmp/rmt/backups/2026 && touch /tmp/rmt/backups/index && ln -s backups /tmp/rmt/latest
      command: cd /tmp/rmt && { rm -r latest/ 2>/dev/null || true; ls -A backups | wc -l; test -L latest && echo link-kept; }
      expect: { exit_code: 0, stdout_regex: "^0\\nlink-kept\\n?$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: fixed, notes: "Options b and c lengthened so the key is not the longest option; verify command made safe under set -e." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [rm, symbolic-link, directory]

  - id: 101-104.6-0019
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      An admin tries to switch `current` to the new release, but the link did not change. Which
      command would have switched it as intended?
    exhibit: |
      $ ls -l current
      lrwxrwxrwx 1 root root 12 Oct 26 11:20 current -> releases/1.4
      $ ln -sf releases/1.5 current
      $ ls -l current
      lrwxrwxrwx 1 root root 12 Oct 26 11:20 current -> releases/1.4
      $ ls -l releases/1.4
      total 0
      lrwxrwxrwx 1 root root 12 Oct 26 11:20 1.5 -> releases/1.5
    options:
      - id: a
        text: "`ln -sfr releases/1.5 current`"
        rationale: Wrong. -r only changes how the target path is written; ln still follows current into releases/1.4 and creates the new link there.
      - id: b
        text: "`ln -sfn releases/1.5 current`"
        rationale: Correct. -n treats current as a plain file even though it is a link to a directory, so -f replaces the link itself.
      - id: c
        text: "`ln -sf releases/1.5 current/`"
        rationale: Wrong. The trailing slash explicitly names the directory behind the link, so the new link again lands inside releases/1.4.
      - id: d
        text: "`rm current/ && ln -s releases/1.5 current`"
        rationale: Wrong. rm current/ fails with "Is a directory" because of the slash, so the && stops and nothing changes.
    answer: [b]
    explanation: >
      When the last argument of ln is (a link to) a directory, ln creates the new link inside that
      directory. -n (--no-dereference, like -T) makes ln treat a symbolic link to a directory as a
      normal file, so ln -sfn swaps the link in one step. rm current (without a slash) followed by ln -s
      would also work.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Creating Symbolic Links }
    verify:
      setup:
        - mkdir -p /tmp/rel/releases/1.4 /tmp/rel/releases/1.5 && ln -s releases/1.4 /tmp/rel/current
      command: cd /tmp/rel && ln -sfn releases/1.5 current && readlink current && ls -A releases/1.4 | wc -l
      expect: { exit_code: 0, stdout_regex: "^releases/1\\.5\\n0\\n?$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [ln, symbolic-link, directory]

  - id: 101-104.6-0020
    type: multi_choice
    difficulty: 5
    pool: holdout
    stem: >
      You need the names of all hard links to `/tmp/q104-6/archive/notes.txt` on this system.
      Several symbolic links elsewhere also point to that file. Based on the output below, which
      **TWO** commands list exactly the hard links and nothing else?
    exhibit: |
      $ ls -i /tmp/q104-6/archive/notes.txt
      21 /tmp/q104-6/archive/notes.txt
      $ findmnt -n -o SOURCE,FSTYPE,TARGET -T /tmp/q104-6/archive
      /dev/loop0 ext4   /tmp/q104-6/archive
    select_count: 2
    options:
      - id: a
        text: "`find / -samefile /tmp/q104-6/archive/notes.txt`"
        rationale: Correct. -samefile compares both the device and the inode number, so it matches only names of this very file.
      - id: b
        text: "`find / -inum 21`"
        rationale: Wrong. Inode numbers are unique only within one filesystem; other filesystems can have their own inode 21, and those files would be listed too.
      - id: c
        text: "`find -L / -samefile /tmp/q104-6/archive/notes.txt`"
        rationale: Wrong. -L makes find follow symbolic links, so links that resolve to the file are listed as well.
      - id: d
        text: "`find /tmp/q104-6/archive -xdev -inum 21`"
        rationale: Correct. Hard links cannot leave the filesystem, and -xdev keeps the search on /dev/loop0, where inode 21 is this file.
    answer: [a, d]
    explanation: >
      An inode number identifies a file only together with its filesystem. -samefile handles that by
      comparing device and inode; -inum is safe only when the search is limited to the right
      filesystem, for example by starting at its mount point with -xdev. Following symbolic links
      (-L) adds names that are not hard links.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Managing Hard Links }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Rationale b: dropped the test-system aside." }
    tags: [find, inode, hard-link]

