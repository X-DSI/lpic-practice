  - id: 101-104.6-0021
    type: single_choice
    difficulty: 1
    pool: practice
    stem: Which command creates a hard link named `report-final.odt` for the existing file `report.odt`?
    options:
      - id: a
        text: "`ln -s report.odt report-final.odt`"
        rationale: Wrong. -s creates a symbolic link, not a hard link.
      - id: b
        text: "`ln report-final.odt report.odt`"
        rationale: Wrong. The existing file must come first; this fails because report-final.odt does not exist yet.
      - id: c
        text: "`cp -s report.odt report-final.odt`"
        rationale: Wrong. cp -s makes symbolic links instead of copies.
      - id: d
        text: "`ln report.odt report-final.odt`"
        rationale: Correct. ln without options makes a hard link; the existing file is named first, the new name second.
    answer: [d]
    explanation: >
      The syntax is ln TARGET LINK_NAME. Without -s, the result is a hard link: a second name for the
      same inode, with the link count of the file raised to 2.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Creating Hard Links }
    verify:
      setup:
        - cd /tmp && touch report.odt
      command: cd /tmp && ln report.odt report-final.odt && stat -c %h report.odt
      expect: { exit_code: 0, stdout_contains: "2" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [ln, hard-link]

  - id: 101-104.6-0022
    type: single_choice
    difficulty: 1
    pool: practice
    stem: >
      `today.log` is a symbolic link to `/var/log/app/2026-10-26.log`. A cleanup script deletes
      `/var/log/app/2026-10-26.log`. What happens to `today.log`?
    options:
      - id: a
        text: It remains, but it no longer leads to any file
        rationale: Correct. The link still stores the old path, which now leads nowhere; it is a dangling (broken) link.
      - id: b
        text: It is deleted automatically along with its target
        rationale: Wrong. Nothing tracks symbolic links to a file, so deleting the target never touches them.
      - id: c
        text: It keeps the log's contents, because the data is freed only when the last link goes
        rationale: Wrong. That holds for hard links; a symbolic link does not count as a link to the inode.
      - id: d
        text: It is turned into an empty regular file
        rationale: Wrong. The link stays a symbolic link; nothing converts it to a regular file.
    answer: [a]
    explanation: >
      A symbolic link depends on its target's path. Once that path is gone, the link dangles: ls -l
      still shows it with its arrow, but opening it fails with "No such file or directory".
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Understanding Links }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [symbolic-link, dangling-link]

  - id: 101-104.6-0023
    type: fill_in
    difficulty: 3
    pool: practice
    stem: >
      `ln -s /etc/nginx/sites-available/shop /etc/nginx/sites-enabled/shop` fails with "File exists",
      because an old regular file `shop` is in the way. Type the `ln` option that removes the existing
      destination first.
    fill_in:
      accepted:
        - '((sudo\s+)?((/usr)?/bin/)?ln\s+)?((-s|--symbolic|-n|--no-dereference|-T|--no-target-directory)\s+)*(-f|--force|-(?=[snT]*f)[sfnT]{2,4})(\s+(-s|--symbolic|-n|--no-dereference|-T|--no-target-directory))*'
      match: regex
      case_sensitive: true
    explanation: >
      -f (--force) makes ln remove an existing destination before creating the link, so
      `ln -sf /etc/nginx/sites-available/shop /etc/nginx/sites-enabled/shop` succeeds. It does not
      help when the destination is a directory or a link to one; ln then creates the link inside it
      unless -n (or -T) is added.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Creating Symbolic Links }
    verify:
      setup:
        - mkdir -p /tmp/ng/avail /tmp/ng/enabled && touch /tmp/ng/avail/shop && echo old > /tmp/ng/enabled/shop
      command: ln -sf /tmp/ng/avail/shop /tmp/ng/enabled/shop && readlink /tmp/ng/enabled/shop
      expect: { exit_code: 0, stdout_contains: "/tmp/ng/avail/shop" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Fill-in now accepts -sfn, -n -f and -s -f (all work). Pattern supplied by the reviewer; tested by the reviewer and the writer." }
    tags: [ln, symbolic-link]

  - id: 101-104.6-0024
    type: single_choice
    difficulty: 2
    pool: practice
    stem: >
      `data.csv` has three hard links in total (link count 3). A user deletes one of the names with
      `rm`. What happens?
    options:
      - id: a
        text: The data is freed, and the other two names become empty files
        rationale: Wrong. Data is only freed when the link count reaches zero; here it drops from 3 to 2.
      - id: b
        text: The other two names become dangling links
        rationale: Wrong. Hard links do not depend on each other; only symbolic links can dangle.
      - id: c
        text: The other two names still give the same content, and the link count drops to 2
        rationale: Correct. rm removes one directory entry; the inode and its data remain while other names point to it.
      - id: d
        text: rm refuses, because the file still has other hard links
        rationale: Wrong. rm removes a hard-linked name without complaint; it neither checks nor reports other links.
    answer: [c]
    explanation: >
      Every hard link is an equal name for the inode. Removing a name only decrements the link count.
      The file disappears for good only after its last name is removed and no process holds it open.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Moving and Removing Hard Links }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [rm, hard-link, link-count]

  - id: 101-104.6-0025
    type: single_choice
    difficulty: 2
    pool: practice
    stem: Which command shows a file's inode number and its hard link count as labelled fields?
    options:
      - id: a
        text: "`stat FILE`"
        rationale: Correct. stat prints labelled fields, including Inode and Links.
      - id: b
        text: "`file FILE`"
        rationale: Wrong. file guesses the type of content (text, ELF binary, image); it shows neither field.
      - id: c
        text: "`readlink FILE`"
        rationale: Wrong. readlink prints the value of a symbolic link and prints nothing for a regular file.
      - id: d
        text: "`lsattr FILE`"
        rationale: Wrong. lsattr shows extended filesystem attributes such as immutable or append-only.
    answer: [a]
    explanation: >
      stat shows the metadata stored in the inode: size, blocks, device, Inode, Links, permissions,
      owner and timestamps. stat -c '%i %h' prints just the inode number and the link count.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Managing Hard Links }
    verify:
      setup:
        - touch /tmp/st && ln /tmp/st /tmp/st2
      command: stat /tmp/st
      expect: { exit_code: 0, stdout_regex: "(?s).*Inode: \\d+\\s+Links: 2.*" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [stat, inode, link-count]

  - id: 101-104.6-0026
    type: single_choice
    difficulty: 2
    pool: practice
    stem: >
      `data.csv` shows a link count of 1. A user then runs `ln -s data.csv data.lnk`. What link count
      does `ls -l` now show for `data.csv`?
    options:
      - id: a
        text: "2"
        rationale: Wrong. Only hard links raise the count; a symbolic link is a separate file with its own inode.
      - id: b
        text: 2, and `data.lnk` shows 2 as well
        rationale: Wrong. The two do not share an inode, so neither count changes because of the other.
      - id: c
        text: 1, while `data.lnk` shows 2
        rationale: Wrong. data.lnk is a new file with a single name, so its own count is 1.
      - id: d
        text: "1"
        rationale: Correct. Creating a symbolic link adds no directory entry for data.csv's inode.
    answer: [d]
    explanation: >
      The link count counts hard links only. A symbolic link is a separate inode containing a path,
      so data.csv stays at 1 and data.lnk has a count of 1 of its own.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.6", lesson: 1, section: Managing Hard Links }
    review:
