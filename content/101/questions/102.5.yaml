  - id: 101-102.5-0038
    type: single_choice
    difficulty: 3
    pool: practice
    stem: On Fedora, which command lists only the repositories that are configured but disabled?
    options:
      - id: a
        text: "`dnf repolist --disabled`"
        rationale: Correct. --disabled limits repolist to disabled repositories.
      - id: b
        text: "`dnf repolist`"
        rationale: Wrong. Without options, repolist shows the enabled repositories.
      - id: c
        text: "`dnf list --installed`"
        rationale: Wrong. This lists installed packages, not repositories.
      - id: d
        text: "`dnf config-manager --set-disabled`"
        rationale: Wrong. This dnf 4 command disables repositories; it does not list them.
    answer: [a]
    explanation: >
      dnf repolist shows enabled repositories by default; --disabled shows only disabled ones and
      --all shows both.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Managing Software Repositories }
