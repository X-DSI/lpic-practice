  - id: 101-102.5-0020
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: An administrator runs the command in the exhibit. Which statement is correct?
    exhibit: |
      # rpm -V rsyslog
      S.5....T.  c /etc/rsyslog.conf
      .M.......    /usr/sbin/rsyslogd
    options:
      - id: a
        text: The rsyslogd binary's content differs from the packaged file
        rationale: Wrong. Its line only shows M (mode); a content change would show 5 (digest) and usually S (size).
      - id: b
        text: "`/etc/rsyslog.conf` is missing from the disk"
        rationale: Wrong. A missing file is reported with the word "missing", not with attribute letters.
      - id: c
        text: rsyslog.conf was edited and rsyslogd's permissions changed
        rationale: Correct. S, 5 and T mean size, digest and mtime differ for the config file (c); M means the binary's mode differs.
      - id: d
        text: The installed package's GPG signature failed to verify
        rationale: Wrong. rpm -V compares installed files with the database; package signatures are checked with rpm -K.
    answer: [c]
    explanation: >
      rpm -V prints one line per file that differs, with a dot for each attribute that matches:
      S size, M mode, 5 digest, D device, L link, U user, G group, T mtime, P capabilities. The c
      marks a configuration file, where local edits are normal.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: The RPM Package Manager (rpm) }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked. Tested with rpm 4.18 in a private --root." }
    tags: [rpm, rpm-V, integrity]

  - id: 101-102.5-0021
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      A CentOS 7 host has the file `/etc/yum.repos.d/acme.repo` shown in the exhibit. Which command
      disables this repository permanently?
    exhibit: |
      [acme-stable]
      name=ACME Monitoring Agents
      baseurl=https://pkgs.acme.example/el7/stable/
      enabled=1
      gpgcheck=1
      gpgkey=https://pkgs.acme.example/RPM-GPG-KEY-acme
    options:
      - id: a
        text: "`yum-config-manager --disable acme-stable`"
        rationale: Correct. The repo id is the [section] name, and yum-config-manager writes enabled=0 for that id into the .repo file.
      - id: b
        text: "`yum-config-manager --disable 'ACME Monitoring Agents'`"
        rationale: Wrong. name= is only a human-readable description; yum-config-manager selects repositories by id.
      - id: c
        text: "`yum-config-manager --disable acme`"
        rationale: Wrong. acme is the file name, not a repo id, so no repository matches it.
      - id: d
        text: "`yum --disablerepo=acme-stable update`"
        rationale: Wrong. --disablerepo affects only that one yum run; the repository stays enabled in its .repo file.
    answer: [a]
    explanation: >
      In a .repo file the text in square brackets is the repository id; name= is a description and
      the file name is irrelevant (one file may hold several repositories). Commands such as
      yum-config-manager --enable/--disable and --enablerepo/--disablerepo take the id.
      yum-config-manager --disable saves enabled=0, so the change survives future runs.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Managing Software Repositories }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Needs re-check. Exhibit changed to a .repo file whose [section] id differs from its name= line and file name; same tested fact (yum-config-manager takes repo ids)." }
    tags: [yum, yum-config-manager, repolist]

  - id: 101-102.5-0022
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: >
      Installing a downloaded package fails as shown in the exhibit. The host's enabled repositories
      contain the missing pieces. Which **TWO** approaches install `reportgen` so that it works?
    exhibit: |
      # rpm -i reportgen-3.4-1.el9.x86_64.rpm
      error: Failed dependencies:
              libxlsxwriter.so.6()(64bit) is needed by reportgen-3.4-1.el9.x86_64
              python3-jinja2 is needed by reportgen-3.4-1.el9.x86_64
    select_count: 2
    options:
      - id: a
        text: "Run `rpm -i --nodeps reportgen-3.4-1.el9.x86_64.rpm`"
        rationale: Wrong. The package gets installed, but its dependencies are still missing, so it will not work.
      - id: b
        text: "Run `rpm -Uvh reportgen-3.4-1.el9.x86_64.rpm`"
        rationale: Wrong. -U performs the same dependency check and fails the same way.
      - id: c
        text: "Run `yum install ./reportgen-3.4-1.el9.x86_64.rpm`"
        rationale: Correct. yum installs the local file and pulls the missing dependencies from the repositories.
      - id: d
        text: "Install the providers found with `yum provides`, then rerun `rpm -i`"
        rationale: Correct. Once the providing packages are installed, rpm's dependency check passes.
      - id: e
        text: "Run `rpm -qpR reportgen-3.4-1.el9.x86_64.rpm`"
        rationale: Wrong. This lists what the package requires; it does not install anything.
    answer: [c, d]
    explanation: >
      rpm only checks dependencies; it never fetches them. Either let a high-level tool handle the
      local file (yum/dnf install ./file.rpm, zypper in ./file.rpm), or find the providers yourself
      with yum provides (whatprovides) and install them before retrying rpm.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Dealing with Dependencies }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Option d shortened; it was the longest option and a giveaway." }
    tags: [rpm, yum, dependencies]

  - id: 101-102.5-0023
