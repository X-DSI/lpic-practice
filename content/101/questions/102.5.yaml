      (-m keeps modification times, -v lists the files). The files land under ./usr/... in the
      current directory.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: The RPM Package Manager (rpm) }
    review:
