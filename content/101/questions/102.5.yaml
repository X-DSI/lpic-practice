    tags: [zypper, repos]

  - id: 101-102.5-0036
    type: multi_choice
    difficulty: 2
    pool: practice
    stem: >
      Which **TWO** commands install `htop` from the configured repositories, resolving its
      dependencies automatically?
    select_count: 2
    options:
      - id: a
        text: "`rpm -ivh htop`"
        rationale: Wrong. rpm needs a package file and does not fetch dependencies.
      - id: b
        text: "`dnf install htop`"
        rationale: Correct. dnf downloads htop and whatever it needs from the enabled repositories.
      - id: c
        text: "`zypper in htop`"
        rationale: Correct. zypper install resolves and installs dependencies from its repositories.
      - id: d
        text: "`yum search htop`"
        rationale: Wrong. search only finds packages; it installs nothing.
      - id: e
        text: "`rpm -U htop`"
        rationale: Wrong. rpm -U also needs a package file and does not resolve dependencies.
    answer: [b, c]
    explanation: >
      Dependency resolution and downloading are the jobs of yum, dnf and zypper. rpm installs only
      the package files you give it, after checking that their dependencies are already present.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Dealing with Dependencies }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked. Checked against dnf4/dnf5/zypper docs and source." }
    tags: [dnf, zypper, install]

