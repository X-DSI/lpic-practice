  - id: 101-102.5-0042
    type: single_choice
    difficulty: 4
    pool: practice
    stem: The exhibit shows the output of `zypper se gimp`. Which statement is correct?
    exhibit: |
      S  | Name      | Summary                              | Type
      ---+-----------+--------------------------------------+--------
      i+ | gimp      | The GNU Image Manipulation Program   | package
      i  | gimp-lang | Translations for package gimp        | package
         | gimp-help | Help files for the GIMP              | package
    options:
      - id: a
        text: gimp-help is installed, but an older version
        rationale: Wrong. An empty status means no version of gimp-help is installed; in this summary view any installed version would show i or i+.
      - id: b
        text: gimp was requested by a user; gimp-lang came in automatically
        rationale: Correct. i+ marks a package installed on request, i one installed automatically by the resolver.
      - id: c
        text: All three packages are installed
        rationale: Wrong. gimp-help has an empty status column, so it is not installed.
      - id: d
        text: gimp-lang is locked against changes
        rationale: Wrong. A lock is shown as l in the second status column, which is not present here.
    answer: [b]
    explanation: >
      The S column of zypper search shows i+ (installed by user request), i (installed
      automatically as a dependency) or nothing (not installed); the detailed view (`zypper se -s`)
      can also show v when a different version is installed. `zypper se -i` limits the output to
      installed packages and `-u` to packages not installed.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Searching for Packages }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Option a rationale and explanation corrected: v appears only in the detailed view (se -s)." }
    tags: [zypper, search]

  - id: 101-102.5-0043
    type: single_choice
    difficulty: 4
    pool: practice
    stem: >
      Before removing `openssl-libs` with rpm, you want to see which installed packages would be
      left with broken dependencies, without changing anything. Which command shows that?
    options:
      - id: a
        text: "`rpm -qR openssl-libs`"
        rationale: Wrong. This lists what openssl-libs itself requires, not what depends on it.
      - id: b
        text: "`rpm -e --nodeps openssl-libs`"
        rationale: Wrong. This actually removes the package and skips the dependency check.
      - id: c
        text: "`rpm -e --test openssl-libs`"
        rationale: Correct. --test runs the checks of the removal, prints any failed dependencies and removes nothing.
      - id: d
        text: "`rpm -ql openssl-libs`"
        rationale: Wrong. This lists the files in the package.
    answer: [c]
    explanation: >
      --test performs a dry run of an install, upgrade or erase: rpm reports what would fail,
      including "is needed by (installed) ..." lines, without touching the system.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: "Installing, Upgrading and Removing Packages" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked. Tested with rpm 4.18 in a private --root." }
    tags: [rpm, rpm-e, dependencies]

  - id: 101-102.5-0044
    type: single_choice
    difficulty: 5
    pool: practice
    stem: >
      `foo` is only in the repository `extras-testing`, defined with `enabled=0` in
      `/etc/yum.repos.d/`. You want to install `foo` from it once, without changing any
      configuration file. Which command does that?
    options:
      - id: a
        text: "`yum --enablerepo=extras-testing install foo`"
        rationale: Correct. --enablerepo enables the repository for this one command only.
      - id: b
        text: "`yum-config-manager --enable extras-testing`"
        rationale: Wrong. This rewrites the .repo file to enable the repository permanently, and installs nothing.
      - id: c
        text: "`yum repolist enabled extras-testing`"
        rationale: Wrong. repolist only displays repositories.
      - id: d
        text: "`yum clean metadata`"
        rationale: Wrong. Clearing cached metadata does not enable a disabled repository.
    answer: [a]
    explanation: >
      --enablerepo and --disablerepo are temporary overrides for a single yum (or dnf) run.
      yum-config-manager --enable/--disable, or editing enabled= in the .repo file, changes the
      setting for good.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Managing Software Repositories }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [yum, enablerepo]

  - id: 101-102.5-0045
    type: single_choice
    difficulty: 5
    pool: practice
    stem: >
      A service broke after packages were installed yesterday. Which command lists the installed
      packages with their install time, most recent first?
    options:
      - id: a
        text: "`rpm -qa | sort -r`"
        rationale: Wrong. This sorts package names in reverse alphabetical order and shows no times.
      - id: b
        text: "`rpm -qa --last`"
        rationale: Correct. --last adds the install time to each package and sorts newest first.
      - id: c
        text: "`rpm -qai | grep 'Install Date'`"
        rationale: Wrong. This prints install dates without package names and in no particular order.
      - id: d
        text: "`rpm -Va`"
        rationale: Wrong. -Va reports files that differ from the RPM database; it shows no install times.
    answer: [b]
    explanation: >
      `rpm -qa --last` prints each installed package with its installation time, newest first, so
      the head of the output shows what changed most recently.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Listing Installed Packages }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [rpm, rpm-qa]
