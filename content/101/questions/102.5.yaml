  - id: 101-102.5-0027
    type: multi_choice
    difficulty: 5
    pool: holdout
    stem: >
      Before removing a library package you want to see which **installed** packages require the
      capability `libpcre2-8.so.0()(64bit)`. Which **TWO** commands list them?
    select_count: 2
    options:
      - id: a
        text: "`rpm -q --whatrequires 'libpcre2-8.so.0()(64bit)'`"
        rationale: Correct. --whatrequires queries the RPM database for installed packages that require the capability.
      - id: b
        text: "`dnf repoquery --installed --whatrequires 'libpcre2-8.so.0()(64bit)'`"
        rationale: Correct. repoquery limited to installed packages with --whatrequires gives the same answer.
      - id: c
        text: "`rpm -qR pcre2`"
        rationale: Wrong. This lists what pcre2 itself requires, which is the opposite direction.
      - id: d
        text: "`rpm -q --whatprovides 'libpcre2-8.so.0()(64bit)'`"
        rationale: Wrong. This shows the package that provides the capability, not the ones that need it.
      - id: e
        text: "`yum provides 'libpcre2-8.so.0()(64bit)'`"
        rationale: Wrong. provides searches for packages that provide the capability, including ones in repositories.
    answer: [a, b]
    explanation: >
      Dependencies point both ways: -qR lists what a package requires, --whatrequires lists who
      requires a capability, and --whatprovides (or yum/dnf provides) lists who provides it.
      Checking --whatrequires before a removal shows what would break.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Dealing with Dependencies }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked. Checked against dnf4/dnf5/zypper docs and source." }
    tags: [rpm, dnf, dependencies, whatrequires]

  - id: 101-102.5-0028
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      `rsync-3.2.7` is installed and you need to go back to the file
      `rsync-3.2.3-19.el9.x86_64.rpm`. `rpm -U` on that file prints
      `package rsync-3.2.7-... (which is newer than rsync-3.2.3-...) is already installed`.
      Which command performs the downgrade?
    options:
      - id: a
        text: "`rpm -F rsync-3.2.3-19.el9.x86_64.rpm`"
        rationale: Wrong. Freshen only replaces older installed versions; with a newer one installed it does nothing.
      - id: b
        text: "`rpm -i rsync-3.2.3-19.el9.x86_64.rpm`"
        rationale: Wrong. rpm -i refuses with the same "newer ... is already installed" message.
      - id: c
        text: "`rpm -U --nodeps rsync-3.2.3-19.el9.x86_64.rpm`"
        rationale: Wrong. Dependencies are not the problem; the version check still refuses the older package.
      - id: d
        text: "`rpm -U --oldpackage rsync-3.2.3-19.el9.x86_64.rpm`"
        rationale: Correct. --oldpackage allows an upgrade to replace a newer package with an older one.
    answer: [d]
    explanation: >
      rpm -U refuses to "upgrade" to a lower version unless told to with --oldpackage (also implied
      by --force). The high-level tools offer the same through `yum downgrade` / `dnf downgrade`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: "Installing, Upgrading and Removing Packages" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked. Tested with rpm 4.18 in a private --root." }
    tags: [rpm, rpm-U, oldpackage]

  - id: 101-102.5-0029
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      Before installing `vendor-agent-2.0-1.x86_64.rpm`, downloaded from a website, you want rpm to
      check the file's digests and its GPG signature against the keys you imported. Which command
      does that?
    options:
      - id: a
        text: "`rpm -qip vendor-agent-2.0-1.x86_64.rpm`"
        rationale: Wrong. This is a query; it shows the header and its Signature line, while checking the file is the job of rpm -K (--checksig).
      - id: b
        text: "`rpm --import vendor-agent-2.0-1.x86_64.rpm`"
        rationale: Wrong. --import adds a GPG public key file to the keyring; a package is not a key.
      - id: c
        text: "`rpm -K vendor-agent-2.0-1.x86_64.rpm`"
        rationale: Correct. -K (--checksig) checks the package file's digests and signature and reports OK or the failure.
      - id: d
        text: "`rpm -Va`"
        rationale: Wrong. -Va verifies installed packages' files on disk; it does not check a downloaded package file.
    answer: [c]
    explanation: >
      `rpm -K FILE` (`--checksig`) checks a package file before you install it. An unsigned
      package shows only "digests OK"; a signed one is checked against the keys imported with
      rpm --import. `rpm -V` is the opposite check: installed files against the database.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Getting Package Information }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Option a rationale reworded: rpm -qp does warn about bad/unknown signatures, so it no longer claims it reports nothing." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [rpm, rpm-K, signatures, integrity]

  - id: 101-102.5-0030
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      You saved the file in the exhibit as `/etc/yum.repos.d/internal.repo` on a CentOS 7 host. The
      repository is reachable and contains `deploytool`, yet `yum install deploytool` answers
      `No package deploytool available.` What is the cause?
    exhibit: |
      [internal-tools]
      name=Internal tools
      baseurl=https://repo.example.com/el7/tools/
      enabled=0
      gpgcheck=1
      gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-internal
    options:
      - id: a
        text: The repository is defined but disabled, so yum ignores it
        rationale: Correct. enabled=0 makes yum skip the repository unless it is enabled in the file or for one run.
      - id: b
        text: gpgcheck=1 stops yum from listing unsigned packages
        rationale: Wrong. gpgcheck controls signature checks at install time; it does not hide packages from searches.
      - id: c
        text: The file only takes effect after `yum-config-manager --add-repo` reads it
        rationale: Wrong. yum reads every .repo file in /etc/yum.repos.d/ directly; --add-repo is just one way to create it.
      - id: d
        text: The section name must match the file name, `internal`
        rationale: Wrong. The section name is the repo id and can differ from the file name; one file can hold several repositories.
    answer: [a]
    explanation: >
      Each [section] in a .repo file defines one repository; enabled=0 keeps it configured but
      unused. Set enabled=1, run `yum-config-manager --enable internal-tools`, or use
      `--enablerepo=internal-tools` for a single command.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Managing Software Repositories }
