  - id: 101-102.5-0039
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      On openSUSE you want to add the repository at `https://download.example.org/nightly/` with the
      alias `nightly`, but keep it disabled until testing starts. Which command does that?
    options:
      - id: a
        text: "`zypper ar -f https://download.example.org/nightly/ nightly`"
        rationale: Wrong. -f turns on auto-refresh; the repository is still added enabled.
      - id: b
        text: "`zypper mr -d nightly`"
        rationale: Wrong. modifyrepo changes an existing repository; nightly has not been added yet.
      - id: c
        text: "`zypper rr nightly`"
        rationale: Wrong. rr removes a repository.
      - id: d
        text: "`zypper ar -d https://download.example.org/nightly/ nightly`"
        rationale: Correct. addrepo -d adds the repository in the disabled state.
    answer: [d]
    explanation: >
      `zypper addrepo URI ALIAS` adds an enabled repository with auto-refresh off. -d adds it
      disabled and -f turns auto-refresh on. Later, `zypper mr -e nightly` enables it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Adding and Removing Repositories }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked. Checked against dnf4/dnf5/zypper docs and source." }
    tags: [zypper, addrepo]

  - id: 101-102.5-0040
    type: multi_choice
    difficulty: 3
    pool: practice
    stem: Which **TWO** statements about `rpm -Uvh pkg.rpm` are true?
    select_count: 2
    options:
      - id: a
        text: It installs the package if no version of it is installed yet.
        rationale: Correct. -U upgrades an installed package, or installs it fresh when absent.
      - id: b
        text: It downloads missing dependencies from the repositories.
        rationale: Wrong. rpm never downloads dependencies.
      - id: c
        text: The -h option prints the package's header information.
        rationale: Wrong. -h prints hash marks as a progress bar; header information comes from -qi.
      - id: d
        text: The -h option prints hash marks to show progress.
        rationale: Correct. -h (--hash) prints hash characters as the package is unpacked.
    answer: [a, d]
    explanation: >
      -U is install-or-upgrade, -v makes rpm verbose and -h shows progress with hash marks. Short
      options can be grouped, so -Uvh is the same as -U -v -h.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: "Installing, Upgrading and Removing Packages" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Option d rationale no longer uses a literal hash sign, which YAML parsed as a comment." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [rpm, rpm-U]

  - id: 101-102.5-0041
    type: fill_in
    difficulty: 3
    pool: practice
    stem: >
      Type the complete `yum` command that lists all configured repositories, both enabled and
