  - id: 101-102.5-0001
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: Which `rpm` option uninstalls a package that is currently installed?
    options:
      - id: a
        text: "`-U`"
        rationale: Wrong. -U upgrades a package from a package file (or installs it if no version is present).
      - id: b
        text: "`-e`"
        rationale: Correct. -e (--erase) removes an installed package by name.
      - id: c
        text: "`-F`"
        rationale: Wrong. -F freshens, which upgrades a package only if an older version is already installed.
      - id: d
        text: "`-V`"
        rationale: Wrong. -V verifies an installed package's files against the RPM database.
    answer: [b]
    explanation: >
      rpm uses -e ("erase") to remove packages, for example `rpm -e telnet`. It takes the package
      name, not a file name, and refuses if other installed packages still depend on it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: "Installing, Upgrading and Removing Packages" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [rpm, rpm-e]

  - id: 101-102.5-0002
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      On a CentOS server you find a file named `/etc/yum.repos.d/internal.repo`. What is this file
      for?
    options:
      - id: a
        text: It records which packages were installed from internal sources
        rationale: Wrong. Installed packages are recorded in the RPM database, not in .repo files.
      - id: b
        text: It holds the GPG public key that signs internal packages
        rationale: Wrong. A .repo file can point to a key with gpgkey=, but keys are kept in separate files (often under /etc/pki/rpm-gpg/).
      - id: c
        text: It defines software repositories that yum and dnf can use
        rationale: Correct. Each .repo file in /etc/yum.repos.d/ defines one or more repositories.
      - id: d
        text: It stores global yum settings such as the cache directory
        rationale: Wrong. Global settings live in the [main] section of /etc/yum.conf (dnf.conf on dnf systems).
    answer: [c]
    explanation: >
      yum and dnf read every *.repo file in /etc/yum.repos.d/. Each file contains one or more
      sections such as [internal], each defining a repository with a name, a URL and options like
      enabled= and gpgcheck=.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Managing Software Repositories }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [yum, yum.repos.d]

  - id: 101-102.5-0003
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      Which tool is the standard command-line package manager, with automatic dependency
      resolution, on openSUSE and SUSE Linux Enterprise?
    options:
      - id: a
        text: "`dnf`"
        rationale: Wrong. dnf is the package manager of Fedora and current Red Hat Enterprise Linux.
      - id: b
        text: "`yum`"
        rationale: Wrong. yum comes from the Red Hat family (RHEL 7, CentOS 7 and older).
      - id: c
        text: "`rpm`"
        rationale: Wrong. SUSE uses the RPM format and the rpm tool exists there, but rpm does not resolve dependencies.
      - id: d
        text: "`zypper`"
        rationale: Correct. zypper is the SUSE/openSUSE package manager and resolves dependencies from its repositories.
    answer: [d]
    explanation: >
      openSUSE and SLES use RPM packages, managed day to day with zypper. zypper fetches packages and
      their dependencies from configured repositories, much like yum/dnf on Red Hat systems.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Zypper }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked. Checked against dnf4/dnf5/zypper docs and source." }
    tags: [zypper]

  - id: 101-102.5-0004
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: What does the command `rpm -qa` print?
    options:
      - id: a
        text: The full name of every package installed on the system
        rationale: Correct. -q -a queries all packages in the RPM database and prints name-version-release.arch for each.
      - id: b
        text: Every package available in the configured repositories
        rationale: Wrong. rpm only knows the local database; repositories are handled by yum, dnf or zypper.
      - id: c
        text: Every file owned by every installed package
        rationale: Wrong. That needs the list option as well (rpm -qal).
      - id: d
        text: Only the installed packages that have updates available
        rationale: Wrong. rpm has no notion of available updates; use yum check-update or zypper list-updates.
    answer: [a]
    explanation: >
      -q is query mode and -a means all installed packages. The output is one
      name-version-release.arch string per package, often piped to grep to look for one package.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Listing Installed Packages }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Removed a verify block that needed the rpm package, which stock debian:stable-slim lacks." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [rpm, rpm-qa]

  - id: 101-102.5-0005
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: Which description fits `dnf`?
    options:
      - id: a
        text: A converter that turns .rpm packages into .deb packages
        rationale: Wrong. That describes alien, not dnf.
      - id: b
        text: The successor of yum, using the same .repo files and similar subcommands
        rationale: Correct. dnf began as a fork of yum, reads /etc/yum.repos.d/ and keeps most yum subcommands.
      - id: c
        text: The low-level tool that installs .rpm files without resolving dependencies
        rationale: Wrong. That is rpm itself.
      - id: d
        text: The openSUSE repository manager that replaced zypper
        rationale: Wrong. openSUSE still uses zypper; dnf comes from the Fedora/Red Hat side.
    answer: [b]
    explanation: >
      dnf ("Dandified YUM") replaced yum on Fedora and on RHEL 8 and later, where the yum command
      is kept as a link to dnf. Commands such as install, remove, search, info and repolist work the
      same way, and repositories are still defined in /etc/yum.repos.d/.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: DNF }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked. Checked against dnf4/dnf5/zypper docs and source." }
    tags: [dnf, yum]

  - id: 101-102.5-0006
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      On a Rocky Linux host, `/usr/bin/dig` behaves strangely and you suspect the binary was
      replaced. You want to know which installed package it came from so you can reinstall that
      package. Which command tells you?
    options:
      - id: a
        text: "`rpm -ql /usr/bin/dig`"
        rationale: Wrong. -ql expects a package name; given a path it reports that no such package is installed.
      - id: b
        text: "`rpm -qi dig`"
        rationale: Wrong. This queries a package named dig; the program's name is not necessarily its package's name.
      - id: c
        text: "`rpm -qf /usr/bin/dig`"
        rationale: Correct. -qf prints the installed package that owns the given file.
      - id: d
        text: "`rpm -qa dig`"
        rationale: Wrong. This only matches an installed package whose name is dig, so it prints nothing if the package is named differently.
    answer: [c]
    explanation: >
      `rpm -qf FILE` looks the path up in the RPM database and prints the owning package (dig, for
      example, belongs to bind-utils). If no package owns the file, rpm says so.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Finding Out Which Package Owns a Specific File }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked. Tested with rpm 4.18 in a private --root." }
    tags: [rpm, rpm-qf]

  - id: 101-102.5-0007
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      On a CentOS 7 server you want to install `htop` from the configured repositories, with any
      packages it depends on downloaded and installed automatically. Which command does that?
    options:
      - id: a
        text: "`rpm -i htop`"
        rationale: Wrong. rpm -i needs a package file and never downloads dependencies.
      - id: b
        text: "`rpm2cpio htop`"
        rationale: Wrong. rpm2cpio converts a package file into a cpio archive; it installs nothing.
      - id: c
        text: "`zypper in htop`"
        rationale: Wrong. This is the right idea on openSUSE, but zypper is not CentOS's package manager.
      - id: d
        text: "`yum install htop`"
        rationale: Correct. yum finds htop in the enabled repositories and installs it together with its dependencies.
    answer: [d]
    explanation: >
      yum (dnf on newer releases) works with repositories: it resolves dependencies, downloads every
      package needed and installs them in one transaction, asking for confirmation first.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: YellowDog Updater Modified (YUM) }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [yum, install]

  - id: 101-102.5-0008
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      Which command makes zypper download fresh repository metadata now, so newly published
      packages become visible?
    options:
      - id: a
        text: "`zypper refresh`"
        rationale: Correct. refresh (ref) updates the local copy of the repositories' metadata.
      - id: b
        text: "`zypper update`"
        rationale: Wrong. update installs available package updates; it is not the command for refreshing metadata.
      - id: c
        text: "`zypper list-updates`"
        rationale: Wrong. list-updates shows which updates are available; it does not refresh every repository.
      - id: d
        text: "`zypper repos`"
        rationale: Wrong. repos only lists the configured repositories and their settings.
    answer: [a]
    explanation: >
      zypper keeps a local cache of repository metadata. `zypper refresh` (short form `ref`)
      refreshes it for all enabled repositories, or only for the ones named on the command line.
      Repositories with auto-refresh turned on are also refreshed automatically before use.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Updating the Package Index }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Stem reworded away from the lesson's wording." }
    tags: [zypper, refresh]

  - id: 101-102.5-0009
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      A CentOS user needs a program to convert HEIC photos but does not know which package provides
      one. Which command searches the repositories for `heic` in package names and summaries?
    options:
      - id: a
        text: "`yum info heic`"
        rationale: Wrong. info shows details for packages whose name matches heic; it does not search summaries.
      - id: b
        text: "`yum search heic`"
        rationale: Correct. search matches the keyword against package names and summaries.
      - id: c
        text: "`yum check-update heic`"
        rationale: Wrong. check-update reports whether updates are available for installed packages.
      - id: d
        text: "`yum list installed heic`"
        rationale: Wrong. This only shows an installed package named heic.
    answer: [b]
    explanation: >
      `yum search KEYWORD` (and `dnf search`, `zypper search`) is the way to find a package when you
      know what it does but not what it is called. yum also offers `search all` to look in
      descriptions and URLs.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Searching for Packages }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Stem reworded away from the lesson's wording." }
    tags: [yum, search]

  - id: 101-102.5-0010
    type: multi_choice
    difficulty: 2
    pool: holdout
    stem: >
      `curl` is installed. Which **TWO** commands upgrade it to the newest version available in the
      configured repositories, each on its own type of distribution?
    select_count: 2
    options:
      - id: a
        text: "`yum update curl`"
        rationale: Correct. On yum-based systems, update with a package name upgrades just that package.
      - id: b
        text: "`rpm -U curl`"
        rationale: Wrong. rpm -U needs a package file (or URL); it cannot fetch a package by name from a repository.
      - id: c
        text: "`yum check-update curl`"
        rationale: Wrong. check-update only reports whether an update exists; it installs nothing.
      - id: d
        text: "`zypper update curl`"
        rationale: Correct. On SUSE systems, zypper update with a package name upgrades that package.
      - id: e
        text: "`zypper list-updates`"
        rationale: Wrong. list-updates shows the available updates without installing them.
    answer: [a, d]
    explanation: >
      The high-level tools fetch the new version from a repository: `yum update NAME`,
      `dnf upgrade NAME` or `zypper update NAME`. Without a name, they upgrade every package that has
      an update. rpm alone only works with package files you already have.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: "Installing, Upgrading and Removing Packages" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked. Tested with rpm 4.18 in a private --root." }
    tags: [yum, zypper, update]

  - id: 101-102.5-0011
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      For an audit you need the install date, license and packager of the installed package
      `chrony`. Which command shows them?
    options:
      - id: a
        text: "`rpm -ql chrony`"
        rationale: Wrong. -ql lists the files in the package.
      - id: b
        text: "`rpm -qR chrony`"
        rationale: Wrong. -qR lists the capabilities the package requires.
      - id: c
        text: "`rpm -qi chrony`"
        rationale: Correct. -qi prints the package header information, including Install Date, License and Packager.
      - id: d
        text: "`rpm -qc chrony`"
        rationale: Wrong. -qc lists only the package's configuration files.
    answer: [c]
    explanation: >
      `rpm -qi NAME` shows name, version, release, architecture, install date, size, license,
      signature, packager, URL, summary and description. Add -p to read the same data from a
      package file that is not installed.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Getting Package Information }
    review:
      status: pass2
      history:
