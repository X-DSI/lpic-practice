    tags: [rpm, rpm-i]

  - id: 101-102.5-0032
    type: single_choice
    difficulty: 1
    pool: practice
    stem: What does `zypper in nano` do?
    options:
      - id: a
        text: Installs nano and its dependencies from the repositories
        rationale: Correct. in is the short form of zypper install.
      - id: b
        text: Shows information about the nano package
        rationale: Wrong. That is zypper info (if).
      - id: c
        text: Searches the repositories for packages matching nano
        rationale: Wrong. That is zypper search (se).
      - id: d
        text: Lists the files installed by the nano package
        rationale: Wrong. Listing an installed package's files is done with rpm -ql nano.
    answer: [a]
    explanation: >
      Most zypper commands have short aliases: in (install), rm (remove), se (search), up (update),
      lu (list-updates), ref (refresh), lr (repos), ar/rr/mr for repository management.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Zypper }
    review:
      status: pass2
