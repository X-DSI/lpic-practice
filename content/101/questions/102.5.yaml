    tags: [zypper, install]

  - id: 101-102.5-0033
    type: multi_choice
    difficulty: 2
    pool: practice
    stem: Which **TWO** locations can contain repository definitions read by yum?
    select_count: 2
    options:
      - id: a
        text: "`/etc/zypp/repos.d/`"
        rationale: Wrong. This directory holds zypper's repository definitions on SUSE systems.
      - id: b
        text: "`/etc/yum.repos.d/`"
        rationale: Correct. yum reads every .repo file in this directory.
      - id: c
        text: "`/var/cache/yum/`"
        rationale: Wrong. This is yum's cache of downloaded packages and metadata.
      - id: d
        text: "`/etc/yum.conf`"
        rationale: Correct. Besides its [main] section, yum.conf may contain repository sections too.
      - id: e
        text: "`/etc/yum/pluginconf.d/`"
        rationale: Wrong. This directory configures yum plugins.
    answer: [b, d]
    explanation: >
      The usual place is a .repo file in /etc/yum.repos.d/, but yum also reads repository sections
      appended to /etc/yum.conf. dnf uses the same .repo directory.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Managing Software Repositories }
    review:
