  - id: 101-102.5-0035
    type: single_choice
    difficulty: 2
    pool: practice
    stem: >
      Which zypper command lists the configured repositories with columns such as Alias, Enabled,
      GPG Check and Refresh?
    options:
      - id: a
        text: "`zypper refresh`"
        rationale: Wrong. refresh downloads repository metadata.
      - id: b
        text: "`zypper repos`"
        rationale: Correct. repos (lr) lists the defined repositories and their settings.
      - id: c
        text: "`zypper search`"
        rationale: Wrong. search looks for packages, not repositories.
      - id: d
        text: "`zypper info`"
        rationale: Wrong. info shows details about a package.
    answer: [b]
    explanation: >
      `zypper repos` (lr) prints one numbered line per repository. The number or alias can then be
      used with mr (modifyrepo), rr (removerepo) and ref (refresh).
