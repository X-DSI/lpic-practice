    tags: [yum, yum.conf, yum.repos.d]

  - id: 101-102.5-0034
    type: single_choice
    difficulty: 1
    pool: practice
    stem: >
      You want a package's size, origin repository and full description before installing it.
      Which yum command shows them?
    options:
      - id: a
        text: "`yum search`"
        rationale: Wrong. search lists matching package names with their summaries only.
      - id: b
        text: "`yum list`"
        rationale: Wrong. list shows name.arch, version and repository, but not size or description.
      - id: c
        text: "`yum check-update`"
        rationale: Wrong. check-update lists packages that have updates available.
      - id: d
        text: "`yum info`"
        rationale: Correct. info prints the detailed metadata of a package.
    answer: [d]
    explanation: >
      `yum info NAME` (and `dnf info`, `zypper info`) prints the full metadata of a package, whether
      installed or only available in a repository.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Getting Information About a Package }
