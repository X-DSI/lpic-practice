  - id: 101-102.5-0025
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      You want to uninstall both `libmaxminddb` and `geoipupdate` cleanly with `rpm`. Your first
      attempt fails as shown. Which command removes both packages?
    exhibit: |
      # rpm -e libmaxminddb
      error: Failed dependencies:
              libmaxminddb.so.0()(64bit) is needed by (installed) geoipupdate-4.6.0-1.el9.x86_64
    options:
      - id: a
        text: "`rpm -e --nodeps libmaxminddb`"
        rationale: Wrong. This removes only the library and leaves geoipupdate installed with a broken dependency.
      - id: b
        text: "`rpm -e libmaxminddb geoipupdate`"
        rationale: Correct. Removing both in one transaction leaves nothing installed that needs the library.
      - id: c
        text: "`rpm -e libmaxminddb && rpm -e geoipupdate`"
        rationale: Wrong. The first command fails again, so && never runs the second one.
      - id: d
        text: "`rpm -e --test libmaxminddb geoipupdate`"
        rationale: Wrong. --test only checks whether the removal would succeed; nothing is removed.
    answer: [b]
    explanation: >
      rpm checks dependencies against the state after the whole transaction. Naming the dependent
      package in the same rpm -e command satisfies the check. --nodeps skips the check and leaves a
      broken system.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: "Installing, Upgrading and Removing Packages" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked. Tested with rpm 4.18 in a private --root." }
    tags: [rpm, rpm-e, dependencies]

  - id: 101-102.5-0026
