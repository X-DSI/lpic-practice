  - id: 101-102.5-0017
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: >
      A vendor publishes `https://repo.example.com/vendor.repo`. Which **TWO** actions make the
      vendor's repository known to yum on a CentOS 7 host?
    select_count: 2
    options:
      - id: a
        text: "Run `rpm --import https://repo.example.com/vendor.repo`"
        rationale: Wrong. rpm --import imports GPG public keys into the RPM database; it defines no repository.
      - id: b
        text: Save the file as `/etc/yum.repos.d/vendor.repo`
        rationale: Correct. yum reads every .repo file in /etc/yum.repos.d/.
      - id: c
        text: "Run `yum install https://repo.example.com/vendor.repo`"
        rationale: Wrong. yum install expects package names or .rpm files; a .repo file is not a package.
      - id: d
        text: "Run `yum-config-manager --add-repo https://repo.example.com/vendor.repo`"
        rationale: Correct. --add-repo downloads the .repo file and saves it in /etc/yum.repos.d/.
      - id: e
        text: "Run `yum makecache`"
        rationale: Wrong. makecache downloads metadata for repositories that are already configured.
    answer: [b, d]
    explanation: >
      A yum repository exists for the system once its definition is in /etc/yum.repos.d/ (or in
      /etc/yum.conf). You can copy the .repo file there yourself, or let yum-config-manager
      --add-repo fetch and save it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Managing Software Repositories }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [yum, yum.repos.d, yum-config-manager]

