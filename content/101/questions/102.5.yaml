  # --------------------------------------------------------------------------- practice (CLI)

  - id: 101-102.5-0031
    type: single_choice
    difficulty: 1
    pool: practice
    stem: Which `rpm` option installs a package from a `.rpm` file?
    options:
      - id: a
        text: "`-q`"
        rationale: Wrong. -q selects query mode.
      - id: b
        text: "`-e`"
        rationale: Wrong. -e erases (removes) an installed package.
      - id: c
        text: "`-i`"
        rationale: Correct. -i installs the package file given on the command line.
      - id: d
        text: "`-V`"
        rationale: Wrong. -V verifies an installed package's files.
    answer: [c]
    explanation: >
      `rpm -i FILE.rpm` installs a package file, typically with -v and -h for verbose output and a
      progress bar. -U and -F are the upgrade modes.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: "Installing, Upgrading and Removing Packages" }
