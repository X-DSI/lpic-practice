        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [rpm, rpm-qi]

  - id: 101-102.5-0012
    type: multi_choice
    difficulty: 2
    pool: holdout
    stem: Which **TWO** commands uninstall the package `httpd`, each on its own type of distribution?
    select_count: 2
    options:
      - id: a
        text: "`yum clean packages httpd`"
        rationale: Wrong. yum clean deletes cached data; it never uninstalls packages.
      - id: b
        text: "`yum remove httpd`"
        rationale: Correct. remove uninstalls the package on yum-based systems.
      - id: c
        text: "`zypper rm httpd`"
        rationale: Correct. rm is the short form of zypper's remove command.
      - id: d
        text: "`zypper rr httpd`"
        rationale: Wrong. rr (removerepo) deletes a repository definition with that alias, not a package.
      - id: e
        text: "`rpm -F httpd`"
        rationale: Wrong. -F freshens (upgrades) from a package file; it does not remove anything.
    answer: [b, c]
    explanation: >
      `yum remove`, `dnf remove`, `zypper remove` (rm) and `rpm -e` all uninstall packages. Take care
      not to confuse zypper's package commands with its repository commands (ar, rr, mr, lr).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: "Installing, Upgrading and Removing Packages" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked. Checked against dnf4/dnf5/zypper docs and source." }
    tags: [yum, zypper, remove]

  - id: 101-102.5-0013
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      `/var/cache/yum` on a CentOS 7 server has grown to several gigabytes of downloaded `.rpm`
      files. Which command deletes the cached package files but keeps the repository metadata?
    options:
      - id: a
        text: "`yum clean packages`"
        rationale: Correct. clean packages removes only the cached package files.
      - id: b
        text: "`yum clean metadata`"
        rationale: Wrong. This removes the cached repository metadata, the part you wanted to keep.
      - id: c
        text: "`yum check-update`"
        rationale: Wrong. check-update lists available updates and may download fresh metadata; it deletes nothing.
      - id: d
        text: "`yum-config-manager --disable base`"
        rationale: Wrong. This disables a repository; files already in the cache stay where they are.
    answer: [a]
    explanation: >
      yum clean takes what to clean as an argument: packages (downloaded .rpm files), metadata
      (repository metadata), all (everything) and a few more. dnf has the same subcommand; its
      cache lives under /var/cache/dnf instead.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: Managing Software Repositories }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [yum, clean]

  - id: 101-102.5-0014
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      A script copies `agent-5.2-1.x86_64.rpm` to many hosts and runs one `rpm` command. Hosts with an
      older agent must be upgraded; hosts without agent must **not** get it installed. Which command
      should the script run?
    options:
      - id: a
        text: "`rpm -Uvh agent-5.2-1.x86_64.rpm`"
        rationale: Wrong. -U upgrades, but it also installs the package on hosts that do not have it.
      - id: b
        text: "`rpm -Fvh agent-5.2-1.x86_64.rpm`"
        rationale: Correct. -F (freshen) upgrades only when an older version is installed and otherwise does nothing.
      - id: c
        text: "`rpm -ivh agent-5.2-1.x86_64.rpm`"
        rationale: Wrong. -i installs the package where it is absent, and does not replace an existing older version.
      - id: d
        text: "`rpm -qip agent-5.2-1.x86_64.rpm`"
        rationale: Wrong. This only displays information about the package file.
    answer: [b]
    explanation: >
      -U means "install or upgrade"; -F means "upgrade only if already installed". -v and -h add
      verbose output and hash-mark progress bars to either one.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: "Installing, Upgrading and Removing Packages" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked. Tested with rpm 4.18 in a private --root." }
    tags: [rpm, rpm-F, rpm-U]

  - id: 101-102.5-0015
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: Which **TWO** statements about removing packages are true?
    select_count: 2
    options:
      - id: a
        text: "`rpm -e` refuses to remove a package that other installed packages depend on."
        rationale: Correct. rpm stops with "Failed dependencies" and names the packages that need it.
      - id: b
        text: "`rpm -e` accepts only one package name per command."
        rationale: Wrong. Several package names can be given and are removed together.
      - id: c
        text: "`zypper rm` also removes the installed packages that depend on the one being removed."
        rationale: Correct. zypper lists the dependent packages it will remove too and asks for confirmation.
      - id: d
        text: "`yum remove` leaves the dependent packages installed with unmet dependencies."
        rationale: Wrong. yum resolves the transaction and removes the packages that depend on the removed one as well.
    answer: [a, c]
    explanation: >
      rpm checks dependencies but never acts on them: removing a needed package fails unless you
      remove the dependents in the same command. The high-level tools (yum, dnf, zypper) instead
      add the dependent packages to the removal and show you the list before going ahead.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: "Installing, Upgrading and Removing Packages" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked. Checked against dnf4/dnf5/zypper docs and source." }
    tags: [rpm, zypper, yum, remove]

  - id: 101-102.5-0016
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      On Fedora, the package `ripgrep` is available in an enabled repository but not installed.
      Which command lists the files it would install, without installing it?
    options:
      - id: a
        text: "`rpm -ql ripgrep`"
        rationale: Wrong. rpm -ql reads the local RPM database, so it only works for installed packages.
      - id: b
        text: "`dnf info ripgrep`"
        rationale: Wrong. info shows version, size, repository and description, but no file list.
      - id: c
        text: "`dnf provides ripgrep`"
        rationale: Wrong. provides finds packages that provide a file or capability; it does not list a package's files.
      - id: d
        text: "`dnf repoquery -l ripgrep`"
        rationale: Correct. repoquery -l (--list) prints the file list from the repository metadata.
    answer: [d]
    explanation: >
      dnf repoquery queries repository metadata, so it works for packages that are not installed.
      `-l` lists their files. For an installed package `rpm -ql` does the same from the local
      database.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.5", lesson: 1, section: DNF }
    review:
      status: pass2
      history:
