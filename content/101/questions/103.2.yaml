  - id: 101-103.2-0030
    type: fill_in
    difficulty: 3
    pool: practice
    stem: >
      Type the `tr` option that replaces each run of a repeated character, such as several spaces
      in a row, with a single copy of it.
    fill_in:
      accepted: ['(tr\s+)?(-s|--squeeze-repeats)']
      match: regex
      case_sensitive: true
    explanation: >
      tr -s (--squeeze-repeats) collapses each run of a listed character into a single one:
      echo 'a    b' | tr -s ' ' prints "a b". Combined with a second set, as in tr -s 'x' 'y',
      it translates first and then squeezes the result.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.2", lesson: 1, section: Summary }
    verify:
      command: echo 'a    b' | tr -s ' '
      expect: { exit_code: 0, stdout_regex: "^a b\\s*$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Explanation reworded to avoid echoing an explorational exercise (tr -s before cut)." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Regex no longer accepts trailing operands; the stem asks only for the option." }
    tags: [tr]
