  - id: 101-103.2-0018
    type: multi_choice
    difficulty: 5
    pool: holdout
    stem: >
      An admin meant to edit `site.conf` in place with GNU sed and keep a backup, but typed
      `sed -ie 's/8080/9090/' site.conf`. Which **TWO** statements describe the result?
    select_count: 2
    options:
      - id: a
        text: "`site.conf` now contains 9090 where it had 8080"
        rationale: Correct. The script still runs and the file is edited in place.
      - id: b
        text: A backup named `site.conf.bak` was created
        rationale: Wrong. The backup suffix is whatever directly follows -i, and no ".bak" was given.
      - id: c
        text: "`site.conf` is unchanged and the edited text went to standard output"
        rationale: Wrong. -i is in effect, so sed writes the result back to the file instead of to standard output.
      - id: d
        text: A copy of the original file was saved as `site.confe`
        rationale: Correct. GNU sed reads the "e" right after -i as the backup suffix.
      - id: e
        text: sed stopped with an error because the script follows -e
        rationale: Wrong. The e was taken as the suffix, so the script is the first non-option argument and sed runs normally.
    answer: [a, d]
    explanation: >
      With GNU sed, -i takes an optional suffix that must be attached to it: -i.bak keeps the
      original as FILE.bak. In -ie the "e" is that suffix, not the -e option, so sed edits the file and
      leaves the original as site.confe. Write -i -e or -e ... -i to avoid this.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.2", lesson: 1, section: "The Basics of sed, the Stream Editor" }
    verify:
      setup: ["cd /tmp && printf 'listen=8080\\n' > site.conf"]
      command: cd /tmp && sed -ie 's/8080/9090/' site.conf && cat site.confe site.conf
      expect: { exit_code: 0, stdout_regex: "listen=8080\\s+listen=9090" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [sed]

  - id: 101-103.2-0019
    type: multi_choice
    difficulty: 5
    pool: holdout
    stem: >
      Each line of `access.log` starts with the client address followed by a space. Which **TWO**
      pipelines print the address that made the most requests together with its correct request
      count?
    exhibit: |
      $ head -n 3 access.log
      10.0.0.7 - - [26/Oct/2026:09:01:12] "GET / HTTP/1.1" 200
      10.0.0.9 - - [26/Oct/2026:09:01:15] "GET /login HTTP/1.1" 200
      10.0.0.7 - - [26/Oct/2026:09:01:20] "GET /about HTTP/1.1" 200
    select_count: 2
    options:
      - id: a
        text: "`cut -d' ' -f1 access.log | uniq -c | sort -rn | head -n 1`"
        rationale: Wrong. Without sorting first, uniq counts only runs of adjacent lines, so the counts are split up.
      - id: b
        text: "`cut -d' ' -f1 access.log | sort | uniq -c | sort -rn | head -n 1`"
        rationale: Correct. Sort, count each address, sort the counts largest first and keep the top line.
      - id: c
        text: "`cut -d' ' -f1 access.log | sort | uniq -c | sort -n | tail -n 1`"
        rationale: Correct. Counts sorted smallest first put the busiest address on the last line.
      - id: d
        text: "`cut -d' ' -f1 access.log | sort -u | uniq -c | sort -rn | head -n 1`"
        rationale: Wrong. sort -u leaves one line per address, so every count is 1.
      - id: e
        text: "`cut -d' ' -f1 access.log | sort | uniq -d | head -n 1`"
        rationale: Wrong. uniq -d prints each repeated address once, without counts, in sorted order.
    answer: [b, c]
    explanation: >
      The classic "top N" pipeline is cut | sort | uniq -c | sort -rn | head. uniq needs sorted
      input to see all copies of a line together, and the second sort must be numeric because the
      counts are numbers.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.2", lesson: 1, section: Summary }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [cut, sort, uniq, head, tail]

  - id: 101-103.2-0020
    type: fill_in
    difficulty: 5
    pool: holdout
    stem: >
      Type the full command that splits `capture.log` into pieces of 100 MiB each, named
      `log_00`, `log_01`, `log_02` and so on.
    fill_in:
      accepted: ['(?=.*(\s-d|\s--numeric-suffixes))(?=.*(\s-d?b|\s--bytes))(sudo\s+)?((/usr)?/bin/)?split(\s+(-b\s*(100M|100MiB|104857600)|--bytes(=|\s+)(100M|100MiB|104857600)|-db\s*(100M|100MiB|104857600)|-d|--numeric-suffixes(=0+)?|-a\s*2|--suffix-length(=|\s+)2))*\s+(\./)?capture\.log\s+log_(\s+(-b\s*(100M|100MiB|104857600)|--bytes(=|\s+)(100M|100MiB|104857600)|-db\s*(100M|100MiB|104857600)|-d|--numeric-suffixes(=0+)?|-a\s*2|--suffix-length(=|\s+)2))*']
      match: regex
      case_sensitive: true
    explanation: >
      split -b SIZE starts a new piece every SIZE bytes; the suffixes K, M, G are powers of 1024
      (KB, MB, GB are powers of 1000). -d gives numeric suffixes 00, 01, ... instead of aa, ab, ...,
      and the last argument is the prefix.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.2", lesson: 1, section: Summary }
    verify:
      setup: ["cd /tmp && head -c 250M /dev/zero > capture.log"]
      command: cd /tmp && split -b 100M -d capture.log log_ && ls log_* && stat -c %s log_00
      expect: { exit_code: 0, stdout_regex: "log_00\\s+log_01\\s+log_02\\s+104857600" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Regex also accepts options after the operands (GNU getopt permutes them)." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Rewritten as a size-based split (-b 100M -d); the line-based version restated Explorational Exercise 5. Text supplied by the reviewer; verified live by the writer." }
    tags: [split]

