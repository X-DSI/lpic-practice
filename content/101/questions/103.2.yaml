  - id: 101-103.2-0024
    type: single_choice
    difficulty: 3
    pool: practice
    stem: Which command produced the output shown? (`todo.txt` contains two empty lines.)
    exhibit: |
      $ ??? todo.txt
           1	mount /data

           2	check quota
           3	rotate logs

           4	notify admin
    options:
      - id: a
        text: "`cat -n todo.txt`"
        rationale: Wrong. cat -n numbers every line, empty ones included, so it would reach 6.
      - id: b
        text: "`nl -b a todo.txt`"
        rationale: Wrong. -b a tells nl to number all lines, including the empty ones.
      - id: c
        text: "`nl todo.txt`"
        rationale: Correct. By default nl numbers only non-empty lines (-b t), so the empty lines get no number.
      - id: d
        text: "`wc -l todo.txt`"
        rationale: Wrong. wc -l prints just a count and the file name, not the lines.
    answer: [c]
    explanation: >
      nl numbers lines, but its default body style (-b t) skips empty lines. cat -n and nl -b a
      number every line.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.2", lesson: 1, section: Getting a Portion of a Text File }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [nl, cat]

  - id: 101-103.2-0025
    type: single_choice
    difficulty: 2
    pool: practice
    stem: According to the output shown, how many words does `todo.txt` contain?
    exhibit: |
      $ wc todo.txt
       6  8 51 todo.txt
    options:
      - id: a
        text: "6"
        rationale: Wrong. The first number is the line count.
      - id: b
        text: "51"
        rationale: Wrong. The third number is the byte count.
      - id: c
        text: "1"
        rationale: Wrong. wc counted one file, but it does not print a file count.
      - id: d
        text: "8"
        rationale: Correct. With no options wc prints lines, words, then bytes, so the second number is the words.
    answer: [d]
    explanation: >
      With no options wc prints the line, word and byte counts, in that order, followed by the file
      name. -l, -w and -c select single counts; -m counts characters.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.2", lesson: 1, section: Getting a Portion of a Text File }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Difficulty 3 -> 2 (reading wc column order is choosing/recall, not option knowledge)." }
    tags: [wc]

  - id: 101-103.2-0026
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      The command shown replaced only one "red" on the first line. Which command replaces every
      "red" on every line?
    exhibit: |
      $ sed 's/red/pink/' col.txt
      pink red green
      blue pink
    options:
      - id: a
        text: "`sed 's/red/pink/g' col.txt`"
        rationale: Correct. The g flag makes s replace every match on the line, not only the first.
      - id: b
        text: "`sed -n 's/red/pink/' col.txt`"
        rationale: Wrong. -n turns off automatic printing, so nothing is printed at all.
      - id: c
        text: "`sed 's/red/pink/2' col.txt`"
        rationale: Wrong. The 2 flag replaces only the second match on each line, so "blue red" keeps its red.
      - id: d
        text: "`sed -i 's/red/pink/' col.txt`"
        rationale: Wrong. -i writes the result back to the file, but still replaces only the first match per line.
    answer: [a]
    explanation: >
      sed's s command replaces the first match on each line. A trailing g replaces all matches on
      the line, and a number N replaces only the Nth match.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.2", lesson: 1, section: "The Basics of sed, the Stream Editor" }
    verify:
      command: printf 'red red green\n' | sed 's/red/pink/g'
      expect: { exit_code: 0, stdout_contains: "pink pink green" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [sed]

  - id: 101-103.2-0027
    type: multi_choice
    difficulty: 2
    pool: practice
    stem: Which **TWO** commands compute a message digest (hash) of a file that can later be checked with `-c`?
    select_count: 2
    options:
      - id: a
        text: "`od`"
        rationale: Wrong. od dumps the file's bytes; it computes no digest.
      - id: b
        text: "`nl`"
        rationale: Wrong. nl numbers lines.
      - id: c
        text: "`md5sum`"
        rationale: Correct. md5sum computes MD5 digests and checks them with -c.
      - id: d
        text: "`split`"
        rationale: Wrong. split breaks a file into smaller files.
      - id: e
        text: "`sha512sum`"
        rationale: Correct. sha512sum computes SHA-512 digests and checks them with -c.
    answer: [c, e]
    explanation: >
      md5sum, sha256sum and sha512sum each print a digest followed by the file name, and with -c
      they read such lines back and check the files. SHA-256 and SHA-512 are stronger than MD5.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.2", lesson: 1, section: Ensuring Data Integrity }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [md5sum, sha512sum, checksum]

  - id: 101-103.2-0028
    type: multi_choice
    difficulty: 3
    pool: practice
    stem: >
      Which **TWO** commands print the lines of `fruit.txt` in reverse alphabetical order with each
      distinct line shown only once?
    select_count: 2
    options:
      - id: a
        text: "`sort -ru fruit.txt`"
        rationale: Correct. -r reverses the order and -u keeps one copy of equal lines.
      - id: b
        text: "`uniq fruit.txt | sort -r`"
        rationale: Wrong. uniq runs before sorting, so duplicates that are not adjacent survive.
      - id: c
        text: "`sort -R -u fruit.txt`"
        rationale: Wrong. -R shuffles the lines into a random order instead of reversing them.
      - id: d
        text: "`sort -r fruit.txt | uniq`"
        rationale: Correct. After sorting, equal lines are adjacent, so uniq removes the repeats.
    answer: [a, d]
    explanation: >
      sort -u is the same as sort followed by uniq. uniq alone only removes repeats that are next to
      each other, so it needs sorted input.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.2", lesson: 1, section: Summary }
    review:
      status: pass2
      history:
