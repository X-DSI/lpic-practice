    tags: [head]

  - id: 101-103.2-0023
    type: single_choice
    difficulty: 2
    pool: practice
    stem: Which command prints the text inside the xz-compressed file `dmesg.old.xz`?
    options:
      - id: a
        text: "`xzcat dmesg.old.xz`"
        rationale: Correct. xzcat decompresses xz data to standard output.
      - id: b
        text: "`zcat dmesg.old.xz`"
        rationale: Wrong. zcat is for gzip data and reports that the file is not in gzip format.
      - id: c
        text: "`bzcat dmesg.old.xz`"
        rationale: Wrong. bzcat is for bzip2 data and reports that the file is not a bzip2 file.
      - id: d
        text: "`unxz dmesg.old.xz`"
        rationale: Wrong. unxz decompresses the file into `dmesg.old` and removes the .xz file; nothing is printed.
    answer: [a]
    explanation: >
      Match the viewer to the compression: xzcat for .xz, bzcat for .bz2, zcat for .gz. Each one
      writes the decompressed text to standard output and leaves the compressed file alone.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.2", lesson: 1, section: Reading a Compressed File }
