  - id: 101-103.2-0021
    type: single_choice
    difficulty: 1
    pool: practice
    stem: >
      You have `part1.txt` and `part2.txt` and want a single file `whole.txt` that holds all of
      part1 followed by all of part2. Which command does this?
    options:
      - id: a
        text: "`paste part1.txt part2.txt > whole.txt`"
        rationale: Wrong. paste puts the files side by side, joining line N of each into one line.
      - id: b
        text: "`cat part1.txt part2.txt > whole.txt`"
        rationale: Correct. cat concatenates files one after the other on standard output, which is redirected to whole.txt.
      - id: c
        text: "`split part1.txt part2.txt > whole.txt`"
        rationale: Wrong. split breaks one file into pieces; the second name is taken as the output prefix.
      - id: d
        text: "`cut part1.txt part2.txt > whole.txt`"
        rationale: Wrong. cut needs a -b, -c or -f selection and fails without one.
    answer: [b]
    explanation: >
      cat (from "concatenate") writes the named files to standard output in the order given. With
      > the output goes to a new file; >> would append to an existing one instead.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.2", lesson: 1, section: A Quick Review on Redirections and Pipes }
    review:
      status: pass2
      history:
