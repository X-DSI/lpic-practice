        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [cat]

  - id: 101-103.2-0022
    type: single_choice
    difficulty: 2
    pool: practice
    stem: Which command shows only the first five lines of `queue.txt`?
    options:
      - id: a
        text: "`tail -n 5 queue.txt`"
        rationale: Wrong. tail shows the last five lines.
      - id: b
        text: "`head -c 5 queue.txt`"
        rationale: Wrong. -c counts bytes, so this prints only the first five bytes.
      - id: c
        text: "`cut -c1-5 queue.txt`"
        rationale: Wrong. This keeps the first five characters of every line.
      - id: d
        text: "`head -n 5 queue.txt`"
        rationale: Correct. head -n sets how many lines to print from the start.
    answer: [d]
    explanation: >
      head prints the start of a file (ten lines by default) and tail the end. -n NUM sets the
      number of lines and -c NUM a number of bytes instead.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.2", lesson: 1, section: Getting a Portion of a Text File }
    review:
      status: pass2
