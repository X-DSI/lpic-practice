    tags: [apt]

  - id: 101-102.4-0033
    type: single_choice
    difficulty: 1
    pool: practice
    stem: By default, where does APT store the .deb files it downloads before installing them?
    options:
      - id: a
        text: "`/var/lib/apt/lists`"
        rationale: Wrong. This holds the downloaded package indexes, not the packages.
      - id: b
        text: "`/var/cache/apt/archives`"
        rationale: Correct. Downloaded .deb files go here; partial downloads go to its partial/ subdirectory.
      - id: c
        text: "`/var/lib/dpkg/info`"
        rationale: Wrong. dpkg keeps per-package file lists and maintainer scripts here.
      - id: d
        text: "`/tmp/apt`"
        rationale: Wrong. APT does not use this directory for its cache.
    answer: [b]
    explanation: >
      /var/cache/apt/archives holds downloaded packages until apt-get clean or apt-get autoclean
      removes them.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: The Local Cache }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [cache]

  - id: 101-102.4-0034
    type: single_choice
    difficulty: 2
    pool: practice
    stem: >
      You want to add a repository in its own one-line-format file rather than editing
      `/etc/apt/sources.list`. Where do you put it?
    options:
      - id: a
        text: "`/etc/apt/apt.conf.d/vendor.conf`"
        rationale: Wrong. apt.conf.d holds APT configuration options, not repository lines.
      - id: b
        text: "`/etc/apt/preferences.d/vendor`"
        rationale: Wrong. preferences.d holds pinning rules that set package priorities.
      - id: c
        text: "`/etc/apt/sources.list.d/vendor.conf`"
        rationale: Wrong. The directory is right but APT ignores files there that do not end in .list or .sources.
      - id: d
        text: "`/etc/apt/sources.list.d/vendor.list`"
        rationale: Correct. One-line-format files in sources.list.d must end in .list.
    answer: [d]
    explanation: >
      Each file in /etc/apt/sources.list.d/ ending in .list uses the same syntax as sources.list,
      which keeps third-party repositories separate and easy to remove. Run apt-get update after
      adding one.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: The /etc/apt/sources.list.d Directory }
    review:
      status: pass2
