  - id: 101-102.4-0024
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: >
      You add a third-party repository by creating a file in `/etc/apt/sources.list.d/`. With
      current APT, which **TWO** file names will APT actually read?
    select_count: 2
    options:
      - id: a
        text: "`vendor.list` (one-line `deb …` format)"
        rationale: Correct. Files ending in .list use the classic one-line sources.list format.
      - id: b
        text: "`vendor.conf` (one-line `deb …` format)"
        rationale: Wrong. APT ignores files in sources.list.d whose names do not end in .list or .sources.
      - id: c
        text: "`vendor.repo` (one-line `deb …` format)"
        rationale: Wrong. .repo is the yum/dnf convention; APT ignores it.
      - id: d
        text: "`vendor.sources` (deb822 `Types:`/`URIs:` format)"
        rationale: Correct. Files ending in .sources use the multi-line deb822 format, used by default on current Ubuntu and Debian.
    answer: [a, d]
    explanation: >
      APT reads *.list files (one-line format) and *.sources files (deb822 format) from
      /etc/apt/sources.list.d/. Ubuntu 24.04, for example, ships its own repositories in
      ubuntu.sources. Files with other extensions are ignored.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: The /etc/apt/sources.list.d Directory }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. Verified live on dpkg 1.22.6 / apt 2.8.3." }
    tags: [sources.list]

  - id: 101-102.4-0025
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: >
      The line in the exhibit was added to `/etc/apt/sources.list`. Which **TWO** statements about
      it are true?
    exhibit: |
      deb-src http://deb.debian.org/debian bookworm main contrib
    select_count: 2
    options:
      - id: a
        text: It points APT at source packages, which commands like `apt-get source` can download
        rationale: Correct. deb-src lines provide source package indexes, used by apt-get source and build-dep.
      - id: b
        text: "`bookworm` names the distribution release (suite or codename) the line refers to"
        rationale: Correct. The third field is the distribution (codename or suite).
      - id: c
        text: After an index update, `apt-get install` can install ready-to-run programs from main and contrib through this line
        rationale: Wrong. Binary packages come from deb lines; a deb-src line provides no installable binaries.
      - id: d
        text: APT reads it immediately; no index update is needed before using it
        rationale: Wrong. apt-get update must run before APT knows what the new line offers.
    answer: [a, b]
    explanation: >
      A one-line entry is: archive type (deb or deb-src), URL, distribution, then one or more
      components. deb-src lines are only for source packages; binary packages need a deb line.
      Run apt-get update after any change.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: The Sources List }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: fixed, notes: "Option b reworded: the field is the suite or codename the line refers to." }
    tags: [sources.list, deb-src]

  - id: 101-102.4-0026
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      After `apt-get update`, 34 packages can be upgraded (see the exhibit). Change control allows
      you to upgrade **only** `ca-certificates` today. Which command does that?
    exhibit: |
      $ apt list --upgradable
      Listing...
      ca-certificates/noble-updates 20260816ubuntu0.24.04.1 all [upgradable from: 20260601~24.04.1]
      distro-info-data/noble-updates 2026.10.12-0ubuntu0.24.04.1 all [upgradable from: 0.72-0ubuntu0.24.04.1]
      tmux/noble-updates 3.4-1ubuntu0.2 amd64 [upgradable from: 3.4-1build1]
      ... (31 more lines)
    options:
      - id: a
        text: "`apt-get install ca-certificates`"
        rationale: Correct. install on an already installed package upgrades just that package (plus anything it needs) to the candidate version.
      - id: b
        text: "`apt-get upgrade ca-certificates`"
        rationale: Wrong. With current apt-get, upgrade still upgrades every upgradable package; the name does not restrict it.
      - id: c
        text: "`apt-get update ca-certificates`"
        rationale: Wrong. update refreshes the package indexes, does not take package names and upgrades nothing.
      - id: d
        text: "`dpkg -i ca-certificates`"
        rationale: Wrong. dpkg -i expects a .deb file name and does not download packages from repositories.
    answer: [a]
    explanation: >
      apt-get install PKG upgrades an installed package to its candidate version (add
      --only-upgrade to make sure nothing new gets installed). apt-get upgrade with a package name
      still upgrades everything upgradable, as a simulated run (-s) shows.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Upgrading Packages }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. Verified live on dpkg 1.22.6 / apt 2.8.3." }
    tags: [apt-get, upgrade]

  - id: 101-102.4-0027
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      `vpnclient_4.2_amd64.deb` is in your current directory. It depends on packages that are
      available from your configured repositories but not yet installed. Which **single** command
      installs the file and its dependencies?
    options:
      - id: a
        text: "`dpkg -i vpnclient_4.2_amd64.deb`"
        rationale: Wrong. dpkg unpacks the file but stops with unmet dependencies; it never fetches them.
      - id: b
        text: "`apt-get install vpnclient_4.2_amd64.deb`"
        rationale: Wrong. Without a path, apt-get treats the argument as a package name and fails with "Unable to locate package".
      - id: c
        text: "`apt-get install vpnclient`"
        rationale: Wrong. This looks for a package named vpnclient in the repositories, not in the local file.
      - id: d
        text: "`apt-get install ./vpnclient_4.2_amd64.deb`"
        rationale: Correct. With a path (here ./), apt-get installs the local file and fetches its dependencies.
    answer: [d]
    explanation: >
      apt-get install (and apt install) accept a local .deb file when it is given as a path, such
      as ./file.deb or /tmp/file.deb. APT then resolves and downloads the dependencies as usual.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Installing and Removing Packages }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. Verified live on dpkg 1.22.6 / apt 2.8.3." }
    tags: [apt-get, deb]

  - id: 101-102.4-0028
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      `geo-tools` depends on `libgeo`; neither is installed. Both .deb files are in the current
      directory, and the dependent package is listed **first**. What happens when you run
      `dpkg -i geo-tools_2.0-1_all.deb libgeo_1.0-1_all.deb`?
    options:
      - id: a
        text: dpkg stops at geo-tools with a dependency error and never processes libgeo
        rationale: Wrong. dpkg unpacks every file given before configuring, so the order on the command line does not matter here.
      - id: b
        text: libgeo is installed, but geo-tools stays unconfigured because it was processed before libgeo
        rationale: Wrong. Configuration happens after all packages are unpacked, so geo-tools' dependency is met by then.
      - id: c
        text: Both packages are unpacked and then configured, so both end up fully installed
        rationale: Correct. dpkg unpacks all listed packages first, then configures them in dependency order.
      - id: d
        text: dpkg refuses to start because the files must be listed in dependency order
        rationale: Wrong. dpkg has no such rule; it sorts out the configuration order itself.
    answer: [c]
    explanation: >
      dpkg -i with several files unpacks all of them first and then configures them, ordering the
      configuration by dependencies. Installing a package together with its dependencies in one
      dpkg call works in any order.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Dealing with Dependencies }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. Verified live on dpkg 1.22.6 / apt 2.8.3." }
    tags: [dpkg, dependencies]

  - id: 101-102.4-0029
    type: fill_in
    difficulty: 5
    pool: holdout
    stem: >
      `apt-cache search ssh` returns hundreds of results because it also matches descriptions. Type
      the `apt-cache` option (short or long form) that limits the search to package names.
    fill_in:
