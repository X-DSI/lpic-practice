  - id: 101-102.4-0037
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      You asked APT to remove one library, but it wants to remove a second package too (see the
      exhibit). Why is `cowsay` in the list?
    exhibit: |
      # apt-get remove libtext-charwidth-perl
      Reading package lists... Done
      Building dependency tree... Done
      Reading state information... Done
      The following packages will be REMOVED:
        cowsay libtext-charwidth-perl
      0 upgraded, 0 newly installed, 2 to remove and 0 not upgraded.
      Do you want to continue? [Y/n]
    options:
      - id: a
        text: cowsay was installed automatically and is no longer needed
        rationale: Wrong. Unneeded automatic packages are reported for autoremove, not added to the REMOVED list.
      - id: b
        text: The two packages are built from the same source package
        rationale: Wrong. Sharing a source package does not make APT remove them together.
      - id: c
        text: cowsay depends on the library, so it cannot stay installed without it
        rationale: Correct. APT removes packages that depend on the one being removed, and lists them before asking.
      - id: d
        text: remove always deletes every package installed in the same transaction
        rationale: Wrong. APT has no such rule; only dependencies decide what else is removed.
    answer: [c]
    explanation: >
      APT resolves dependencies in both directions: installing pulls in what a package needs, and
      removing takes away the packages that need it. Always read the list before answering Y.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Installing and Removing Packages }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: fixed, notes: "Exhibit completed with the Reading state information line apt-get prints." }
    tags: [apt-get, dependencies]

  - id: 101-102.4-0038
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      After removing an application, APT says that several libraries "were automatically installed
      and are no longer required". Which command removes them?
    options:
      - id: a
        text: "`apt-get autoremove`"
        rationale: Correct. autoremove removes automatically installed packages that nothing depends on any more.
      - id: b
        text: "`apt-get autoclean`"
        rationale: Wrong. autoclean deletes obsolete .deb files from the download cache, not installed packages.
      - id: c
        text: "`apt-get install -f`"
        rationale: Wrong. -f repairs missing dependencies; it does not remove unneeded ones.
      - id: d
        text: "`dpkg --configure -a`"
        rationale: Wrong. This configures all unpacked but unconfigured packages.
    answer: [a]
    explanation: >
      APT marks packages pulled in as dependencies as "automatically installed". When nothing
      depends on them any more, apt-get autoremove (or apt autoremove) removes them.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Installing and Removing Packages }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [apt-get, autoremove]

  - id: 101-102.4-0039
    type: multi_choice
    difficulty: 3
