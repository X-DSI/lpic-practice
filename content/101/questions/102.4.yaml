  - id: 101-102.4-0001
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      You have downloaded `zoomtool_3.1-2_amd64.deb` to the current directory. What does
      `dpkg -i zoomtool_3.1-2_amd64.deb` do?
    options:
      - id: a
        text: Installs the package from that file, or upgrades it if an older version is installed
        rationale: Correct. -i (--install) unpacks and configures the package in the file, replacing any older installed version.
      - id: b
        text: Prints the control information (version, dependencies, maintainer) stored in the file
        rationale: Wrong. That is dpkg -I (capital i, --info).
      - id: c
        text: Downloads the package's dependencies from the configured repositories
        rationale: Wrong. dpkg never downloads anything; resolving dependencies from repositories is APT's job.
      - id: d
        text: Checks whether the package named zoomtool is installed and shows its status
        rationale: Wrong. Status is shown by dpkg -s with a package name, not a file name.
    answer: [a]
    explanation: >
      dpkg -i takes one or more .deb file names. If an older version of the package is installed,
      it is upgraded; otherwise it is installed fresh. dpkg checks dependencies but does not fetch
      missing ones.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: The Debian Package Tool (dpkg) }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [dpkg]

  - id: 101-102.4-0002
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: Which file is APT's traditional main list of repositories to fetch packages from?
    options:
      - id: a
        text: "`/etc/apt/apt.conf`"
        rationale: Wrong. apt.conf holds APT configuration options, not the list of repositories.
      - id: b
        text: "`/var/lib/dpkg/status`"
        rationale: Wrong. This is dpkg's database of installed packages and their states.
      - id: c
        text: "`/etc/apt/sources.list`"
        rationale: Correct. sources.list (plus files in /etc/apt/sources.list.d/) tells APT where packages come from.
      - id: d
        text: "`/var/cache/apt/archives`"
        rationale: Wrong. This directory caches downloaded .deb files; it is not a list of repositories.
    answer: [c]
    explanation: >
      APT reads repository definitions from /etc/apt/sources.list and from files in
      /etc/apt/sources.list.d/. After changing them, run apt-get update to fetch the new indexes.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: The Sources List }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [sources.list]

  - id: 101-102.4-0003
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      On a Debian system, which tool fetches a package from the configured repositories and
      automatically installs the other packages it needs?
    options:
      - id: a
        text: "`dpkg`"
        rationale: Wrong. dpkg reports missing dependencies but cannot fetch or install them by itself.
      - id: b
        text: "`dpkg-query`"
        rationale: Wrong. dpkg-query only reads dpkg's database (status, file lists, searches).
      - id: c
        text: "`dpkg-reconfigure`"
        rationale: Wrong. It re-runs the configuration of a package that is already installed.
      - id: d
        text: "`apt-get`"
        rationale: Correct. apt-get downloads packages from repositories and resolves dependencies automatically.
    answer: [d]
    explanation: >
      APT (apt-get, apt-cache, apt) is the front end that works with repositories and resolves
      dependencies. It calls dpkg underneath to do the actual installation.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Advanced Package Tool (apt) }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [apt-get, dpkg]

  - id: 101-102.4-0004
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      When a package was installed you answered its set-up questions wrongly. Which utility lets you
      go through that package's configuration questions again?
    options:
      - id: a
        text: "`apt-get install --reinstall`"
        rationale: Wrong. Reinstalling unpacks the files again but does not normally ask questions that have already been answered.
      - id: b
        text: "`dpkg-reconfigure`"
        rationale: Correct. dpkg-reconfigure re-runs the configuration of an installed package, asking its debconf questions again.
      - id: c
        text: "`dpkg --configure`"
        rationale: Wrong. This configures packages that are unpacked but not yet configured; an already configured package is not reconfigured.
      - id: d
        text: "`apt-cache show`"
        rationale: Wrong. apt-cache show only displays package information.
    answer: [b]
    explanation: >
      dpkg-reconfigure PACKAGE (for example dpkg-reconfigure tzdata) runs the package's
      configuration again, so you can change the answers you gave when it was installed.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Reconfiguring Installed Packages }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. Verified live on dpkg 1.22.6 / apt 2.8.3." }
    tags: [dpkg-reconfigure]

  - id: 101-102.4-0005
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: Which file name is a Debian binary package that `dpkg -i` can install?
    options:
      - id: a
        text: "`nettool-2.4-1.x86_64.rpm`"
        rationale: Wrong. .rpm is the RPM package format used by Red Hat-style distributions.
      - id: b
        text: "`nettool-2.4.tar.gz`"
        rationale: Wrong. This is a compressed tar archive, typically source code, not a package dpkg can install.
      - id: c
        text: "`nettool_2.4-1.dsc`"
        rationale: Wrong. A .dsc file describes a Debian source package; it is not installable with dpkg -i.
      - id: d
        text: "`nettool_2.4-1_amd64.deb`"
        rationale: Correct. Debian binary packages use the .deb extension, named name_version_architecture.deb.
    answer: [d]
    explanation: >
      Debian binary packages are .deb files, conventionally named
      name_upstreamversion-revision_architecture.deb.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Introduction }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [deb]

  - id: 101-102.4-0006
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: The `curl` package is installed. Which command lists every file it put on the system?
    options:
      - id: a
        text: "`dpkg -l curl`"
        rationale: Wrong. Lower-case -l lists the package with its state, version and description, not its files.
      - id: b
        text: "`dpkg -L curl`"
        rationale: Correct. -L (--listfiles) lists the files that an installed package owns.
      - id: c
        text: "`dpkg -c curl`"
        rationale: Wrong. -c lists the contents of a .deb archive file; given a package name it fails.
      - id: d
        text: "`dpkg -I curl`"
        rationale: Wrong. -I shows control information of a .deb archive file, not an installed package's files.
    answer: [b]
    explanation: >
      dpkg -L PACKAGE (dpkg-query -L) reads the installed package's file list from dpkg's
      database. For a .deb file that is not installed, use dpkg -c FILE instead.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Listing Installed Packages and Package Contents }
    verify:
      command: dpkg -L dpkg
      expect: { exit_code: 0, stdout_contains: "/usr/bin/dpkg" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. Verified live on dpkg 1.22.6 / apt 2.8.3." }
    tags: [dpkg]

  - id: 101-102.4-0007
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      You want to know which installed package provides the file `/usr/bin/dpkg-query`. Which
      command tells you?
    options:
      - id: a
        text: "`dpkg -S /usr/bin/dpkg-query`"
        rationale: Correct. -S (--search) finds the installed package that owns a matching path.
      - id: b
        text: "`dpkg -L /usr/bin/dpkg-query`"
        rationale: Wrong. -L expects a package name and lists its files; it does not search by path.
      - id: c
        text: "`apt-cache search /usr/bin/dpkg-query`"
        rationale: Wrong. apt-cache search matches package names and descriptions, not file paths.
      - id: d
        text: "`dpkg -p /usr/bin/dpkg-query`"
        rationale: Wrong. -p prints available-version details for a package name; it does not search files.
    answer: [a]
    explanation: >
      dpkg -S (same as dpkg-query -S) prints "package: path" for each installed file matching the
      pattern. It only knows about installed packages.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Finding Out Which Package Owns a Specific File }
    verify:
      command: dpkg -S /usr/bin/dpkg-query
      expect: { exit_code: 0, stdout_contains: "dpkg: /usr/bin/dpkg-query" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [dpkg, dpkg-query]

  - id: 101-102.4-0008
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      You want to uninstall the `fortune-mod` package with dpkg but keep its configuration files in
      case you reinstall it later. Which command do you use?
    options:
      - id: a
        text: "`dpkg -P fortune-mod`"
        rationale: Wrong. -P (--purge) removes the configuration files as well.
      - id: b
        text: "`dpkg -x fortune-mod`"
        rationale: Wrong. -x extracts a .deb archive to a directory; it does not uninstall anything.
      - id: c
        text: "`dpkg -r fortune-mod`"
        rationale: Correct. -r (--remove) removes the package but leaves its configuration files on disk.
      - id: d
        text: "`dpkg -R fortune-mod`"
        rationale: Wrong. -R (--recursive) only modifies an action such as -i to process a directory tree; on its own dpkg exits with "need an action option".
    answer: [c]
    explanation: >
      dpkg -r removes a package's files except its configuration files, so the package is left in
      the "rc" state. dpkg -P removes everything, configuration included.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Removing Packages }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Rationale for -R corrected: dpkg exits with 'need an action option' (tested)." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. Verified live on dpkg 1.22.6 / apt 2.8.3." }
    tags: [dpkg, remove]

  - id: 101-102.4-0009
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      You are looking for a Markdown converter but don't know any package names. Which command
      searches the names and descriptions of all packages in APT's index for the word "markdown"?
    options:
      - id: a
        text: "`apt-cache show markdown`"
        rationale: Wrong. show prints the full record of a package called exactly "markdown"; it does not search.
      - id: b
        text: "`dpkg -l '*markdown*'`"
        rationale: Wrong. dpkg -l only knows packages in dpkg's database (installed or previously installed), and matches names only.
      - id: c
        text: "`apt-file search markdown`"
        rationale: Wrong. apt-file searches the file paths inside packages, not package descriptions.
      - id: d
        text: "`apt-cache search markdown`"
        rationale: Correct. apt-cache search matches a pattern against package names and descriptions in the index.
    answer: [d]
    explanation: >
      apt-cache search PATTERN searches the package index (built by apt-get update) and prints
      "name - short description" for each match. apt search does the same with friendlier output.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Searching for Packages }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [apt-cache]

  - id: 101-102.4-0010
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      `/var/cache/apt/archives` has grown to several gigabytes of downloaded .deb files. Which
      command empties it?
    options:
      - id: a
        text: "`apt-get clean`"
        rationale: Correct. clean deletes the downloaded package files from /var/cache/apt/archives and its partial/ directory.
      - id: b
        text: "`apt-get autoremove`"
        rationale: Wrong. autoremove uninstalls automatically installed packages that are no longer needed; it does not empty the download cache.
      - id: c
        text: "`apt-get purge`"
        rationale: Wrong. purge uninstalls named packages with their configuration files; the cache is untouched.
      - id: d
        text: "`dpkg --clear-avail`"
        rationale: Wrong. This erases dpkg's record of available packages, not the downloaded files.
    answer: [a]
    explanation: >
      APT downloads .deb files to /var/cache/apt/archives (partial downloads go to the partial/
      subdirectory) before installing them. apt-get clean (or apt clean) deletes them all.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: The Local Cache }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [apt-get, cache]

  - id: 101-102.4-0011
    type: multi_choice
    difficulty: 2
    pool: holdout
    stem: >
      Which **TWO** commands uninstall the `nginx` package **and** delete its configuration files?
    select_count: 2
    options:
      - id: a
        text: "`apt-get remove nginx`"
        rationale: Wrong. remove leaves the configuration files on the system.
      - id: b
        text: "`apt-get purge nginx`"
        rationale: Correct. purge removes the package together with its configuration files.
      - id: c
        text: "`dpkg -r nginx`"
        rationale: Wrong. dpkg -r also keeps the configuration files; dpkg -P would purge.
      - id: d
        text: "`apt-get remove --purge nginx`"
        rationale: Correct. The --purge option turns a remove into a purge.
    answer: [b, d]
    explanation: >
      With APT, either apt-get purge PKG or apt-get remove --purge PKG removes the configuration
      files too. With dpkg the equivalent is dpkg -P (--purge).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Installing and Removing Packages }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. Reviewer noted a minor giveaway (both correct options contain purge); left unchanged because a purge-free distractor such as autoremove --purge would risk a second right answer." }
    tags: [apt-get, purge]

  - id: 101-102.4-0012
    type: fill_in
    difficulty: 2
    pool: holdout
    stem: >
      A colleague added a new repository line to `/etc/apt/sources.list`, but `apt-get install`
      still cannot find its packages. Type the complete command that downloads fresh package
      indexes from all configured repositories.
    fill_in:
      accepted: ['(sudo\s+)?((/usr)?/bin/)?(apt-get|apt)\s+update']
      match: regex
      case_sensitive: true
    explanation: >
      apt-get update (or apt update) downloads the current package lists from every repository in
      sources.list and sources.list.d/. Until it runs, APT does not know what the new repository
      offers. It installs or upgrades nothing.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Updating the Package Index }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [apt-get, update]

  - id: 101-102.4-0013
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      Type the `dpkg` option (short or long form) that removes an installed package **together
      with** its configuration files.
    fill_in:
      accepted: ['((sudo\s+)?((/usr)?/bin/)?dpkg\s+)?(-P|--purge)(\s+(?!-)\S+)*']
      match: regex
      case_sensitive: true
    explanation: >
      dpkg -P (--purge) removes everything, including configuration files. dpkg -r (--remove)
      keeps the configuration files. -P can also purge a package that was already removed with -r.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Removing Packages }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [dpkg, purge]

  - id: 101-102.4-0014
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      Before removing the `libgeo3` library, you want to see which packages in APT's index declare a
      dependency **on** it. Which `apt-cache` subcommand shows this?
    options:
      - id: a
        text: "`apt-cache depends libgeo3`"
        rationale: Wrong. depends lists what libgeo3 itself needs, the opposite direction.
      - id: b
        text: "`apt-cache rdepends libgeo3`"
        rationale: Correct. rdepends lists reverse dependencies, the packages that depend on libgeo3.
      - id: c
        text: "`apt-cache policy libgeo3`"
        rationale: Wrong. policy shows installed and candidate versions and their sources.
      - id: d
        text: "`apt-cache search libgeo3`"
        rationale: Wrong. search matches names and descriptions; it does not follow dependency relationships.
    answer: [b]
    explanation: >
      apt-cache depends PKG shows what PKG needs; apt-cache rdepends PKG shows what needs PKG.
      Adding --installed limits rdepends to installed packages.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Searching for Packages }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [apt-cache, dependencies]

  - id: 101-102.4-0015
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      In the output of `dpkg -l`, the line for the package `mutt` begins with `rc`. What does that
      tell you?
    options:
      - id: a
        text: mutt is installed and fully configured
        rationale: Wrong. A fully installed and configured package shows ii.
      - id: b
        text: mutt was unpacked but its configuration step has not run yet
        rationale: Wrong. Unpacked but unconfigured is shown as iU.
      - id: c
        text: mutt was removed, but its configuration files are still on disk
        rationale: Correct. r = marked for removal (desired state), c = only config files remain (current state).
      - id: d
        text: mutt is held at its current version and will not be upgraded
        rationale: Wrong. A held package shows h in the first column, as in hi.
    answer: [c]
    explanation: >
      The first letter of a dpkg -l line is the desired state (i install, r remove, p purge, h hold),
      the second the current state (i installed, c config-files, U unpacked, n not installed). "rc"
      is what dpkg -r leaves behind; dpkg -P mutt would clear it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Removing Packages }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [dpkg, package-state]

  - id: 101-102.4-0016
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: >
      Which **TWO** commands show the version of the `bash` package that is currently installed?
    select_count: 2
    options:
      - id: a
        text: "`dpkg -s bash`"
        rationale: Correct. dpkg -s prints the installed package's status record, including Status and Version.
      - id: b
        text: "`dpkg -L bash`"
        rationale: Wrong. -L lists the files the package owns; it does not print the version.
      - id: c
        text: "`apt-cache policy bash`"
        rationale: Correct. policy shows the Installed version alongside the Candidate version from the repositories.
      - id: d
        text: "`dpkg -S bash`"
        rationale: Wrong. -S searches installed file paths containing "bash" and prints each owning package with the path, without versions.
    answer: [a, c]
    explanation: >
      dpkg -s PKG reads dpkg's database and shows Status and Version. apt-cache policy PKG shows
      the Installed version and the Candidate APT would install, which also reveals whether an
      upgrade is available.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Getting Package Information }
    verify:
      command: dpkg -s bash
      expect: { exit_code: 0, stdout_regex: "(?m)^Version: " }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Rationale for option d reworded (YAML colon issue; content unchanged)." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. Verified live on dpkg 1.22.6 / apt 2.8.3." }
    tags: [dpkg, apt-cache]

  - id: 101-102.4-0017
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      `dpkg -i` left a package unconfigured because three dependencies were missing. Using
      `apt-get`, type the complete command (without a package name) that installs the missing
      dependencies and finishes configuring the package.
    fill_in:
      accepted: ['(sudo\s+)?((/usr)?/bin/)?apt-get(\s+(-y|--yes|--assume-yes))*\s+((install(\s+(-y|--yes|--assume-yes))*\s+(-f|--fix-broken|-fy|-yf))|((-f|--fix-broken|-fy|-yf)(\s+(-y|--yes|--assume-yes))*\s+install))(\s+(-y|--yes|--assume-yes))*']
      match: regex
      case_sensitive: true
    explanation: >
      apt-get install -f (--fix-broken) with no package names tries to repair broken dependencies:
      it fetches the missing packages from the repositories and lets dpkg finish configuring the
      half-installed one. apt install -f does the same.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Fixing Broken Dependencies }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: fixed, notes: "Regex extended to accept -y/--yes/--assume-yes anywhere and combined -fy/-yf; still rejects apt-get -f, apt-get install, apt-get install -f pkg, apt install -f." }
    tags: [apt-get, dependencies]

  - id: 101-102.4-0018
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      In a Debian repository, which component holds packages that meet the Debian Free Software
      Guidelines but depend on software that is not in `main`?
    options:
      - id: a
        text: "`contrib`"
        rationale: Correct. contrib is free software that needs something outside main to work.
      - id: b
        text: "`non-free`"
        rationale: Wrong. non-free holds packages that do not meet the DFSG themselves.
      - id: c
        text: "`universe`"
        rationale: Wrong. universe is an Ubuntu component (community-maintained open source), not a Debian one.
      - id: d
        text: "`main`"
        rationale: Wrong. main packages are DFSG-free and do not depend on anything outside main.
    answer: [a]
    explanation: >
      Debian's components are main (free, self-contained), contrib (free but depending on
      software outside main), non-free (not DFSG-free) and, since Debian 12, non-free-firmware. Ubuntu
      uses main, restricted, universe and multiverse.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: The Sources List }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Explanation: contrib depends on software outside main, not only non-free software." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [sources.list, components]

  - id: 101-102.4-0019
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      A vendor sent you `agent_5.0-1_amd64.deb`. Before installing it, you want to see its version,
      maintainer and the packages it depends on. Which command shows this?
    options:
      - id: a
        text: "`dpkg -c agent_5.0-1_amd64.deb`"
        rationale: Wrong. -c lists the files inside the archive, not its control fields.
      - id: b
        text: "`dpkg -s agent_5.0-1_amd64.deb`"
        rationale: Wrong. -s expects the name of an installed package and looks it up in dpkg's database.
      - id: c
        text: "`apt-cache show agent_5.0-1_amd64.deb`"
        rationale: Wrong. Given a bare file name, apt-cache show looks for a package with that name in APT's index and reports that none is found.
      - id: d
        text: "`dpkg -I agent_5.0-1_amd64.deb`"
        rationale: Correct. -I (--info) prints the control information of a .deb file, including Version, Maintainer and Depends.
    answer: [d]
    explanation: >
      dpkg -I FILE (same as dpkg-deb --info) shows a .deb's control fields without installing it.
      Use dpkg -c FILE to see which files it would install.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Getting Package Information }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Rationale for apt-cache show clarified: a bare file name is looked up as a package name (apt-cache show ./file.deb does work)." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. Verified live on dpkg 1.22.6 / apt 2.8.3." }
    tags: [dpkg]

  - id: 101-102.4-0020
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: >
      An administrator runs the command shown in the exhibit. Which **TWO** statements about the
      result are true?
    exhibit: |
      # dpkg -i cowsay_3.03+dfsg2-8_all.deb
      Selecting previously unselected package cowsay.
      (Reading database ... 40122 files and directories currently installed.)
      Preparing to unpack cowsay_3.03+dfsg2-8_all.deb ...
      Unpacking cowsay (3.03+dfsg2-8) ...
      dpkg: dependency problems prevent configuration of cowsay:
       cowsay depends on libtext-charwidth-perl; however:
        Package libtext-charwidth-perl is not installed.

      dpkg: error processing package cowsay (--install):
       dependency problems - leaving unconfigured
      Errors were encountered while processing:
       cowsay
    select_count: 2
    options:
      - id: a
        text: No files from cowsay were written to disk, because the dependency check failed first.
        rationale: Wrong. The output shows "Unpacking cowsay", so its files are on disk; only configuration was skipped.
      - id: b
        text: cowsay is now unpacked but not configured, and `dpkg -l cowsay` shows it as `iU`.
        rationale: Correct. "leaving unconfigured" means the package is in the unpacked state, shown as iU.
      - id: c
        text: dpkg did not try to obtain libtext-charwidth-perl, because it cannot resolve dependencies.
        rationale: Correct. dpkg only reports missing dependencies; fetching them is APT's job.
      - id: d
        text: Running `apt-get update` will install libtext-charwidth-perl and finish configuring cowsay.
        rationale: Wrong. update only refreshes package indexes; apt-get install -f would install the dependency.
    answer: [b, c]
    explanation: >
      dpkg unpacks the package and then refuses to configure it while dependencies are missing,
      leaving it as iU. It never downloads anything. apt-get install -f (or installing the
      dependency and running dpkg --configure cowsay) completes the job.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Dealing with Dependencies }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. Verified live on dpkg 1.22.6 / apt 2.8.3." }
    tags: [dpkg, dependencies, package-state]

  - id: 101-102.4-0021
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      Removing the library alone fails as shown in the exhibit. You then run
      `dpkg -r --force-depends libgeo`. What is the state of the two packages afterwards?
    exhibit: |
      # dpkg -r libgeo
      dpkg: dependency problems prevent removal of libgeo:
       geo-tools depends on libgeo (>= 1.0).

      dpkg: error processing package libgeo (--remove):
       dependency problems - not removing
      Errors were encountered while processing:
       libgeo
    options:
      - id: a
        text: Both libgeo and geo-tools are removed, because dpkg removes dependants automatically
        rationale: Wrong. dpkg only removes the packages named on the command line; removing dependants automatically is something APT does.
      - id: b
        text: libgeo is removed and geo-tools stays installed (ii) with an unmet dependency
        rationale: Correct. dpkg prints "dependency problems, but removing anyway as you requested", removes libgeo and leaves geo-tools as it was.
      - id: c
        text: libgeo stays installed and geo-tools is removed instead
        rationale: Wrong. dpkg never removes a package that was not named; libgeo is the one removed.
      - id: d
        text: libgeo is removed and geo-tools is set back to unpacked (iU) until the dependency returns
        rationale: Wrong. dpkg does not change geo-tools' state; it stays ii, now with a broken dependency.
    answer: [b]
    explanation: >
      --force-depends turns the dependency error into a warning, so dpkg removes libgeo anyway. It
      does not touch geo-tools, which keeps its ii state but now has an unmet dependency; apt-get
      check or apt-get install -f will report or try to repair it. Removing both in one dpkg -r
      run avoids the breakage.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Removing Packages }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: fixed, notes: "Rewritten: stem restated Guided Exercise 3. Now asks for the package states after dpkg -r --force-depends (geo-tools stays ii, verified live). needs re-check" }
    tags: [dpkg, dependencies, remove, force]

  - id: 101-102.4-0022
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      Look at the exhibit. Why does `apt-file` find an owner for `/usr/bin/hello` when `dpkg -S`
      does not?
    exhibit: |
      $ dpkg -S /usr/bin/hello
      dpkg-query: no path found matching pattern /usr/bin/hello
      $ apt-file search /usr/bin/hello
      hello: /usr/bin/hello
      hello-traditional: /usr/bin/hello
    options:
      - id: a
        text: dpkg -S needs root privileges to read the package database, so it found nothing
        rationale: Wrong. Any user can query dpkg's database; the empty result has another cause.
      - id: b
        text: dpkg -S only matches file names, so the full path must be shortened to `hello`
        rationale: Wrong. dpkg -S accepts full paths (and patterns); a full path is the normal usage.
      - id: c
        text: hello is not installed; apt-file also covers packages that are not installed
        rationale: Correct. dpkg -S only knows installed packages, while apt-file uses the repositories' Contents indexes.
      - id: d
        text: The file exists but was created by hand, so dpkg has no record of it
        rationale: Wrong. Nothing in the exhibit shows the file exists, and apt-file answers from the repositories' Contents indexes, not from the local disk, so a hand-made file cannot explain its result.
    answer: [c]
    explanation: >
      dpkg -S searches the file lists of installed packages only. apt-file search uses the Contents
      indexes it downloads with apt-file update, so it also finds files in packages that are not
      installed. Here hello is simply not installed.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Listing Package Contents and Finding Files }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Correct option shortened so it is not the longest." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: fixed, notes: "Option d rationale was false; replaced with a true statement about apt-file using Contents indexes." }
    tags: [apt-file, dpkg-query]

  - id: 101-102.4-0023
    type: fill_in
