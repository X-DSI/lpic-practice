  - id: 101-102.4-0040
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      You have just installed `apt-file`, but `apt-file search libpng16.so` finds nothing and says
      the cache is empty. What must you run first?
    options:
      - id: a
        text: "`apt-get update apt-file`"
        rationale: Wrong. apt-get update takes no package names.
      - id: b
        text: "`dpkg-reconfigure apt-file`"
        rationale: Wrong. Reconfiguring the package does not download any file lists.
      - id: c
        text: "`apt-cache search libpng16.so`"
        rationale: Wrong. This searches names and descriptions; it does not fill apt-file's cache.
      - id: d
        text: "`apt-file update`"
        rationale: Correct. apt-file update (or apt-get update once apt-file is configured) downloads the Contents indexes apt-file searches.
    answer: [d]
    explanation: >
      apt-file searches the Contents indexes (file lists) of repository packages. They must be
      downloaded first with apt-file update; on current systems apt-get update also fetches them
      once apt-file is installed.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Listing Package Contents and Finding Files }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. Verified live on dpkg 1.22.6 / apt 2.8.3." }
    tags: [apt-file]

  - id: 101-102.4-0041
    type: single_choice
    difficulty: 4
    pool: practice
    stem: What does the `apt-cache policy` output in the exhibit tell you?
    exhibit: |
      $ apt-cache policy ca-certificates
      ca-certificates:
        Installed: 20260601~24.04.1
        Candidate: 20260816ubuntu0.24.04.1
        Version table:
           20260816ubuntu0.24.04.1 500
              500 http://archive.ubuntu.com/ubuntu noble-updates/main amd64 Packages
       *** 20260601~24.04.1 100
              100 /var/lib/dpkg/status
           20240203 500
              500 http://archive.ubuntu.com/ubuntu noble/main amd64 Packages
    options:
      - id: a
        text: The package is not installed; 20260816ubuntu0.24.04.1 would be installed
        rationale: Wrong. "Installed:" shows a version, so the package is installed; (none) would mean it is not.
      - id: b
        text: A newer version is available, and an upgrade would install 20260816ubuntu0.24.04.1
        rationale: Correct. The Candidate is newer than the Installed version, so an upgrade is pending.
      - id: c
        text: APT would downgrade the package to 20240203, the version from the release pocket
        rationale: Wrong. The candidate is the highest-priority, highest version, not the original release.
      - id: d
        text: The package is held, because its installed version has priority 100
        rationale: Wrong. Priority 100 is the normal priority of the installed version from /var/lib/dpkg/status; it does not mean held.
    answer: [b]
    explanation: >
      apt-cache policy shows the installed version, the candidate APT would install, and every
      version it knows with its source and priority. *** marks the installed version.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Upgrading Packages }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [apt-cache]

  - id: 101-102.4-0042
    type: multi_choice
    difficulty: 4
    pool: practice
    stem: >
      Which **TWO** dpkg commands work on a `.deb` **file** that has not been installed?
    select_count: 2
    options:
      - id: a
        text: "`dpkg -I app_1.0_all.deb`"
        rationale: Correct. -I shows the archive's control information.
      - id: b
        text: "`dpkg -s app_1.0_all.deb`"
        rationale: Wrong. -s looks up an installed package by name in dpkg's database.
      - id: c
        text: "`dpkg -c app_1.0_all.deb`"
        rationale: Correct. -c lists the files inside the archive.
      - id: d
        text: "`dpkg -L app_1.0_all.deb`"
        rationale: Wrong. -L lists files of an installed package given by name.
    answer: [a, c]
    explanation: >
      -I (--info) and -c (--contents) are passed to dpkg-deb and read the archive itself. -s, -L,
      -l and -S are dpkg-query actions that read the database of installed packages.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Getting Package Information }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [dpkg]

  - id: 101-102.4-0043
    type: fill_in
    difficulty: 5
    pool: practice
    stem: >
      `dpkg -i geo-tools_2.0-1_all.deb` leaves geo-tools unconfigured because `libgeo` is not
      installed. You know the library is provided outside dpkg's control. Type the narrowest `dpkg`
      force option that turns this dependency error into a warning so the package is configured
      anyway.
    fill_in:
      accepted:
        - '--force-depends'
        - '(sudo\s+)?((/usr)?/bin/)?dpkg\s+(-i|--install)\s+--force-depends\s+\S+\.deb'
        - '(sudo\s+)?((/usr)?/bin/)?dpkg\s+--force-depends\s+(-i|--install)\s+\S+\.deb'
      match: regex
      case_sensitive: true
    explanation: >
      dpkg's force options are --force-THING; --force-depends turns dependency problems into
      warnings, so dpkg -i --force-depends prints "dependency problems, but configuring anyway as
      you requested" and the package ends up ii. A bare --force is rejected ("--force option takes
      a value"). dpkg's database still records the unmet dependency, so APT will complain until it
      is satisfied.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Dealing with Dependencies }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: fixed, notes: "Rewritten: stem restated Explorational Exercise 3. Now about dpkg -i --force-depends configuring anyway (verified live, package ends ii); accepted patterns use -i/--install with a .deb. needs re-check" }
    tags: [dpkg, force, dependencies]

  - id: 101-102.4-0044
    type: single_choice
    difficulty: 4
    pool: practice
    stem: >
      `dpkg -S passwd` prints lines from seven different packages, including `grub-common` and
      `vim-runtime`. Why?
    options:
      - id: a
        text: Each of those packages contains its own copy of `/etc/passwd`
        rationale: Wrong. /etc/passwd is not shipped by any of them; the matches are other paths.
      - id: b
        text: dpkg -S also searches packages that are available but not installed
        rationale: Wrong. dpkg -S only searches installed packages.
      - id: c
        text: The argument is a pattern that matches anywhere in installed paths
        rationale: Correct. Without a full path, dpkg -S matches the string anywhere in the installed file paths.
      - id: d
        text: dpkg -S lists every installed package that depends on the passwd package
        rationale: Wrong. dpkg -S searches file paths, not dependencies.
    answer: [c]
    explanation: >
      dpkg -S treats its argument as a pattern. A bare word such as passwd matches any installed
      path containing it (for example grub-mkpasswd-pbkdf2 or chgpasswd.8.gz). Give the full
      path to find the single owner of one file.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Finding Out Which Package Owns a Specific File }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Correct option shortened so it is not the longest." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [dpkg, dpkg-query]

  - id: 101-102.4-0045
    type: single_choice
    difficulty: 5
    pool: practice
    stem: >
      You want to free space in APT's download cache but keep the .deb files that can still be
      downloaded from your repositories. Which command does that?
    options:
      - id: a
        text: "`apt-get autoclean`"
        rationale: Correct. autoclean removes only cached package files that can no longer be downloaded, which are mostly outdated versions.
      - id: b
        text: "`apt-get clean`"
        rationale: Wrong. clean empties the whole cache, including files that are still downloadable.
      - id: c
        text: "`apt-get autoremove`"
        rationale: Wrong. autoremove uninstalls unneeded packages; it does not touch the download cache.
      - id: d
        text: "`apt-get check`"
        rationale: Wrong. check updates the package cache and checks for broken dependencies; it deletes nothing.
    answer: [a]
    explanation: >
      apt-get clean deletes everything in /var/cache/apt/archives. apt-get autoclean only deletes
      package files that are no longer in any repository, so the cache keeps current versions.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: The Local Cache }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. Reviewer suggested difficulty 4; kept at 5 to hold the holdout split. autoclean semantics match the apt-get man page." }
    tags: [apt-get, cache]
