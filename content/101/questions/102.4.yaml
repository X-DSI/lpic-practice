  - id: 101-102.4-0030
    type: multi_choice
    difficulty: 5
    pool: holdout
    stem: >
      You check the integrity of the files installed by the `geo-tools` package with `dpkg -V`.
      Which **TWO** statements about the output in the exhibit are true?
    exhibit: |
      # dpkg -V geo-tools
      ??5?????? c /etc/geo/geo.conf
      missing     /usr/bin/geoconv
    select_count: 2
    options:
      - id: a
        text: The `?` characters mean the file's permissions and owner were changed
        rationale: Wrong. "?" means that check could not be done; dpkg only verifies checksums, so most columns are always "?".
      - id: b
        text: "`/usr/bin/geoconv` exists but dpkg could not compute its checksum"
        rationale: Wrong. "missing" means the file is not on disk at all.
      - id: c
        text: The content of `/etc/geo/geo.conf` no longer matches the checksum recorded for it
        rationale: Correct. A 5 in the third column means the MD5 checksum check failed.
      - id: d
        text: The `c` marks `/etc/geo/geo.conf` as a configuration file of the package
        rationale: Correct. dpkg -V flags conffiles with c, so a changed config file may well be an intended edit.
    answer: [c, d]
    explanation: >
      dpkg -V (--verify) compares installed files with the checksums dpkg recorded. The output uses
      rpm -V's format: "5" = checksum mismatch, "?" = check not performed, "c" = conffile, and
      "missing" for deleted files. Reinstalling the package restores a damaged non-config file.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Getting Package Information }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. Verified live on dpkg 1.22.6 / apt 2.8.3." }
    tags: [dpkg, integrity]

