    stem: >
      On Ubuntu, which **TWO** components hold software that Canonical does **not** officially
      support?
    select_count: 2
    options:
      - id: a
        text: "`main`"
        rationale: Wrong. main is officially supported open-source software.
      - id: b
        text: "`universe`"
        rationale: Correct. universe is open-source software maintained by the community.
      - id: c
        text: "`multiverse`"
        rationale: Correct. multiverse holds unsupported software that is closed-source or legally restricted.
      - id: d
