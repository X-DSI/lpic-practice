        - '(sudo\s+)?((/usr)?/bin/)?apt-cache\s+search\s+(?!-)\S+\s+(-n|--names-only)'
      match: regex
      case_sensitive: true
    explanation: >
      apt-cache search --names-only (-n) PATTERN matches the pattern against package names instead
      of names and long descriptions. Combined with a regular expression such as '^openssh' it
