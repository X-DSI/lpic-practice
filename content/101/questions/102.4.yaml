        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [sources.list]

  - id: 101-102.4-0035
    type: multi_choice
    difficulty: 2
    pool: practice
    stem: Which **TWO** commands list the packages dpkg knows to be installed on the system?
    select_count: 2
    options:
      - id: a
        text: "`dpkg --get-selections`"
        rationale: Correct. It prints every package with its selection state, such as install.
      - id: b
        text: "`dpkg -L`"
        rationale: Wrong. -L needs a package name and lists that package's files.
      - id: c
        text: "`apt-cache pkgnames`"
        rationale: Wrong. pkgnames lists every package name in APT's index, installed or not.
      - id: d
        text: "`dpkg -l`"
        rationale: Correct. Without a pattern it lists the packages in dpkg's database with their state and version.
    answer: [a, d]
    explanation: >
      dpkg -l gives a table with state, version, architecture and description; dpkg
      --get-selections gives a plain "name selection-state" list that can be saved and later fed to
      dpkg --set-selections.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Listing Installed Packages and Package Contents }
    verify:
      command: dpkg --get-selections dpkg
