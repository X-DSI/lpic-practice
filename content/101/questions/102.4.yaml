      - id: b
        text: The list of files that htop installed on this system, with their full paths
        rationale: Wrong. That is dpkg -L htop.
      - id: c
        text: The htop processes that are currently running, with their process IDs
        rationale: Wrong. apt-cache only reads package information; ps or pgrep show processes.
      - id: d
        text: The repositories configured on the system and when they were last refreshed
        rationale: Wrong. show describes one package; it does not report on repositories or refresh times.
    answer: [a]
    explanation: >
      apt-cache show PKG (or apt show PKG) prints the package record from APT's index: Version,
      Depends, Size, checksums, Description and more. It works whether or not the package is
      installed.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Searching for Packages }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Distractors lengthened so the correct option is not the longest." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [apt-cache]

  - id: 101-102.4-0032
    type: single_choice
    difficulty: 1
    pool: practice
    stem: How does the `apt` command relate to `apt-get` and `apt-cache`?
    options:
      - id: a
        text: It is an older front end that apt-get replaced, kept only for compatibility
        rationale: Wrong. apt is the newer tool; apt-get remains available alongside it.
      - id: b
        text: It installs only local .deb files, like dpkg
        rationale: Wrong. apt works with repositories just as apt-get does.
      - id: c
        text: It combines their most common commands in one tool with friendlier output
        rationale: Correct. apt offers install, remove, update, upgrade, search, show and more in one interactive-oriented tool.
      - id: d
        text: It is the low-level tool that apt-get calls to unpack packages
        rationale: Wrong. The low-level tool is dpkg.
    answer: [c]
    explanation: >
      apt bundles the everyday commands of apt-get and apt-cache with progress bars and colour.
      Its output is not guaranteed to stay stable, so scripts should keep using apt-get and
      apt-cache.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.4", lesson: 1, section: Advanced Package Tool (apt) }
    review:
      status: pass2
