  - id: 101-102.1-0021
    type: single_choice
    difficulty: 1
    pool: practice
    stem: >
      A disk is divided into sections, each with its location and size recorded in an MBR or GPT table
      at the beginning of the disk. What is each section called?
    options:
      - id: a
        text: A filesystem
        rationale: Wrong. A filesystem is the structure created inside a section to organize files and directories.
      - id: b
        text: A partition
        rationale: Correct. A partition is a logical division of a disk, described in the partition table.
      - id: c
        text: A volume group
        rationale: Wrong. A volume group is an LVM pool built from one or more physical volumes, not a table entry.
      - id: d
        text: A mount point
        rationale: Wrong. A mount point is a directory where a filesystem is attached.
    answer: [b]
    explanation: >
      Disks are divided into partitions, recorded in a partition table (MBR or GPT). Each partition then
      holds a filesystem, swap, or an LVM physical volume.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.1", lesson: 1, section: Introduction }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: fixed, notes: "Stem reworded (location and size instead of start and end sector)." }
    tags: [partitions]

  - id: 101-102.1-0022
    type: single_choice
    difficulty: 2
    pool: practice
    stem: >
      Which order shows how LVM layers are built, from the block device up to the volume you format
      with a filesystem?
    options:
      - id: a
        text: Logical volume → volume group → physical volume
        rationale: Wrong. This is the stack upside down.
      - id: b
        text: Volume group → physical volume → logical volume
        rationale: Wrong. A volume group is made from physical volumes, so they must come first.
      - id: c
        text: Physical volume → logical volume → volume group
        rationale: Wrong. Logical volumes are carved from a volume group, so the group comes before them.
      - id: d
        text: Physical volume → volume group → logical volume
        rationale: Correct. Block devices become PVs, PVs are pooled into a VG, and LVs are allocated from the VG.
    answer: [d]
    explanation: >
      A partition or disk is initialized as a physical volume, PVs are combined into a volume group,
      and logical volumes are taken from the group. The LV is what gets a filesystem.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.1", lesson: 1, section: LVM }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [lvm]

  - id: 101-102.1-0023
    type: multi_choice
    difficulty: 3
    pool: practice
    stem: >
      A logical volume named `pgsql` is created in the volume group `data`. Which **TWO** paths refer to
      its block device?
    select_count: 2
    options:
      - id: a
        text: "`/dev/pgsql/data`"
        rationale: Wrong. The directory is named after the volume group and the entry after the logical volume, not the other way round.
      - id: b
        text: "`/dev/data/pgsql`"
        rationale: Correct. LVM creates /dev/VGNAME/LVNAME for each active logical volume.
      - id: c
        text: "`/dev/mapper/pgsql-data`"
        rationale: Wrong. Device-mapper names put the volume group first, as VGNAME-LVNAME.
      - id: d
        text: "`/dev/mapper/data-pgsql`"
        rationale: Correct. The device-mapper node is named VGNAME-LVNAME, and /dev/data/pgsql points to the same device.
      - id: e
        text: "`/dev/lvm/data/pgsql`"
        rationale: Wrong. LVM does not create a /dev/lvm directory.
    answer: [b, d]
    explanation: >
      An active LV appears as /dev/VGNAME/LVNAME and as /dev/mapper/VGNAME-LVNAME; both name the same
      device-mapper device. Either can be used with mkfs, mount or /etc/fstab.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.1", lesson: 1, section: LVM }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. LV creation untestable here (no device-mapper); documented behaviour." }
    tags: [lvm, dev-mapper]

  - id: 101-102.1-0024
    type: single_choice
    difficulty: 2
    pool: practice
    stem: >
      You are sizing filesystems for a new Apache web server and need to know where its default document
      root lives. Which directory is it on most distributions?
    options:
      - id: a
        text: "`/srv/www`"
        rationale: Wrong. Some admins choose /srv for served data, but it is not Apache's packaged default on Debian or RHEL.
      - id: b
        text: "`/var/lib/apache2`"
        rationale: Wrong. On Debian this holds Apache's internal state, not web content.
      - id: c
        text: "`/var/www/html`"
        rationale: Correct. Debian, Ubuntu and RHEL-family Apache packages use /var/www/html as the default document root.
      - id: d
        text: "`/home/www`"
        rationale: Wrong. /home is for users' home directories; Apache does not serve from /home/www by default.
    answer: [c]
    explanation: >
      Web content lives under /var by default (/var/www/html), as do database files (/var/lib/mysql).
      That is one reason servers often put /var on a filesystem of its own. Both locations can be changed.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.1", lesson: 1, section: Variable Data (/var) }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [var, apache]

  - id: 101-102.1-0025
    type: single_choice
    difficulty: 2
    pool: practice
    stem: >
      The directory `/srv/data` contains a file `report.txt`. You then mount a new filesystem on
      `/srv/data`. What happens to `report.txt`?
    options:
      - id: a
        text: It is hidden until the filesystem is unmounted, then visible again
        rationale: Correct. The mounted filesystem covers the directory's original contents without changing them.
      - id: b
        text: It is deleted from the parent filesystem as soon as the mount takes place
        rationale: Wrong. Mounting never deletes the files underneath; they stay on the parent filesystem.
      - id: c
        text: It is copied into the newly mounted filesystem
        rationale: Wrong. Mount copies nothing; the new filesystem shows only its own contents.
      - id: d
        text: It is moved into the new filesystem's `lost+found` directory
        rationale: Wrong. lost+found is used by fsck for recovered orphaned files, not by mount.
    answer: [a]
    explanation: >
      A mount point should normally be empty. If it is not, the old files stay on the underlying
      filesystem but cannot be reached through that path while something is mounted over it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.1", lesson: 1, section: Mount Points }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Option b lengthened so the correct option is not the longest." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [mount-point]

  - id: 101-102.1-0026
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      A server with 32 GB of RAM will never hibernate. Following Red Hat's swap sizing guidance for RHEL,
      how much swap should it get?
    options:
      - id: a
        text: At least 64 GB
        rationale: Wrong. Twice RAM is the old rule of thumb, and Red Hat applies 2x only below 2 GB of RAM.
      - id: b
        text: At least 48 GB
        rationale: Wrong. 1.5x RAM is the figure for 8–64 GB of RAM when hibernation is needed.
      - id: c
        text: At least 4 GB
        rationale: Correct. For 8–64 GB of RAM without hibernation, Red Hat recommends at least 4 GB.
      - id: d
        text: At least 32 GB
        rationale: Wrong. Swap equal to RAM is the figure for 2–8 GB of RAM without hibernation.
    answer: [c]
    explanation: >
      Without hibernation, large-memory systems need only modest swap: at least 4 GB from 8 GB of RAM
      upward. Workloads such as databases may need a vendor-specific figure.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.1", lesson: 1, section: Swap }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: fixed, notes: "All options made floors (At least ...) so the key is not the only one phrased differently. RHEL 9/10 swap table checked." }
    tags: [swap, sizing]

  - id: 101-102.1-0027
    type: single_choice
    difficulty: 3
    pool: practice
    stem: Which statement about the EFI System Partition is true?
    options:
      - id: a
        text: It is formatted with ext4
        rationale: Wrong. The ESP uses a FAT filesystem so the firmware can read it.
      - id: b
        text: It is read only by legacy BIOS firmware, never by UEFI firmware
        rationale: Wrong. The ESP exists for UEFI firmware; legacy BIOS boots from code in the MBR instead.
      - id: c
        text: Linux mounts it at `/boot/grub`
        rationale: Wrong. /boot/grub holds GRUB's files; the ESP is mounted elsewhere, commonly at /boot/efi.
      - id: d
        text: It does not have to be the first partition on the disk
        rationale: Correct. It is often first by convention, but the firmware locates it by its partition type.
    answer: [d]
    explanation: >
      The ESP is a FAT partition holding UEFI boot loaders. It is identified by its type (GUID on GPT,
      0xEF on MBR), not by its position, and Linux usually mounts it at /boot/efi.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.1", lesson: 1, section: The EFI System Partition (ESP) }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Option b lengthened so the correct option is not the longest." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [esp]

