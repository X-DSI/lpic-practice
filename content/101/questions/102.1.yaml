  - id: 101-102.1-0030
    type: multi_choice
    difficulty: 4
    pool: practice
    stem: Which **TWO** statements about mount points are true?
    select_count: 2
    options:
      - id: a
        text: Without extra options, `mount` fails when the target directory is missing
        rationale: "Correct. mount reports 'mount point does not exist'. Only with --mkdir (util-linux 2.39+) or X-mount.mkdir does it create the directory first."
      - id: b
        text: A swap partition can be mounted at `/swap` to browse its contents
        rationale: Wrong. Swap has no filesystem to browse; it is activated with swapon, and mount rejects it.
      - id: c
        text: Any existing directory can serve as a mount point, not only those under `/mnt` or `/media`
        rationale: Correct. /mnt and /media are conventions; a filesystem can be mounted on any directory.
      - id: d
        text: Mounting a filesystem on a directory deletes the files already in it
        rationale: Wrong. Existing files are only hidden while the mount is active; they return after unmounting.
      - id: e
        text: Internal disks must be mounted under `/media`
        rationale: Wrong. /media is a convention for removable media; internal disks can be mounted anywhere.
    answer: [a, c]
    explanation: >
      A mount point is just an existing directory. Conventions (/mnt for manual temporary mounts, /media
      for removable media) make administration easier but are not enforced.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.1", lesson: 1, section: Mount Points }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: fixed, notes: "Option a reworded: mount fails without extra options; --mkdir / X-mount.mkdir noted in rationale." }
    tags: [mount-point]
