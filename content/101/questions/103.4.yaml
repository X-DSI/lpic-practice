    tags: [tee, pipe, stderr]

  - id: 101-103.4-0040
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: What is the output of the command below?
    exhibit: |
      $ printf 'a b\nc\n' | xargs -I{} echo "<{}>"
    options:
      - id: a
        text: "`<a>`, `<b>` and `<c>` on three lines"
        rationale: Wrong. With -I, blanks inside a line do not split items; each whole line is one item.
      - id: b
        text: "`<a b>` and `<c>` on two lines"
        rationale: Correct. -I makes xargs run the command once per input line and put the whole line in place of {}.
      - id: c
        text: "`<a b c>` on one line"
        rationale: Wrong. -I never combines several lines into one command.
      - id: d
        text: "`<{}>` twice, because the braces are quoted"
        rationale: Wrong. The double quotes are removed by the shell; xargs still sees {} and replaces it.
    answer: [b]
    explanation: >
      `-I replace-str` implies one command per input line and treats the line, blanks included, as
      a single item that replaces every occurrence of the string.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Command Substitution }
    verify:
      command: printf 'a b\nc\n' | xargs -I{} echo "<{}>"
      expect: { exit_code: 0, stdout_contains: "<a b>" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [xargs]

  # ---------------------------------------------------------------- practice (study mode)

  - id: 101-103.4-0041
    type: single_choice
    difficulty: 1
    pool: practice
    stem: In an interactive shell, where does a command read its standard input from when nothing is redirected?
    options:
      - id: a
        text: The keyboard (terminal)
        rationale: Correct. Without redirection, stdin is attached to the terminal, so input comes from the keyboard.
      - id: b
        text: The file `/dev/null`
        rationale: Wrong. /dev/null is only used when you redirect to or from it.
      - id: c
        text: The previous command's output
        rationale: Wrong. That only happens when a pipe connects the commands.
      - id: d
        text: The user's `~/.bash_history` file
        rationale: Wrong. That file stores command history; it is not anyone's stdin.
    answer: [a]
    explanation: >
      In a terminal session, stdin is the keyboard and both stdout and stderr are the screen.
      Redirections and pipes change these defaults for one command.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Introduction }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [stdin]

  - id: 101-103.4-0042
    type: single_choice
    difficulty: 1
    pool: practice
    stem: Which standard stream uses file descriptor 1?
    options:
      - id: a
        text: Standard input
        rationale: Wrong. Standard input is descriptor 0.
      - id: b
        text: Standard error
        rationale: Wrong. Standard error is descriptor 2.
      - id: c
        text: Standard output
        rationale: Correct. Standard output is descriptor 1, the default for >.
      - id: d
        text: The terminal's control channel
        rationale: Wrong. There is no such default descriptor; 0, 1 and 2 are the three standard streams.
    answer: [c]
    explanation: >
      0 is stdin, 1 is stdout and 2 is stderr. > without a number means 1>.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Introduction }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [file-descriptors]

  - id: 101-103.4-0043
    type: single_choice
    difficulty: 1
    pool: practice
    stem: Which path refers to the standard error of the process that opens it?
    options:
      - id: a
        text: "`/dev/tty0`"
        rationale: Wrong. This is the first virtual console device, not a per-process stream.
      - id: b
        text: "`/dev/stderr`"
        rationale: Correct. /dev/stderr is a link to /proc/self/fd/2.
      - id: c
        text: "`/var/log/stderr`"
        rationale: Wrong. No such standard file exists; stderr is not a log file.
      - id: d
        text: "`/proc/stderr`"
        rationale: Wrong. Per-process descriptors live under /proc/self/fd/ or /proc/PID/fd/.
    answer: [b]
    explanation: >
      /dev/stdin, /dev/stdout and /dev/stderr are symbolic links to /proc/self/fd/0, 1 and 2, so
      programs can name the standard streams as file paths.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Introduction }
    verify:
      command: readlink /dev/stderr
      expect: { exit_code: 0, stdout_contains: "/proc/self/fd/2" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [dev-stderr]

  - id: 101-103.4-0044
    type: single_choice
    difficulty: 2
    pool: practice
    stem: In Bash, what does `make &> build.log` do?
    options:
      - id: a
        text: Runs `make` in the background and creates an empty `build.log`
        rationale: Wrong. That would be `make & > build.log`, with a space after the &.
      - id: b
        text: Saves only the error messages of `make` in `build.log`
        rationale: Wrong. That is 2>; &> covers both streams.
      - id: c
        text: Writes both standard output and standard error of `make` to `build.log`
        rationale: Correct. &> redirects stdout and stderr to the same file.
      - id: d
        text: Appends the output of `make` to `build.log`
        rationale: Wrong. &> truncates the file; appending both streams is &>>.
    answer: [c]
    explanation: >
      &> (also written >&) sends both streams to one file. The & must be attached to >; with a
      space before it, Bash reads & as "run in the background".
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [redirection, stderr]

  - id: 101-103.4-0045
    type: single_choice
    difficulty: 2
    pool: practice
    stem: Which command creates a directory named like `logs-2026-10-25`, using today's date?
    options:
      - id: a
        text: "`mkdir logs-'date +%F'`"
        rationale: Wrong. Single quotes keep the text literal, so the name contains "date +%F".
      - id: b
        text: "`mkdir logs- | date +%F`"
        rationale: Wrong. This creates "logs-" and pipes nothing useful to date.
      - id: c
        text: "`mkdir logs-${date +%F}`"
        rationale: Wrong. ${ } is parameter expansion and fails with "bad substitution".
      - id: d
        text: "`mkdir logs-$(date +%F)`"
        rationale: Correct. The substitution is replaced by the date, giving one argument such as logs-2026-10-25.
    answer: [d]
    explanation: >
      Command substitution can form part of a word. `date +%F` prints the date as YYYY-MM-DD.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Command Substitution }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [command-substitution]

  - id: 101-103.4-0046
    type: single_choice
    difficulty: 2
    pool: practice
    stem: In `find /tmp -name '*.bak' | xargs rm`, what is the job of `xargs`?
    options:
      - id: a
        text: It turns the file names arriving on its stdin into arguments for `rm`
        rationale: Correct. rm ignores stdin, so xargs places the names on rm's command line.
      - id: b
        text: It asks for confirmation before each file is removed
        rationale: Wrong. That is xargs -p or rm -i; plain xargs does not prompt.
      - id: c
        text: It filters out the names that do not end in `.bak`
        rationale: Wrong. find already selected the names; xargs does no filtering.
      - id: d
        text: It sends rm's error messages back to find
        rationale: Wrong. Data in a pipeline flows only left to right.
    answer: [a]
    explanation: >
      Many commands, such as rm, take file names as arguments and never read stdin. xargs bridges
      that gap by reading the list and running the command with it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Command Substitution }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [xargs]

  - id: 101-103.4-0047
    type: fill_in
