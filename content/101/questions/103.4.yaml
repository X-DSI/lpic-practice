# 103.4 Use streams, pipes and redirects — weight 4 → 40 holdout + 20 practice.
# Original questions written from LPI Learning Materials 101-500, objective 103.4, lessons 1 and 2.
schema_version: 1
exam: "101"
objective: "103.4"
questions:
  # ---------------------------------------------------------------- holdout (mock exams only)

  - id: 101-103.4-0001
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: Which file descriptor number does a Linux process use for its standard error stream?
    options:
      - id: a
        text: "0"
        rationale: Wrong. File descriptor 0 is standard input.
      - id: b
        text: "1"
        rationale: Wrong. File descriptor 1 is standard output.
      - id: c
        text: "2"
        rationale: Correct. Standard error is file descriptor 2, which is why 2> redirects error messages.
      - id: d
        text: "3"
        rationale: Wrong. Descriptors 3 and above are not opened by default; programs use them for extra files.
    answer: [c]
    explanation: >
      Every process starts with three open descriptors: 0 (stdin), 1 (stdout) and 2 (stderr). The
      numbers are what you write in front of a redirection operator, as in 2>errors.log.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Introduction }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [file-descriptors, stderr]

  - id: 101-103.4-0002
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      You want each run of a nightly script to add its output to the end of `history.log`, keeping
      what earlier runs wrote. Which operator do you use after the script name?
    options:
      - id: a
        text: "`>>`"
        rationale: Correct. >> opens the file for appending and creates it if it does not exist.
      - id: b
        text: "`>`"
        rationale: Wrong. > truncates the file first, so earlier runs' output would be lost.
      - id: c
        text: "`<<`"
        rationale: Wrong. << starts a here document, which feeds typed text to standard input.
      - id: d
        text: "`|`"
        rationale: Wrong. A pipe sends output to another command, not to a file.
    answer: [a]
    explanation: >
      `script >> history.log` appends standard output to the file. A single > would empty the file
      on every run before writing.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [redirection, append]

  - id: 101-103.4-0003
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: In the command line `dmesg | less`, what does the `|` character do?
    options:
      - id: a
        text: It runs `less` only if `dmesg` exits successfully
        rationale: Wrong. That is the && operator; a pipe does not depend on exit status.
      - id: b
        text: It writes the output of `dmesg` to a file named `less`
        rationale: Wrong. Writing to a file is done with >; the target of a pipe is a command.
      - id: c
        text: It runs `dmesg` and `less` one after the other with no connection between them
        rationale: Wrong. That is what ; does. A pipe connects the two commands.
      - id: d
        text: It connects the standard output of `dmesg` to the standard input of `less`
        rationale: Correct. The pipe feeds whatever dmesg writes to stdout into less's stdin.
    answer: [d]
    explanation: >
      A pipe joins two processes: the left command's standard output becomes the right command's
      standard input. Data flows left to right and the target is always another command.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Pipes }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [pipe]

  - id: 101-103.4-0004
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: Which command copies the data it reads on standard input both to standard output and to one or more files?
    options:
      - id: a
        text: "`xargs`"
        rationale: Wrong. xargs turns its input into arguments for another command.
      - id: b
        text: "`tee`"
        rationale: Correct. tee writes its input to stdout and to every file named on its command line.
      - id: c
        text: "`cat`"
        rationale: Wrong. cat copies input or files to standard output only; it does not also write to a file.
      - id: d
        text: "`split`"
        rationale: Wrong. split cuts its input into pieces stored in several files and prints nothing.
    answer: [b]
    explanation: >
      tee is named after a T-shaped pipe fitting: data goes in once and comes out twice, on the
      screen (or the next command) and in the named files.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Pipes }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [tee]

  - id: 101-103.4-0005
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: Which redirection operator makes a command read its standard input from a file?
    options:
      - id: a
        text: "`>`"
        rationale: Wrong. > sends standard output to a file.
      - id: b
        text: "`<`"
        rationale: Correct. `command < file` connects the file to the command's stdin.
      - id: c
        text: "`2>`"
        rationale: Wrong. 2> sends standard error to a file.
      - id: d
        text: "`&>`"
        rationale: Wrong. &> sends both standard output and standard error to a file.
    answer: [b]
    explanation: >
      With <, data flows from the file on the right into the command on the left, as in
      `wc -l < users.txt`. Without a number in front it applies to file descriptor 0.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [redirection, stdin]

  - id: 101-103.4-0006
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: To throw away output you never want to see, you redirect it to which file?
    options:
      - id: a
        text: "`/dev/null`"
        rationale: Correct. Anything written to /dev/null is discarded, and any user may write to it.
      - id: b
        text: "`/dev/zero`"
        rationale: Wrong. /dev/zero is mostly used as a source of zero bytes when read.
      - id: c
        text: "`/dev/stdout`"
        rationale: Wrong. This refers to the process's own standard output, so the data would still appear.
      - id: d
        text: "`/tmp/null`"
        rationale: Wrong. This is just an ordinary file name; the data would be stored there.
    answer: [a]
    explanation: >
      /dev/null is a character device that accepts writes and keeps nothing. `cmd 2>/dev/null`
      is the usual way to hide error messages.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [dev-null]

  - id: 101-103.4-0007
    type: multi_choice
    difficulty: 2
    pool: holdout
    stem: >
      `ls /etc/hosts /nonexistent` prints one listing and one error message. Which **TWO** commands
      still show the listing on the terminal but keep the error message off it?
    select_count: 2
    options:
      - id: a
        text: "`ls /etc/hosts /nonexistent 2>/dev/null`"
        rationale: Correct. Only stderr is sent to /dev/null; stdout still reaches the terminal.
      - id: b
        text: "`ls /etc/hosts /nonexistent >/dev/null`"
        rationale: Wrong. This discards the listing (stdout) and leaves the error on the screen.
      - id: c
        text: "`ls /etc/hosts /nonexistent 2>ls-errors.txt`"
        rationale: Correct. stderr goes into the file, so only the listing appears on screen.
      - id: d
        text: "`ls /etc/hosts /nonexistent &>/dev/null`"
        rationale: Wrong. Both streams are discarded, so the listing disappears too.
      - id: e
        text: "`ls /etc/hosts /nonexistent 1>&2`"
        rationale: Wrong. stdout is sent where stderr goes, so both still appear on the terminal.
    answer: [a, c]
    explanation: >
      Error messages travel on file descriptor 2. Redirecting only that descriptor, to /dev/null or
      to a file, removes them from the terminal while descriptor 1 still prints the listing.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [stderr, dev-null]

  - id: 101-103.4-0008
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      A search over the whole filesystem prints many "Permission denied" messages. You want those
      messages saved in `denied.txt` so you can check them later, while the found paths still print
      on screen. Which command does that?
    options:
      - id: a
        text: "`find / -name '*.conf' > denied.txt`"
        rationale: Wrong. This saves the found paths and leaves the error messages on screen.
      - id: b
        text: "`find / -name '*.conf' < denied.txt`"
        rationale: Wrong. < feeds the file to find's stdin; it does not capture anything.
      - id: c
        text: "`find / -name '*.conf' 2> denied.txt`"
        rationale: Correct. 2> sends only standard error, where find writes its errors, to the file.
      - id: d
        text: "`find / -name '*.conf' | tee denied.txt`"
        rationale: Wrong. A pipe carries only stdout, so the file gets the paths and not the errors.
    answer: [c]
    explanation: >
      find writes results to stdout and complaints to stderr. Prefixing > with the descriptor number
      2 redirects just the complaints.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [stderr, redirection]

  - id: 101-103.4-0009
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      You start typing `cat <<STOP > notes.txt` at a Bash prompt and then enter several lines of
      text. What ends the input?
    options:
      - id: a
        text: A line that contains only the word `STOP`
        rationale: Correct. The here document ends at a line holding nothing but the delimiter.
      - id: b
        text: Any line in which the word `STOP` appears
        rationale: Wrong. STOP inside a longer line is ordinary text; the line must hold only the delimiter.
      - id: c
        text: An empty line
        rationale: Wrong. Empty lines are kept as part of the document.
      - id: d
        text: The text `EOF` on a line by itself
        rationale: Wrong. EOF is only a common choice of delimiter; here the delimiter is STOP.
    answer: [a]
    explanation: >
      The word after << is the delimiter. Bash collects lines until one consists of exactly that
      word, then hands the collected text to the command's standard input.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Here Document and Here String }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [here-document]

  - id: 101-103.4-0010
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: In a Bash script, which line stores the kernel release printed by `uname -r` in the variable `KREL`?
    options:
      - id: a
        text: "`KREL=uname -r`"
        rationale: Wrong. Bash sets KREL=uname for one command and then tries to run a command named -r.
      - id: b
        text: "`KREL=$(uname -r)`"
        rationale: Correct. $( ) runs the command and replaces itself with the command's standard output.
      - id: c
        text: "`KREL=${uname -r}`"
        rationale: Wrong. ${ } is parameter expansion; this is a "bad substitution" error in Bash.
      - id: d
        text: "`KREL='uname -r'`"
        rationale: Wrong. Single quotes store the literal text "uname -r", not its output.
    answer: [b]
    explanation: >
      Command substitution, written $(command) or with backquotes, is replaced by the command's
      output, so it can be assigned to a variable or used as an argument.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Command Substitution }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [command-substitution]

  - id: 101-103.4-0011
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      A file holds one package name per line. Which utility reads such a list on standard input and
      runs another command with the names as its arguments?
    options:
      - id: a
        text: "`tee`"
        rationale: Wrong. tee copies its input to stdout and files; it runs no commands.
      - id: b
        text: "`exec`"
        rationale: Wrong. exec replaces the shell with a command or changes the shell's own redirections.
      - id: c
        text: "`env`"
        rationale: Wrong. env runs a command in a modified environment; it does not read arguments from stdin.
      - id: d
        text: "`xargs`"
        rationale: Correct. xargs builds command lines from the items it reads on stdin and runs them.
    answer: [d]
    explanation: >
      `xargs cmd < list` (or `cat list | xargs cmd`) appends the items read from standard input to
      cmd's arguments and runs it, so output of one program becomes arguments of another.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Command Substitution }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [xargs]

  - id: 101-103.4-0012
    type: fill_in
    difficulty: 2
    pool: holdout
    stem: >
      Type a command that makes the current Bash session refuse to overwrite existing files with
      the `>` redirection.
    fill_in:
      accepted: ['set\s+(-C|-o\s+noclobber)']
      match: regex
      case_sensitive: true
    explanation: >
      `set -o noclobber` (short form `set -C`) turns on noclobber. After that, > into an existing
      file fails with "cannot overwrite existing file". `set +o noclobber` or `set +C` turns it off.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [noclobber, set]

  - id: 101-103.4-0013
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: What does the command `grep -c error <<< "$LINE"` give to `grep`?
    options:
      - id: a
        text: The value of the variable `LINE` on its standard input
        rationale: Correct. <<< is a here string; the expanded word is fed to stdin, followed by a newline.
      - id: b
        text: The contents of the file whose name is stored in `LINE`
        rationale: Wrong. That would need < "$LINE"; a here string passes the text itself.
      - id: c
        text: The value of `LINE` as an extra command-line argument
        rationale: Wrong. The text goes to standard input, not to grep's argument list.
      - id: d
        text: Lines typed at the keyboard until one equals the value of `LINE`
        rationale: Wrong. That describes a here document (<<), not a here string.
    answer: [a]
    explanation: >
      A here string (<<<) sends one word, after expansion, to the command's standard input. Quote
      it when it may contain spaces so it stays one word.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Here Document and Here String }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [here-string]

  - id: 101-103.4-0014
    type: multi_choice
    difficulty: 1
    pool: holdout
    stem: >
      Which **TWO** commands write the standard output of `date` to `now.txt`, replacing anything
      already in the file?
    select_count: 2
    options:
      - id: a
        text: "`date >> now.txt`"
        rationale: Wrong. >> appends; the old content is kept.
      - id: b
        text: "`date > now.txt`"
        rationale: Correct. > redirects stdout and truncates the file first.
      - id: c
        text: "`date 2> now.txt`"
        rationale: Wrong. 2> captures standard error; date's normal output still goes to the screen.
      - id: d
        text: "`date 1> now.txt`"
        rationale: Correct. 1> names stdout explicitly and behaves exactly like >.
      - id: e
        text: "`date < now.txt`"
        rationale: Wrong. < feeds the file to date's stdin and writes nothing to it.
    answer: [b, d]
    explanation: >
      When no descriptor number is written before >, Bash uses 1 (stdout). So > and 1> are the same
      operation and both truncate the target before writing.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [redirection, stdout]

  - id: 101-103.4-0015
    type: fill_in
    difficulty: 2
    pool: holdout
    stem: >
      Type the redirection that, placed after a command, sends its standard error to wherever its
      standard output is currently going.
    fill_in:
      accepted: ['2>&\s*1']
      match: regex
      case_sensitive: true
    explanation: >
      `2>&1` makes descriptor 2 a copy of descriptor 1. The & tells Bash that 1 is a file
      descriptor; without it, `2>1` would write errors to a file named 1.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [stderr, fd-duplication]

  - id: 101-103.4-0016
    type: multi_choice
    difficulty: 2
    pool: holdout
    stem: >
      Which **TWO** commands create a directory whose name is the output of `hostname`?
    select_count: 2
    options:
      - id: a
        text: "`mkdir $(hostname)`"
        rationale: Correct. $( ) is replaced by the output of hostname before mkdir runs.
      - id: b
        text: "`mkdir 'hostname'`"
        rationale: Wrong. Single quotes make this the literal name "hostname".
      - id: c
        text: "`mkdir | hostname`"
        rationale: Wrong. This pipes mkdir's (empty) output to hostname; mkdir fails with a missing operand.
      - id: d
        text: "`` mkdir `hostname` ``"
        rationale: Correct. Backquotes are the older form of command substitution.
      - id: e
        text: "`mkdir < hostname`"
        rationale: Wrong. This tries to read a file named hostname as stdin; mkdir ignores stdin anyway.
    answer: [a, d]
    explanation: >
      Command substitution has two forms, $(command) and `command`. Both are replaced by the
      command's standard output, which then becomes an argument of the outer command.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Command Substitution }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [command-substitution]

  - id: 101-103.4-0017
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: What does the following pipeline print?
    exhibit: |
      $ printf 'red\ngreen\nblue\n' | xargs
    options:
      - id: a
        text: Nothing, because no command was given to `xargs`
        rationale: Wrong. With no command, xargs runs a default command rather than doing nothing.
      - id: b
        text: "`red`, `green` and `blue` on three separate lines"
        rationale: Wrong. The default command receives all three words as arguments of one call.
      - id: c
        text: "`red green blue` on a single line"
        rationale: Correct. Without a command xargs runs echo, which prints its arguments on one line.
      - id: d
        text: An error saying `xargs` needs a command name
        rationale: Wrong. A command is optional; xargs falls back to echo.
    answer: [c]
    explanation: >
      When xargs is given no command it uses echo. All input items fit in one command line, so a
      single `echo red green blue` runs.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Command Substitution }
    verify:
      command: printf 'red\ngreen\nblue\n' | xargs
      expect: { exit_code: 0, stdout_contains: "red green blue" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [xargs]

  - id: 101-103.4-0018
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: Which option, placed in the blank, produces the output shown?
    exhibit: |
      $ echo jan feb mar apr may | xargs ____ echo
      jan feb
      mar apr
      may
    options:
      - id: a
        text: "`-L 2`"
        rationale: Wrong. -L counts input lines; the input is one line, so a single echo prints all five words.
      - id: b
        text: "`-n 2`"
        rationale: Correct. -n 2 passes at most two arguments to each run of echo.
      - id: c
        text: "`-P 2`"
        rationale: Wrong. -P sets how many commands run in parallel, not how many arguments each gets.
      - id: d
        text: "`-I 2`"
        rationale: Wrong. -I sets a replacement string; echo has no "2" to replace, so one blank line is printed.
    answer: [b]
    explanation: >
      `-n N` (--max-args) limits the number of arguments per command line, so the five words are
      handed out two at a time. -L limits by input lines instead, which differs when a line holds
      several words.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Command Substitution }
    verify:
      command: echo jan feb mar apr may | xargs -n 2 echo | head -n 1
      expect: { exit_code: 0, stdout_regex: "^jan feb\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [xargs]

  - id: 101-103.4-0019
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      `find /data -type f -print0` separates file names with null characters. Type the `xargs`
      option that tells `xargs` to split its input on null characters.
    fill_in:
      accepted: ['(xargs\s+)?(-0|--null)']
      match: regex
      case_sensitive: true
    explanation: >
      `xargs -0` (long form --null) treats the null character as the only separator, so names with
      spaces, quotes or newlines are passed through intact. It pairs with find's -print0.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Command Substitution }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [xargs, find, print0]

  - id: 101-103.4-0020
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      `tee` normally truncates the files it writes to. Type the `tee` option that makes it add to
      the end of the files instead.
    fill_in:
      accepted: ['(tee\s+)?(-a|--append)']
      match: regex
      case_sensitive: true
