    tags: [command-substitution, word-splitting]

  - id: 101-103.4-0055
    type: single_choice
    difficulty: 4
    pool: practice
    stem: >
      With GNU `xargs`, `grep -l TODO *.c | xargs wc -l` misbehaves when no file matches: `wc`
      runs anyway and prints a meaningless `0`. Which option stops `xargs` from running the
      command when its input is empty?
    options:
      - id: a
        text: "`-t`"
        rationale: Wrong. -t prints each command line to stderr before running it.
      - id: b
        text: "`-r`"
        rationale: Correct. -r (--no-run-if-empty) skips the command when there is no input.
      - id: c
        text: "`-p`"
        rationale: Wrong. -p asks for confirmation before each run; it still runs with empty input if you agree.
      - id: d
        text: "`-x`"
        rationale: Wrong. -x makes xargs exit if a command line would exceed the size limit.
    answer: [b]
    explanation: >
      GNU xargs runs the command once even with empty input, unless -r / --no-run-if-empty is
      given. Without arguments, wc then counts its stdin, which GNU xargs connects to /dev/null.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Command Substitution }
    verify:
      command: printf '' | xargs -r echo RAN; echo end
      expect: { stdout_regex: "^end\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Stem fixed: GNU xargs gives the child /dev/null as stdin, so wc prints 0 instead of waiting for input." }
    tags: [xargs]

  - id: 101-103.4-0056
    type: multi_choice
    difficulty: 4
    pool: practice
    stem: Which **TWO** command lines leave the output of `uptime` in both `a.log` and `b.log`?
    select_count: 2
    options:
      - id: a
        text: "`uptime | tee a.log b.log`"
        rationale: Correct. tee writes its input to every file named, and also to stdout.
      - id: b
        text: "`uptime > a.log > b.log`"
        rationale: Wrong. stdout is moved to b.log by the second redirection; a.log is left empty.
      - id: c
        text: "`uptime | tee a.log > b.log`"
        rationale: Correct. tee writes a.log, and its stdout copy is redirected into b.log.
      - id: d
        text: "`uptime | tee a.log | b.log`"
        rationale: Wrong. b.log is not a command, so the last stage fails with "command not found".
      - id: e
        text: "`uptime > a.log | tee b.log`"
        rationale: Wrong. stdout is already sent to a.log, so nothing goes through the pipe and b.log is empty.
    answer: [a, c]
    explanation: >
      One output stream can have only one destination. tee is the tool that duplicates it, either
      into several files or into a file plus its own standard output.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Pipes }
    verify:
      command: >
        bash -c 'cd "$(mktemp -d)"; echo up | tee a.log > b.log; [ -s a.log ] && [ -s b.log ] && echo both'
      expect: { stdout_contains: "both" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "verify uses echo instead of uptime (procps is not in debian:stable-slim)." }
    tags: [tee, redirection]

  - id: 101-103.4-0057
    type: single_choice
    difficulty: 4
    pool: practice
    stem: What does the Bash command line `> app.log` (with no command before it) do?
    options:
      - id: a
        text: It prints the contents of `app.log`
        rationale: Wrong. Nothing is read; > opens the file for writing.
      - id: b
        text: It waits for keyboard input and writes it into `app.log`
        rationale: Wrong. No command runs, so nothing reads the keyboard.
      - id: c
        text: It is a syntax error, because a redirection needs a command
        rationale: Wrong. Bash accepts a redirection on its own.
      - id: d
        text: It empties `app.log`, or creates it empty if it does not exist
        rationale: Correct. The redirection opens and truncates the file, and no command writes anything.
    answer: [d]
    explanation: >
      An output redirection truncates its target as soon as it is set up, even if no command runs.
      This is a quick way to empty a log file without deleting it (noclobber would block it).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    verify:
      command: bash -c 'cd /tmp; echo data > a57.log; > a57.log; wc -c < a57.log'
      expect: { stdout_regex: "^0\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [redirection, truncation]

  - id: 101-103.4-0058
    type: single_choice
    difficulty: 5
    pool: practice
    stem: >
      A function prints `out` on standard output and then `err` on standard error. What does
      `run.txt` contain after the command below?
    exhibit: |
      $ myfunc > run.txt 2> run.txt
    options:
      - id: a
        text: "`out` followed by `err`"
        rationale: Wrong. That needs one shared open file, as with > run.txt 2>&1.
      - id: b
        text: Only `out`
        rationale: Wrong. stderr was written to the file too, at the same starting position.
      - id: c
        text: Only `err`, written over `out`
        rationale: Correct. Each redirection opens the file separately at offset 0, so the later write overwrites the earlier one.
      - id: d
        text: Nothing; Bash refuses to redirect two streams to one file
        rationale: Wrong. Bash allows it; the two descriptors simply do not share a file position.
    answer: [c]
    explanation: >
      `> f 2> f` opens the file twice, each descriptor with its own offset. Writes clobber each
      other. Use `> f 2>&1` or `&> f` so both streams share one open file.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    verify:
      command: bash -c 'cd /tmp; f(){ echo out; echo err >&2; }; f > r58.txt 2> r58.txt; cat r58.txt'
      expect: { stdout_regex: "^err\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [redirection, stderr]

  - id: 101-103.4-0059
    type: multi_choice
    difficulty: 5
    pool: practice
    stem: >
      `list.txt` holds one path per line; some paths contain spaces, none contain newlines. Which
      **TWO** commands copy every listed file into `/srv/backup/`?
    select_count: 2
    options:
      - id: a
        text: "`xargs cp -t /srv/backup/ < list.txt`"
        rationale: Wrong. Default parsing splits on spaces, so a path like "my file" becomes two names.
      - id: b
        text: "`tr '\\n' '\\0' < list.txt | xargs -0 cp -t /srv/backup/`"
        rationale: Correct. Newlines become nulls, and xargs -0 splits only on nulls.
      - id: c
        text: "`cat list.txt | xargs -0 cp -t /srv/backup/`"
        rationale: Wrong. The input has no nulls, so the whole list, newlines included, becomes one name.
      - id: d
        text: "`xargs -d '\\n' cp -t /srv/backup/ < list.txt`"
        rationale: Correct. GNU xargs -d sets newline as the only delimiter, so spaces are kept.
      - id: e
        text: "`xargs cp /srv/backup/ < list.txt`"
        rationale: Wrong. The names are appended after /srv/backup/, so cp uses the last name as the target; spaces also split names.
    answer: [b, d]
    explanation: >
      Plain xargs splits on blanks and newlines. Either convert the list to null-separated form and
      use -0, or use GNU xargs -d '\n'. cp -t names the destination first, so the appended names
      are all sources.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Command Substitution }
    verify:
      command: >
        bash -c 'd=$(mktemp -d); mkdir "$d/dst"; touch "$d/my file" "$d/b";
        printf "%s\n" "$d/my file" "$d/b" > "$d/list";
        xargs -d "\n" cp -t "$d/dst/" < "$d/list"; ls "$d/dst" | wc -l'
      expect: { exit_code: 0, stdout_contains: "2" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [xargs, tr]

  - id: 101-103.4-0060
    type: fill_in
    difficulty: 5
    pool: practice
    stem: >
      Type the redirection(s) that, written after `cmd`, **append** both its standard output and
      its standard error to `run.log`.
    fill_in:
      accepted: ['(cmd\s+)?(&>>\s*run\.log|1?>>\s*run\.log\s+2>&\s*1)']
      match: regex
      case_sensitive: true
    explanation: >
      `>> run.log 2>&1` appends stdout and then makes stderr share it; Bash also has the shorthand
      `&>> run.log`. The order matters: `2>&1 >> run.log` would leave stderr on the terminal.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [redirection, append, stderr]
