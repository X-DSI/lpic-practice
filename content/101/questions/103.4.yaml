  - id: 101-103.4-0021
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: >
      A program `sync-job` reports problems on standard output or standard error, depending on the
      problem. In Bash, which **TWO** command lines make `grep` search **both** streams for `fail`?
    select_count: 2
    options:
      - id: a
        text: "`sync-job | grep fail 2>&1`"
        rationale: Wrong. Here 2>&1 applies to grep, not to sync-job, so sync-job's stderr bypasses the pipe.
      - id: b
        text: "`sync-job 2>&1 | grep fail`"
        rationale: Correct. sync-job's stderr is joined to its stdout before the pipe carries both to grep.
      - id: c
        text: "`sync-job |& grep fail`"
        rationale: Correct. In Bash, |& is shorthand for 2>&1 followed by a pipe.
      - id: d
        text: "`sync-job 2> grep fail`"
        rationale: Wrong. This writes stderr to a file named grep and passes "fail" as an argument to sync-job.
      - id: e
        text: "`sync-job 2>&1 > grep`"
        rationale: Wrong. This writes stdout to a file named grep; no grep command runs.
    answer: [b, c]
    explanation: >
      A pipe carries only standard output. To search error messages as well, copy stderr onto stdout
      with 2>&1 before the |, or use Bash's |& operator, which does the same.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Pipes }
    verify:
      command: >
        bash -c 'j(){ echo fail-out; echo fail-err >&2; };
        a=$(j 2>&1 | grep -c fail); b=$(j |& grep -c fail); echo "$a$b"'
      expect: { exit_code: 0, stdout_contains: "22" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [pipe, stderr]

  - id: 101-103.4-0022
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: Which command is equivalent to `sort < names.txt`?
    options:
      - id: a
        text: "`sort << names.txt`"
        rationale: Wrong. This starts a here document whose delimiter is the word names.txt.
      - id: b
        text: "`sort <<< names.txt`"
        rationale: Wrong. This sorts the literal text "names.txt", not the file's contents.
      - id: c
        text: "`sort 0< names.txt`"
        rationale: Correct. < without a number applies to descriptor 0, so 0< is the same redirection.
      - id: d
        text: "`sort 2< names.txt`"
        rationale: Wrong. This opens the file on descriptor 2; sort still reads its stdin, which is unchanged.
    answer: [c]
    explanation: >
      An input redirection defaults to file descriptor 0 (standard input) when no number is written,
      so `< file` and `0< file` are identical.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [redirection, stdin, file-descriptors]

  - id: 101-103.4-0023
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      After `set -o noclobber`, the file `audit.log` already exists. Which command can still write
      to it?
    options:
      - id: a
        text: "`echo done > audit.log`"
        rationale: Wrong. noclobber blocks > on an existing regular file.
      - id: b
        text: "`echo done 1> audit.log`"
        rationale: Wrong. 1> is the same as > and is blocked the same way.
      - id: c
        text: "`echo done &> audit.log`"
        rationale: Wrong. &> also truncates the target, so noclobber refuses it.
      - id: d
        text: "`echo done >> audit.log`"
        rationale: Correct. Appending does not overwrite existing data, so noclobber allows it.
    answer: [d]
    explanation: >
      noclobber only prevents redirections that would truncate an existing file. Appending with >>
      keeps the old contents and is still allowed.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    verify:
      command: >
        bash -c 'cd /tmp; rm -f nc.t; set -C; echo a > nc.t; echo b >> nc.t;
        echo c &> nc.t 2>/dev/null; wc -l < nc.t'
      expect: { exit_code: 0, stdout_contains: "2" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [noclobber, append]

  - id: 101-103.4-0024
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: What does `3<>state.db` on a command line do for the command being started?
    options:
      - id: a
        text: Opens `state.db` on file descriptor 3 for both reading and writing
        rationale: Correct. <> opens the file read-write, and the 3 picks the descriptor number.
      - id: b
        text: Copies the first three lines of `state.db` to standard input
        rationale: Wrong. Redirections do not select lines; 3 is a descriptor number.
      - id: c
        text: Sends standard output to `state.db` and reads standard input from it
        rationale: Wrong. Only descriptor 3 is opened; stdin and stdout are unchanged.
      - id: d
        text: Swaps descriptor 3 with standard error for the command
        rationale: Wrong. Nothing is swapped; the file is simply opened on descriptor 3.
    answer: [a]
    explanation: >
      Programs may use descriptors 3 and above for extra data channels. `n<>file` opens the file
      for reading and writing on descriptor n, so one descriptor can serve both directions.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [file-descriptors]

  - id: 101-103.4-0025
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: >
      Which **TWO** commands make `tr a-z A-Z` print `HELLO WORLD`?
    select_count: 2
    options:
      - id: a
        text: "`tr a-z A-Z \"hello world\"`"
        rationale: Wrong. tr reads only stdin; the extra argument makes it fail with "extra operand".
      - id: b
        text: "`tr a-z A-Z < \"hello world\"`"
        rationale: Wrong. This tries to open a file called "hello world", which normally does not exist.
      - id: c
        text: "`echo \"hello world\" | tr a-z A-Z`"
        rationale: Correct. echo writes the text to the pipe, and tr reads it on stdin.
      - id: d
        text: "`tr a-z A-Z <<< \"hello world\"`"
        rationale: Correct. The here string sends the quoted text to tr's stdin.
      - id: e
        text: "`tr a-z A-Z <<< hello world`"
        rationale: Wrong. Without quotes only "hello" is the here string; "world" becomes an extra operand and tr fails.
    answer: [c, d]
    explanation: >
      tr only processes standard input. Text can reach it through a pipe or a here string; a here
      string must be quoted when it contains spaces.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Here Document and Here String }
    verify:
      command: bash -c 'tr a-z A-Z <<< "hello world"'
      expect: { exit_code: 0, stdout_contains: "HELLO WORLD" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [here-string, pipe, tr]

  - id: 101-103.4-0026
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: As root, you run `echo test > /etc`. What happens?
    options:
      - id: a
        text: The text replaces the contents of every file in `/etc`
        rationale: Wrong. A redirection target is one path; it never writes into the files of a directory.
      - id: b
        text: Bash reports "Is a directory" and nothing is written
        rationale: Correct. A directory cannot be opened as an output file, so the redirection fails and echo does not run.
      - id: c
        text: A file named `/etc/echo` is created containing the text
        rationale: Wrong. No file is created inside the directory.
      - id: d
        text: The text is written, because root may overwrite anything
        rationale: Wrong. Root privileges do not let a directory be opened for writing as a file.
    answer: [b]
    explanation: >
      If the redirection target cannot be opened for writing (a directory, a read-only file), Bash
      prints an error, leaves the target unchanged and does not run the command.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [redirection, errors]

  - id: 101-103.4-0027
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      As an ordinary user with sudo rights, `sudo echo "Maintenance tonight" > /etc/motd` fails
      with "Permission denied". Which command writes the text to `/etc/motd`?
    options:
      - id: a
        text: "`echo \"Maintenance tonight\" | sudo tee /etc/motd`"
        rationale: Correct. tee runs as root and opens the file itself, so the write is allowed.
      - id: b
        text: "`sudo echo \"Maintenance tonight\" >> /etc/motd`"
        rationale: Wrong. The >> is still opened by your own unprivileged shell, so it fails the same way.
      - id: c
        text: "`echo \"Maintenance tonight\" | sudo cat /etc/motd`"
        rationale: Wrong. cat with a file argument prints that file; it does not write stdin into it.
      - id: d
        text: "`sudo echo \"Maintenance tonight\" 2>&1 /etc/motd`"
        rationale: Wrong. This only joins echo's stderr to stdout and passes /etc/motd as text to echo.
    answer: [a]
    explanation: >
      Redirections are set up by your shell before sudo starts, so they run with your own
      permissions. Piping into `sudo tee file` moves the file opening into a root process. Add
      `> /dev/null` if you do not want the copy on screen.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Pipes }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [tee, sudo, redirection]

  - id: 101-103.4-0028
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      `/srv/archive` does not exist. After `RESULT=$(ls /srv/archive)` in an interactive shell, what
      is the situation?
    options:
      - id: a
        text: "`RESULT` holds the error message from `ls`"
        rationale: Wrong. Command substitution captures only stdout; the message went to stderr.
      - id: b
        text: "`RESULT` holds the exit status of `ls`"
        rationale: Wrong. Exit status is in $?, not in the substituted text.
      - id: c
        text: The assignment is refused and `RESULT` keeps its old value
        rationale: Wrong. The assignment happens; it just assigns the (empty) output.
      - id: d
        text: "`RESULT` is empty; the error shows on screen"
        rationale: Correct. ls wrote nothing to stdout, and its stderr was not redirected.
    answer: [d]
    explanation: >
      $( ) is replaced by the command's standard output only. Standard error still goes wherever it
      was going, here the terminal. Use 2>&1 inside the substitution to capture errors too.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Command Substitution }
    verify:
      command: bash -c 'R=$(ls /srv/nonexistent-dir 2>/dev/null); echo "[$R]"'
      expect: { stdout_contains: "[]" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Correct option shortened so it is not the longest." }
    tags: [command-substitution, stderr]

  - id: 101-103.4-0029
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      `/etc/hostname` exists and `/nonexistent` does not. After the command below, what does
      `out.txt` contain?
    exhibit: |
      $ ls /etc/hostname /nonexistent | tee out.txt
      ls: cannot access '/nonexistent': No such file or directory
      /etc/hostname
    options:
      - id: a
        text: Both the error message and `/etc/hostname`
        rationale: Wrong. The error went to stderr, which the pipe does not carry.
      - id: b
        text: Only the error message
        rationale: Wrong. That is the stream that bypassed tee.
      - id: c
        text: Only `/etc/hostname`
        rationale: Correct. tee received ls's stdout, which held just the listing.
      - id: d
        text: Nothing, because `ls` exited with an error
        rationale: Wrong. The exit status does not stop the data that ls already sent to stdout.
    answer: [c]
    explanation: >
      Both lines appear on the screen, but only stdout passes through the pipe. The error was
      printed directly by ls on stderr, so tee never saw it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Pipes }
    verify:
      command: bash -c 'cd /tmp; ls /etc/hostname /nonexistent 2>/dev/null | tee out29.txt >/dev/null; cat out29.txt'
      expect: { stdout_regex: "^/etc/hostname\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [tee, pipe, stderr]

  - id: 101-103.4-0030
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: >
      You want `names.txt` to end up containing its own lines in sorted order. Which **TWO**
      commands achieve that?
    select_count: 2
    options:
      - id: a
        text: "`sort -o names.txt names.txt`"
        rationale: Correct. sort reads all input before it opens the -o file, so the same file is safe.
      - id: b
        text: "`sort names.txt > sorted.tmp && mv sorted.tmp names.txt`"
        rationale: Correct. The sorted copy is written elsewhere and then replaces the original.
      - id: c
        text: "`sort names.txt > names.txt`"
        rationale: Wrong. The shell truncates names.txt before sort starts, so sort reads an empty file.
      - id: d
        text: "`sort < names.txt > names.txt`"
        rationale: Wrong. The output redirection still truncates the file before sort reads it.
      - id: e
        text: "`sort names.txt >> names.txt`"
        rationale: Wrong. The sorted lines are appended after the original unsorted ones.
    answer: [a, b]
    explanation: >
      The shell opens and truncates output files before the command runs. Redirecting a command's
      output to its own input file therefore destroys the input.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    verify:
      command: bash -c 'cd /tmp; printf "b\na\n" > s30; sort s30 > s30; wc -c < s30'
      expect: { stdout_contains: "0" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [redirection, sort, truncation]

  - id: 101-103.4-0031
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: >
      Under `~/cache` some file names contain spaces, such as `old copy.tmp`. Which **TWO** command
      lines remove every `.tmp` file there correctly?
    select_count: 2
    options:
      - id: a
        text: "`find ~/cache -name '*.tmp' | xargs rm`"
        rationale: Wrong. xargs splits on blanks, so rm gets "old" and "copy.tmp" as separate names.
      - id: b
        text: "`find ~/cache -name '*.tmp' -print0 | xargs -0 rm`"
        rationale: Correct. Names are null-separated and xargs -0 splits only on nulls.
      - id: c
        text: "`find ~/cache -name '*.tmp' -print0 | xargs rm`"
        rationale: Wrong. Without -0, xargs warns about the null characters and still splits on blanks.
      - id: d
        text: "`find ~/cache -name '*.tmp' -exec rm {} +`"
        rationale: Correct. find passes each path to rm itself, with no text parsing in between.
      - id: e
        text: "`find ~/cache -name '*.tmp' | xargs -0 rm`"
        rationale: Wrong. The list is newline-separated, so xargs -0 sees one huge name containing newlines.
    answer: [b, d]
    explanation: >
      Default xargs input parsing breaks on spaces and newlines. Pair find -print0 with xargs -0, or
      let find run the command with -exec, when names may contain blanks.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Command Substitution }
    verify:
      command: >
        bash -c 'd=$(mktemp -d); touch "$d/old copy.tmp" "$d/b.tmp";
        find "$d" -name "*.tmp" -print0 | xargs -0 rm; ls "$d" | wc -l'
      expect: { exit_code: 0, stdout_contains: "0" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [xargs, find, print0]

  - id: 101-103.4-0032
    type: fill_in
    difficulty: 4
    pool: holdout
    stem: >
      Type a complete command line that runs `ls -R /etc`, saves its normal output in `list.txt`
      and discards its error messages.
    fill_in:
      accepted: ['ls\s+(-R|--recursive)\s+/etc/?\s+(1?>\s*list\.txt\s+2>\s*/dev/null|2>\s*/dev/null\s+1?>\s*list\.txt)']
      match: regex
      case_sensitive: true
    explanation: >
      Two independent redirections are needed: > (or 1>) list.txt for stdout and 2>/dev/null for
      stderr. Because they touch different descriptors, their order does not matter.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [redirection, dev-null, stderr]

  - id: 101-103.4-0033
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      `moves.txt` contains the line `a.txt b.txt`, and both files and the directory `backup/`
      exist. Why does the command below fail?
    exhibit: |
      $ xargs mv backup/ < moves.txt
      mv: target 'b.txt': Not a directory
    options:
      - id: a
        text: "`xargs` cannot read its input from a redirected file"
        rationale: Wrong. xargs reads standard input, and < supplies it from the file without problem.
      - id: b
        text: "`xargs` runs `mv` once per name, so `mv` lacks a destination"
        rationale: Wrong. By default xargs passes as many names as fit into one command line.
      - id: c
        text: The trailing slash in `backup/` must not be used with `mv`
        rationale: Wrong. A trailing slash on a directory destination is fine.
      - id: d
        text: The names are added after `backup/`, so `b.txt` is the destination
        rationale: Correct. The command run is `mv backup/ a.txt b.txt`; mv's last argument is the target.
    answer: [d]
    explanation: >
      xargs appends the items it reads after the fixed arguments. For commands whose last argument
      must be a destination, use `-I` with a placeholder (`xargs -I F mv F backup/`) or an option
      such as `mv -t backup/`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Command Substitution }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Correct option shortened so it is not the longest." }
    tags: [xargs]

  - id: 101-103.4-0034
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: What number does `wc -c <<< "abc"` print?
    options:
      - id: a
        text: "`4`"
        rationale: Correct. A here string is followed by a newline, so wc counts a, b, c and the newline.
      - id: b
        text: "`3`"
        rationale: Wrong. This ignores the newline Bash adds after the here string.
      - id: c
        text: "`5`"
        rationale: Wrong. The quotes are removed by the shell and are not counted.
      - id: d
        text: "`1`"
        rationale: Wrong. That would be a line or word count; -c counts bytes.
    answer: [a]
    explanation: >
      Bash appends a newline to a here string before feeding it to standard input. "abc" plus the
      newline is 4 bytes.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Here Document and Here String }
    verify:
      command: bash -c 'wc -c <<< "abc"'
      expect: { exit_code: 0, stdout_regex: "^4\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [here-string, wc]

  - id: 101-103.4-0035
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: Which of these commands prints **nothing** on the terminal?
    options:
      - id: a
        text: "`echo hi 1>&2 2>/dev/null`"
        rationale: Wrong. stdout was copied to the terminal's stderr first; moving stderr afterwards does not change that copy.
      - id: b
        text: "`echo hi 2>/dev/null 1>&2`"
        rationale: Correct. stderr points at /dev/null first, then stdout is copied from it, so "hi" is discarded.
      - id: c
        text: "`echo hi 2>&1 2>/dev/null`"
        rationale: Wrong. Only stderr ends at /dev/null; stdout still goes to the terminal.
      - id: d
        text: "`echo hi 2>/dev/null | cat`"
        rationale: Wrong. stdout goes through the pipe to cat, which prints it.
    answer: [b]
    explanation: >
      Redirections are applied left to right, and `n>&m` copies where m points **at that moment**.
      In b, stderr already points at /dev/null when stdout copies it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    verify:
      command: bash -c 'a=$( (echo hi 2>/dev/null 1>&2) 2>&1 ); echo "[$a]"'
      expect: { stdout_contains: "[]" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [redirection, order, fd-duplication]

  - id: 101-103.4-0036
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      `missing.txt` does not exist and `out.txt` does not exist either. You run
      `cat < missing.txt > out.txt`. What is the result?
    options:
      - id: a
        text: "`out.txt` is created and contains the error message"
        rationale: Wrong. Error messages go to stderr, which is not redirected here.
      - id: b
        text: "`out.txt` is created empty and `cat` waits for keyboard input"
        rationale: Wrong. cat never starts, because a redirection failed.
      - id: c
        text: An error is printed and `out.txt` is not created
        rationale: Correct. Bash processes the < first, it fails, and Bash stops before opening out.txt or running cat.
      - id: d
        text: "`out.txt` is created empty and an error is printed"
        rationale: Wrong. Redirections are handled left to right, and processing stops at the first failure.
    answer: [c]
    explanation: >
      Bash sets up redirections left to right. When one fails, the remaining ones are not
      performed and the command is not run, so out.txt is never opened.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    verify:
      command: bash -c 'cd "$(mktemp -d)"; cat < missing.txt > out.txt 2>/dev/null; ls out.txt 2>/dev/null | wc -l'
      expect: { stdout_contains: "0" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [redirection, order, errors]

  - id: 101-103.4-0037
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      A build script writes progress to standard output and warnings to standard error; some lines
      on both streams contain `WARN`. What does `grep` count in the command below?
    exhibit: |
      $ ./build.sh 2>&1 >build.log | grep -c WARN
    options:
      - id: a
        text: The `WARN` lines from both streams
        rationale: Wrong. stdout is moved to build.log after stderr copied the pipe, so stdout never reaches grep.
      - id: b
        text: The `WARN` lines from standard output only
        rationale: Wrong. Standard output goes into build.log, not into the pipe.
      - id: c
        text: Nothing; `grep` reads `build.log` instead of the pipe
        rationale: Wrong. grep reads its stdin, which is the pipe; build.log is only where stdout was sent.
      - id: d
        text: The `WARN` lines from standard error only
        rationale: Correct. stderr copies stdout while it still points at the pipe, then stdout moves to the file.
    answer: [d]
    explanation: >
      The pipe is set up first, so stdout initially points at it. 2>&1 then sends stderr into the
      pipe, and >build.log moves only stdout to the file. This is a common way to filter just the
      error stream.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Pipes }
    verify:
      command: >
        bash -c 'cd /tmp; b(){ echo WARN-out; echo WARN-err >&2; echo ok; };
        b 2>&1 >b37.log | grep -c WARN'
      expect: { exit_code: 0, stdout_regex: "^1\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [pipe, order, stderr]

  - id: 101-103.4-0038
    type: multi_choice
    difficulty: 5
    pool: holdout
    stem: >
      `set -C` is active and `report.txt` already exists. Which **TWO** commands succeed in writing
      to `report.txt`?
    select_count: 2
    options:
      - id: a
        text: "`date >> report.txt`"
        rationale: Correct. Appending is allowed under noclobber.
      - id: b
        text: "`date &> report.txt`"
        rationale: Wrong. &> truncates the file, so noclobber refuses it.
      - id: c
        text: "`date >| report.txt`"
        rationale: Correct. >| explicitly overrides noclobber for this one redirection.
      - id: d
        text: "`date 1> report.txt`"
        rationale: Wrong. 1> is the same as > and is blocked.
      - id: e
        text: "`date > report.txt 2>&1`"
        rationale: Wrong. The > part is blocked, so the command fails before date runs.
    answer: [a, c]
    explanation: >
      noclobber (set -C) blocks redirections that would overwrite an existing file. >> only adds to
      the end, and >| is Bash's deliberate "overwrite anyway" operator.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    verify:
      command: >
        bash -c 'cd /tmp; rm -f r38; set -C; echo a > r38; date >> r38 && date >| r38 && echo both-ok'
      expect: { exit_code: 0, stdout_contains: "both-ok" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [noclobber]

  - id: 101-103.4-0039
    type: fill_in
    difficulty: 5
    pool: holdout
    stem: >
      Type a complete command line that runs `./backup.sh`, shows both its standard output and its
      standard error on the terminal, and also **appends** both streams to `/var/log/backup.log`.
      Use `tee`.
    fill_in:
      accepted: ['(\./)?backup\.sh(\s+2>&1\s*\||\s*\|&)\s*(sudo\s+)?tee\s+((-a|--append)\s+/var/log/backup\.log|/var/log/backup\.log\s+(-a|--append))']
      match: regex
      case_sensitive: true
    explanation: >
      stderr must join stdout before the pipe (2>&1 |, or |& in Bash), because a pipe carries only
      stdout. tee -a then shows the data and appends it to the log.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Pipes }
    review:
