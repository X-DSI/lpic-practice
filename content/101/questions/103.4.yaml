  - id: 101-103.4-0048
    type: multi_choice
    difficulty: 2
    pool: practice
    stem: Which **TWO** commands count the lines of `users.txt` by giving its contents to `wc -l` on standard input?
    select_count: 2
    options:
      - id: a
        text: "`wc -l < users.txt`"
        rationale: Correct. < connects the file to wc's stdin.
      - id: b
        text: "`wc -l > users.txt`"
        rationale: Wrong. This truncates users.txt and waits for keyboard input.
      - id: c
        text: "`wc -l << users.txt`"
        rationale: Wrong. This starts a here document ended by a line "users.txt"; the file is not read.
      - id: d
        text: "`cat users.txt | wc -l`"
        rationale: Correct. cat writes the file to the pipe and wc reads it on stdin.
      - id: e
        text: "`wc -l <<< users.txt`"
        rationale: Wrong. This counts the one-line string "users.txt", so it always prints 1.
    answer: [a, d]
    explanation: >
      Input redirection (<) and a pipe from cat both deliver the file's bytes on standard input.
      wc then prints just the count, without a file name.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Pipes }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [redirection, pipe, stdin]

  - id: 101-103.4-0049
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      Each line of `jobs.txt` holds a host name and a port, such as `db1 5432`. Which `xargs`
      option runs `check-port` once per line with both words as arguments?
    options:
      - id: a
        text: "`-n 1`"
        rationale: Wrong. -n 1 passes one word per run, splitting the host from its port.
      - id: b
        text: "`-L 1`"
        rationale: Correct. -L 1 uses one input line, all of its words, for each command run.
      - id: c
        text: "`-0`"
        rationale: Wrong. -0 changes the separator to null; the file has none, so everything becomes one item.
      - id: d
        text: "`-r`"
        rationale: Wrong. -r only skips running the command when the input is empty.
    answer: [b]
    explanation: >
      `xargs -L 1 check-port < jobs.txt` runs `check-port db1 5432` and so on, one run per line.
      -n counts arguments, -L counts lines.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Command Substitution }
    verify:
      command: printf 'db1 5432\nweb 80\n' | xargs -L 1 echo | head -n 1
      expect: { stdout_regex: "^db1 5432\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [xargs]

  - id: 101-103.4-0050
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      Instead of piping `find` into `xargs -n 1 gzip`, which `find` action runs `gzip` for each
      result directly?
    options:
      - id: a
        text: "`-print0 gzip`"
        rationale: Wrong. -print0 only prints names with null separators; it runs nothing.
      - id: b
        text: "`-delete gzip`"
        rationale: Wrong. -delete removes the files found.
      - id: c
        text: "`-exec gzip {} \\;`"
        rationale: Correct. -exec runs the command for each result, with {} replaced by the path.
      - id: d
        text: "`-ok gzip`"
        rationale: Wrong. -ok needs {} and a terminating \;, and it asks for confirmation each time.
    answer: [c]
    explanation: >
      `find ... -exec cmd {} \;` runs cmd once per file. Ending with + instead of \; passes many
      paths per run, much like plain xargs.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Command Substitution }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [find, exec, xargs]

  - id: 101-103.4-0051
    type: single_choice
    difficulty: 3
    pool: practice
    stem: In a script, what does the line `echo "config file missing" >&2` do?
    options:
      - id: a
        text: Writes the message to a file named `2`
        rationale: Wrong. The & marks 2 as a descriptor; a file named 2 would need >2.
      - id: b
        text: Runs `echo` in the background with priority 2
        rationale: Wrong. & attached to > is part of the redirection, not a background request.
      - id: c
        text: Discards the message
        rationale: Wrong. Nothing is sent to /dev/null; the message is printed on stderr.
      - id: d
        text: Writes the message to standard error instead of standard output
        rationale: Correct. >&2 (1>&2) makes stdout a copy of stderr for this command.
    answer: [d]
    explanation: >
      Scripts send error messages to stderr with >&2, so that callers who redirect or pipe the
      normal output still see the error.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 1, section: Redirects }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [stderr, fd-duplication]

  - id: 101-103.4-0052
    type: multi_choice
    difficulty: 3
    pool: practice
    stem: Which **TWO** statements about a pipeline such as `cmd1 | cmd2` are true?
    select_count: 2
    options:
      - id: a
        text: "`cmd2` starts only after `cmd1` has finished"
        rationale: Wrong. The shell starts all commands of a pipeline together; data streams between them.
      - id: b
        text: Only the standard output of `cmd1` is passed to `cmd2`
        rationale: Correct. stderr of cmd1 still goes to the terminal unless redirected.
      - id: c
        text: "`cmd1` and `cmd2` run at the same time"
        rationale: Correct. They run concurrently, with cmd2 reading data as cmd1 produces it.
      - id: d
        text: "`cmd2` may be the name of a file to write to"
        rationale: Wrong. The right side of | must be a command; writing to a file needs >.
      - id: e
        text: The data flows from `cmd2` to `cmd1`
        rationale: Wrong. Data flows left to right.
    answer: [b, c]
    explanation: >
      A pipe links cmd1's stdout to cmd2's stdin. Both processes are started at once, which is why
      long pipelines can process data as it arrives.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Pipes }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [pipe]

  - id: 101-103.4-0053
    type: fill_in
    difficulty: 3
    pool: practice
    stem: >
      Type the `xargs` option that takes a placeholder string and replaces it, anywhere in the
      command, with each input line (for example so the name can go before a destination).
    fill_in:
      accepted: ['(xargs\s+)?(-I(\s*(?!-)\S+)?|--replace(=\S+)?)']
      match: regex
      case_sensitive: true
    explanation: >
      `xargs -I {} cp {} /backup/` puts each line where {} appears instead of at the end. GNU xargs
      also has the long form --replace=R.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Command Substitution }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [xargs]

  - id: 101-103.4-0054
    type: single_choice
    difficulty: 4
    pool: practice
    stem: What does `echo $(printf 'one\ntwo\n')` print?
    options:
      - id: a
        text: "`one two` on one line"
        rationale: Correct. The unquoted substitution is split into words, and echo joins them with a space.
      - id: b
        text: "`one` and `two` on separate lines"
        rationale: Wrong. That needs quotes, as in echo "$(printf ...)".
      - id: c
        text: "`one\\ntwo` literally"
        rationale: Wrong. printf turns \n into real newlines before the substitution sees the text.
      - id: d
        text: An empty line, because `printf` output is not captured
        rationale: Wrong. printf writes to stdout, which command substitution captures.
    answer: [a]
    explanation: >
      Command substitution removes trailing newlines. Left unquoted, the result is also split into
      words on whitespace, so embedded newlines disappear. Quote it to keep the lines.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.4", lesson: 2, section: Command Substitution }
    verify:
      command: bash -c "echo \$(printf 'one\ntwo\n')"
