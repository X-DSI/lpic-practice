  - id: 101-104.7-0027
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      The locate database was built last night, and several files have been deleted since. Which
      `locate` option leaves out results for files that no longer exist?
    options:
      - id: a
        text: "`-e`"
        rationale: Correct. -e (--existing) checks each result and prints only files that still exist.
      - id: b
        text: "`-i`"
        rationale: Wrong. -i makes the match case-insensitive.
      - id: c
        text: "`-c`"
        rationale: Wrong. -c prints the number of matches instead of the matches.
      - id: d
        text: "`-b`"
        rationale: Wrong. -b matches the pattern only against the last component of each path.
    answer: [a]
    explanation: >
      locate searches a database, not the disk, so it can show deleted files until updatedb runs
      again. -e removes results that no longer exist; files created since the last update still only
      show up after updatedb.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.7", lesson: 1, section: Using locate and updatedb }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
    tags: [locate]

  - id: 101-104.7-0028
    type: multi_choice
    difficulty: 3
    pool: practice
    stem: >
      Which **TWO** statements are true on a current distribution that has merged `/usr`, such as
      Debian 12, Ubuntu 24.04 or Fedora?
    select_count: 2
    options:
      - id: a
        text: "`/bin` is a symbolic link to `/usr/bin`."
        rationale: Correct. After the merge, /bin is a symlink (usually relative, usr/bin) to /usr/bin.
      - id: b
        text: "`/bin` and `/usr/bin` hold separate copies of essential commands."
        rationale: Wrong. Both paths lead to the same directory, so there is only one copy of each command.
      - id: c
        text: "`/lib` is a symbolic link to `/usr/lib`."
        rationale: Correct. /lib (and /lib64 where present) also point into /usr.
      - id: d
        text: "Commands from `/sbin` were moved to `/usr/local/sbin`."
        rationale: Wrong. /sbin points to /usr/sbin; /usr/local is reserved for software the administrator installs locally.
    answer: [a, c]
    explanation: >
      The /usr merge moves the contents of /bin, /sbin and /lib into /usr and replaces the old
      directories with symbolic links. Paths such as /bin/sh keep working, but everything the
      distribution installs lives under /usr.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.7", lesson: 1, section: The Filesystem Hierarchy Standard }
    verify:
      command: test -L /bin && test -L /lib && readlink /bin
      expect: { exit_code: 0, stdout_contains: "usr/bin" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
    tags: [usrmerge, fhs]

  - id: 101-104.7-0029
    type: single_choice
    difficulty: 4
    pool: practice
    stem: >
      In your interactive Bash shell you get the output below. What runs when you type
      `grep error app.log`?
    exhibit: |
      $ which grep
      /usr/bin/grep
      $ type -a grep
      grep is aliased to `grep --color=auto'
      grep is /usr/bin/grep
      grep is /bin/grep
    options:
      - id: a
        text: "`/usr/bin/grep` exactly as typed, because which found it first"
        rationale: Wrong. which only searches PATH; the shell expands the alias before it ever searches PATH.
      - id: b
        text: "The alias, so `/usr/bin/grep` runs with `--color=auto` added"
        rationale: Correct. Aliases come before PATH lookup; the alias expands to grep --color=auto, and that grep is then found in PATH.
      - id: c
        text: "`/bin/grep`, because the last match in `PATH` wins"
        rationale: Wrong. PATH is searched in order and the first match wins; both names are the same file here anyway.
      - id: d
        text: "A shell function called `grep`"
        rationale: Wrong. type would then report "grep is a function"; no function is shown.
    answer: [b]
    explanation: >
      type shows how the shell will interpret a name, in priority order: aliases, keywords,
      functions, builtins, then files in PATH. which only knows about files in PATH, so it can
      miss what really runs.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.7", lesson: 1, section: "Finding Binaries, Manual Pages and Source Code" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
    tags: [type, which, alias]

  - id: 101-104.7-0030
    type: single_choice
    difficulty: 4
    pool: practice
    stem: >
      Given the tree below, which files does `find . -maxdepth 2 -name '*.log'` print?
    exhibit: |
      $ find . | sort
      .
      ./logs
      ./logs/app.log
      ./logs/notes.txt
      ./logs/old
      ./logs/old/2025.log
      ./top.log
    options:
      - id: a
        text: "`./top.log` only"
        rationale: Wrong. That is the result of -maxdepth 1, which stays in the starting directory.
      - id: b
        text: "`./logs/app.log` and `./logs/old/2025.log`"
        rationale: Wrong. That is the result of -mindepth 2, which skips the first level instead of limiting the depth.
      - id: c
        text: "`./top.log` and `./logs/app.log`"
        rationale: Correct. Depth 1 is the starting directory's contents and depth 2 one level below; logs/old/2025.log is at depth 3.
      - id: d
        text: All three `.log` files
        rationale: Wrong. logs/old/2025.log is at depth 3, beyond the limit of 2.
    answer: [c]
    explanation: >
      The starting point is depth 0, its entries are depth 1, and so on. -maxdepth N stops find from
      going deeper than N levels; -mindepth N skips everything shallower than N.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.7", lesson: 1, section: Finding Files }
    verify:
      setup:
        - mkdir -p /tmp/v/logs/old && cd /tmp/v && touch top.log logs/app.log logs/old/2025.log logs/notes.txt
      command: cd /tmp/v && find . -maxdepth 2 -name '*.log' | sort | tr '\n' ' '
      expect: { exit_code: 0, stdout_contains: "./logs/app.log ./top.log " }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
    tags: [find, maxdepth]
