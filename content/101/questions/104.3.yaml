  - id: 101-104.3-0017
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      Web content lives in `/srv/www`. A chrooted service can only see `/var/chroot`, so the same
      files must also be visible under `/var/chroot/www`, while they stay available at `/srv/www`.
      Which command does this?
    options:
      - id: a
        text: "`mount -M /srv/www /var/chroot/www`"
        rationale: Wrong. --move relocates an existing mount, so the content would no longer be available at /srv/www (and /srv/www would have to be a mount point).
      - id: b
        text: "`mount -o loop /srv/www /var/chroot/www`"
        rationale: Wrong. A loop device needs an image file as its source; /srv/www is a directory, so setting up the loop device fails.
      - id: c
        text: "`mount --bind /srv/www /var/chroot/www`"
        rationale: Correct. A bind mount makes the same directory tree visible at a second place; both paths show the same files.
      - id: d
        text: "`mount -o remount /srv/www /var/chroot/www`"
        rationale: Wrong. remount only changes the options of something already mounted; it does not make a directory appear elsewhere.
    answer: [c]
    explanation: >
      `mount --bind` (or `-B`, or `-o bind`) attaches an existing directory at another mount point.
      It is not a copy: changes made through either path are seen through the other. Unlike a
      symbolic link, it also works where a chroot cannot follow a link out of its tree.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting and Unmounting Filesystems }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [bind]

  - id: 101-104.3-0018
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      A local filesystem is busy, and the process using it cannot be stopped right now. You want the
      filesystem removed from the directory tree immediately and fully released as soon as nothing
      uses it any more. Which command does this?
    options:
      - id: a
        text: "`umount -f /data`"
        rationale: Wrong. -f forces the unmount of unreachable network filesystems; on a busy local filesystem it still fails with "target is busy".
      - id: b
        text: "`umount -l /data`"
        rationale: Correct. A lazy unmount detaches the filesystem now and cleans up references once it is no longer busy.
      - id: c
        text: "`umount -r /data`"
        rationale: Wrong. -r remounts the filesystem read-only if unmounting fails; it stays attached.
      - id: d
        text: "`umount -n /data`"
        rationale: Wrong. -n only skips writing to /etc/mtab; it does not get around a busy filesystem.
    answer: [b]
    explanation: >
      `umount -l` (lazy) removes the mount from the tree at once, so new accesses through the path
      no longer reach it, and the kernel finishes the unmount when the last user lets go. Finding and
      closing the user with lsof or fuser is the cleaner fix when possible.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Dealing with Open Files }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [umount, busy]

  - id: 101-104.3-0019
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      An `/etc/fstab` entry for `/home` ends with the two fields `0 2`. What does the final `2`
      mean?
    exhibit: |
      UUID=7a1e5c90-3f2b-4d8e-a6c1-0b9d4e2f8a37  /home  ext4  defaults  0  2
    options:
      - id: a
        text: The filesystem is checked by fsck at boot, after the root filesystem
        rationale: Correct. The sixth field is the fsck pass number; root uses 1 and other filesystems to be checked use 2.
      - id: b
        text: The filesystem is backed up by the dump utility every second day of the week
        rationale: Wrong. The dump setting is the fifth field (here 0), and it is a flag, not a schedule.
      - id: c
        text: The filesystem is mounted as the second one during boot
        rationale: Wrong. Mount order follows the mount point hierarchy, not this field.
      - id: d
        text: Two reserved-block percentage points are kept free for root
        rationale: Wrong. Reserved blocks are a property of the ext filesystem set with mkfs or tune2fs, not an fstab field.
    answer: [a]
    explanation: >
      Field five is the dump flag (0 = ignore). Field six tells fsck at boot in which order to
      check: 0 means never, 1 is for the root filesystem, and 2 for other filesystems, checked after
      root. Both fields may be omitted, and then default to 0.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Filesystems on Bootup }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: fixed, notes: "Option lengths rebalanced; the key was the longest option." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [fstab, fsck]

  - id: 101-104.3-0020
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: >
      None of the filesystems below is mounted yet, and every device exists. The administrator runs
      `mount -a` as root. Which **TWO** mount points have a filesystem mounted afterwards?
    exhibit: |
      LABEL=scratch   /scratch     ext4  noauto,noatime      0  0
      LABEL=projects  /projects    xfs   defaults            0  2
      LABEL=camera    /media/cam   ext4  noauto,users        0  0
      LABEL=logs      /var/log2    ext4  nouser,noexec,async 0  2
    select_count: 2
    options:
      - id: a
        text: "`/scratch`"
        rationale: Wrong. noauto tells mount -a to skip this entry; it can only be mounted by naming it.
      - id: b
        text: "`/projects`"
        rationale: Correct. defaults includes auto, so mount -a mounts it.
      - id: c
        text: "`/var/log2`"
        rationale: Correct. auto is the default when noauto is not given; nouser and noexec only restrict who mounts it and what can run.
      - id: d
        text: "`/media/cam`"
        rationale: Wrong. users allows ordinary users to mount it, but noauto still makes mount -a skip it.
    answer: [b, c]
    explanation: >
      mount -a mounts every fstab entry that is not marked noauto (and is not mounted yet). Options
      such as user, users, nouser or noexec have nothing to do with whether mount -a picks the entry
      up. Removable media are usually marked noauto so a missing device does not break the boot.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Filesystems on Bootup }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [fstab, noauto, mount]

  - id: 101-104.3-0021
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: Based on the output below, which statement is correct?
    exhibit: |
      # umount /mnt/archive
      umount: /mnt/archive: target is busy.
      # lsof /mnt/archive
      COMMAND  PID   USER   FD   TYPE DEVICE SIZE/OFF NODE NAME
      bash    5995 nobody  cwd    DIR    7,0     4096   16 /mnt/archive/reports
      tail    5996   root    3r   REG    7,0        2   17 /mnt/archive/reports/q3.log
      sleep   5998 nobody  cwd    DIR    7,0     4096   16 /mnt/archive/reports
    options:
      - id: a
        text: Only `tail` keeps the filesystem busy; the `bash` and `sleep` lines are informational
        rationale: Wrong. A current working directory on the filesystem also keeps it busy, so bash and sleep block the unmount too.
      - id: b
        text: Process 5995 has a file named `reports` open for reading
        rationale: Wrong. FD cwd with TYPE DIR means reports is that process's current directory, not an open file.
      - id: c
        text: "`umount -f /mnt/archive` will succeed because the users are local processes"
        rationale: Wrong. -f is meant for unreachable network filesystems; a busy local filesystem still reports "target is busy".
      - id: d
        text: Process 5995 holds the filesystem busy because its current directory is inside it
        rationale: Correct. The cwd entry shows the shell is sitting in /mnt/archive/reports, which pins the filesystem.
    answer: [d]
    explanation: >
      lsof lists everything that pins the filesystem: open files (here tail has q3.log open as file
      descriptor 3 for reading) and current directories (the cwd lines). The shell must leave the
      directory, its child must finish, and tail must close the file before umount succeeds.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Dealing with Open Files }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [lsof, busy, troubleshooting]

  - id: 101-104.3-0022
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      The disk described below must be mounted on `/srv/backup`, but systemd refuses the unit. What
      fixes it?
    exhibit: |
      $ cat /etc/systemd/system/backup.mount
      [Unit]
      Description=Backup volume

      [Mount]
      What=/dev/disk/by-uuid/c2b82332-2a49-4df8-beeb-3f20f639afb7
      Where=/srv/backup
      Type=ext4
      Options=noatime

      [Install]
      WantedBy=multi-user.target
      $ systemd-analyze verify /etc/systemd/system/backup.mount
      backup.mount: Where= setting doesn't match unit name. Refusing.
      Unit backup.mount has a bad unit file setting.
    options:
      - id: a
        text: Replace `What=` with the kernel device name, such as `/dev/sdb1`
        rationale: Wrong. What= may name any device path; the error is about the unit name and Where=, which this does not change.
      - id: b
        text: Run `systemctl daemon-reload` and verify again
        rationale: Wrong. Reloading makes systemd reread the file, but the name still does not match Where=.
      - id: c
        text: Rename the file to `srv-backup.mount`
        rationale: Correct. A mount unit's name must be derived from its Where= path, so /srv/backup requires srv-backup.mount.
      - id: d
        text: Add `Type=auto` and remove `Options=`
        rationale: Wrong. Type= and Options= are unrelated to the naming error; ext4 and noatime are valid.
    answer: [c]
    explanation: >
      systemd ties a mount unit to its mount point: the file name must be the escaped Where= path plus
      .mount. Here /srv/backup becomes srv-backup.mount. Changing Where= to /backup would also make
      the name match, but would mount the disk in the wrong place.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Disks with Systemd }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [systemd, mount-unit, naming, troubleshooting]

  - id: 101-104.3-0023
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: >
      A monitoring script must list every XFS filesystem that is mounted right now, and must not
      mount anything. Which **TWO** commands are suitable?
    select_count: 2
    options:
      - id: a
        text: "`mount -a -t xfs`"
        rationale: Wrong. -a mounts the matching fstab entries that are not mounted yet; it changes the system instead of just listing.
      - id: b
        text: "`mount -t xfs`"
        rationale: Correct. Without a source or target, mount lists the mounted filesystems, and -t limits the list to the given types.
      - id: c
        text: "`blkid -t TYPE=xfs`"
        rationale: Wrong. blkid shows every device containing XFS, whether it is mounted or not.
      - id: d
        text: "`findmnt -t xfs`"
        rationale: Correct. findmnt shows the current mounts, and -t restricts them to the listed types.
    answer: [b, d]
    explanation: >
      With no device or directory, mount prints the current mount table; -t (which also takes a
      comma-separated list) filters by type. findmnt accepts the same -t filter and prints a tree. Combined with -a,
      the type list would instead select which fstab entries to mount.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Listing Mounted Filesystems }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Reworded (XFS only, monitoring script) to move away from Guided Exercise 6. Text supplied by the reviewer; verified by the reviewer." }
    tags: [mount, findmnt]

  - id: 101-104.3-0024
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      Using the `blkid` output below, which `/etc/fstab` line mounts the filesystem labelled PHOTOS
      on `/srv/photos`?
    exhibit: |
      # blkid /dev/loop0 /dev/loop1
      /dev/loop0: LABEL="DATA" UUID="c2b82332-2a49-4df8-beeb-3f20f639afb7" BLOCK_SIZE="4096" TYPE="ext4"
      /dev/loop1: LABEL="PHOTOS" UUID="cc8c6641-d20c-4d32-9317-70b28bae9db1" BLOCK_SIZE="4096" TYPE="ext4"
    options:
      - id: a
        text: "`LABEL=PHOTOS  /srv/photos  ext4  defaults  0  2`"
        rationale: Correct. Source, mount point, type, options, dump and pass are in the right order, and the type matches.
      - id: b
        text: "`UUID=c2b82332-2a49-4df8-beeb-3f20f639afb7  /srv/photos  ext4  defaults  0  2`"
        rationale: Wrong. That UUID belongs to the DATA filesystem on /dev/loop0, so the wrong filesystem would be mounted.
      - id: c
        text: "`/srv/photos  LABEL=PHOTOS  ext4  defaults  0  2`"
        rationale: Wrong. The first field must be the source and the second the mount point; they are swapped.
      - id: d
        text: "`LABEL=photos  /srv/photos  ext4  defaults  0  2`"
        rationale: Wrong. Labels are case-sensitive; the label is PHOTOS, so mount reports that it can't find LABEL=photos.
    answer: [a]
    explanation: >
      An fstab line is: source (device, LABEL= or UUID=), mount point, type, options, dump, pass.
      Each value has to match the real filesystem, which blkid (or lsblk -f) shows.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Using UUIDs and Labels }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Option d changed from an easy xfs mismatch to a lowercase label, which fails because labels are case-sensitive (tested: mount -T reports can't find LABEL=photos)." }
    tags: [fstab, blkid, label]

  - id: 101-104.3-0025
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      A working unit `srv-backup.mount` exists. The administrator now wants the disk mounted only
      when something first accesses `/srv/backup`, not at every boot. What is needed?
    options:
      - id: a
        text: Add `Automount=yes` to the `[Mount]` section of `srv-backup.mount`, then run `systemctl daemon-reload` and restart the unit
        rationale: Wrong. There is no Automount= key; systemd warns about an unknown key and ignores it.
      - id: b
        text: Create `srv-backup.automount` with `[Automount]` `Where=/srv/backup` and an `[Install]` section, then enable that unit instead of the mount unit
        rationale: Correct. An automount unit with the same base name watches the path and starts the matching mount unit on first access.
      - id: c
        text: Rename `srv-backup.mount` to `srv-backup.automount`, keep its contents unchanged and enable the renamed unit
        rationale: Wrong. An automount unit takes an [Automount] section; a [Mount] section with What= is not valid in it, and the mount unit itself is still needed.
      - id: d
        text: Change `WantedBy=multi-user.target` to `WantedBy=local-fs.target` in the mount unit
        rationale: Wrong. That only changes which target pulls in the mount at boot; it still mounts at boot rather than on access.
    answer: [b]
    explanation: >
      Automounting needs a second unit: <name>.automount with an [Automount] section whose Where=
      is the same mount point. Enabling and starting the automount unit (and not the mount unit)
      makes systemd mount the filesystem on first access via the matching .mount unit.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Automounting a Mount Unit }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: fixed, notes: "Option lengths rebalanced; the key was the longest option." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Option b now mentions the [Install] section that enabling needs." }
    tags: [systemd, automount]

  - id: 101-104.3-0026
    type: multi_choice
    difficulty: 5
    pool: holdout
    stem: Which **TWO** conclusions follow from the session below?
    exhibit: |
      $ findmnt -no OPTIONS /mnt/tools
      rw,noexec,relatime
      $ ls -l backup.sh
      -rwxr-xr-x 1 root root 27 Oct 26 11:08 backup.sh
      $ ./backup.sh
      bash: ./backup.sh: Permission denied
      $ sh backup.sh
      backup done
    select_count: 2
    options:
      - id: a
        text: noexec stops scripts on the filesystem from being started directly, even with execute permission set.
        rationale: Correct. ./backup.sh is refused although the file mode allows execution, because the mount is noexec.
      - id: b
        text: noexec only affects compiled binaries, so the denial must come from the file permissions.
        rationale: Wrong. The mode is rwxr-xr-x, so the permissions allow execution; the denial comes from noexec, which applies to scripts too.
      - id: c
        text: An interpreter from another filesystem can still read and run the script, so noexec alone does not stop scripts.
        rationale: Correct. sh is executed from /usr/bin and only reads backup.sh as data, which noexec does not prevent.
      - id: d
        text: "`sh backup.sh` worked because `sh` runs with root privileges that bypass mount options."
        rationale: Wrong. sh is not set-user-ID; it works because it merely reads the file, and a root shell would also be refused for ./backup.sh.
      - id: e
        text: noexec removed the execute bits when the filesystem was mounted, which is why `./backup.sh` failed.
        rationale: Wrong. ls -l still shows the execute bits; noexec leaves file modes alone and is enforced when executing.
    answer: [a, c]
    explanation: >
      noexec makes the kernel refuse execve() of any file on that filesystem, ELF binary or script.
      Passing the script to an interpreter that lives elsewhere sidesteps this, since the interpreter
      only opens the script for reading. noexec reduces risk but is not a full barrier against
      running code.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Filesystems on Bootup }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [noexec, mount-options]

  - id: 101-104.3-0027
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      Ordinary users must be able to mount a tools disk on `/mnt/tools` **and** run the programs on
      it. Which options field achieves this?
    options:
      - id: a
        text: "`noauto,exec,user`"
        rationale: Wrong. user implies noexec, and because it comes after exec it overrides it, so programs cannot run.
      - id: b
        text: "`defaults,user`"
        rationale: Wrong. defaults includes exec, but the later user implies noexec, nosuid and nodev, so programs cannot run.
      - id: c
        text: "`noauto,nouser,exec`"
        rationale: Wrong. nouser means only root may mount the filesystem.
      - id: d
        text: "`noauto,user,exec`"
        rationale: Correct. user allows ordinary users to mount and implies noexec, but the exec that follows overrides it.
    answer: [d]
    explanation: >
      user (and users) imply noexec, nosuid and nodev. Options are applied from left to right, so an
      exec placed after user turns execution back on, while an exec placed before it is cancelled.
      The resulting mount shows noexec or not in the mount or findmnt output.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Filesystems on Bootup }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [user, noexec, mount-options]

  - id: 101-104.3-0028
    type: multi_choice
    difficulty: 5
    pool: holdout
    stem: >
      On a systemd host, `/etc/fstab` contains the line below. The listing shows the unit files that
      systemd generates from it at boot (trimmed). Which **TWO** statements are true?
    exhibit: |
      LABEL=PHOTOS /srv/photo-archive ext4 noauto,x-systemd.automount 0 2

      $ ls /run/systemd/generator
      local-fs.target.requires  local-fs.target.wants
      srv-photo\x2darchive.automount  srv-photo\x2darchive.mount
      $ cat '/run/systemd/generator/srv-photo\x2darchive.mount'
      [Unit]
      Requires=systemd-fsck@dev-disk-by\x2dlabel-PHOTOS.service
      After=systemd-fsck@dev-disk-by\x2dlabel-PHOTOS.service

      [Mount]
      What=/dev/disk/by-label/PHOTOS
      Where=/srv/photo-archive
      Type=ext4
      Options=noauto,x-systemd.automount
    select_count: 2
    options:
      - id: a
        text: The filesystem is mounted when something first accesses `/srv/photo-archive`.
        rationale: Correct. x-systemd.automount makes systemd create an automount unit for the path, which triggers the mount on first access.
      - id: b
        text: Because of `noauto`, the filesystem is never mounted unless an administrator runs `mount /srv/photo-archive`.
        rationale: Wrong. noauto stops it from being mounted at boot, but the generated automount unit still mounts it on access.
      - id: c
        text: The `\x2d` in the names shows the files are corrupt; they must be renamed `srv-photo-archive.*` to work.
        rationale: Wrong. \x2d is systemd's escape for a dash that is part of a path component; the names are correct as generated.
      - id: d
        text: The pass value `2` makes systemd check the filesystem with fsck before mounting it.
        rationale: Correct. A non-zero pass field makes the generator add the systemd-fsck@ dependency shown in [Unit].
      - id: e
        text: The generated units must be copied to `/etc/systemd/system` before systemd uses them.
        rationale: Wrong. Units in the generator directory under /run are loaded directly; copying is not needed.
    answer: [a, d]
    explanation: >
      systemd-fstab-generator turns each fstab line into a .mount unit named after the mount point,
      and x-systemd.automount adds a matching .automount unit. A dash inside a path component is
      escaped as \x2d, because a plain dash stands for "/". A non-zero sixth field becomes an fsck
      dependency on the device.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Automounting a Mount Unit }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [systemd, automount, fstab, naming]

  - id: 101-104.3-0029
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      `/srv/www` is a directory on a writable filesystem. A copy of the same tree must appear at
      `/var/chroot/www` read-only, while `/srv/www` itself stays writable. Which command achieves
      this?
    options:
      - id: a
        text: "`mount -o ro /srv/www /var/chroot/www`"
        rationale: Wrong. Without bind, mount treats /srv/www as a device and fails because it is not a block device.
      - id: b
        text: "`mount --bind /srv/www /var/chroot/www && mount -o remount,ro /var/chroot/www`"
        rationale: Wrong. Remounting without the bind flag changes the underlying filesystem, so /srv/www becomes read-only too.
      - id: c
        text: "`mount -o bind,ro /srv/www /var/chroot/www`"
        rationale: Correct. Current mount creates the bind mount and then makes only that mount read-only.
      - id: d
        text: "`mount -o loop,ro /srv/www /var/chroot/www`"
        rationale: Wrong. loop needs an image file as the source; /srv/www is a directory, so the loop setup fails.
    answer: [c]
    explanation: >
      A read-only flag on a bind mount belongs to that mount only. mount -o bind,ro does it in one
      step (internally a bind followed by remount,bind,ro). A plain remount,ro on the bind target
      applies to the filesystem's superblock and so affects every place it is mounted.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Filesystems on Bootup }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [bind, remount, ro]

  - id: 101-104.3-0030
    type: fill_in
    difficulty: 5
    pool: holdout
    stem: >
      A disk must be mounted on `/srv/web-data` with a systemd mount unit. Type the unit's file name
      exactly as `systemd-escape -p --suffix=mount /srv/web-data` prints it.
    fill_in:
      accepted: ['([''"]?)(/etc/systemd/system/)?srv-web\\x2ddata\.mount\1']
      match: regex
      case_sensitive: true
    explanation: >
      In unit names a "-" stands for "/", so a dash that really is part of a directory name is
      escaped as \x2d. /srv/web-data therefore becomes srv-web\x2ddata.mount. Quote the name in the
      shell (for example systemctl status 'srv-web\x2ddata.mount') so the backslash survives.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Disks with Systemd }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [systemd, systemd-escape, naming]

  # --------------------------------------------------------------------------- practice (CLI)

  - id: 101-104.3-0031
    type: single_choice
    difficulty: 1
    pool: practice
    stem: >
      An administrator needs a place to mount a filesystem by hand for a short repair job. Which
      directory is traditionally used for such temporary mounts?
    options:
      - id: a
        text: "`/boot`"
        rationale: Wrong. /boot holds the kernel and boot loader files.
      - id: b
        text: "`/var`"
        rationale: Wrong. /var holds variable data such as logs, spools and caches.
      - id: c
        text: "`/tmp`"
        rationale: Wrong. /tmp is for temporary files, not a conventional mount point location.
      - id: d
        text: "`/mnt`"
        rationale: Correct. /mnt is the conventional place for filesystems an administrator mounts temporarily.
    answer: [d]
    explanation: >
      /mnt is for temporary, manual mounts by the administrator; /media is for removable media,
      often mounted automatically by the desktop.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: "Where to Mount?" }
    review:
      status: pass2
