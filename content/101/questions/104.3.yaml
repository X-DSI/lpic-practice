    tags: [remount]

  - id: 101-104.3-0038
    type: single_choice
    difficulty: 2
    pool: practice
    stem: What is the effect of `noauto` in an `/etc/fstab` entry?
    options:
      - id: a
        text: Ordinary users may not mount the filesystem
        rationale: Wrong. That is nouser (part of defaults).
      - id: b
        text: The filesystem type is not detected automatically
        rationale: Wrong. Type detection depends on the type field (auto there), not the noauto option.
      - id: c
        text: The filesystem is never checked by fsck during the boot process, even after a crash
        rationale: Wrong. Boot-time checks are controlled by the sixth field (0 = no check).
      - id: d
        text: The filesystem is skipped by `mount -a` and so not mounted at boot
        rationale: Correct. noauto entries are only mounted when someone names them explicitly.
    answer: [d]
    explanation: >
      noauto keeps an entry out of mount -a and the boot process; the entry still supplies the
      defaults when someone runs mount with its mount point or device. It suits removable media.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Filesystems on Bootup }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: fixed, notes: "Option lengths rebalanced; the key was the longest option." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [noauto, fstab]

  - id: 101-104.3-0039
    type: multi_choice
    difficulty: 3
    pool: practice
    stem: >
      An fstab entry has the options `noauto,user` and nothing else. Which **THREE** options does
      the resulting mount get implicitly?
    select_count: 3
    options:
      - id: a
        text: "`noexec`"
        rationale: Correct. user implies noexec unless a later exec overrides it.
      - id: b
        text: "`ro`"
        rationale: Wrong. user does not make the mount read-only; it stays rw.
      - id: c
        text: "`nosuid`"
        rationale: Correct. user implies nosuid, so set-user-ID and set-group-ID bits are ignored.
      - id: d
        text: "`sync`"
        rationale: Wrong. user does not change the I/O mode; async remains the default.
      - id: e
        text: "`nodev`"
        rationale: Correct. user implies nodev, so device files on the filesystem cannot be used.
    answer: [a, c, e]
    explanation: >
      Letting ordinary users mount media is a security risk, so user (and users) imply noexec,
      nosuid and nodev. A later option such as exec can turn one back on: user,exec.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Filesystems on Bootup }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [user, mount-options]

  - id: 101-104.3-0040
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      A USB disk brought in by a visitor is mounted with `nosuid`. What does this option prevent?
    options:
      - id: a
        text: Files on the disk from being owned by root
        rationale: Wrong. Ownership stored on the disk is unchanged; nosuid only changes how special bits are treated.
      - id: b
        text: Ordinary users from writing to the disk
        rationale: Wrong. Write access depends on rw/ro and the file permissions.
      - id: c
        text: A set-user-ID program on the disk from running with its owner's privileges
        rationale: Correct. With nosuid the set-user-ID and set-group-ID bits are ignored, so such a program runs with the caller's own IDs.
      - id: d
        text: Any program stored on the disk from being started by any user, including root
        rationale: Wrong. That is noexec; with nosuid programs still run, just without privilege change.
    answer: [c]
    explanation: >
      A set-user-ID root program copied to removable media could otherwise give root rights to
      whoever runs it. nosuid makes the kernel ignore the setuid and setgid bits on that filesystem.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Filesystems on Bootup }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: fixed, notes: "Option lengths rebalanced; the key was the longest option." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [nosuid, mount-options]

  - id: 101-104.3-0041
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      Which section and key does a systemd `.automount` unit use to name the directory that triggers
      the mount?
    options:
      - id: a
        text: "`[Mount]` with `What=`"
        rationale: Wrong. That section and key belong to the .mount unit and name the source device.
      - id: b
        text: "`[Automount]` with `Where=`"
        rationale: Correct. The automount unit's Where= gives the mount point to watch; it must match the .mount unit's Where=.
      - id: c
        text: "`[Install]` with `WantedBy=`"
        rationale: Wrong. WantedBy= decides which target starts the unit when enabled, not the path.
      - id: d
        text: "`[Automount]` with `What=`"
        rationale: Wrong. Automount units have no What= key; the source is taken from the matching .mount unit.
    answer: [b]
    explanation: >
      An automount unit is small: [Unit] with a Description=, [Automount] with Where= (plus optional
      settings such as TimeoutIdleSec=), and usually an [Install] section. Its name matches the
      mount unit's, with .automount instead of .mount.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Automounting a Mount Unit }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [systemd, automount]

  - id: 101-104.3-0042
    type: fill_in
    difficulty: 3
    pool: practice
    stem: >
      Fill in the mount option that explicitly asks `mount` to attach an image file to a loop device:
      `mount -o ____ /root/rescue.img /mnt/rescue`
    fill_in:
      accepted: [loop]
      match: normalized
      case_sensitive: true
    explanation: >
      The loop option makes mount attach the file to a free /dev/loopN device and mount that. Current
      util-linux mount also does this automatically when the source is a regular file, and detaches
      the loop device again on umount.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting and Unmounting Filesystems }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [loop]

  - id: 101-104.3-0043
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      After writing `mnt-media.mount`, an administrator ran `systemctl daemon-reload` and
      `systemctl start mnt-media.mount`. The disk was mounted, but after a reboot it is not. What
      was missing?
    options:
      - id: a
        text: "`systemctl daemon-reexec` after the reload"
        rationale: Wrong. daemon-reexec restarts the systemd manager itself; it does not make a unit start at boot.
      - id: b
        text: An entry for the same disk in `/etc/mtab`
        rationale: Wrong. /etc/mtab is a link to the kernel's list of current mounts and is not configuration.
      - id: c
        text: "`systemctl restart mnt-media.mount`"
        rationale: Wrong. Restarting only remounts it in the running system, like start.
      - id: d
        text: "`systemctl enable mnt-media.mount`"
        rationale: Correct. enable creates the link from the target in WantedBy= so the unit is started at every boot.
    answer: [d]
    explanation: >
      start acts on the running system only. enable reads the [Install] section and links the unit
      into the named target (for example multi-user.target), so it is started on every boot;
      enable --now does both at once.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Disks with Systemd }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [systemd, mount-unit]

  - id: 101-104.3-0044
    type: single_choice
    difficulty: 4
    pool: practice
    stem: >
      An ordinary user mounted the disk below. Why does the mount show `nosuid,nodev,noexec`
      although the fstab entry does not list them?
    exhibit: |
      $ grep photos /etc/fstab
      LABEL=PHOTOS  /mnt/photos  ext4  noauto,user  0  0
      $ mount /mnt/photos
      $ mount -t ext4 | grep photos
      /dev/loop1 on /mnt/photos type ext4 (rw,nosuid,nodev,noexec,relatime,user=nobody)
    options:
      - id: a
        text: The `user` option implies `nosuid`, `nodev` and `noexec`
        rationale: Correct. user brings these three restrictions with it unless later options override them.
      - id: b
        text: "`noauto` adds them because the disk was not mounted at boot"
        rationale: Wrong. noauto only keeps the entry out of mount -a; it adds no other options.
      - id: c
        text: The kernel adds them to every ext4 filesystem on a loop device
        rationale: Wrong. Loop-mounted ext4 filesystems get no such options by default.
      - id: d
        text: A dump value of `0` disables execution on the filesystem
        rationale: Wrong. The fifth field is only the dump backup flag.
    answer: [a]
    explanation: >
      Because user lets anyone mount media, it also implies nosuid, nodev and noexec. The user=nobody
      entry records who mounted it, which is used to decide who may unmount it. To allow programs,
      write noauto,user,exec.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Filesystems on Bootup }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [user, mount-options]

  - id: 101-104.3-0045
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      After adding the fstab line below, `mount -a` prints an error. `blkid -L DATA` finds the
      filesystem. What fixes the problem?
    exhibit: |
      LABEL=DATA  /srv/data  ext4  defaults,noatime  0  2

      # mount -a
      mount: /srv/data: mount point does not exist.
             dmesg(1) may have more information after failed mount system call.
    options:
      - id: a
        text: Replace `LABEL=DATA` with the filesystem's UUID
        rationale: Wrong. The label was found; the error concerns the target directory, not the source.
      - id: b
        text: Change the last field from `2` to `0`
        rationale: Wrong. The pass field only controls the boot-time fsck; it does not create the mount point.
      - id: c
        text: Run `mkfs.ext4` on the device so it can be mounted
        rationale: Wrong. The filesystem exists; reformatting would destroy its data and still leave /srv/data missing.
      - id: d
        text: Create the directory with `mkdir /srv/data`
        rationale: Correct. A mount point must be an existing directory; once it exists, mount -a succeeds.
    answer: [d]
    explanation: >
      The mount point named in the second field must already exist. `findmnt --verify` checks
      /etc/fstab for this and similar problems without mounting anything.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting and Unmounting Filesystems }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Difficulty 4 -> 3; the error message points at the answer." }
    tags: [fstab, troubleshooting]
