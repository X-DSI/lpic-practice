    tags: [mnt, fhs]

  - id: 101-104.3-0032
    type: single_choice
    difficulty: 1
    pool: practice
    stem: What does running `mount` with no arguments do?
    options:
      - id: a
        text: It lists the filesystems that are currently mounted
        rationale: Correct. Without arguments mount prints the mount table, one "source on target type type (options)" line each.
      - id: b
        text: It mounts everything listed in `/etc/fstab`
        rationale: Wrong. That needs the -a option.
      - id: c
        text: It prints the contents of `/etc/fstab`
        rationale: Wrong. It shows what is mounted now, which may differ from the configuration in /etc/fstab.
      - id: d
        text: It lists all block devices together with their filesystem types
        rationale: Wrong. That is what lsblk -f or blkid do; unmounted devices do not appear in mount's output.
    answer: [a]
    explanation: >
      Plain mount shows every mounted filesystem, including in-memory ones such as proc, sysfs and
      tmpfs. Add -t type (or use findmnt) to narrow the list.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Listing Mounted Filesystems }
    verify:
      command: mount
      expect: { exit_code: 0, stdout_regex: " on / type " }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: fixed, notes: "Option lengths rebalanced; the key was the longest option." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [mount]

  - id: 101-104.3-0033
    type: single_choice
    difficulty: 1
    pool: practice
    stem: >
      Which option in an `/etc/fstab` entry lets an ordinary (non-root) user mount that filesystem?
    options:
      - id: a
        text: "`auto`"
        rationale: Wrong. auto means the entry is mounted by mount -a and at boot; it does not grant users anything.
      - id: b
        text: "`user`"
        rationale: Correct. user allows an ordinary user to mount the filesystem described by that entry.
      - id: c
        text: "`rw`"
        rationale: Wrong. rw makes the mounted filesystem writable; it does not decide who may mount it.
      - id: d
        text: "`dev`"
        rationale: Wrong. dev lets device files on the filesystem be used; it is unrelated to who may mount it.
    answer: [b]
    explanation: >
      Normally only root may mount. The user option (and users) in an fstab entry lets ordinary users
      mount that filesystem by naming its mount point or device, as in mount /media/usb.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Filesystems on Bootup }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [user, mount-options]

  - id: 101-104.3-0034
    type: fill_in
    difficulty: 2
    pool: practice
    stem: >
      Type the util-linux command that, given `/dev/sdc1`, prints that filesystem's attributes as
      KEY="value" pairs, for example `UUID="…" TYPE="ext4"`.
    fill_in:
      accepted: ['(sudo\s+)?((/usr)?/s?bin/)?blkid(\s+/dev/sdc1)?']
      match: regex
      case_sensitive: true
    explanation: >
      blkid identifies the content of block devices and prints LABEL, UUID, TYPE and similar tags as
      KEY="value" pairs. lsblk -f shows the same data as table columns.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Using UUIDs and Labels }
