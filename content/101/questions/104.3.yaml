    tags: [blkid]

  - id: 101-104.3-0035
    type: single_choice
    difficulty: 2
    pool: practice
    stem: >
      Before you pull a USB stick mounted on `/media/usb`, you want to see whether any program still
      has a file open on it, with the file names and process IDs. Which command shows this?
    options:
      - id: a
        text: "`blkid /media/usb`"
        rationale: Wrong. blkid prints the filesystem's label, UUID and type, not processes.
      - id: b
        text: "`ps -ef /media/usb`"
        rationale: Wrong. ps lists processes but cannot filter them by the filesystem they use.
      - id: c
        text: "`lsof /media/usb`"
        rationale: Correct. Given a mount point (or a mounted device), lsof lists every open file on that filesystem with the command and PID.
      - id: d
        text: "`lsblk /media/usb`"
        rationale: Wrong. lsblk shows device details and mount points, not who is using them.
    answer: [c]
    explanation: >
      lsof with a block device or mount point argument lists the open files on that filesystem,
      including current directories (FD cwd). Close those programs or leave the directory, then
      unmount again.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Dealing with Open Files }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Stem rewritten (USB stick before removal); the old one restated Guided Exercise 2. Text supplied by the reviewer; verified by the reviewer." }
    tags: [lsof, busy]

  - id: 101-104.3-0036
    type: single_choice
    difficulty: 2
    pool: practice
    stem: In an `/etc/fstab` line, which field holds the comma-separated mount options?
    options:
      - id: a
        text: The fourth field
        rationale: Correct. The order is source, mount point, type, options, dump, pass, so options come fourth.
      - id: b
        text: The second field
        rationale: Wrong. The second field is the mount point.
      - id: c
        text: The third field
        rationale: Wrong. The third field is the filesystem type.
      - id: d
        text: The sixth field
        rationale: Wrong. The sixth field is the fsck pass number.
    answer: [a]
    explanation: >
      Each fstab line has up to six fields: source (device, LABEL= or UUID=), mount point, type,
      options, dump flag and fsck pass number.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Filesystems on Bootup }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [fstab]

  - id: 101-104.3-0037
    type: fill_in
    difficulty: 2
    pool: practice
    stem: >
      `/srv/data` is mounted. Fill in the blank so it stops updating access times without being
      unmounted: `mount -o ____,noatime /srv/data`
    fill_in:
      accepted: [remount]
      match: normalized
      case_sensitive: true
    explanation: >
      `mount -o remount,noatime /srv/data` applies new options to the mounted filesystem in place. The
      mount point (or device) is enough; type and source are already known.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Filesystems on Bootup }
