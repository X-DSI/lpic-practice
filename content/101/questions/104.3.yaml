  - id: 101-104.3-0001
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      An administrator wants a new data partition to be attached to the directory tree automatically
      every time the system starts. Which file should get a new line describing it?
    options:
      - id: a
        text: "`/etc/mtab`"
        rationale: Wrong. On current systems /etc/mtab is a symbolic link to /proc/self/mounts, which shows what is mounted right now; it is not configuration.
      - id: b
        text: "`/etc/filesystems`"
        rationale: Wrong. This optional file lists filesystem types for mount to try when no type is given; it does not describe what to mount where.
      - id: c
        text: "`/etc/fstab`"
        rationale: Correct. Each line of /etc/fstab describes a filesystem, its mount point, type and options, and it is read at boot.
      - id: d
        text: "`/proc/mounts`"
        rationale: Wrong. This is a kernel-generated view of the current mounts; it cannot be edited to configure boot-time mounts.
    answer: [c]
    explanation: >
      /etc/fstab is the static table of filesystems. At boot (and with mount -a) every entry that is
      not marked noauto is mounted. The list of what is mounted at this moment lives in the kernel
      and is shown through /proc/self/mounts, which /etc/mtab points to.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Filesystems on Bootup }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [fstab]

  - id: 101-104.3-0002
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      Under the Filesystem Hierarchy Standard, which directory is meant to hold the mount points for
      removable media such as USB sticks and memory cards?
    options:
      - id: a
        text: "`/media`"
        rationale: Correct. The FHS reserves /media for mount points of removable media, and desktop systems mount such devices below it.
      - id: b
        text: "`/srv`"
        rationale: Wrong. /srv holds data served by the system, such as web or FTP content.
      - id: c
        text: "`/opt`"
        rationale: Wrong. /opt is for add-on application software packages.
      - id: d
        text: "`/dev`"
        rationale: Wrong. /dev contains device files, not mount points.
    answer: [a]
    explanation: >
      /media is for removable media; on many desktops a stick appears under /media/<user>/<label>.
      /mnt is traditionally the place for filesystems that an administrator mounts temporarily by
      hand.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: "Where to Mount?" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [media, fhs]

  - id: 101-104.3-0003
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      You have finished copying files to an external disk mounted on `/mnt/ext`. Which command
      detaches the filesystem so the disk can be removed safely?
    options:
      - id: a
        text: "`unmount /mnt/ext`"
        rationale: Wrong. There is no standard unmount command; the utility is spelled umount.
      - id: b
        text: "`mount -u /mnt/ext`"
        rationale: Wrong. Linux mount has no -u option for unmounting.
      - id: c
        text: "`fsck /mnt/ext`"
        rationale: Wrong. fsck checks a filesystem for errors; it does not unmount it.
      - id: d
        text: "`umount /mnt/ext`"
        rationale: Correct. umount detaches the filesystem; it accepts either the mount point or the device.
    answer: [d]
    explanation: >
      umount (with no "n") detaches a mounted filesystem and writes out pending data first. You can
      name the mount point or the device that is mounted there.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Additional Command Line Parameters }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [umount]

  - id: 101-104.3-0004
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      An `/etc/fstab` line begins with `UUID=0b3f9c2e-6d1a-4e57-9a80-3c1d2b7e4f15` instead of a device
      name such as `/dev/sdb1`. What does this achieve?
    options:
      - id: a
        text: A new UUID is written to the filesystem each time it is mounted
        rationale: Wrong. Mounting never changes the UUID; it is set when the filesystem is created or changed on purpose with a tool such as tune2fs.
      - id: b
        text: The filesystem is found by its own ID, whatever device name the disk gets
        rationale: Correct. The UUID belongs to the filesystem, so the entry keeps working when the kernel names the disk differently.
      - id: c
        text: Only the user account with that UUID may mount the filesystem from the command line
        rationale: Wrong. User accounts are identified by UID numbers, and the user/users options control who may mount.
      - id: d
        text: The filesystem is mounted over the network from the host with that UUID
        rationale: Wrong. Network filesystems are named with host:/path or //host/share sources, not UUID=.
    answer: [b]
    explanation: >
      Device names such as /dev/sdb1 depend on detection order and ports. A filesystem UUID (or a
      label, with LABEL=) stays the same until the filesystem is recreated or the value is changed
      deliberately, so it is the safer way to refer to the filesystem in /etc/fstab.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Using UUIDs and Labels }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: fixed, notes: "Option lengths rebalanced; the key was the longest option." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [uuid, fstab]

  - id: 101-104.3-0005
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      Which type of systemd unit file describes a filesystem to mount, using `What=` and `Where=`
      settings?
    options:
      - id: a
        text: A `.path` unit
        rationale: Wrong. A .path unit watches files or directories and starts another unit when they change.
      - id: b
        text: A `.target` unit
        rationale: Wrong. A target groups other units into a synchronisation point, such as multi-user.target.
      - id: c
        text: A `.mount` unit
        rationale: Correct. A .mount unit has a [Mount] section whose What= names the source and Where= the mount point.
      - id: d
        text: A `.swap` unit
        rationale: Wrong. A .swap unit activates a swap device or file; it has What= but no Where=.
    answer: [c]
    explanation: >
      systemd can mount filesystems itself. Each mount point gets a .mount unit with a [Mount]
      section (What=, Where=, Type=, Options=); an optional .automount unit with the same base name
      mounts it on first access.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Disks with Systemd }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [systemd, mount-unit]

  - id: 101-104.3-0006
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      `mount -a` reports that it cannot find the device for the line
      `UUID=… /data ext4 defaults 0 2`. Which command lists the UUIDs of the filesystems the system
      can see, so you can compare them?
    options:
      - id: a
        text: "`blkid`"
        rationale: Correct. Without arguments, blkid prints the attributes of every filesystem it finds, including UUID, LABEL and TYPE.
      - id: b
        text: "`fdisk -l`"
        rationale: Wrong. fdisk -l shows partition tables and disk identifiers, not the UUID stored inside a filesystem.
      - id: c
        text: "`df -T`"
        rationale: Wrong. df -T adds the filesystem type to the usage report; it does not show UUIDs.
      - id: d
        text: "`mount -l`"
        rationale: Wrong. mount -l lists mounted filesystems and adds their labels in brackets, but no UUIDs.
    answer: [a]
    explanation: >
      blkid reads the filesystem signature on the device and prints it as KEY="value" pairs, for
      example UUID="…" TYPE="ext4". lsblk -f shows the same information as columns.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Using UUIDs and Labels }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: fixed, notes: "Removed verify block (blkid --help proves nothing about the key)." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Stem rewritten (troubleshooting a UUID line); the old one restated Guided Exercise 4. Text supplied by the reviewer; verified by the reviewer." }
    tags: [blkid, uuid]

  - id: 101-104.3-0007
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      `umount /srv/share` fails with "target is busy". Which command lists the processes that are
      using the filesystem mounted there?
    options:
      - id: a
        text: "`findmnt /srv/share`"
        rationale: Wrong. findmnt shows the mount itself (source, type, options), not which processes use it.
      - id: b
        text: "`lsblk /srv/share`"
        rationale: Wrong. lsblk lists block devices; it does not report processes, and it expects a device rather than a directory.
      - id: c
        text: "`df /srv/share`"
        rationale: Wrong. df reports the space used and free on the filesystem, nothing about processes.
      - id: d
        text: "`fuser -vm /srv/share`"
        rationale: Correct. fuser -m reports every process using the filesystem that contains the given path; -v shows user, PID, access type and command.
    answer: [d]
    explanation: >
      A filesystem is busy while a process has a file open on it or has its current directory there.
      fuser -m (with -v for a readable table) and lsof given the mount point or device both name those
      processes, so you can close them before unmounting.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Dealing with Open Files }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [fuser, busy]

  - id: 101-104.3-0008
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      A shared upload area is mounted on `/srv/uploads`. Users must not be able to run programs
      directly from it. Which mount option provides this?
    options:
      - id: a
        text: "`nodev`"
        rationale: Wrong. nodev stops device files on the filesystem from being interpreted; programs can still run.
      - id: b
        text: "`noexec`"
        rationale: Correct. noexec makes the kernel refuse to execute files directly from that filesystem.
      - id: c
        text: "`noauto`"
        rationale: Wrong. noauto only keeps the filesystem from being mounted by mount -a or at boot.
      - id: d
        text: "`nouser`"
        rationale: Wrong. nouser means only root may mount it; it says nothing about running programs.
    answer: [b]
    explanation: >
      noexec blocks direct execution of binaries and scripts stored on the filesystem. Its
      counterpart exec is part of defaults. Related hardening options are nosuid (ignore set-user-ID
      and set-group-ID bits) and nodev (ignore device files).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Filesystems on Bootup }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [noexec, mount-options]

  - id: 101-104.3-0009
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      After a boot problem the root filesystem is mounted read-only. Which command makes it writable
      again without unmounting it?
    options:
      - id: a
        text: "`mount -a`"
        rationale: Wrong. mount -a only mounts fstab entries that are not mounted yet; it skips / because it is already mounted.
      - id: b
        text: "`umount -r /`"
        rationale: Wrong. umount -r falls back to remounting read-only when unmounting fails, the opposite of what is needed.
      - id: c
        text: "`mount -o remount,rw /`"
        rationale: Correct. remount changes the options of an already mounted filesystem; rw makes it writable.
      - id: d
        text: "`mount -o remount,ro /`"
        rationale: Wrong. This remounts / read-only, which it already is.
    answer: [c]
    explanation: >
      The remount option applies new options to a filesystem that is already mounted, without
      unmounting it. Only the mount point (or device) is needed; the type and source are already
      known.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Filesystems on Bootup }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [remount]

  - id: 101-104.3-0010
    type: fill_in
    difficulty: 2
    pool: holdout
    stem: >
      You added three lines to `/etc/fstab` and want to test them without rebooting. Type the
      `mount` option that mounts every filesystem listed in `/etc/fstab` that is not marked `noauto`.
    fill_in:
      accepted: ['((sudo\s+)?((/usr)?/s?bin/)?mount\s+)?(-a|--all)(\s+(-v|--verbose))?', '((sudo\s+)?((/usr)?/s?bin/)?mount\s+)?(-av|-va)']
      match: regex
      case_sensitive: true
    explanation: >
      `mount -a` (long form `--all`) walks through /etc/fstab and mounts each entry that is not
      already mounted and not marked noauto. Running it after editing the file catches mistakes before
      the next boot does; `findmnt --verify` checks the file without mounting anything.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Additional Command Line Parameters }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [mount, fstab]

  - id: 101-104.3-0011
    type: multi_choice
    difficulty: 2
    pool: holdout
    stem: >
      A USB disk is sometimes detected as `/dev/sdb` and sometimes as `/dev/sdc`. Which **TWO** forms
      of the first `/etc/fstab` field keep finding its filesystem either way?
    select_count: 2
    options:
      - id: a
        text: "`LABEL=archive`"
        rationale: Correct. The label is stored in the filesystem, so it does not depend on the device name.
      - id: b
        text: "`/dev/sdb1`"
        rationale: Wrong. This names a device node, which points to a different disk when detection order changes.
      - id: c
        text: "`DEVICE=sdb1`"
        rationale: Wrong. DEVICE= is not a recognised source tag in fstab, and sdb1 is still the changing kernel name.
      - id: d
        text: "`UUID=5e1f8a3c-2b47-4d09-8c6e-91a0f3d7b2e4`"
        rationale: Correct. The filesystem UUID is stored in the filesystem and is independent of the device name.
    answer: [a, d]
    explanation: >
      LABEL= and UUID= identify the filesystem by data stored inside it, so the entry follows the
      filesystem whatever name the kernel gives the disk. Labels are easier to read but must be kept
      unique by the administrator; UUIDs are unique by design.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Using UUIDs and Labels }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [uuid, label, fstab]

  - id: 101-104.3-0012
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      You downloaded `debian.iso` and want to browse its contents under the existing directory
      `/mnt/iso`. Which command does this?
    options:
      - id: a
        text: "`mount /mnt/iso debian.iso`"
        rationale: Wrong. The source must come first; here mount treats /mnt/iso as the source and fails because it is not a block device.
      - id: b
        text: "`mount -o loop debian.iso /mnt/iso`"
        rationale: Correct. The loop option attaches the image file to a loop device and mounts the filesystem in it.
      - id: c
        text: "`mount --bind debian.iso /mnt/iso`"
        rationale: Wrong. A bind mount makes a file or directory visible elsewhere; binding a file onto a directory fails with "Not a directory".
      - id: d
        text: "`losetup /mnt/iso debian.iso`"
        rationale: Wrong. losetup's first argument must be a loop device such as /dev/loop0, and losetup never mounts anything.
    answer: [b]
    explanation: >
      An image file is not a block device, so mount uses a loop device to present it as one. The
      loop option asks for this explicitly; current versions of mount also set up a loop device on
      their own when the source is a regular file.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting and Unmounting Filesystems }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [loop, mount]

  - id: 101-104.3-0013
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      `systemctl list-units` shows a mount unit named `var-lib-backups.mount`. Type the absolute path
      of the directory it mounts.
    fill_in:
      accepted: ['/var/lib/backups/?']
      match: regex
      case_sensitive: true
    explanation: >
      A mount unit's name is its mount point path with the leading slash dropped, the other slashes
      turned into dashes and .mount appended, so var-lib-backups.mount mounts /var/lib/backups. A
      real dash in the path is escaped as \x2d. `systemd-escape -p -u var-lib-backups` converts the
      name back to the path.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Disks with Systemd }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: fixed, notes: "Removed verify block (systemd-escape is not in debian:stable-slim)." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Turned around (unit name to mount point); the old direction restated Explorational Exercise 5. Text supplied by the reviewer; verified by the reviewer." }
    tags: [systemd, mount-unit, naming]

  - id: 101-104.3-0014
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: Which set of options does the `defaults` mount option stand for?
    options:
      - id: a
        text: "`rw, suid, dev, exec, auto, user, async`"
        rationale: Wrong. defaults includes nouser, so ordinary users may not mount the filesystem.
      - id: b
        text: "`rw, nosuid, nodev, exec, auto, nouser, async`"
        rationale: Wrong. defaults allows set-user-ID bits and device files (suid, dev); nosuid and nodev must be added explicitly.
      - id: c
        text: "`ro, suid, dev, exec, auto, nouser, sync`"
        rationale: Wrong. defaults mounts read-write and with asynchronous I/O (rw, async).
      - id: d
        text: "`rw, suid, dev, exec, auto, nouser, async`"
        rationale: Correct. This is the set the mount manual page gives for defaults.
    answer: [d]
    explanation: >
      defaults means rw, suid, dev, exec, auto, nouser and async. Options written after it override
      single items, so `defaults,noexec` is the usual way to keep everything else and forbid
      execution.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Filesystems on Bootup }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [defaults, mount-options]

  - id: 101-104.3-0015
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      Two `/etc/fstab` entries for removable drives differ only in the options `user` and `users`.
      What is the difference?
    options:
      - id: a
        text: With `users`, any ordinary user may unmount the filesystem; with `user`, only the user who mounted it (or root) may
        rationale: Correct. Both let ordinary users mount; users also lets any user unmount, while user restricts unmounting to the user who mounted it and root.
      - id: b
        text: With `user`, only the owner of the device file may mount it; with `users`, any member of the device file's group may mount it
        rationale: Wrong. Those rules belong to the owner and group options.
      - id: c
        text: "`users` lets ordinary users mount it; `user` is a synonym for `nouser`"
        rationale: Wrong. user is not a synonym for nouser; it explicitly allows ordinary users to mount the filesystem.
      - id: d
        text: There is no difference; `users` is accepted only as an alias of `user`
        rationale: Wrong. The two options differ in who may unmount the filesystem.
    answer: [a]
    explanation: >
      user and users both allow an ordinary user to mount the filesystem. The mounting user is
      recorded, and with user only that user (or root) can unmount it; users lets any user unmount
      it. Both also imply noexec, nosuid and nodev unless later options override them.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Mounting Filesystems on Bootup }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: fixed, notes: "Option lengths rebalanced; the key was the longest option." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [user, users, mount-options]

  - id: 101-104.3-0016
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      Type the `lsblk` option that adds filesystem columns (such as FSTYPE, LABEL, UUID and
      MOUNTPOINTS) to its device list.
    fill_in:
      accepted: ['((sudo\s+)?((/usr)?/s?bin/)?lsblk\s+)?(-f|--fs)(\s+(?!-)\S+)*']
      match: regex
      case_sensitive: true
    explanation: >
      `lsblk -f` (long form `--fs`) shows each block device with its filesystem type, label, UUID,
      free space, use percentage and mount points. Adding a device name, as in `lsblk -f /dev/sdb`,
      limits the output to that device.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.3", lesson: 1, section: Using UUIDs and Labels }
    verify:
      command: lsblk --help
      expect: { exit_code: 0, stdout_regex: "-f, --fs" }
    review:
      status: pass2
