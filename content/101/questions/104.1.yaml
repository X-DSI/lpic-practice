    tags: [mkfs.fat, label]

  - id: 101-104.1-0027
    type: multi_choice
    difficulty: 3
    pool: practice
    stem: >
      Which **TWO** commands create an ext4 filesystem on the existing partition `/dev/sdb1`?
    select_count: 2
    options:
      - id: a
        text: "`mke2fs -L ext4 /dev/sdb1`"
        rationale: Wrong. -L sets the label; called as mke2fs without -t, it creates ext2, here labelled "ext4".
      - id: b
        text: "`mkfs.ext4 /dev/sdb1`"
        rationale: Correct. mkfs.ext4 is a link to mke2fs, which creates ext4 when called by this name.
      - id: c
        text: "`mke2fs -t ext4 /dev/sdb1`"
        rationale: Correct. -t selects the filesystem type, so this is equivalent to mkfs.ext4.
      - id: d
        text: "`parted /dev/sdb mkpart data ext4 1MiB 100%`"
        rationale: Wrong. This tries to create a new partition, and parted's filesystem-type word never creates a filesystem anyway.
    answer: [b, c]
    explanation: >
      mkfs.ext2, mkfs.ext3 and mkfs.ext4 are links to mke2fs, which picks its defaults from the name
      it is called by or from -t. Plain mke2fs creates ext2 unless told otherwise.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.1", lesson: 1, section: Creating an ext2/ext3/ext4 Filesystem }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok, notes: "e2fsprogs 1.47.0: mke2fs -L ext4 produced TYPE=ext2 LABEL=ext4; mkfs.ext* are symlinks to mke2fs on Ubuntu 24.04." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [mke2fs, mkfs.ext4]

  - id: 101-104.1-0028
    type: single_choice
    difficulty: 2
    pool: practice
    stem: >
      In `gdisk`, which type code do you give a GPT partition that will be used as Linux swap?
    options:
      - id: a
        text: "`8200`"
        rationale: Correct. 8200 is gdisk's code for Linux swap.
      - id: b
        text: "`82`"
        rationale: Wrong. 82 is the one-byte MBR code used in fdisk on DOS disks.
      - id: c
        text: "`8300`"
        rationale: Wrong. 8300 is a Linux filesystem partition.
      - id: d
        text: "`EF00`"
        rationale: Wrong. EF00 is the EFI system partition.
    answer: [a]
    explanation: >
      gdisk maps GPT type GUIDs to four-digit codes: 8300 Linux filesystem, 8200 Linux swap, EF00
      EFI system. After setting the type and writing with w, mkswap prepares the partition.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.1", lesson: 1, section: Creating Swap Partitions }
    review:
      status: pass2
