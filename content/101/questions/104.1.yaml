        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Difficulty 3 -> 2 to match its mirror question 0006." }
    tags: [gdisk, partition-type, swap]

  - id: 101-104.1-0029
    type: single_choice
    difficulty: 4
    pool: practice
    stem: Which sequence creates and activates a 2 GiB swap file at `/swapfile`?
    options:
      - id: a
        text: "`dd if=/dev/zero of=/swapfile bs=1M count=2048`; `swapon /swapfile`; `mkswap /swapfile`"
        rationale: Wrong. swapon fails on a file that mkswap has not prepared yet; the last two steps are in the wrong order.
      - id: b
        text: "`touch /swapfile`; `chmod 600 /swapfile`; `mkswap /swapfile`; `swapon /swapfile`"
        rationale: Wrong. touch creates an empty file; mkswap rejects it because a swap area needs at least 40 KiB.
      - id: c
        text: "`dd if=/dev/zero of=/swapfile bs=1M count=2048`; `chmod 600 /swapfile`; `mkswap /swapfile`; `swapon /swapfile`"
        rationale: Correct. dd allocates 2048 x 1 MiB, chmod restricts access, mkswap writes the swap signature and swapon activates it.
      - id: d
        text: "`dd if=/dev/zero of=/swapfile bs=1M count=2048`; `chmod 600 /swapfile`; `mkfs -t swap /swapfile`; `swapon /swapfile`"
        rationale: Wrong. There is no mkfs.swap helper, so mkfs -t swap fails; swap is prepared with mkswap.
    answer: [c]
    explanation: >
      A swap file needs real space (dd from /dev/zero), mode 0600, a swap signature from mkswap and
      activation with swapon. An /etc/fstab entry makes it come back after a reboot.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.1", lesson: 1, section: Creating Swap Partitions }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok, notes: "mkswap on an empty file: \"swap area needs to be at least 40 KiB\"; mkfs -t swap: \"failed to execute mkfs.swap\"." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [swap, mkswap, swapon, dd]

  - id: 101-104.1-0030
    type: single_choice
    difficulty: 4
    pool: practice
    stem: >
      `/dev/sdb1` held an old ext4 filesystem that is no longer needed. Creating XFS on it fails as
      shown. Which command creates the XFS filesystem?
    exhibit: |
      # mkfs.xfs /dev/sdb1
      mkfs.xfs: /dev/sdb1 appears to contain an existing filesystem (ext4).
      mkfs.xfs: Use the -f option to force overwrite.
    options:
      - id: a
        text: "`mkfs.xfs -N /dev/sdb1`"
        rationale: Wrong. -N only prints the parameters it would use and writes nothing.
      - id: b
        text: "`mkfs.xfs -q /dev/sdb1`"
        rationale: Wrong. -q only silences the output; the existing filesystem still blocks creation.
      - id: c
        text: "`mkfs.xfs -F /dev/sdb1`"
        rationale: Wrong. -F is mke2fs's force option; mkfs.xfs does not accept it.
      - id: d
        text: "`mkfs.xfs -f /dev/sdb1`"
        rationale: Correct. -f tells mkfs.xfs to overwrite the existing filesystem signature.
    answer: [d]
    explanation: >
      mkfs.xfs refuses to overwrite a device that already holds a recognisable filesystem unless you
      add -f. mke2fs uses -F for a similar purpose, which is an easy pair to mix up.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.1", lesson: 1, section: Creating an XFS Filesystem }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok, notes: "Exhibit from mkfs.xfs 6.6.0 on an ext4 image (path renamed); -f succeeds." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [mkfs.xfs, force]
