        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [fdisk]

  - id: 101-104.1-0022
    type: single_choice
    difficulty: 1
    pool: practice
    stem: Which of these filesystems supports subvolumes and snapshots by itself?
    options:
      - id: a
        text: Btrfs
        rationale: Correct. Btrfs has built-in subvolumes and copy-on-write snapshots.
      - id: b
        text: ext4
        rationale: Wrong. ext4 has no subvolumes or snapshots of its own; snapshots need something like LVM underneath.
      - id: c
        text: VFAT
        rationale: Wrong. VFAT is a simple FAT filesystem without such features.
      - id: d
        text: exFAT
        rationale: Wrong. exFAT is designed for removable media and has no subvolumes or snapshots.
    answer: [a]
    explanation: >
      Btrfs is a copy-on-write filesystem with subvolumes, snapshots, multi-device support,
      transparent compression and checksums built in.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.1", lesson: 1, section: Getting to Know the Btrfs Filesystem }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [btrfs]

  - id: 101-104.1-0023
    type: multi_choice
    difficulty: 2
    pool: practice
    stem: Which **TWO** statements about extended partitions on an MBR disk are true?
    select_count: 2
    options:
      - id: a
        text: Logical partitions inside it are numbered from 5 upward.
        rationale: Correct. Numbers 1 to 4 are reserved for the primary slots, so the first logical partition is 5 (for example /dev/sda5).
      - id: b
        text: A disk can have up to four extended partitions.
        rationale: Wrong. Only one extended partition is allowed; it takes one of the four primary slots.
      - id: c
        text: Linux can only mount filesystems that are on primary partitions.
        rationale: Wrong. Linux treats logical partitions like primary ones; any of them can hold a filesystem or swap.
      - id: d
        text: Deleting the extended partition also deletes the logical partitions inside it.
        rationale: Correct. The logical partitions live inside the extended one, so they disappear with it.
    answer: [a, d]
    explanation: >
      An extended partition uses one of the four MBR slots as a container for logical partitions,
      which are numbered from 5. For Linux, logical and primary partitions work the same way.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.1", lesson: 1, section: Primary vs Extended Partitions }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok, notes: "fdisk 2.39.3 on an image: logical partitions became 5 and 6; deleting extended partition 2 removed both." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [mbr, extended-partition, logical-partition]

  - id: 101-104.1-0024
    type: single_choice
    difficulty: 2
    pool: practice
    stem: >
      On a GPT disk you deleted partition 2 of 3, so the remaining partitions are numbered 1 and 3.
      Which `gdisk` command renumbers them to remove the gap?
    options:
      - id: a
        text: "`r`"
        rationale: Wrong. r opens the recovery and transformation menu.
      - id: b
        text: "`o`"
        rationale: Wrong. o creates a new, empty GPT, discarding every partition.
      - id: c
        text: "`t`"
        rationale: Wrong. t changes a partition's type code.
      - id: d
        text: "`s`"
        rationale: Correct. s sorts the partition entries so they are numbered in order without gaps.
    answer: [d]
    explanation: >
      gdisk's s command sorts partitions by their position on the disk and renumbers them. Note that
      in fdisk the same letter does something else entirely (it creates a Sun disk label).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.1", lesson: 1, section: Deleting a Partition }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok, notes: "Command letters checked in the gdisk 1.0.10 and fdisk 2.39.3 menus." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [gdisk, gpt]

  - id: 101-104.1-0025
    type: single_choice
    difficulty: 2
    pool: practice
    stem: How do you make Btrfs compress files transparently as they are written?
    options:
      - id: a
        text: Create the filesystem with `mkfs.btrfs -d raid0`
        rationale: Wrong. -d raid0 sets the data profile to striping across devices; it has nothing to do with compression.
      - id: b
        text: Mount the filesystem with the `compress` option
        rationale: Correct. With -o compress (default algorithm zlib) Btrfs compresses new data where it is worth it.
      - id: c
        text: Take a snapshot with `btrfs subvolume snapshot`
        rationale: Wrong. A snapshot shares existing data blocks; it does not compress anything.
      - id: d
        text: Mount the filesystem with `-o subvol=compress`
        rationale: Wrong. That mounts a subvolume named compress instead of the top level.
    answer: [b]
    explanation: >
      Btrfs compression is a mount option: compress (zlib by default), or compress=lzo or
      compress=zstd. Files that do not compress well are stored uncompressed, so one directory can
      hold both kinds.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "104.1", lesson: 1, section: A Few Words on Compression }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-26", result: ok, notes: "Loop-mounted Btrfs with -o compress shows compress=zlib:3 in /proc/mounts." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [btrfs, compression]

  - id: 101-104.1-0026
    type: fill_in
    difficulty: 3
    pool: practice
    stem: Type the `mkfs.fat` option that sets the volume label of the new filesystem.
    fill_in:
      accepted: ['((sudo\s+)?((/usr)?/s?bin/)?(mkfs\.(v?fat|msdos)|mkdosfs|mkfs\s+-t\s+(v?fat|msdos))\s+(-F\s*(12|16|32)\s+)?)?-n(\s*(?!-)\S+)?(\s+(?!-)\S+)?']
      match: regex
