objective: "101.3"
questions:
  # ---------------------------------------------------------------- holdout (mock exams only)

  - id: 101-101.3-0001
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: On a SysV init system, switching to which runlevel restarts the machine?
    options:
      - id: a
        text: "0"
        rationale: Wrong. Runlevel 0 halts or powers off the system; it does not bring it back up.
      - id: b
        text: "6"
        rationale: Correct. Runlevel 6 is the reboot runlevel.
      - id: c
        text: "1"
        rationale: Wrong. Runlevel 1 is single-user (maintenance) mode.
      - id: d
        text: "5"
        rationale: Wrong. Runlevel 5 is normally multi-user mode with a graphical login.
    answer: [b]
    explanation: >
      Runlevels 0 and 6 are the two "transition" runlevels: 0 shuts the machine down and 6 reboots
      it. That is also why neither may ever be configured as the default runlevel.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.3", lesson: 1, section: SysVinit }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. SysV behaviour checked against upstream sysvinit man pages (no sysvinit on Ubuntu 24.04)." }
    tags: [runlevels, sysvinit]

  - id: 101-101.3-0002
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: Which command is the main tool for starting, stopping and enabling units on a systemd system?
    options:
      - id: a
        text: "`journalctl`"
        rationale: Wrong. journalctl reads the systemd journal (logs); it does not control units.
      - id: b
        text: "`initctl`"
        rationale: Wrong. initctl is the control tool of Upstart, not of systemd.
      - id: c
        text: "`loginctl`"
        rationale: Wrong. loginctl manages user logins and sessions through systemd-logind.
      - id: d
        text: "`systemctl`"
        rationale: Correct. systemctl starts, stops, restarts, enables, disables and queries systemd units.
    answer: [d]
    explanation: >
      systemctl is the front end to the systemd manager. Unit control (start, stop, restart, status),
      boot-time configuration (enable, disable, set-default) and power actions (reboot, poweroff)
      all go through it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.3", lesson: 1, section: systemd }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [systemctl, systemd]

  - id: 101-101.3-0003
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: In which directory does a SysV init system keep the actual service scripts that runlevels use?
    options:
      - id: a
        text: "`/etc/init.d/`"
        rationale: Correct. The service scripts live in /etc/init.d/; the per-runlevel directories only link to them.
      - id: b
        text: "`/etc/systemd/system/`"
        rationale: Wrong. This holds the administrator's systemd unit files and links, not SysV scripts.
      - id: c
        text: "`/etc/init/`"
        rationale: Wrong. /etc/init/ held Upstart job files.
      - id: d
        text: "`/usr/lib/systemd/system/`"
        rationale: Wrong. This holds the systemd unit files shipped by packages.
    answer: [a]
    explanation: >
      SysV init runs shell scripts from /etc/init.d/. The directories /etc/rc0.d/ to /etc/rc6.d/
      contain symbolic links to those scripts, so one script can serve several runlevels.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.3", lesson: 1, section: SysVinit }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. SysV behaviour checked against upstream sysvinit man pages (no sysvinit on Ubuntu 24.04)." }
    tags: [init.d, sysvinit]

  - id: 101-101.3-0004
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: What is the job of the `acpid` daemon?
    options:
      - id: a
        text: Running commands at scheduled times
        rationale: Wrong. Scheduled jobs are handled by cron or atd.
      - id: b
        text: Collecting and storing kernel log messages
        rationale: Wrong. That is the job of the system logger or the systemd journal.
      - id: c
        text: Reacting to power events such as a closed lid or low battery
        rationale: Correct. acpid listens for ACPI events and runs the actions configured for them.
      - id: d
        text: Keeping the clock in sync with time servers
        rationale: Wrong. Time synchronisation is done by an NTP client such as chronyd or systemd-timesyncd.
    answer: [c]
    explanation: >
      acpid is a power management daemon: it receives ACPI events from the kernel (power button,
      lid switch, AC adapter, battery level) and runs the matching rule, usually from
      /etc/acpi/events/. On systemd systems, systemd-logind can handle many of the same events.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.3", lesson: 1, section: systemd }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [acpid, power-management]

  - id: 101-101.3-0005
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: Which systemd target corresponds most closely to SysV runlevel 3?
    options:
      - id: a
        text: "`graphical.target`"
        rationale: Wrong. graphical.target adds a graphical login and corresponds to runlevel 5.
      - id: b
        text: "`rescue.target`"
        rationale: Wrong. rescue.target is single-user mode, the counterpart of runlevel 1.
      - id: c
        text: "`default.target`"
        rationale: Wrong. default.target is only an alias for whatever target the system boots into.
      - id: d
        text: "`multi-user.target`"
        rationale: Correct. multi-user.target is a full multi-user system without the graphical login, like runlevel 3.
    answer: [d]
    explanation: >
      systemd ships runlevel0.target to runlevel6.target as aliases: runlevel2/3/4.target point to
      multi-user.target, runlevel5.target to graphical.target, runlevel1.target to rescue.target.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.3", lesson: 1, section: systemd }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [targets, runlevels]

  - id: 101-101.3-0006
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: Which `/etc/inittab` line makes a SysV system come up in runlevel 2 when no runlevel is given at boot?
    options:
      - id: a
        text: "`id:2:initdefault:`"
        rationale: Correct. The initdefault action names the default runlevel in the runlevels field.
      - id: b
        text: "`l2:2:wait:/etc/init.d/rc 2`"
        rationale: Wrong. This runs the runlevel-2 scripts when runlevel 2 is entered; it does not choose the default.
      - id: c
        text: "`si::sysinit:/etc/init.d/rcS`"
        rationale: Wrong. This runs the system initialisation script at boot, whatever the runlevel.
      - id: d
        text: "`2:23:respawn:/sbin/getty 38400 tty2`"
        rationale: Wrong. This keeps a login prompt running on tty2 in runlevels 2 and 3.
    answer: [a]
    explanation: >
      inittab entries have the form id:runlevels:action:process. The entry whose action is
      initdefault sets the default runlevel; its process field is empty. A runlevel passed on the
      kernel command line overrides it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.3", lesson: 1, section: SysVinit }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. SysV behaviour checked against upstream sysvinit man pages (no sysvinit on Ubuntu 24.04)." }
    tags: [inittab, initdefault]

  - id: 101-101.3-0007
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      You are about to restart the database service and want every logged-in user to see a warning
      on their terminal first. The machine itself stays up. Which command do you use?
    options:
      - id: a
        text: "`write alice \"Database restart in 5 minutes\"`"
        rationale: Wrong. write talks to a single user, and it takes the message on standard input, not as an argument.
      - id: b
        text: "`mesg y`"
        rationale: Wrong. mesg only controls whether your own terminal accepts messages from others.
      - id: c
        text: "`wall \"Database restart in 5 minutes\"`"
        rationale: Correct. wall writes the message to the terminals of all logged-in users.
      - id: d
        text: "`logger \"Database restart in 5 minutes\"`"
        rationale: Wrong. logger writes to the system log; users at their terminals do not see it.
    answer: [c]
    explanation: >
      wall ("write all") broadcasts a message, given as an argument, in a file or on standard input,
      to every logged-in user's terminal. shutdown uses the same mechanism for its warnings.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.3", lesson: 1, section: Shutdown and Restart }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [wall]

  - id: 101-101.3-0008
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      On a systemd system, which command shuts the machine down completely and switches the power
      off, without saving the contents of memory?
    options:
      - id: a
        text: "`systemctl suspend`"
        rationale: Wrong. Suspend keeps the machine in a low-power state with memory still powered.
      - id: b
        text: "`systemctl poweroff`"
        rationale: Correct. poweroff stops all services, shuts down and turns the power off.
      - id: c
        text: "`systemctl hibernate`"
        rationale: Wrong. Hibernate saves memory to disk first so the session can be restored.
      - id: d
        text: "`systemctl halt`"
        rationale: Wrong. halt stops the system but leaves the hardware powered on.
    answer: [b]
    explanation: >
      systemctl poweroff (and the poweroff command, a link to systemctl on most systems) performs a
      clean shutdown followed by power off. halt stops the CPU without cutting power; suspend and
      hibernate keep the session so it can be resumed.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.3", lesson: 1, section: Shutdown and Restart }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [systemctl, poweroff]

  - id: 101-101.3-0009
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      To end a process properly, you first send it the signal that asks it to exit and gives it a
      chance to clean up. `kill` sends this signal when no signal is named. Which is it?
    options:
      - id: a
        text: "`SIGKILL` (9)"
        rationale: Wrong. SIGKILL cannot be caught; the process is ended at once without cleaning up. It is the last resort.
      - id: b
        text: "`SIGSTOP` (19)"
        rationale: Wrong. SIGSTOP pauses a process; it does not end it.
      - id: c
        text: "`SIGHUP` (1)"
        rationale: Wrong. SIGHUP reports a closed terminal, and many daemons treat it as "reload configuration".
      - id: d
        text: "`SIGTERM` (15)"
        rationale: Correct. SIGTERM is the polite termination request and the default signal of kill.
    answer: [d]
    explanation: >
      The proper order is SIGTERM first, then SIGKILL only for processes that do not exit. A system
      shutdown does the same: every process gets SIGTERM, and those still running after a grace
      period get SIGKILL.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.3", lesson: 1, section: Shutdown and Restart }
    verify:
      command: bash -c 'kill -l 15'
      expect: { exit_code: 0, stdout_contains: "TERM" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [signals, kill]

  - id: 101-101.3-0010
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: Where are the systemd unit files that come with installed packages normally kept?
    options:
      - id: a
        text: "`/usr/lib/systemd/system/`"
        rationale: Correct. Packages install their unit files here (on Debian-family systems also reachable as /lib/systemd/system/).
      - id: b
        text: "`/etc/systemd/system/`"
        rationale: Wrong. This is for the administrator's own units, overrides and enablement links.
      - id: c
        text: "`/run/systemd/system/`"
        rationale: Wrong. This holds runtime units that disappear at reboot.
      - id: d
        text: "`/etc/init.d/`"
        rationale: Wrong. This holds SysV init scripts, not systemd unit files.
    answer: [a]
    explanation: >
      Vendor unit files live in /usr/lib/systemd/system/. Files and links in /etc/systemd/system/
      take precedence over them, so local changes go there and survive package upgrades.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.3", lesson: 1, section: systemd }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [unit-files, systemd]

  - id: 101-101.3-0011
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: Which command reboots a systemd system straight away?
    options:
      - id: a
        text: "`shutdown -h now`"
        rationale: Wrong. -h powers the machine off instead of restarting it.
      - id: b
        text: "`systemctl halt`"
        rationale: Wrong. halt stops the system and leaves it halted; it does not restart.
      - id: c
        text: "`systemctl reboot`"
        rationale: Correct. systemctl reboot shuts the system down cleanly and restarts it.
      - id: d
        text: "`telinit 0`"
        rationale: Wrong. Runlevel 0 means shut down (power off), not reboot.
    answer: [c]
    explanation: >
      systemctl reboot is the native systemd command; shutdown -r now, reboot and telinit 6 reach the
      same result. Root privileges (or a polkit rule allowing it) are needed.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.3", lesson: 1, section: Shutdown and Restart }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [systemctl, reboot]

  - id: 101-101.3-0012
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      You want a list of every installed systemd unit file together with whether it is enabled to
      start at boot. Which command gives you that?
    options:
      - id: a
        text: "`systemctl list-units`"
        rationale: Wrong. list-units shows the units currently loaded in memory and their run state, not boot-time enablement.
      - id: b
        text: "`systemctl list-unit-files`"
        rationale: Correct. list-unit-files lists installed unit files with their state (enabled, disabled, static, masked ...).
      - id: c
        text: "`systemctl get-default`"
        rationale: Wrong. get-default prints only the name of the default target.
      - id: d
        text: "`systemctl list-dependencies`"
        rationale: Wrong. This shows the dependency tree of one unit, default.target if none is given.
    answer: [b]
    explanation: >
      list-unit-files works from the files on disk and shows each one's enablement state; add
      --type=service or --type=target to narrow it. list-units shows what is loaded and running now.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.3", lesson: 1, section: systemd }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [systemctl, list-unit-files]

  - id: 101-101.3-0013
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      Which command restarts the machine in 15 minutes and warns logged-in users with the text
      "Kernel update"?
    options:
      - id: a
        text: "`shutdown -r +15 \"Kernel update\"`"
        rationale: Correct. -r means reboot, +15 means 15 minutes from now, and the text is sent to users.
      - id: b
        text: "`shutdown -h +15 \"Kernel update\"`"
        rationale: Wrong. -h powers the machine off instead of rebooting.
      - id: c
        text: "`shutdown -r 00:15 \"Kernel update\"`"
        rationale: Wrong. 00:15 is a clock time (a quarter past midnight), not a delay.
      - id: d
        text: "`shutdown -k +15 \"Kernel update\"`"
        rationale: Wrong. -k only sends the warning; the machine is not rebooted.
    answer: [a]
    explanation: >
      shutdown takes an action option, a time and an optional message. The time is either now, +m
      (minutes from now) or hh:mm (24-hour clock time). The message goes to all logged-in users.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.3", lesson: 1, section: Shutdown and Restart }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [shutdown]

  - id: 101-101.3-0014
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      On a SysV init system you have just edited `/etc/inittab`. Type the command that makes `init`
      read the file again without changing the current runlevel.
    fill_in:
      accepted: ['(sudo\s+)?((/usr)?/s?bin/)?(telinit|init)\s+[qQ]', '(sudo\s+)?((/usr)?/bin/)?kill\s+(-(?i:(SIG)?HUP)|-1|-s\s+(?i:(SIG)?HUP)|-n\s+(1|(?i:(SIG)?HUP)))\s+1']
      match: regex
      case_sensitive: true
    explanation: >
      telinit q (or Q) tells SysV init to re-examine /etc/inittab. Doing so right after an edit
      shows mistakes while the system is still running normally. Sending SIGHUP to init (PID 1)
      has the same effect.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.3", lesson: 1, section: SysVinit }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: fixed, notes: "kill pattern widened (-n 1/HUP, SIGHUP, case-insensitive signal name, -s SIGHUP)." }
    tags: [telinit, inittab]

  - id: 101-101.3-0015
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: >
      Which **THREE** commands switch a running systemd system into rescue (single-user) mode right
      away?
    select_count: 3
    options:
      - id: a
        text: "`systemctl rescue`"
        rationale: Correct. This verb starts rescue.target and stops the units it does not need.
      - id: b
        text: "`systemctl set-default rescue.target`"
        rationale: Wrong. This only changes the target for the next boot; the running system is not affected.
      - id: c
        text: "`systemctl isolate rescue.target`"
        rationale: Correct. isolate starts the given target and stops everything it does not depend on.
      - id: d
        text: "`systemctl enable rescue.target`"
        rationale: Wrong. rescue.target has no [Install] section, so enable does nothing, and enabling never switches state anyway.
      - id: e
        text: "`telinit 1`"
        rationale: Correct. On systemd, telinit is a compatibility link to systemctl, and runlevel 1 maps to rescue.target.
    answer: [a, c, e]
    explanation: >
      Changing the target of a running system means isolating it: systemctl isolate rescue.target,
      its shortcut systemctl rescue, or the SysV-style telinit 1 (also s or S). set-default and the
      systemd.unit= kernel parameter only affect booting.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.3", lesson: 1, section: systemd }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [rescue, isolate, telinit]

  - id: 101-101.3-0016
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      You want to test how users react to a shutdown warning. Type the `shutdown` option that sends
      the warning message to everyone but does not actually halt, power off or reboot.
    fill_in:
      accepted: ['-k', '(sudo\s+)?((/usr)?/s?bin/)?shutdown\s+-k(\s+.+)?']
      match: regex
      case_sensitive: true
    explanation: >
      shutdown -k ("kidding") goes through the warning part only: the wall message is sent, but the
      machine keeps running. Use it to check that the warning reaches everyone before a real
      shutdown.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.3", lesson: 1, section: Shutdown and Restart }
    review:
      status: pass2
