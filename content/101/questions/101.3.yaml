    tags: [shutdown]

  - id: 101-101.3-0017
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: Which **TWO** statements about `systemctl is-enabled sshd.service` are true?
    select_count: 2
    options:
      - id: a
        text: It reports whether the sshd processes are running at this moment.
        rationale: Wrong. That is what systemctl is-active (or status) reports.
      - id: b
        text: It prints the unit file's state, for example enabled, disabled or masked.
        rationale: Correct. Current systemd versions print the state as well as setting the exit status.
      - id: c
        text: It enables the unit if it finds that the unit is currently disabled.
        rationale: Wrong. is-enabled only queries; systemctl enable makes the change.
      - id: d
        text: Its exit status is 0 for an enabled unit and non-zero for a disabled one.
        rationale: Correct. This makes it easy to test in a shell script, for example with if or &&.
    answer: [b, d]
    explanation: >
      is-enabled answers "will this unit be started at boot?". It prints the state and exits 0 when
      the unit is enabled (also for states like static or alias) and non-zero when it is disabled or
      masked. Whether it is running now is a separate question for is-active.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "101.3", lesson: 1, section: systemd }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
