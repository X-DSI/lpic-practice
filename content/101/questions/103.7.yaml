        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [character-classes, bracket-expression]

  - id: 101-103.7-0043
    type: single_choice
    difficulty: 4
    pool: practice
    stem: Given `app.log` below, which command prints each `ERROR` line exactly once and nothing else?
    exhibit: |
      INFO start
      ERROR disk
      WARN low
      ERROR net
    options:
      - id: a
        text: "`sed -n '/ERROR/p' app.log`"
        rationale: Correct. `-n` stops automatic printing, and `p` prints only the lines matching the address.
      - id: b
        text: "`sed '/ERROR/p' app.log`"
        rationale: Wrong. Without `-n`, every line is printed once and the ERROR lines a second time.
      - id: c
        text: "`sed '/ERROR/d' app.log`"
        rationale: Wrong. This deletes the ERROR lines and prints the others.
      - id: d
        text: "`sed -n '/ERROR/d' app.log`"
        rationale: Wrong. With `-n` and no `p`, nothing is printed at all.
    answer: [a]
    explanation: >
      `sed -n '/regex/p'` behaves like grep: automatic output is off and only addressed lines are
      printed. Forgetting `-n` is the classic cause of duplicated lines.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 2, section: "The Stream Editor: sed" }
    verify:
      command: printf 'INFO start\nERROR disk\nWARN low\nERROR net\n' | sed -n '/ERROR/p' | tr '\n' ' '
      expect: { exit_code: 0, stdout_regex: "^ERROR disk ERROR net\\s*$" }
