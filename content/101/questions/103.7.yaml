    tags: [sed, sed-E, ERE]

  - id: 101-103.7-0020
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: The file `sshd.conf` is shown below with line numbers. What does `grep -vc '^#' sshd.conf` print?
    exhibit: |
      $ cat -n sshd.conf
           1  # sshd settings
           2  Port 2222
           3
           4  #PermitRootLogin yes
           5  PermitRootLogin no
           6    # indented comment
           7  PasswordAuthentication no
    options:
      - id: a
        text: "`3`"
        rationale: Wrong. This leaves out the empty line 3 and the indented comment on line 6, which both lack a `#` in the first column.
      - id: b
        text: "`5`"
        rationale: Correct. Only lines 1 and 4 start with `#`; the other five lines are counted.
      - id: c
        text: "`4`"
        rationale: Wrong. The empty line does not start with `#`, so it is counted as well.
      - id: d
        text: "`2`"
        rationale: Wrong. 2 is the number of lines that do start with `#`; -v counts the rest.
    answer: [b]
    explanation: >
      `-v` selects lines that do not match and `-c` counts them. `^#` only matches a `#` in the first
      column, so the blank line and the indented comment are counted. To skip both, use
      `grep -Evc '^[[:space:]]*(#|$)'`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 2, section: "The Pattern Finder: grep" }
    verify:
      command: >-
        printf '# sshd settings\nPort 2222\n\n#PermitRootLogin yes\nPermitRootLogin no\n  # indented comment\nPasswordAuthentication no\n' | grep -vc '^#'
      expect: { exit_code: 0, stdout_regex: "^5\\s*$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "verify command put in a block scalar; the # in the printf text was read as a YAML comment." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [grep-v, grep-c, anchors]

  - id: 101-103.7-0021
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: Which **TWO** commands select exactly the lines that contain a run of at least two consecutive digits?
    select_count: 2
    options:
      - id: a
        text: "`grep -E '[0-9]{2,}' data`"
        rationale: Correct. In ERE, `{2,}` means two or more of the preceding atom.
      - id: b
        text: "`grep '[0-9]{2,}' data`"
        rationale: Wrong. In a basic regex unescaped braces are literal, so this looks for a digit followed by the text `{2,}`.
      - id: c
        text: "`grep '[0-9][0-9]*' data`"
        rationale: Wrong. `[0-9]*` allows zero more digits, so any line with a single digit also matches.
      - id: d
        text: "`grep '[0-9]\\{2,\\}' data`"
        rationale: Correct. A basic regex writes the same bound with escaped braces.
      - id: e
        text: "`grep -E '[0-9]{,2}' data`"
        rationale: Wrong. `{,2}` means zero to two, so every line matches.
    answer: [a, d]
    explanation: >
      Bounds are `{n}`, `{n,}` and `{n,m}` in ERE and `\{n\}`, `\{n,\}`, `\{n,m\}` in BRE. With
      lines `id 7`, `port 8080` and `v 1.2`, both correct commands print only `port 8080`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Bounds }
    verify:
      command: printf 'id 7\nport 8080\nv 1.2\n' | grep '[0-9]\{2,\}'
      expect: { exit_code: 0, stdout_regex: "^port 8080\\s*$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [bounds, BRE, ERE]

  - id: 101-103.7-0022
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: What is the output of the following command?
    exhibit: |
      $ echo 'Smith, John' | sed -E 's/([^,]*), (.*)/\2 \1/'
    options:
      - id: a
        text: "`Smith John`"
        rationale: Wrong. The back-references are used in reverse order, so the groups swap places.
      - id: b
        text: "`\\2 \\1`"
        rationale: Wrong. In the replacement, `\1` and `\2` are replaced by the text the groups captured.
      - id: c
        text: "`John Smith`"
        rationale: Correct. Group 1 captures `Smith`, group 2 captures `John`, and the replacement writes group 2, a space, then group 1.
      - id: d
        text: "`John, Smith`"
        rationale: Wrong. The comma is part of the matched text but is not in any group, and the replacement does not add it back.
    answer: [c]
    explanation: >
      Parentheses capture parts of the match; `\1`, `\2` and so on insert them in the replacement.
      Without `-E`, the same command needs `\(` and `\)`, otherwise sed rejects `\2` as an invalid
      reference.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Branches and Back References }
    verify:
      command: echo 'Smith, John' | sed -E 's/([^,]*), (.*)/\2 \1/'
      expect: { exit_code: 0, stdout_regex: "^John Smith\\s*$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [sed, back-references]

  - id: 101-103.7-0023
    type: fill_in
    difficulty: 4
    pool: holdout
    stem: >
      `grep admin users.txt` also prints lines such as `sysadmin` and `admin2`. Type the `grep` option
      that only accepts a match covering the entire line, so that only lines consisting of exactly
      `admin` are printed.
    fill_in:
      accepted: ['((sudo\s+)?((/usr)?/bin/)?grep\s+)?(-x|--line-regexp)(\s+(?!-)\S+)*']
      match: regex
      case_sensitive: true
    explanation: >
      `-x` (`--line-regexp`) behaves as if the pattern were wrapped in `^...$`. `-w` would not be enough
      for a line like `admin tools`, where `admin` is a whole word but not the whole line.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 2, section: "The Pattern Finder: grep" }
    verify:
      command: printf 'admin\nsysadmin\nadmin2\nadmin tools\n' | grep -x admin
      expect: { exit_code: 0, stdout_regex: "^admin\\s*$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [grep-x]

  - id: 101-103.7-0024
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: The file below is shown with line numbers. Which lines does `grep '^[^#]' fstab.sample` print?
    exhibit: |
      $ cat -n fstab.sample
           1  UUID=1234 / ext4 defaults 0 1
           2  # swap was on /dev/sda2
           3
           4    #tmpfs /tmp tmpfs defaults 0 0
           5  /dev/sdb1 /data xfs noatime 0 2
    options:
      - id: a
        text: Lines 1, 4 and 5
        rationale: Correct. Each of these starts with a character other than `#`; line 4 starts with a space.
      - id: b
        text: Lines 1 and 5
        rationale: Wrong. Line 4 begins with spaces, and a space satisfies `[^#]`.
      - id: c
        text: Lines 1, 3, 4 and 5
        rationale: Wrong. The empty line 3 has no first character, so `[^#]` has nothing to match.
      - id: d
        text: Lines 1, 2, 4 and 5
        rationale: Wrong. Line 2 starts with `#`, which the negated bracket excludes.
    answer: [a]
    explanation: >
      `^[^#]` needs one character at the start of the line, and that character must not be `#`. That
      drops comments starting in column one and also empty lines, but not indented comments.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Bracket Expression }
    verify:
      command: >-
        printf 'UUID=1234 / ext4\n# swap\n\n  #tmpfs /tmp\n/dev/sdb1 /data\n' | grep -c '^[^#]'
      expect: { exit_code: 0, stdout_regex: "^3\\s*$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "verify command put in a block scalar; the # in the printf text was read as a YAML comment." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [bracket-expression, anchors, negation]

  - id: 101-103.7-0025
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      The directory `proj` contains `proj/notes.log`, `proj/logs/app.log`, `proj/logs/app.log.1` and
      `proj/src/main.c`. Which command lists exactly the two files whose names end in `.log`?
    options:
      - id: a
        text: "`find proj -regex '\\.log$'`"
        rationale: Wrong. find's `-regex` must match the whole path, and no path consists only of `.log`, so nothing is printed.
      - id: b
        text: "`find proj -regex '.*\\.log'`"
        rationale: Correct. `.*` covers the directory part and file name, and the expression must end at `.log` because it matches the whole path.
      - id: c
        text: "`find proj -regex 'app.*'`"
        rationale: Wrong. The pattern would have to match the whole path starting with `proj/`, so nothing is printed.
      - id: d
        text: "`find proj -regex '.*\\.log.*'`"
        rationale: Wrong. The trailing `.*` also lets `app.log.1` match.
    answer: [b]
    explanation: >
      Unlike grep, find's `-regex` test is anchored to the whole path it examines (`proj/logs/app.log`),
      so patterns usually start with `.*`. `-iregex` is the case-insensitive version, and
      `-regextype posix-extended` switches to ERE syntax.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Searching with Regular Expressions }
    verify:
      setup:
        - mkdir -p /tmp/proj/logs /tmp/proj/src
        - touch /tmp/proj/notes.log /tmp/proj/logs/app.log /tmp/proj/logs/app.log.1 /tmp/proj/src/main.c
      command: cd /tmp && find proj -regex '.*\.log' | wc -l
      expect: { exit_code: 0, stdout_regex: "^2\\s*$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [find, regex]

  - id: 101-103.7-0026
    type: multi_choice
    difficulty: 5
    pool: holdout
    stem: >
      Which **TWO** commands print only the lines of `words.txt` that consist of exactly three
      lowercase letters and nothing else (such as `fox`, but not `dogs` or `yak bat`)?
    select_count: 2
    options:
      - id: a
        text: "`grep -w '[[:lower:]]\\{3\\}' words.txt`"
        rationale: Wrong. `-w` accepts a three-letter word anywhere, so `yak bat` is printed too.
      - id: b
        text: "`grep -x '[[:lower:]]\\{3\\}' words.txt`"
        rationale: Correct. `-x` requires the match to cover the whole line, and the BRE bound is written with escaped braces.
      - id: c
        text: "`grep '^[[:lower:]]{3}$' words.txt`"
        rationale: Wrong. In a basic regex `{3}` is literal text, so this matches a single lowercase letter followed by `{3}`.
      - id: d
        text: "`grep -E '[[:lower:]]{3}' words.txt`"
        rationale: Wrong. Without anchors, any line containing three lowercase letters in a row matches, such as `dogs`.
      - id: e
        text: "`grep -E '^[[:lower:]]{3}$' words.txt`"
        rationale: Correct. Both anchors and the ERE bound together allow exactly three lowercase letters.
    answer: [b, e]
    explanation: >
      To match a whole line, either anchor the pattern with `^` and `$` or use `grep -x`. The bound
      syntax depends on the dialect: `{3}` in ERE, `\{3\}` in BRE.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Bounds }
    verify:
      command: printf 'cat\nCow\ndogs\nyak bat\nfox\n' | grep -E '^[[:lower:]]{3}$' | tr '\n' ' '
      expect: { exit_code: 0, stdout_regex: "^cat fox\\s*$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [bounds, anchors, grep-x, grep-w, character-classes]

  - id: 101-103.7-0027
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: What does this command print?
    exhibit: |
      $ echo '<b>bold</b> and <i>it</i>' | sed 's/<.*>//'
    options:
      - id: a
        text: "`bold and it`"
        rationale: Wrong. That needs a pattern that stops at the first `>`, such as `s/<[^>]*>//g`.
      - id: b
        text: "`bold</b> and <i>it</i>`"
        rationale: Wrong. That is the result of `s/<[^>]*>//`, which removes only the first tag.
      - id: c
        text: "`and`"
        rationale: Wrong. sed does not remove tags pairwise; `.*` is not limited to one tag.
      - id: d
        text: An empty line
        rationale: Correct. `.*` is greedy, so the match runs from the first `<` to the last `>`, which is the whole line.
    answer: [d]
    explanation: >
      POSIX regexes choose the longest match starting at the leftmost position. Here the line both
      begins with `<` and ends with `>`, so everything is replaced by nothing. A negated bracket such
      as `[^>]*` keeps each match inside one tag.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Bounds }
    verify:
      command: echo '<b>bold</b> and <i>it</i>' | sed 's/<.*>//' | wc -c
      expect: { exit_code: 0, stdout_regex: "^1\\s*$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [sed, greedy-matching]

  - id: 101-103.7-0028
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      The command below prints `grep: (standard input): binary file matches` and nothing else.
      Why?
    exhibit: |
      $ printf 'a b.conf\0prod web.conf\0' | grep prod
      grep: (standard input): binary file matches
    options:
      - id: a
        text: grep reads the stream as one line containing NUL bytes; `grep -z` would fix it
        rationale: Correct. There is no newline, so the whole input is one "line" with NULs in it, which grep treats as binary. With -z, grep splits records at NUL bytes and prints `prod web.conf`.
      - id: b
        text: The pattern has no regex characters, so grep needs `-F` to print it
        rationale: Wrong. A plain word is a valid regex; `grep -F prod` gives exactly the same message.
      - id: c
        text: printf cannot write `\0`, so grep received an empty or broken stream
        rationale: Wrong. printf does write NUL bytes (od -c shows them), and the message itself says grep found a match.
      - id: d
        text: "grep hides binary output unless `-a` is given; `-a` would print only `prod web.conf`"
        rationale: 'Wrong. -a prints the whole matching "line", which is the entire stream: `a b.conf`, a NUL, `prod web.conf` and another NUL. The name that does not match is printed too.'
    answer: [a]
    explanation: >
      grep normally splits its input at newlines. NUL-separated data, as produced by `find -print0`
      or `printf '...\0'`, has none, so it arrives as one line containing NUL bytes, and grep only
      reports that a binary file matched. `-z` (`--null-data`) splits records at NUL bytes instead and
      ends each output record with a NUL, so the result can be passed to `xargs -0`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 2, section: "The Pattern Finder: grep" }
    verify:
      command: printf 'a b.conf\0prod web.conf\0' | grep -z prod | tr '\0' '\n'
      expect: { exit_code: 0, stdout_regex: "^prod web\\.conf\\s*$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Rewritten as single choice on the binary-file-matches symptom; the fill-in restated a lesson 2 Guided Exercise. Re-check: option d reworded so it is clearly false (-a prints both names); otherwise matches key." }
    tags: [grep-z, binary, find]

  - id: 101-103.7-0029
    type: multi_choice
    difficulty: 5
    pool: holdout
    stem: >
      `results.txt` contains the lines shown below. Which **TWO** commands print only the line that
      contains the literal text `1+1=2`?
    exhibit: |
      1+1=2
      11=2
      1=2
    select_count: 2
    options:
      - id: a
        text: "`grep '1+1=2' results.txt`"
        rationale: Correct. In a basic regex `+` is an ordinary character, so the pattern is the literal text.
      - id: b
        text: "`grep -E '1+1=2' results.txt`"
        rationale: Wrong. In ERE `1+` means one or more 1s, so it prints `11=2` and not `1+1=2`.
      - id: c
        text: "`grep -F '1+1=2' results.txt`"
        rationale: Correct. Fixed-string mode never treats `+` specially.
      - id: d
        text: "`grep '1\\+1=2' results.txt`"
        rationale: Wrong. In GNU BRE `\+` is the one-or-more quantifier, so this behaves like the ERE version and prints `11=2`.
    answer: [a, c]
    explanation: >
      The backslash rules are opposite in the two dialects: in BRE a bare `+` is literal and `\+` is a
      GNU quantifier; in ERE a bare `+` is the quantifier and `\+` is literal. `grep -F` avoids the
      question entirely.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Quantifiers }
    verify:
      command: printf '1+1=2\n11=2\n1=2\n' | grep '1+1=2'
      expect: { exit_code: 0, stdout_regex: "^1\\+1=2\\s*$" }
    review:
      status: pass2
      history:
