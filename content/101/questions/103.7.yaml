  - id: 101-103.7-0045
    type: single_choice
    difficulty: 5
    pool: practice
    stem: Which lines of `pal.txt` does `grep -E '^(.).*\1$' pal.txt` print?
    exhibit: |
      level
      abc
      x
      noon
      moon
    options:
      - id: a
        text: All five lines
        rationale: Wrong. The back-reference must repeat the first character at the end of the line.
      - id: b
        text: "`level`, `x` and `noon`"
        rationale: Wrong. `x` has one character; the group and the back-reference each need one, so at least two characters are required.
      - id: c
        text: "`level`, `noon` and `moon`"
        rationale: Wrong. `moon` starts with `m` and ends with `n`, so `\1` (which must repeat `m`) fails at the end.
      - id: d
        text: "`level` and `noon` only"
        rationale: Correct. Each of these lines ends with the same character it starts with.
    answer: [d]
    explanation: >
      `(.)` captures the first character and `\1$` requires the same character at the end of the line.
      `.*` in between may be empty, so two-character lines like `aa` would match, but a one-character
      line cannot.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Branches and Back References }
