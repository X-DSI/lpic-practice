  - id: 101-103.7-0041
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      A script runs `for f in *.conf; do grep Listen "$f"; done`. The output shows the matching lines
      but not which file each came from. Which option added to grep fixes that?
    options:
      - id: a
        text: "`-l`"
        rationale: Wrong. `-l` prints only the file names and drops the lines.
      - id: b
        text: "`-n`"
        rationale: Wrong. `-n` adds line numbers, not file names.
      - id: c
        text: "`-c`"
        rationale: Wrong. `-c` replaces the lines with a count.
      - id: d
        text: "`-H`"
        rationale: Correct. `-H` (`--with-filename`) prefixes each line with its file name even when only one file is searched.
    answer: [d]
    explanation: >
      grep shows file names automatically only when it is given more than one file. Each loop pass
      gives it a single file, so `-H` is needed to force the prefix.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 2, section: "The Pattern Finder: grep" }
    review:
