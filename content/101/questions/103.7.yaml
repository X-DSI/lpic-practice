  - id: 101-103.7-0031
    type: single_choice
    difficulty: 1
    pool: practice
    stem: What does `$` mean at the end of a regular expression such as `\.conf$`?
    options:
      - id: a
        text: The match must be at the end of the line
        rationale: Correct. A trailing `$` anchors the match to the end of the line.
      - id: b
        text: The name of a shell variable follows
        rationale: Wrong. In single quotes the shell leaves `$` alone, and in the regex it is an anchor.
      - id: c
        text: The match must be at the start of the line
        rationale: Wrong. The start-of-line anchor is `^`.
      - id: d
        text: Any single character
        rationale: Wrong. Any single character is matched by `.`.
    answer: [a]
    explanation: >
      `grep '\.conf$'` matches lines ending in `.conf`. `$` is an anchor at the end of the
      pattern (or of a group or branch); in most other positions in a basic regex it is an ordinary
      character.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Introduction }
    review:
      status: pass2
