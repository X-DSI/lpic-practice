  - id: 101-103.7-0034
    type: single_choice
    difficulty: 2
    pool: practice
    stem: >
      `inventory.csv` starts with a header line `name,qty`. Which command prints the file without that
      first line?
    options:
      - id: a
        text: "`sed -n 1p inventory.csv`"
        rationale: Wrong. This prints only the first line, the opposite of what is wanted.
      - id: b
        text: "`sed '/1/d' inventory.csv`"
        rationale: Wrong. This deletes every line containing the character 1, not line 1.
      - id: c
        text: "`sed d1 inventory.csv`"
        rationale: Wrong. The address comes before the command; sed reports "extra characters after command".
      - id: d
        text: "`sed 1d inventory.csv`"
        rationale: Correct. Address 1 selects the first line and `d` deletes it; the rest is printed.
    answer: [d]
    explanation: >
      A sed command can start with an address: a line number, a range such as `2,5`, or a regex
      between slashes. `1d` deletes line 1 only.
