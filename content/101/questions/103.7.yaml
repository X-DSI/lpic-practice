    tags: [grep-H]

  - id: 101-103.7-0042
    type: multi_choice
    difficulty: 5
    pool: practice
    stem: >
      Which **TWO** patterns, used with GNU grep, match one hexadecimal digit (0–9, a–f, upper or
      lower case)?
    select_count: 2
    options:
      - id: a
        text: "`[:xdigit:]`"
        rationale: Wrong. A class must sit inside a bracket expression; GNU grep refuses this with "character class syntax is [[:space:]], not [:space:]".
      - id: b
        text: "`[[:xdigit:]]`"
        rationale: Correct. The `xdigit` class inside a bracket expression matches 0–9, a–f and A–F.
      - id: c
        text: "`[[:digit:][:alpha:]]`"
        rationale: Wrong. This accepts every letter, including `g` to `z`.
      - id: d
        text: "`[0-9a-fA-F]`"
        rationale: Correct. The three ranges list exactly the hexadecimal digits.
    answer: [b, d]
    explanation: >
      Character classes are written `[:name:]` and only work inside brackets, so a single class looks
      like `[[:xdigit:]]`. Several classes and ranges can share one bracket expression.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Bracket Expression }
    verify:
      command: printf 'F\ng\n7\n' | grep -c '[[:xdigit:]]'
      expect: { exit_code: 0, stdout_regex: "^2\\s*$" }
    review:
      status: pass2
      history:
