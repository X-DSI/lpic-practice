        rationale: Wrong. `-n` still prints the matching lines, adding line numbers.
      - id: b
        text: "`-c`"
        rationale: Correct. `-c` prints only the number of matching lines.
      - id: c
        text: "`-l`"
        rationale: Correct. `-l` prints only the names of files that contain a match.
      - id: d
