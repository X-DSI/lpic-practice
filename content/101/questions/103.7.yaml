  - id: 101-103.7-0030
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: Given `config.ini` below, what does `sed -n '/^\[db\]/,/^\[/p' config.ini` print?
    exhibit: |
      [main]
      name=app
      [db]
      host=localhost
      port=5432
      [log]
      level=info
    options:
      - id: a
        text: "`host=localhost` and `port=5432`, without either header line"
        rationale: Wrong. The lines that start and end a range are part of it, so both header lines are printed.
      - id: b
        text: Everything from `[db]` to the end of the file
        rationale: Wrong. The end address is searched for from the line after `[db]`, so the range closes at `[log]`.
      - id: c
        text: "`[db]`, `host=localhost`, `port=5432` and `[log]`"
        rationale: Correct. The range opens at `[db]`, closes at the next line starting with `[`, and includes both ends.
      - id: d
        text: "`[db]` only"
        rationale: Wrong. sed does not test the end address on the line that opened the range, so the range does not close at `[db]` itself.
    answer: [c]
    explanation: >
      An address range `/start/,/end/` begins at a line matching the first regex and ends at the next
      later line matching the second. `-n` turns off automatic printing and `p` prints the range.
      The brackets are escaped so they are matched literally rather than read as bracket expressions.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 2, section: "The Stream Editor: sed" }
    verify:
      command: printf '[main]\nname=app\n[db]\nhost=localhost\nport=5432\n[log]\nlevel=info\n' | sed -n '/^\[db\]/,/^\[/p' | tr '\n' ' '
      expect: { exit_code: 0, stdout_regex: "^\\[db\\] host=localhost port=5432 \\[log\\]\\s*$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Option a lengthened; the correct option was the only long one." }
