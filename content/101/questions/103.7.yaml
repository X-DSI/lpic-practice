  - id: 101-103.7-0038
    type: single_choice
    difficulty: 2
    pool: practice
    stem: Which command matches both `color` and `colour`?
    options:
      - id: a
        text: "`grep -E 'colou?r'`"
        rationale: Correct. In ERE `?` makes the preceding `u` optional.
      - id: b
        text: "`grep 'colou?r'`"
        rationale: Wrong. In a basic regex `?` is literal, so the pattern needs the text `colou?r`.
      - id: c
        text: "`grep -E 'colo[u]r'`"
        rationale: Wrong. The bracket expression requires exactly one `u`, so `color` does not match.
      - id: d
        text: "`grep -F 'colou?r'`"
        rationale: Wrong. Fixed-string mode looks for the literal text `colou?r`.
    answer: [a]
    explanation: >
      `?` means "zero or one of the preceding atom". It needs `-E` (or `\?` in GNU basic regexes).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Quantifiers }
    verify:
      command: printf 'colour\ncolor\ncolr\n' | grep -cE 'colou?r'
