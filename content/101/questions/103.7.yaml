  - id: 101-103.7-0040
    type: single_choice
    difficulty: 3
    pool: practice
    stem: With plain `grep` (basic regular expressions), how do you write a run of four digits?
    options:
      - id: a
        text: "`[0-9]{4}`"
        rationale: Wrong. That is the ERE form; in BRE the braces are literal characters.
      - id: b
        text: "`[[:digit:]]4`"
        rationale: Wrong. This matches one digit followed by the character 4.
      - id: c
        text: "`[0-9]\\{4\\}`"
        rationale: Correct. BRE bounds use escaped braces.
      - id: d
        text: "`[0-9]*4`"
        rationale: Wrong. This matches any number of digits followed by a 4, such as just `4`.
    answer: [c]
    explanation: >
      Bounds exist in both dialects: `{4}` with `grep -E` and `\{4\}` in a basic regex. Add anchors or
      `-w` if the four digits must not be part of a longer number.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Bounds }
