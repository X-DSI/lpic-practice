        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Explanation refined: $ is also an anchor at the end of a group or branch." }
    tags: [anchors]

  - id: 101-103.7-0032
    type: single_choice
    difficulty: 1
    pool: practice
    stem: Which command is equivalent to `egrep`?
    options:
      - id: a
        text: "`grep -e`"
        rationale: Wrong. `-e` marks the next argument as a pattern; it does not change the regex dialect.
      - id: b
        text: "`grep -F`"
        rationale: Wrong. `grep -F` is the equivalent of `fgrep` (fixed strings).
      - id: c
        text: "`grep -E`"
        rationale: Correct. `egrep` runs grep with extended regular expressions, exactly like `grep -E`.
      - id: d
        text: "`grep -x`"
        rationale: Wrong. `-x` restricts matches to whole lines.
    answer: [c]
    explanation: >
      `egrep` is `grep -E`. Upstream GNU grep 3.8 and later print "egrep: warning: egrep is
      obsolescent" when it is used (Debian and Ubuntu disable that warning), so prefer `grep -E`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 2, section: "The Pattern Finder: grep" }
    review:
