  - id: 101-103.7-0035
    type: single_choice
    difficulty: 2
    pool: practice
    stem: In the pattern `grep 'ab*c'`, what does the `*` mean?
    options:
      - id: a
        text: Any string of characters between `ab` and `c`, as in a shell wildcard
        rationale: Wrong. That is the shell glob meaning; in a regex any string is written `.*`.
      - id: b
        text: Zero or more `b` characters
        rationale: Correct. `*` repeats the atom just before it any number of times, including zero.
      - id: c
        text: One or more `b` characters
        rationale: Wrong. One or more is `\+` in GNU BRE or `+` in ERE; `*` also allows none, so `ac` matches.
      - id: d
        text: Zero or more repetitions of `ab`
        rationale: Wrong. A quantifier applies to one atom; repeating `ab` needs a group, `\(ab\)*`.
    answer: [b]
    explanation: >
      `ab*c` matches `ac`, `abc`, `abbbc` and so on. `*` works the same way in basic and extended
      regular expressions.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Quantifiers }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [quantifiers]

  - id: 101-103.7-0036
    type: multi_choice
    difficulty: 3
    pool: practice
    stem: Which **TWO** bracket expressions match a tab character?
    select_count: 2
    options:
      - id: a
        text: "`[[:blank:]]`"
        rationale: Correct. `[:blank:]` is a space or a tab.
      - id: b
        text: "`[[:punct:]]`"
        rationale: Wrong. `[:punct:]` covers printable punctuation; a tab is a control character.
      - id: c
        text: "`[[:print:]]`"
        rationale: Wrong. `[:print:]` covers printable characters and the space, not the tab.
      - id: d
        text: "`[[:space:]]`"
        rationale: Correct. `[:space:]` includes space, tab, newline, carriage return, form feed and vertical tab.
    answer: [a, d]
    explanation: >
      Character classes are only valid inside a bracket expression, hence the double brackets.
      `[:blank:]` is the narrower class (space and tab); `[:space:]` adds the other whitespace characters.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Bracket Expression }
    verify:
      command: printf '\t\n' | grep -c '[[:blank:]]'
      expect: { exit_code: 0, stdout_regex: "^1\\s*$" }
    review:
      status: pass2
      history:
