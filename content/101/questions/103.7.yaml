# 103.7 Search text files using regular expressions — weight 3 → 30 holdout + 15 practice.
# Original questions written from LPI Learning Materials 101-500, objective 103.7, lessons 1 and 2.
schema_version: 1
exam: "101"
objective: "103.7"
questions:
  # ---------------------------------------------------------------- holdout (mock exams only)

  - id: 101-103.7-0001
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: In a regular expression, what does the bracket expression `[xyz]` match?
    options:
      - id: a
        text: The three-character string `xyz`
        rationale: Wrong. Without brackets, `xyz` would match that string; with brackets it is a single-character atom.
      - id: b
        text: Exactly one character, which is `x`, `y` or `z`
        rationale: Correct. A bracket expression is one atom that matches any single character from its list.
      - id: c
        text: Any one character except `x`, `y` and `z`
        rationale: Wrong. That is `[^xyz]`; the list only negates when it starts with a caret.
      - id: d
        text: One or more characters taken from `x`, `y` and `z`
        rationale: Wrong. Repetition needs a quantifier such as `[xyz]*` or `[xyz]+`; the bracket alone matches one character.
    answer: [b]
    explanation: >
      Brackets group a list of characters into one atom. The atom matches a single character, provided
      that character is in the list. Add a quantifier after the closing bracket to repeat it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Bracket Expression }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [bracket-expression]

  - id: 101-103.7-0002
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: Which command behaves the same as `fgrep`?
    options:
      - id: a
        text: "`grep -E`"
        rationale: Wrong. `grep -E` is the equivalent of `egrep` (extended regular expressions).
      - id: b
        text: "`grep -f`"
        rationale: Wrong. Lowercase `-f FILE` reads the patterns from a file; it does not switch off regex parsing.
      - id: c
        text: "`grep -x`"
        rationale: Wrong. `-x` only accepts matches that cover the whole line.
      - id: d
        text: "`grep -F`"
        rationale: Correct. `-F` (`--fixed-strings`) treats the patterns as plain strings, which is what `fgrep` does.
    answer: [d]
    explanation: >
      `fgrep` is `grep -F`: the pattern is a fixed string, so characters such as `.`, `*` and `$` have
      no special meaning. Upstream GNU grep 3.8 and later print a warning that `fgrep` and `egrep` are
      obsolescent (Debian and Ubuntu patch the warning out), so scripts should use `grep -F` and `grep -E`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 2, section: "The Pattern Finder: grep" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [fgrep, grep-F]

  - id: 101-103.7-0003
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: What does an unescaped `.` (dot) match in a regular expression?
    options:
      - id: a
        text: Any single character
        rationale: Correct. The dot is a one-character wildcard.
      - id: b
        text: Only a literal period
        rationale: Wrong. A literal period needs `\.`, a bracket expression `[.]`, or fixed-string mode (`grep -F`).
      - id: c
        text: Any sequence of characters, including none
        rationale: Wrong. That is `.*`; the dot on its own stands for exactly one character.
      - id: d
        text: The end of a line
        rationale: Wrong. The end-of-line anchor is `$`.
    answer: [a]
    explanation: >
      `.` matches one character of any kind, so `b.t` matches `bat`, `b7t` and `b t`. Combine it with
      `*` to match any run of characters.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Introduction }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [dot, metacharacter]

  - id: 101-103.7-0004
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: What does `grep -v` do?
    options:
      - id: a
        text: Prints grep's version number
        rationale: Wrong. The version is printed by `grep -V` (capital) or `--version`.
      - id: b
        text: Prints extra diagnostic messages while searching
        rationale: Wrong. grep has no verbose mode; `-v` is not "verbose" here.
      - id: c
        text: Prints only the non-matching lines
        rationale: Correct. `-v` (`--invert-match`) selects the non-matching lines.
      - id: d
        text: Prints only the part of each line that matches
        rationale: Wrong. That is `-o` (`--only-matching`).
    answer: [c]
    explanation: >
      `-v` inverts the selection. `grep -v '^;' php.ini`, for example, hides every line that starts
      with a semicolon and shows everything else.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 2, section: "The Pattern Finder: grep" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Correct option shortened; it was the longest option." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [grep-v]

  - id: 101-103.7-0005
    type: multi_choice
    difficulty: 1
    pool: holdout
    stem: Which **TWO** regular expression characters are anchors, matching a position rather than a character?
    select_count: 2
    options:
      - id: a
        text: "`*`"
        rationale: Wrong. `*` is a quantifier (zero or more of the preceding atom).
      - id: b
        text: "`^`"
        rationale: Correct. At the start of a pattern, `^` matches the beginning of the line.
      - id: c
        text: "`.`"
        rationale: Wrong. The dot matches one character; it is not a position.
      - id: d
        text: "`$`"
        rationale: Correct. At the end of a pattern, `$` matches the end of the line.
    answer: [b, d]
    explanation: >
      `^` and `$` tie a match to the start or end of the line without consuming a character, which is
      why they are called anchors. `^$` therefore matches an empty line.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Introduction }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [anchors]

  - id: 101-103.7-0006
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      You want to know which files anywhere below `/etc/nginx` contain the text `server_name`, and to
      see the matching lines. Which command does it?
    options:
      - id: a
        text: "`grep -l server_name /etc/nginx`"
        rationale: Wrong. Without recursion grep refuses the argument with "Is a directory"; `-l` also prints only file names, not the lines.
      - id: b
        text: "`find /etc/nginx -name server_name`"
        rationale: Wrong. This looks for files called server_name; it does not read file contents.
      - id: c
        text: "`grep -r server_name /etc/nginx`"
        rationale: Correct. `-r` makes grep descend into the directory and print each matching line prefixed with its file name.
      - id: d
        text: "`grep -c server_name /etc/nginx`"
        rationale: Wrong. Without recursion grep reports "Is a directory"; `-c` would only print counts anyway.
    answer: [c]
    explanation: >
      `grep -r PATTERN DIR` searches every file below DIR. Because several files are involved, each
      result line starts with the file name. `-R` does the same but also follows symbolic links.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Searching with Regular Expressions }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [grep-r, recursive]

  - id: 101-103.7-0007
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: Which pattern makes `grep -c PATTERN notes.txt` count the completely empty lines in the file?
    options:
      - id: a
        text: "`'^.*$'`"
        rationale: Wrong. `.*` can match zero or more characters, so this matches every line.
      - id: b
        text: "`'^ $'`"
        rationale: Wrong. This matches lines that hold exactly one space, not empty lines.
      - id: c
        text: "`'$^'`"
        rationale: Wrong. In a basic regex, a `$` at the very start and a `^` at the very end are ordinary characters, so this looks for the literal text `$^`.
      - id: d
        text: "`'^$'`"
        rationale: Correct. The start of the line is followed immediately by its end, so the line has no characters.
    answer: [d]
    explanation: >
      Anchoring both ends with nothing in between selects lines of length zero. To include lines that
      hold only spaces or tabs, use `'^[[:space:]]*$'`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Introduction }
    verify:
      command: printf 'a\n\n \nb\n' | grep -c '^$'
      expect: { exit_code: 0, stdout_regex: "^1\\s*$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Option c rationale reworded for accuracy." }
    tags: [anchors, empty-lines]

  - id: 101-103.7-0008
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: What does the regular expression `[^0-9]` match?
    options:
      - id: a
        text: A digit at the beginning of a line
        rationale: Wrong. That would be `^[0-9]`; inside brackets the leading caret means negation, not an anchor.
      - id: b
        text: One character that is not a digit
        rationale: Correct. A caret as the first character in a bracket expression negates the list.
      - id: c
        text: A line that contains no digits at all
        rationale: Wrong. The atom matches a single non-digit anywhere, so a line such as `12a` matches too.
      - id: d
        text: Zero or more digits
        rationale: Wrong. That is `[0-9]*`.
    answer: [b]
    explanation: >
      `[^...]` matches any one character not in the list. `grep '[^0-9]'` therefore selects every line
      that has at least one non-digit character, including `12a`, and skips lines made only of digits
      and empty lines.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Bracket Expression }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [bracket-expression, negation]

  - id: 101-103.7-0009
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      An application log writes the word *timeout* as `Timeout`, `TIMEOUT` or `timeout`. Which
      command shows all of those lines?
    options:
      - id: a
        text: "`grep -i timeout app.log`"
        rationale: Correct. `-i` (`--ignore-case`) ignores case in both pattern and data.
      - id: b
        text: "`grep -w timeout app.log`"
        rationale: Wrong. `-w` only demands a whole-word match; the search is still case-sensitive.
      - id: c
        text: "`grep -F timeout app.log`"
        rationale: Wrong. `-F` turns off regex parsing but stays case-sensitive.
      - id: d
        text: "`grep -x timeout app.log`"
        rationale: Wrong. `-x` requires the whole line to be `timeout`, in lowercase.
    answer: [a]
    explanation: >
      `grep -i` treats upper and lower case as equal. Without it you would need a pattern such as
      `[Tt][Ii][Mm][Ee][Oo][Uu][Tt]`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 2, section: "The Pattern Finder: grep" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [grep-i]

  - id: 101-103.7-0010
    type: multi_choice
    difficulty: 2
    pool: holdout
    stem: Which **TWO** commands interpret their pattern as an extended regular expression (ERE)?
    select_count: 2
    options:
      - id: a
        text: "`grep -E`"
        rationale: Correct. `-E` (`--extended-regexp`) selects ERE syntax.
      - id: b
        text: "`fgrep`"
        rationale: Wrong. `fgrep` (`grep -F`) does not parse regular expressions at all.
      - id: c
        text: "`egrep`"
        rationale: Correct. `egrep` runs `grep -E`; current upstream GNU grep warns that the name is obsolescent, but it still works.
      - id: d
        text: "`grep -G`"
        rationale: Wrong. `-G` (`--basic-regexp`) selects basic regular expressions, grep's default.
    answer: [a, c]
    explanation: >
      grep reads basic regular expressions by default (`-G`). `grep -E` and its old alias `egrep`
      switch to ERE, where `+`, `?`, `|`, `()` and `{}` are special without a backslash. `grep -F` /
      `fgrep` search for fixed strings.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 2, section: "The Pattern Finder: grep" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [egrep, grep-E, BRE, ERE]

  - id: 101-103.7-0011
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      `echo 'cat cat cat' | sed 's/cat/dog/'` prints `dog cat cat`. What change makes it replace every
      `cat` on the line?
    options:
      - id: a
        text: Add the `p` flag, as in `s/cat/dog/p`
        rationale: Wrong. `p` prints the line again after a successful substitution; it still replaces only the first match.
      - id: b
        text: Run `sed -g 's/cat/dog/'`
        rationale: Wrong. GNU sed has no `-g` option and stops with "invalid option".
      - id: c
        text: Run `sed -n 's/cat/dog/'`
        rationale: Wrong. `-n` suppresses automatic printing, so nothing is output at all.
      - id: d
        text: Add the `g` flag, as in `s/cat/dog/g`
        rationale: Correct. The `g` flag applies the substitution to every match on the line.
    answer: [d]
    explanation: >
      By default `s` replaces only the first match on each line. The `g` (global) flag replaces them
      all; a number such as `s/cat/dog/2` replaces only that occurrence.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 2, section: "The Stream Editor: sed" }
    verify:
      command: echo 'cat cat cat' | sed 's/cat/dog/g'
      expect: { exit_code: 0, stdout_contains: "dog dog dog" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [sed, substitute, g-flag]

  - id: 101-103.7-0012
    type: fill_in
    difficulty: 2
    pool: holdout
    stem: >
      `grep 'Failed password' /var/log/auth.log` scrolls hundreds of lines past. You only want to
      know how many attempts there were, as a single number. Type the `grep` option to add.
    fill_in:
      accepted: ['((sudo\s+)?((/usr)?/bin/)?grep\s+)?(-c|--count)(\s+(?!-)\S+)*']
      match: regex
      case_sensitive: true
    explanation: >
      `grep -c` (`--count`) prints the number of selected lines; with several files it prints one
      `file:count` line per file. Combined with `-v` it counts the non-matching lines.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 2, section: "The Pattern Finder: grep" }
    verify:
      command: printf 'err 1\nok\nerr 2\n' | grep -c err
      expect: { exit_code: 0, stdout_regex: "^2\\s*$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Stem rewritten; it restated a lesson 2 Guided Exercise. Text supplied by the reviewer; verified by the writer." }
    tags: [grep-c]

  - id: 101-103.7-0013
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      Using GNU grep **without** `-E` or `-F`, which command selects lines containing an `a`, then one
      or more `b` characters, then a `c` (such as `abc` or `abbbc`)?
    options:
      - id: a
        text: "`grep 'ab+c'`"
        rationale: Wrong. In a basic regex `+` is an ordinary character, so this matches the literal text `ab+c`.
      - id: b
        text: "`grep 'ab\\+c'`"
        rationale: Correct. GNU basic regexes accept `\+` as the one-or-more quantifier.
      - id: c
        text: "`grep 'ab{1}c'`"
        rationale: Wrong. Unescaped braces are literal in a basic regex, so this looks for the text `ab{1}c`.
      - id: d
        text: "`grep 'a.b*c'`"
        rationale: Wrong. `b*` allows zero `b`s and the dot accepts any character, so `axc` would match.
    answer: [b]
    explanation: >
      In basic regular expressions `+`, `?`, `{`, `}`, `|`, `(` and `)` are literal; GNU tools give them
      their special meaning when they are escaped (`\+`, `\?`, `\{n\}`, `\|`, `\( \)`). In extended
      regexes (`grep -E`) it is the other way round.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Quantifiers }
    verify:
      command: printf 'abbc\nac\nab+c\n' | grep 'ab\+c'
      expect: { exit_code: 0, stdout_regex: "^abbc\\s*$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [BRE, quantifiers]

  - id: 101-103.7-0014
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: Which **TWO** commands print the lines of `pets.txt` that contain `cat` or `dog`?
    select_count: 2
    options:
      - id: a
        text: "`grep 'cat|dog' pets.txt`"
        rationale: Wrong. In a basic regex `|` is literal, so only lines containing the text `cat|dog` match.
      - id: b
        text: "`grep -F 'cat|dog' pets.txt`"
        rationale: Wrong. With -F the whole pattern is a fixed string, so again only `cat|dog` literally matches.
      - id: c
        text: "`grep -E 'cat|dog' pets.txt`"
        rationale: Correct. In an extended regex `|` separates alternative branches.
      - id: d
        text: "`grep 'cat\\|dog' pets.txt`"
        rationale: Correct. GNU basic regexes treat `\|` as alternation.
    answer: [c, d]
    explanation: >
      Alternation is `|` in ERE and `\|` in GNU BRE. Another way is to give several patterns:
      `grep -e cat -e dog pets.txt`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 1, section: Branches and Back References }
    verify:
      command: printf 'cat\ndog\nbird\n' | grep -c 'cat\|dog'
      expect: { exit_code: 0, stdout_regex: "^2\\s*$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [alternation, BRE, ERE]

  - id: 101-103.7-0015
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      `grep -E '[[:alnum:]._-]+@[[:alnum:].-]+' contacts.txt` prints whole lines, some holding two
      addresses. Type the additional `grep` option that prints only the matched e-mail addresses,
      each on its own line.
    fill_in:
      accepted: ['((sudo\s+)?((/usr)?/bin/)?grep\s+)?(-o|--only-matching)(\s+(?!-)\S+)*']
      match: regex
      case_sensitive: true
    explanation: >
      `-o` (`--only-matching`) prints each non-empty match on a separate line instead of the whole
      line, so a line holding two e-mail addresses gives two output lines and the surrounding text
      is dropped.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 2, section: "The Pattern Finder: grep" }
    verify:
      command: printf 'a x@y.org and z@w.net\n' | grep -oE '[[:alnum:]._-]+@[[:alnum:].-]+'
      expect: { exit_code: 0, stdout_regex: "^x@y\\.org\\nz@w\\.net\\s*$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Stem, explanation and verify rewritten around e-mail addresses; it restated a lesson 2 Guided Exercise. Text supplied by the reviewer; verified by the writer." }
    tags: [grep-o]

  - id: 101-103.7-0016
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      A file holds the lines below. Which command prints only the first line, where `root` appears as
      a word of its own?
    exhibit: |
      root:x:0:0:root:/root:/bin/bash
      chrootuser:x:1001:1001::/home/c:/bin/sh
      rooted:x:1002:1002::/home/r:/bin/sh
    options:
      - id: a
        text: "`grep -x root accounts`"
        rationale: Wrong. `-x` needs the whole line to be `root`, so no line is printed.
      - id: b
        text: "`grep -o root accounts`"
        rationale: Wrong. `-o` still matches all three lines and prints each occurrence of `root` on its own line (three from the first line).
      - id: c
        text: "`grep -w root accounts`"
        rationale: Correct. `-w` only accepts matches bordered by non-word characters or the line edges, which rules out `chrootuser` and `rooted`.
      - id: d
        text: "`grep -i root accounts`"
        rationale: Wrong. Ignoring case does not stop `root` matching inside longer words.
    answer: [c]
    explanation: >
      With `-w` (`--word-regexp`) the match must not be preceded or followed by a letter, digit or
      underscore. The colons around `root` in the first line count as word boundaries.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 2, section: "The Pattern Finder: grep" }
    verify:
      command: printf 'root:x:0:0\nchrootuser:x\nrooted:x\n' | grep -w root
      expect: { exit_code: 0, stdout_regex: "^root:x:0:0\\s*$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Option b rationale made precise (three matches from the first line)." }
    tags: [grep-w]

  - id: 101-103.7-0017
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      You need just the names of the `*.log` files in the current directory that mention `disk`, one
      name per line. Which command gives that?
    options:
      - id: a
        text: "`grep -l disk *.log`"
        rationale: Correct. `-l` (`--files-with-matches`) prints each matching file name once.
      - id: b
        text: "`grep -L disk *.log`"
        rationale: Wrong. `-L` lists the files that do **not** contain a match.
      - id: c
        text: "`grep -c disk *.log`"
        rationale: Wrong. `-c` prints every file with its count, including files with a count of 0.
      - id: d
        text: "`grep -H disk *.log`"
        rationale: Wrong. `-H` prefixes each matching line with its file name but still prints the lines.
    answer: [a]
    explanation: >
      `grep -l` stops reading a file at its first match and prints the file name. It is handy in
      command substitution, e.g. `vi $(grep -l disk *.log)`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 2, section: "The Pattern Finder: grep" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [grep-l]

  - id: 101-103.7-0018
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      You want the lines of `notes.txt` that contain the text `-rf`. Which command does that
      correctly?
    options:
      - id: a
        text: "`grep '-rf' notes.txt`"
        rationale: Wrong. The quotes are removed by the shell, so grep reads `-r -f notes.txt`, uses notes.txt as a pattern file and searches the current directory recursively.
      - id: b
        text: "`grep -F -rf notes.txt`"
        rationale: Wrong. `-rf` is still parsed as options; `-F` does not change option parsing.
      - id: c
        text: "`grep -w -rf notes.txt`"
        rationale: Wrong. As with the others, `-rf` is taken as the options `-r` and `-f`.
      - id: d
        text: "`grep -e -rf notes.txt`"
        rationale: Correct. `-e` takes the next argument as the pattern, even if it starts with a dash.
    answer: [d]
    explanation: >
      `-e PATTERN` marks its argument as a pattern, so it is the safe way to search for text that
      begins with `-`. `-e` can also be repeated to search for several patterns at once.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 2, section: "The Pattern Finder: grep" }
    verify:
      command: printf 'rm -rf /tmp/x\nls -l\n' | grep -e -rf
      expect: { exit_code: 0, stdout_regex: "^rm -rf /tmp/x\\s*$" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [grep-e]

  - id: 101-103.7-0019
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      Complete the command so that sed reads its script as an extended regular expression and the
      parentheses group without backslashes: `sed ___ 's/(ab)+/X/' input.txt`. Type the option.
    fill_in:
      accepted: ['(sed\s+)?(-E|-r|--regexp-extended)(\s+(?!-)\S+)*']
      match: regex
      case_sensitive: true
    explanation: >
      GNU sed accepts `-E`, `-r` or `--regexp-extended` to switch to extended regexes; `-E` is the
      POSIX spelling. Without it, grouping needs `\(ab\)\+`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.7", lesson: 2, section: "The Stream Editor: sed" }
    verify:
      command: echo ababc | sed -E 's/(ab)+/X/'
      expect: { exit_code: 0, stdout_contains: "Xc" }
    review:
      status: pass2
