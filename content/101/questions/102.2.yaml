  - id: 101-102.2-0030
    type: multi_choice
    difficulty: 5
    pool: practice
    stem: Which **TWO** statements about `grub-install` on a BIOS (i386-pc) system are true?
    select_count: 2
    options:
      - id: a
        text: The install device should be a whole disk, such as `/dev/sdb`, not a partition.
        rationale: Correct. The boot code goes into the disk's MBR; installing to a partition relies on unreliable blocklists and is refused unless forced.
      - id: b
        text: It also regenerates `/boot/grub/grub.cfg` from `/etc/default/grub`.
        rationale: Wrong. grub-install installs images and boot code only; grub.cfg is produced by grub-mkconfig or update-grub.
      - id: c
        text: "`--boot-directory=/mnt/x` places GRUB's files in `/mnt/x/boot/grub`."
        rationale: Wrong. The files go to DIR/grub, here /mnt/x/grub.
      - id: d
        text: Without `--boot-directory`, GRUB's images and modules are copied to `/boot/grub`.
        rationale: Correct. /boot/grub is the default location for GRUB's images and modules.
    answer: [a, d]
    explanation: >
      grub-install copies GRUB's images and modules into /boot/grub (or DIR/grub with
      --boot-directory=DIR) and writes boot code to the disk given. Creating or updating grub.cfg
      is a separate step done with grub-mkconfig or update-grub.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Installing GRUB 2 }
