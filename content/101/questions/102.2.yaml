    tags: [grub2, grub-shell]

  - id: 101-102.2-0018
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      A BIOS machine stops at the `grub rescue>` prompt because its embedded prefix points to a
      partition that no longer exists. `ls` shows `(hd0) (hd0,msdos1)`; the root filesystem is
      `/dev/sda1`, and the kernel and initrd are `/boot/vmlinuz` and
      `/boot/initrd.img` on it. Which sequence of commands boots the system?
    options:
      - id: a
        text: "`insmod normal`; `insmod linux`; `set prefix=(hd0,msdos1)/boot/grub`; `set root=(hd0,msdos1)`; `linux /boot/vmlinuz root=/dev/sda1`; `initrd /boot/initrd.img`; `boot`"
        rationale: Wrong. Modules are loaded from the prefix directory; while the prefix is still wrong, insmod cannot find them.
      - id: b
        text: "`set prefix=(hd0,msdos1)/boot/grub`; `insmod normal`; `insmod linux`; `set root=(hd0,msdos1)`; `linux /boot/vmlinuz root=/dev/sda1`; `initrd /boot/initrd.img`; `boot`"
        rationale: Correct. Fix the prefix, load the modules, set the root device, load kernel then initrd, and boot.
      - id: c
        text: "`set prefix=(hd0,msdos1)/boot/grub`; `insmod normal`; `insmod linux`; `set root=(hd0,msdos1)`; `initrd /boot/initrd.img`; `linux /boot/vmlinuz root=/dev/sda1`; `boot`"
        rationale: Wrong. GRUB 2 refuses to load an initrd before a kernel ("you need to load the kernel first").
      - id: d
        text: "`set prefix=(hd0,msdos1)/boot/grub`; `insmod normal`; `insmod linux`; `set root=(hd0,msdos1)`; `linux /boot/vmlinuz root=(hd0,msdos1)`; `initrd /boot/initrd.img`; `boot`"
        rationale: Wrong. The kernel's root= parameter needs a Linux name such as /dev/sda1 or a UUID; it does not understand GRUB device names.
    answer: [b]
    explanation: >
      The rescue shell appears when GRUB cannot find its modules, so the prefix must be corrected
      first. Then load normal and linux, point root at the partition with the kernel, and run linux
      (with a Linux root= parameter), initrd and boot, in that order.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Booting from the Rescue Shell }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: fixed, notes: "Stem now states why the rescue prompt appears (prefix points to a partition that no longer exists)." }
    tags: [grub2, grub-rescue]

  - id: 101-102.2-0019
    type: multi_choice
    difficulty: 5
    pool: holdout
    stem: >
      An old server uses GRUB Legacy and no longer boots after another OS overwrote the MBR of its
      only disk. You start a GRUB Legacy boot disk, get the session below, and want to reinstall
      GRUB to the MBR. Which **TWO** commands do you run next?
    exhibit: |
      grub> find /boot/grub/stage1
       (hd0,2)
    select_count: 2
    options:
      - id: a
        text: "`root (hd0,3)`"
        rationale: Wrong. find already reported GRUB's device name, (hd0,2); adding one converts to GRUB 2 numbering, which GRUB Legacy does not use.
      - id: b
        text: "`root (hd0,2)`"
        rationale: Correct. This sets the partition that holds /boot/grub, as reported by find.
      - id: c
        text: "`setup (hd0)`"
        rationale: Correct. setup installs GRUB to the MBR of the first disk, using the files on the root partition.
      - id: d
        text: "`setup (hd0,2)`"
        rationale: Wrong. Naming a partition installs GRUB to that partition's boot sector; the MBR stays broken.
      - id: e
        text: "`grub-install /dev/sda`"
        rationale: Wrong. grub-install is a Linux command; it is not available inside the GRUB shell.
    answer: [b, c]
    explanation: >
      In the GRUB Legacy shell, set the partition that holds the GRUB files with root (using the name
      find printed), then run setup on the whole disk to write the MBR. setup on a partition would
      write that partition's boot sector instead.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Installing GRUB Legacy from a GRUB Shell }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. Judged original: tests reading find output, not the lesson's recipe." }
    tags: [grub-legacy, grub-shell, setup]

  - id: 101-102.2-0020
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      An administrator created `/etc/grub.d/45_backup` with the content shown and ran `update-grub`,
      which finished without errors. The new entry is missing from `/boot/grub/grub.cfg`. What is
      the cause?
    exhibit: |
      $ ls -l /etc/grub.d/40_custom /etc/grub.d/45_backup
      -rwxr-xr-x 1 root root 214 Mar 17  2025 /etc/grub.d/40_custom
      -rw-r--r-- 1 root root 197 Oct 25 09:12 /etc/grub.d/45_backup
      $ cat /etc/grub.d/45_backup
      #!/bin/sh
      exec tail -n +3 $0
      menuentry "Backup kernel" {
        search --no-floppy --set=root --label BOOT
        linux /vmlinuz.old root=LABEL=root ro
        initrd /initrd.img.old
      }
    options:
      - id: a
        text: Only the files named `40_custom` and `41_custom` may contain hand-written entries.
        rationale: Wrong. Every executable script in /etc/grub.d is run; 40_custom is a convention, not the only allowed name.
      - id: b
        text: Scripts numbered above 40 are processed after grub.cfg has already been written.
        rationale: Wrong. All scripts are run in name order and their combined output becomes grub.cfg.
      - id: c
        text: The file is not executable, so the generator skips it.
        rationale: Correct. grub-mkconfig (called by update-grub) only runs files in /etc/grub.d that have the execute bit set.
      - id: d
        text: GRUB 2 does not accept `search --label`, so the entry is dropped as invalid.
        rationale: Wrong. search --label is a valid GRUB 2 command, and the generator does not drop entries for using it.
    answer: [c]
    explanation: >
      update-grub runs grub-mkconfig, which runs each executable file in /etc/grub.d in name order
      and joins their output into grub.cfg. A file without the execute bit is silently skipped;
      `chmod +x /etc/grub.d/45_backup` and another update-grub fix it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Managing Menu Entries }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. test -x gate confirmed in grub-mkconfig." }
    tags: [grub2, grub.d, update-grub]

  # --------------------------------------------------------------------------- practice (CLI)

  - id: 101-102.2-0021
    type: single_choice
    difficulty: 1
    pool: practice
    stem: What is the main job of a boot loader such as GRUB?
    options:
      - id: a
        text: To test the hardware when the computer is switched on
        rationale: Wrong. The power-on self test is done by the firmware (BIOS or UEFI) before any boot loader runs.
      - id: b
        text: To load the kernel and start it
        rationale: Correct. A boot loader finds and loads the kernel (and initrd), passes it parameters and starts it.
      - id: c
        text: To start the system services once the kernel is running
        rationale: Wrong. Services are started by the init system (for example systemd), after the boot loader has finished.
      - id: d
        text: To partition and format the disk during installation
        rationale: Wrong. That is the job of partitioning and mkfs tools, not of the boot loader.
    answer: [b]
    explanation: >
      Firmware runs first, then the boot loader, which loads the kernel and initial RAM disk and
      starts the kernel. GRUB can also offer several kernels or operating systems in a menu.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Introduction }
    review:
      status: pass2
      history:
