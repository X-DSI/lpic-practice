        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [grub2, device-naming, gpt]

  - id: 101-102.2-0028
    type: fill_in
    difficulty: 4
    pool: practice
    stem: >
      A boot menu entry must hand control to the boot loader stored in the first sector of the
      partition that `root` points to. Type the line (command and argument) that loads that sector;
      the same line works in GRUB Legacy and GRUB 2.
    fill_in:
      accepted: ['chainloader(\s+--force)?\s+\+1']
      match: regex
      case_sensitive: true
    explanation: >
      `chainloader +1` loads one sector (the first, in blocklist notation) of the root device; boot
      then runs it. This is how GRUB starts Windows and other systems it cannot boot itself. Some
      documents spell the command `chainload`, but GRUB's command is `chainloader`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Chainloading other Operating Systems }
    review:
