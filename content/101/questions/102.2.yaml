    tags: [boot-partition, System.map]

  - id: 101-102.2-0025
    type: multi_choice
    difficulty: 3
    pool: practice
    stem: >
      Which **TWO** situations are good reasons to keep `/boot` on its own partition instead of as a
      directory on the root filesystem?
    select_count: 2
    options:
      - id: a
        text: GRUB 2 can never load a kernel from the root filesystem.
        rationale: Wrong. GRUB 2 can usually read the root filesystem and load the kernel from its /boot directory.
      - id: b
        text: The root filesystem is encrypted in a way GRUB cannot unlock.
        rationale: Correct. GRUB must read the kernel and initrd before anything is decrypted, so they need an unencrypted partition.
      - id: c
        text: The root filesystem uses a filesystem type GRUB has no driver for.
        rationale: Correct. A separate /boot on a filesystem GRUB supports keeps the kernel readable.
      - id: d
        text: UEFI firmware loads the Linux kernel straight from the `/boot` partition.
        rationale: Wrong. UEFI firmware loads the boot loader from the EFI System Partition; /boot is read by GRUB.
    answer: [b, c]
    explanation: >
      A separate /boot is not required, but it keeps boot files apart from the rest of the system
      and is needed when GRUB cannot read the root filesystem, for example because of encryption
      or an unsupported filesystem or compression.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: The /boot Partition }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [boot-partition]

  - id: 101-102.2-0026
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      `/etc/default/grub` contains `GRUB_DEFAULT=saved` and `GRUB_SAVEDEFAULT=true`, and the GRUB
      configuration has been regenerated. Which entry does GRUB select by default?
    options:
      - id: a
        text: Always the first entry in the menu
        rationale: Wrong. That is the behaviour of GRUB_DEFAULT=0.
      - id: b
        text: The entry named `saved`
        rationale: Wrong. saved is a keyword here, not the title of a menu entry.
      - id: c
        text: The entry the user chose at the previous boot
        rationale: Correct. GRUB_SAVEDEFAULT=true records each chosen entry, and GRUB_DEFAULT=saved boots it next time.
      - id: d
        text: The newest installed kernel, whatever its position in the menu
        rationale: Wrong. GRUB has no setting that picks the newest kernel; generators simply list it first.
    answer: [c]
    explanation: >
      GRUB_DEFAULT accepts a number (counting from 0), an entry title, or saved. With saved and
      GRUB_SAVEDEFAULT=true, GRUB stores the selected entry in /boot/grub/grubenv and uses it as the
      default for the next boot.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Configuring GRUB 2 }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Distractor d lengthened so the correct option is no longer the longest." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [grub2, GRUB_DEFAULT]

  - id: 101-102.2-0027
    type: single_choice
    difficulty: 3
    pool: practice
    stem: At the GRUB 2 prompt, what does the device name `(hd0,gpt2)` refer to?
    options:
      - id: a
        text: The third partition of the first disk, which uses a GPT partition table
        rationale: Wrong. GRUB 2 numbers partitions from 1, so gpt2 is the second partition.
      - id: b
        text: The second partition of the second disk, which uses a GPT partition table
        rationale: Wrong. GRUB numbers disks from 0, so hd0 is the first disk.
      - id: c
        text: The second partition of the first disk, which uses a DOS partition table
        rationale: Wrong. Partitions on a DOS-labelled disk are shown as msdosN; gpt marks a GPT partition table.
      - id: d
        text: The second partition of the first disk, which uses a GPT partition table
        rationale: Correct. hd0 is the first disk, gpt2 the second partition of its GPT table.
    answer: [d]
    explanation: >
      GRUB 2 shows partitions with their table type: msdosN for a DOS (MBR) table, gptN for GPT.
      Disks count from 0 and partitions from 1, so (hd0,gpt2) is usually /dev/sda2.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Booting from the GRUB 2 Shell }
    review:
      status: pass2
      history:
