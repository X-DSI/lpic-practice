  - id: 101-102.2-0024
    type: single_choice
    difficulty: 2
    pool: practice
    stem: >
      After a kernel panic you want to match the addresses in the panic message to kernel function
      names. Which file in `/boot` maps symbol names to addresses?
    options:
      - id: a
        text: "`System.map-6.8.0-45-generic`"
        rationale: Correct. System.map is the kernel's symbol table, listing each symbol with its address.
      - id: b
        text: "`config-6.8.0-45-generic`"
        rationale: Wrong. This records the build options of the kernel, not symbol addresses.
      - id: c
        text: "`initrd.img-6.8.0-45-generic`"
        rationale: Wrong. This is the initial RAM disk with drivers and tools needed to mount the root filesystem.
      - id: d
        text: "`grub/grubenv`"
        rationale: Wrong. grubenv is GRUB's environment block, used for example to remember the saved default entry.
    answer: [a]
    explanation: >
      System.map-VERSION is generated with each kernel build and lists symbols (functions and
      variables) with their memory addresses, which helps make sense of a panic or oops.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Contents of the Boot Partition }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
