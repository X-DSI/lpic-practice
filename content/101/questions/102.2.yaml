# 102.2 Install a boot manager — weight 2 → 20 holdout + 10 practice.
# Original questions written from LPI Learning Materials 101-500, objective 102.2, lesson 1.
# GRUB menu editing at boot, /etc/default/grub kernel parameters and grub-mkconfig are tested in 101.2.
schema_version: 1
exam: "101"
objective: "102.2"
questions:
  # ---------------------------------------------------------------- holdout (mock exams only)

  - id: 101-102.2-0001
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      On a Debian system with GRUB 2, you want to read the menu entries exactly as GRUB will show
      them at the next boot, without changing anything. Which file do you open?
    options:
      - id: a
        text: "`/etc/default/grub`"
        rationale: Wrong. This holds settings such as the timeout and default entry, not the generated menu entries.
      - id: b
        text: "`/boot/grub/menu.lst`"
        rationale: Wrong. menu.lst is the configuration file of GRUB Legacy; GRUB 2 does not read it.
      - id: c
        text: "`/boot/grub/grub.cfg`"
        rationale: Correct. This is the file GRUB 2 reads at boot; it contains every generated menuentry.
      - id: d
        text: "`/etc/grub.d/10_linux`"
        rationale: Wrong. This is a script that generates the Linux entries; it does not contain the finished entries.
    answer: [c]
    explanation: >
      GRUB 2 reads /boot/grub/grub.cfg (on Fedora and Red Hat family systems /boot/grub2/grub.cfg)
      at boot. The file is generated from /etc/default/grub and the scripts in /etc/grub.d, so it is
      the right place to look but not the right place to edit.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Configuring GRUB 2 }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [grub2, grub.cfg]

  - id: 101-102.2-0002
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: Which statement about GRUB Legacy is true?
    options:
      - id: a
        text: It is no longer developed; its last release was version 0.97.
        rationale: Correct. GRUB Legacy stopped at 0.97 (2005); development moved to the rewritten GRUB 2.
      - id: b
        text: It is the default boot loader of most current Linux distributions.
        rationale: Wrong. Current distributions install GRUB 2 by default; GRUB Legacy is found only on older systems.
      - id: c
        text: It was written to replace GRUB 2, which was too hard to configure.
        rationale: Wrong. The order is the other way round; GRUB 2 is the complete rewrite that replaced GRUB Legacy.
      - id: d
        text: It reads its menu from `/boot/grub/grub.cfg`.
        rationale: Wrong. GRUB Legacy reads /boot/grub/menu.lst (grub.conf on Red Hat systems); grub.cfg belongs to GRUB 2.
    answer: [a]
    explanation: >
      GRUB Legacy (0.9x) is frozen. GRUB 2 is a rewrite with a scripting-style configuration file,
      loadable modules, UUID support and more, and it is what distributions install today. You may
      still meet GRUB Legacy on old machines, which is why the exam covers both.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: GRUB Legacy vs. GRUB 2 }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [grub-legacy, grub2]

  - id: 101-102.2-0003
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      A BIOS-based PC boots from a disk with a DOS (MBR) partition table. Where does GRUB put the
      small piece of boot code that the BIOS runs first?
    options:
      - id: a
        text: In the `/boot/grub` directory of the root filesystem
        rationale: Wrong. The BIOS cannot read filesystems; /boot/grub holds files GRUB loads later.
      - id: b
        text: In the EFI System Partition
        rationale: Wrong. The ESP is used by UEFI firmware, not by a BIOS booting an MBR disk.
      - id: c
        text: In the last sector of the disk
        rationale: Wrong. The BIOS reads the first sector of the disk, not the last one.
      - id: d
        text: In the disk's first sector, the Master Boot Record
        rationale: Correct. The BIOS loads and runs the first 512-byte sector, which holds GRUB's boot code and the partition table.
    answer: [d]
    explanation: >
      The BIOS loads the disk's first sector (the MBR) and runs the code in it. That code is too
      small to do much, so it loads GRUB's core image, which in turn reads its modules and
      configuration from /boot/grub.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: "Where is the Bootloader?" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Correct option shortened so it is no longer the longest." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [mbr, bios]

  - id: 101-102.2-0004
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      A server's `/boot` holds the four files below for one kernel version. Which one is the
      compressed Linux kernel that GRUB loads?
    options:
      - id: a
        text: "`System.map-6.8.0-45-generic`"
        rationale: Wrong. System.map is a table of kernel symbol names and their addresses, used when debugging.
      - id: b
        text: "`vmlinuz-6.8.0-45-generic`"
        rationale: Correct. vmlinuz is the kernel image; the z marks it as compressed.
      - id: c
        text: "`config-6.8.0-45-generic`"
        rationale: Wrong. This lists the options the kernel was built with; it is not loaded at boot.
      - id: d
        text: "`initrd.img-6.8.0-45-generic`"
        rationale: Wrong. This is the initial RAM disk GRUB loads next to the kernel, not the kernel itself.
    answer: [b]
    explanation: >
      Each installed kernel version leaves a set of files in /boot: vmlinuz-VERSION (the kernel),
      initrd.img-VERSION (initial RAM disk), System.map-VERSION (symbol table) and config-VERSION
      (build configuration). A GRUB entry loads the first two.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Contents of the Boot Partition }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [boot-partition, vmlinuz]

  - id: 101-102.2-0005
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      You want a permanent GRUB 2 menu entry that starts a memory tester, and it must survive the
      next time the distribution regenerates the GRUB configuration after a kernel update. Where do
      you add the `menuentry` block?
    options:
      - id: a
        text: "`/etc/grub.d/40_custom`, then regenerate grub.cfg"
        rationale: Correct. Scripts in /etc/grub.d are run on every regeneration, and 40_custom exists to carry hand-written entries.
      - id: b
        text: Directly in `/boot/grub/grub.cfg`
        rationale: Wrong. The entry works until grub.cfg is regenerated, which overwrites the whole file.
      - id: c
        text: "`/boot/grub/menu.lst`"
        rationale: Wrong. GRUB 2 does not read menu.lst; that is the GRUB Legacy configuration file.
      - id: d
        text: "`/etc/default/grub`, then regenerate the configuration"
        rationale: Wrong. This file only sets shell variables such as GRUB_TIMEOUT; a menuentry block placed there is not copied into grub.cfg.
    answer: [a]
    explanation: >
      grub.cfg is rebuilt (by update-grub or grub-mkconfig) from the executable scripts in
      /etc/grub.d, run in name order. 40_custom prints whatever follows its first lines, so entries
      placed there end up in every regenerated grub.cfg.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Managing Menu Entries }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Correct option shortened so it is no longer the longest." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [grub2, grub.d, 40_custom]

  - id: 101-102.2-0006
    type: fill_in
    difficulty: 2
    pool: holdout
    stem: >
      In a GRUB Legacy `menu.lst`, each menu entry starts with a command that sets the text shown
      for the entry in the boot menu. Type that command.
    fill_in:
      accepted: ['title(\s+.+)?']
      match: regex
      case_sensitive: true
    explanation: >
      A GRUB Legacy entry starts with `title <text>`, followed by commands such as root, kernel and
      initrd. Everything up to the next title belongs to that entry. GRUB 2 uses a
      `menuentry "<text>" { ... }` block instead.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Configuring GRUB Legacy Menu Entries and Settings }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [grub-legacy, menu.lst]

  - id: 101-102.2-0007
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: In a GRUB Legacy configuration, what does the device name `(hd0,0)` refer to?
    options:
      - id: a
        text: The whole first disk, as used when installing to its MBR
        rationale: Wrong. The whole first disk is written (hd0), with no partition number.
      - id: b
        text: The second partition of the first disk
        rationale: Wrong. GRUB Legacy counts partitions from 0, so the second partition would be (hd0,1).
      - id: c
        text: The first partition of the first disk
        rationale: Correct. GRUB Legacy numbers both disks and partitions from zero.
      - id: d
        text: Nothing; it is invalid because partitions are numbered from 1
        rationale: Wrong. Numbering partitions from 1 is a GRUB 2 rule; in GRUB Legacy partition 0 is valid.
    answer: [c]
    explanation: >
      GRUB Legacy counts disks and partitions from 0, so (hd0,0) is the first partition of the first
      disk, usually /dev/sda1. GRUB 2 still counts disks from 0 but partitions from 1, so the same
      partition is (hd0,1) there.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Configuring GRUB Legacy Menu Entries and Settings }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [grub-legacy, device-naming]

  - id: 101-102.2-0008
    type: multi_choice
    difficulty: 2
    pool: holdout
    stem: >
      You are asked to change the boot menu of an old server that still runs GRUB Legacy. Which
      **TWO** file names may hold its menu configuration, depending on the distribution?
    select_count: 2
    options:
      - id: a
        text: "`/boot/grub/grub.cfg`"
        rationale: Wrong. grub.cfg is the configuration file of GRUB 2.
      - id: b
        text: "`/boot/grub/menu.lst`"
        rationale: Correct. menu.lst is the usual GRUB Legacy configuration file.
      - id: c
        text: "`/etc/default/grub`"
        rationale: Wrong. This is the GRUB 2 settings file used when generating grub.cfg.
      - id: d
        text: "`/boot/grub/grub.conf`"
        rationale: Correct. Red Hat family distributions named the GRUB Legacy file grub.conf (with menu.lst as a link to it).
    answer: [b, d]
    explanation: >
      GRUB Legacy reads /boot/grub/menu.lst; Red Hat, CentOS and older Fedora kept it as
      /boot/grub/grub.conf. Both are edited directly and take effect at the next boot, with no
      generator step. GRUB 2 uses a generated grub.cfg instead.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Configuring GRUB Legacy Menu Entries and Settings }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [grub-legacy, menu.lst, grub.conf]

  - id: 101-102.2-0009
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      A BIOS-based server has a single disk, `/dev/sda`, with a DOS partition table; `/boot` is a
      directory on `/dev/sda1`. Which command writes GRUB 2's boot code to the disk's MBR and copies
      its images and modules into `/boot/grub`?
    options:
      - id: a
        text: "`grub-install /dev/sda1`"
        rationale: Wrong. This names a partition, not the disk; GRUB would target the partition's boot sector (and refuses unless forced), leaving the MBR untouched.
      - id: b
        text: "`update-grub /dev/sda`"
        rationale: Wrong. update-grub only regenerates grub.cfg; it ignores the extra argument and writes nothing to the disk.
      - id: c
        text: "`grub-mkconfig -o /dev/sda`"
        rationale: Wrong. This writes a generated configuration file over the start of the raw disk device, destroying the partition table.
      - id: d
        text: "`grub-install /dev/sda`"
        rationale: Correct. grub-install takes the whole disk as its install device and places the boot code in its MBR.
    answer: [d]
    explanation: >
      grub-install installs the boot loader: boot code in the MBR, core image after it, and modules
      and fonts in /boot/grub. Give it the disk (/dev/sda), not a partition. grub-mkconfig and
      update-grub only produce grub.cfg.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Installing GRUB 2 }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. update-grub/grub-mkconfig behaviour checked in the scripts." }
    tags: [grub-install, mbr]

  - id: 101-102.2-0010
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      You booted a broken BIOS machine from a live USB stick and mounted its separate boot
      partition on `/mnt/target`. By default `grub-install` would copy GRUB's files into the live
      system's own `/boot/grub`. Type the GRUB 2 `grub-install` long option that makes it use the mounted
      boot partition instead (you may include its value).
    fill_in:
      accepted: ['((sudo\s+)?((/usr)?/s?bin/)?grub2?-install\s+(/dev/\S+\s+)?)?--boot-directory((=|\s+)/mnt/target/?(\s+/dev/\S+)?)?']
      match: regex
      case_sensitive: true
    explanation: >
      `grub-install --boot-directory=/mnt/target /dev/sda` puts the images and modules into
      /mnt/target/grub, which is /boot/grub on the repaired system, and writes the boot code to
      /dev/sda. Without the option, files go to the running system's /boot/grub.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Installing GRUB 2 }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Regex tightened: a device argument is only accepted after a directory value, so '--boot-directory /dev/sda' is rejected." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: fixed, notes: "Regex now only accepts /mnt/target as the value and allows device-first order; stem says GRUB 2 grub-install." }
    tags: [grub-install, rescue]

  - id: 101-102.2-0011
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      A custom GRUB 2 entry must read its kernel from `/dev/sdb3`, the third partition of the second
      disk (DOS partition table). Assuming GRUB sees the disks in the same order as Linux, which
      device name do you use in `set root=`?
    options:
      - id: a
        text: "`(hd2,3)`"
        rationale: Wrong. GRUB 2 numbers disks from 0, so (hd2) is the third disk.
      - id: b
        text: "`(hd1,3)`"
        rationale: Correct. Second disk is hd1 (disks count from 0); third partition is 3 (partitions count from 1).
      - id: c
        text: "`(hd1,2)`"
        rationale: Wrong. That is the GRUB Legacy way of counting; in GRUB 2 it is the second partition.
      - id: d
        text: "`(sdb,3)`"
        rationale: Wrong. GRUB does not use Linux device names; disks are hd0, hd1 and so on.
    answer: [b]
    explanation: >
      In GRUB 2, disks start at hd0 and partitions start at 1, so /dev/sdb3 is (hd1,3), also written
      (hd1,msdos3) for a DOS partition table. The mapping depends on the firmware's disk order, which
      is why generated entries usually locate the filesystem by UUID instead.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Managing Menu Entries }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [grub2, device-naming]

  - id: 101-102.2-0012
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: >
      Inside a GRUB 2 `menuentry` block, which **TWO** lines tell GRUB which filesystem to read the
      kernel and initrd from?
    select_count: 2
    options:
      - id: a
        text: "`set root=(hd0,2)`"
        rationale: Correct. This sets GRUB's root device directly by disk and partition.
      - id: b
        text: "`root (hd0,1)`"
        rationale: Wrong. This is GRUB Legacy syntax; GRUB 2 has no root command and sets the root variable instead.
      - id: c
        text: "`search --set=root --fs-uuid 0b7c4e2a-6d1f-4c39-9a51-3f2e8d7c1a40`"
        rationale: Correct. search finds the filesystem with that UUID and stores its device in the root variable.
      - id: d
        text: "`linux /vmlinuz root=/dev/sda2`"
        rationale: Wrong. root=/dev/sda2 here is a kernel parameter telling Linux where its root filesystem is; it does not change where GRUB reads files.
    answer: [a, c]
    explanation: >
      GRUB 2 resolves paths such as /vmlinuz against its `root` variable. You set it directly with
      `set root=(hdX,Y)` or let `search --set=root` find the filesystem by UUID (--fs-uuid), label
      (--label) or a file it contains. The kernel's own `root=` parameter is a separate thing.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Managing Menu Entries }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. Commands checked against GRUB 2 command.lst and the GRUB Legacy manual." }
    tags: [grub2, search, uuid]

  - id: 101-102.2-0013
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      You are at the `grub>` prompt of a GRUB Legacy boot disk and do not know which partition holds
      the installed system's GRUB files. Which command finds it?
    options:
      - id: a
        text: "`find /boot/grub/stage1`"
        rationale: Correct. GRUB Legacy's find searches all partitions for the file and prints each one that has it, e.g. (hd0,0).
      - id: b
        text: "`search --file /boot/grub/stage1`"
        rationale: Wrong. search is a GRUB 2 command; GRUB Legacy does not have it.
      - id: c
        text: "`ls /boot/grub`"
        rationale: Wrong. GRUB Legacy has no ls command; listing devices and files with ls is a GRUB 2 feature.
      - id: d
        text: "`root /boot/grub`"
        rationale: Wrong. root takes a device such as (hd0,0), not a path, and it sets the device rather than searching for one.
    answer: [a]
    explanation: >
      GRUB Legacy keeps its stage files in /boot/grub. `find /boot/grub/stage1` lists the partitions
      that contain that file; you then pass the result to `root` and install with `setup`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Installing GRUB Legacy from a GRUB Shell }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. Commands checked against GRUB 2 command.lst and the GRUB Legacy manual." }
    tags: [grub-legacy, grub-shell]

  - id: 101-102.2-0014
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      A machine is moved from GRUB Legacy to GRUB 2, and the entry below has to be added to
      `/etc/grub.d/40_custom`. Which `menuentry` body boots the same kernel in the same way?
    exhibit: |
      title Debian (rescue kernel)
      root (hd0,2)
      kernel /vmlinuz-6.1.0-26-amd64 root=/dev/sda3 ro single
      initrd /initrd.img-6.1.0-26-amd64
    options:
      - id: a
        text: "`set root=(hd0,2)` / `linux /vmlinuz-6.1.0-26-amd64 root=/dev/sda3 ro single` / `initrd /initrd.img-6.1.0-26-amd64`"
        rationale: Wrong. In GRUB 2, (hd0,2) is the second partition; the Legacy (hd0,2) is the third.
      - id: b
        text: "`set root=(hd0,3)` / `kernel /vmlinuz-6.1.0-26-amd64 root=/dev/sda3 ro single` / `initrd /initrd.img-6.1.0-26-amd64`"
        rationale: Wrong. GRUB 2 loads a Linux kernel with the linux command; it has no kernel command.
      - id: c
        text: "`set root=(hd0,3)` / `linux /vmlinuz-6.1.0-26-amd64 root=/dev/sda3 ro single` / `initrd /initrd.img-6.1.0-26-amd64`"
        rationale: Correct. The partition number goes up by one for GRUB 2, linux replaces kernel, and the kernel parameters stay as they were.
      - id: d
        text: "`set root=(hd0,3)` / `linux /vmlinuz-6.1.0-26-amd64 root=/dev/sda4 ro single` / `initrd /initrd.img-6.1.0-26-amd64`"
        rationale: Wrong. root=/dev/sda3 is a Linux device name passed to the kernel; it does not change when GRUB's numbering does.
    answer: [c]
    explanation: >
      Legacy (hd0,2) counts partitions from 0, so it is the third partition, /dev/sda3; in GRUB 2
      that is (hd0,3). GRUB 2 uses `linux` instead of `kernel`. Kernel parameters such as
      root=/dev/sda3 use Linux names and are copied unchanged.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Configuring GRUB Legacy Menu Entries and Settings }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [grub-legacy, grub2, device-naming, menuentry]

  - id: 101-102.2-0015
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      A dual-boot PC uses GRUB Legacy with the `menu.lst` entry below. What happens when a user
      selects it?
    exhibit: |
      title Windows
      root (hd0,1)
      makeactive
      chainloader +1
    options:
      - id: a
        text: GRUB loads the Windows kernel file from the second partition and starts it directly.
        rationale: Wrong. GRUB Legacy cannot load Windows itself; chainloading hands over to Windows' own boot loader.
      - id: b
        text: GRUB reads the first sector of the first partition on the first disk and runs it.
        rationale: Wrong. GRUB Legacy counts partitions from 0, so (hd0,1) is the second partition, not the first.
      - id: c
        text: GRUB re-reads the MBR of the first disk and runs it.
        rationale: Wrong. +1 is relative to the root device (hd0,1), a partition, so the sector read is that partition's first, not the disk's MBR.
      - id: d
        text: GRUB reads the first sector of the second partition on the first disk and runs it.
        rationale: Correct. chainloader +1 loads the first sector of the root device (hd0,1) and boots it, after makeactive marks that partition active.
    answer: [d]
    explanation: >
      Chainloading starts another operating system's boot loader. `root (hd0,1)` selects the second
      partition of the first disk, `makeactive` sets its active flag (primary partitions only), and
      `chainloader +1` loads that partition's first sector, which Windows' boot loader occupies.
      GRUB 2 uses the same `chainloader +1` command.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Chainloading other Operating Systems }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [grub-legacy, chainloading]

  - id: 101-102.2-0016
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: Which **TWO** statements correctly describe where GRUB 2 places its code?
    select_count: 2
    options:
      - id: a
        text: On a BIOS machine with a DOS partition table, the core image goes in the gap between the MBR and the first partition.
        rationale: Correct. The MBR code loads the core image from the unused sectors before the first partition.
      - id: b
        text: On a BIOS machine with a GPT disk, the core image goes in the gap after the protective MBR, exactly as on a DOS-labelled disk.
        rationale: Wrong. The GPT header and partition entries occupy the start of the disk; GRUB needs a small BIOS boot partition to hold the core image.
      - id: c
        text: On a UEFI machine, the firmware runs GRUB's boot code from the MBR, which then loads grubx64.efi from /boot/grub.
        rationale: Wrong. UEFI firmware does not run MBR code; it loads grubx64.efi directly from the EFI System Partition.
      - id: d
        text: On a BIOS machine with a GPT disk, the core image goes in a dedicated BIOS boot partition.
        rationale: Correct. GPT leaves no reliable post-MBR gap, so grub-install embeds the core image in a BIOS boot partition.
    answer: [a, d]
    explanation: >
      BIOS + DOS label: boot code in the MBR, core image in the gap before the first partition.
      BIOS + GPT: boot code in the protective MBR, core image in a BIOS boot partition. UEFI: the
      firmware loads grubx64.efi (grubia32.efi on 32-bit) from the EFI System Partition.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: "Where is the Bootloader?" }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked. Embedding message confirmed in grub-install." }
    tags: [grub2, mbr, gpt, uefi]

  - id: 101-102.2-0017
    type: fill_in
    difficulty: 4
    pool: holdout
    stem: >
      At the GRUB 2 `grub>` prompt, `ls` printed `(proc) (hd0) (hd0,gpt1) (hd0,gpt2)`. Type the
      command that lists the files and directories at the top of the second partition.
    fill_in:
      accepted: ['ls(\s+(-[lha]+|--(long|human-readable|all)))*\s+\(hd0,(gpt)?2\)/']
      match: regex
      case_sensitive: true
    explanation: >
      `ls (hd0,gpt2)/` lists the top directory of that partition (add -l for a long listing). The
      trailing slash matters: `ls (hd0,gpt2)` without it only prints information about the
      partition, such as its filesystem type and UUID. (hd0,2) without the gpt prefix also works.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Booting from the GRUB 2 Shell }
    review:
      status: pass2
