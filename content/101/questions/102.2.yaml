        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [boot-loader]

  - id: 101-102.2-0022
    type: single_choice
    difficulty: 1
    pool: practice
    stem: >
      A server's GRUB 2 menu is on screen. Before choosing an entry, you want to run `ls` to see
      which disks and partitions GRUB can find. Which key do you press?
    options:
      - id: a
        text: "`e`"
        rationale: Wrong. e opens an editor for the selected menu entry, not a command prompt.
      - id: b
        text: "`Esc`"
        rationale: Wrong. Esc leaves the editor or the shell and returns to the menu.
      - id: c
        text: "`Enter`"
        rationale: Wrong. Enter boots the selected entry.
      - id: d
        text: "`c`"
        rationale: Correct. c opens the GRUB command line with the grub> prompt.
    answer: [d]
    explanation: >
      From the menu, c opens the GRUB shell (grub>), where help lists the available commands. The
      same key works in GRUB Legacy. Esc returns to the menu.
