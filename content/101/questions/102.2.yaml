    tags: [chainloading, grub-legacy, grub2]

  - id: 101-102.2-0029
    type: single_choice
    difficulty: 4
    pool: practice
    stem: >
      A menu entry is broken and you are at the GRUB 2 `grub>` prompt. The root filesystem is
      `/dev/sda5`, and its top directory contains `vmlinuz` and `initrd.img`. Based on the output
      below, which commands set the root device and load the kernel?
    exhibit: |
      grub> ls
      (proc) (hd0) (hd0,msdos1) (hd0,msdos5)
    options:
      - id: a
        text: "`set root=(hd0,msdos5)` then `linux /vmlinuz root=/dev/sda5`"
        rationale: Correct. GRUB reads from msdos5 (which is /dev/sda5), and the kernel gets a Linux device name for its root.
      - id: b
        text: "`set root=(hd0,msdos5)` then `linux /vmlinuz root=(hd0,msdos5)`"
        rationale: Wrong. The kernel does not understand GRUB device names in its root= parameter.
      - id: c
        text: "`set root=(hd0,msdos4)` then `linux /vmlinuz root=/dev/sda5`"
        rationale: Wrong. msdos4 does not exist here; GRUB 2 partition numbers match the Linux ones, so sda5 is msdos5.
      - id: d
        text: "`root (hd0,4)` then `kernel /vmlinuz root=/dev/sda5`"
        rationale: Wrong. root and kernel are GRUB Legacy commands; GRUB 2 uses set root= and linux.
    answer: [a]
    explanation: >
      GRUB 2 partition numbers start at 1 like Linux, so /dev/sda5 (a logical partition) is
      (hd0,msdos5). Set root to it, load the kernel with linux and a Linux-style root= parameter,
      then load the initrd and run boot.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.2", lesson: 1, section: Booting from the GRUB 2 Shell }
