        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, repeat]

  - id: 101-103.8-0022
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: Which **TWO** statements about leaving vim with `:x`, `:wq` and `:e` are true?
    select_count: 2
    options:
      - id: a
        text: "`:x` throws away unsaved changes and quits"
        rationale: Wrong. :x saves changes before quitting; :q! is the one that discards them.
      - id: b
        text: "`:e` saves the file and quits, just like `:x`"
        rationale: Wrong. :e edits (reloads) a file and never quits; with unsaved changes it refuses with E37.
      - id: c
        text: "`:wq` writes the file even when nothing has changed"
        rationale: Correct. :wq always writes, so the file's modification time is updated.
      - id: d
        text: "`:x` writes the file only if the buffer was modified"
        rationale: Correct. :x (like ZZ) skips the write when there are no changes, then quits.
    answer: [c, d]
    explanation: >
      :wq always writes and quits; :x and ZZ write only when needed and then quit. :e is the edit
      command: without a file name it reloads the current file, and it will not abandon unsaved
      changes unless written as :e!.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Colon Commands }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "No question change. Lesson lists :e as save-and-exit; vim 9.1 :e reloads and refuses a modified buffer with E37. The question tests real behaviour." }
    tags: [vi, quit]

  - id: 101-103.8-0023
    type: fill_in
    difficulty: 4
    pool: holdout
    stem: >
      The cursor is in the middle of a line. Type a vi normal-mode command that deletes everything
      from the cursor to the end of the line and stays in normal mode.
    fill_in:
      accepted: ['D|d\$']
      match: regex
      case_sensitive: true
    explanation: >
      D is a shortcut for d$: the d operator combined with the $ (end of line) motion. C and c$ do
