  - id: 101-103.8-0036
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      The cursor is somewhere in the middle of a line, and you want to type text in front of the
      line's first non-blank character. Which single vi key enters insert mode there?
    options:
      - id: a
        text: "`I`"
        rationale: Correct. I inserts before the first non-blank character of the line.
      - id: b
        text: "`i`"
        rationale: Wrong. i inserts before the cursor, here in the middle of the line.
      - id: c
        text: "`O`"
        rationale: Wrong. O opens a new line above instead of inserting on this one.
      - id: d
        text: "`0`"
        rationale: Wrong. 0 only moves the cursor to column one; it does not enter insert mode.
    answer: [a]
    explanation: i and a insert at the cursor; I and A insert at the start and end of the line.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, insert]

  - id: 101-103.8-0037
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      The cursor is on the lower-case `w` of `Hello world`. Which vi command turns it into a capital
      `W` and leaves you in normal mode?
    options:
      - id: a
        text: "`sW`"
        rationale: Wrong. s replaces the character but leaves you in insert mode until Esc.
      - id: b
        text: "`RW`"
        rationale: Wrong. R starts replace mode, which keeps overwriting characters until Esc.
      - id: c
        text: "`cwW`"
        rationale: Wrong. cw replaces the whole word "world" with W and stays in insert mode.
      - id: d
        text: "`rW`"
        rationale: Correct. r replaces the single character under the cursor and stays in normal mode.
    answer: [d]
    explanation: >
      r followed by a character overwrites one character and returns straight to normal mode. s, R
      and c-commands all leave you in an insert-type mode.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, replace]

  - id: 101-103.8-0038
    type: single_choice
    difficulty: 3
    pool: practice
    stem: The cursor is in the middle of the word `configuration`. Which vi motion moves it back to the first letter of that word?
    options:
      - id: a
        text: "`w`"
        rationale: Wrong. w moves forward to the start of the next word.
      - id: b
        text: "`b`"
        rationale: Correct. b moves back to the start of the current (or previous) word.
      - id: c
        text: "`e`"
        rationale: Wrong. e moves forward to the end of the word.
      - id: d
        text: "`$`"
        rationale: Wrong. $ moves to the end of the line.
    answer: [b]
    explanation: w and b move forward and back by word starts; e moves to word ends. W, B and E do the same treating punctuation as part of the word.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, navigation]

  - id: 101-103.8-0039
    type: single_choice
    difficulty: 4
    pool: practice
    stem: >
      The line shown starts with four spaces, and the cursor is on its last character. Which key
      sequence deletes the letter `i` of `indented`?
    exhibit: "    indented text"
    options:
      - id: a
        text: "`0x`"
        rationale: Wrong. 0 goes to column one, which is a space, so x deletes a space.
      - id: b
        text: "`Ix`"
        rationale: Wrong. I enters insert mode, so x is typed into the text instead of deleting.
      - id: c
        text: "`^x`"
        rationale: Correct. ^ goes to the first non-blank character, the i, and x deletes it.
      - id: d
        text: "`$x`"
        rationale: Wrong. $ stays at the end of the line, so x deletes the final t.
    answer: [c]
    explanation: 0 goes to the very first column, ^ to the first non-blank character, and $ to the end of the line.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "verify block removed: vi is not installed in debian:stable-slim; behaviour checked with vim 9.1 -es instead." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, navigation]

  - id: 101-103.8-0040
    type: single_choice
    difficulty: 2
    pool: practice
    stem: In GNU nano, which key combination cuts the current line (so it can be pasted with Ctrl-U)?
    options:
      - id: a
        text: "`Ctrl-K`"
        rationale: Correct. Ctrl-K cuts the current line (or the marked selection).
      - id: b
        text: "`Ctrl-X`"
        rationale: Wrong. Ctrl-X exits nano.
      - id: c
        text: "`Ctrl-O`"
        rationale: Wrong. Ctrl-O writes the file out (saves it).
      - id: d
        text: "`Ctrl-W`"
        rationale: Wrong. Ctrl-W searches ("Where Is").
    answer: [a]
    explanation: >
      nano lists its main shortcuts at the bottom of the screen: ^K Cut, ^U Paste, ^O Write Out,
      ^X Exit, ^W Where Is, ^\ Replace, M-U Undo, M-E Redo.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Alternative Editors }
