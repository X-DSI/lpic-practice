  - id: 101-103.8-0024
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      Your shell environment contains `VISUAL=/usr/bin/vim` and `EDITOR=/usr/bin/nano`, both
      exported. You run `crontab -e`. Which editor opens?
    options:
      - id: a
        text: nano, because EDITOR is checked before VISUAL
        rationale: Wrong. crontab checks VISUAL first and only uses EDITOR when VISUAL is unset.
      - id: b
        text: vim, because VISUAL is checked before EDITOR
        rationale: Correct. When both are set, crontab (like sudoedit) uses VISUAL.
      - id: c
        text: None; crontab reports that the two settings conflict
        rationale: Wrong. There is no conflict check; one variable simply takes precedence.
      - id: d
        text: The editor that the system-wide default editor link points to
        rationale: Wrong. The system default (e.g. sensible-editor or /usr/bin/vi) is only a fallback when neither variable is set.
    answer: [b]
    explanation: >
      Programs that launch an editor normally try VISUAL, then EDITOR, then a built-in default. To
      be sure of the result, set both, or unset the one you do not want.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Alternative Editors }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [EDITOR, VISUAL, crontab]

  - id: 101-103.8-0025
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      After many edits you decide the file was better as it is on disk. You want to drop every
      unsaved change and start again from the saved version, without leaving vim. Which command does this?
    options:
      - id: a
        text: "`:q!`"
        rationale: Wrong. :q! discards the changes, but it also exits the editor.
      - id: b
        text: "`u`"
        rationale: Wrong. One u undoes only the most recent change, not all of them.
      - id: c
        text: "`:e!`"
        rationale: Correct. :e! reloads the file from disk, discarding all changes in the buffer.
      - id: d
        text: "`:w!`"
        rationale: Wrong. :w! writes the edited buffer over the saved file, the opposite of what you want.
    answer: [c]
    explanation: >
      :e (edit) loads a file into the buffer; with no file name it reloads the current one. The ! lets
      it throw away unsaved changes, which plain :e refuses to do.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Colon Commands }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "verify block removed: vi is not installed in debian:stable-slim; behaviour checked with vim 9.1 -es instead." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, revert]

  - id: 101-103.8-0026
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      A file contains the lines shown. The cursor is on the first character of line 1 in normal
      mode. You type `/Listen`, press Enter, then type `n` and `dd`. Which line is deleted?
    exhibit: |
      Listen 80
      ServerName www.example.com
      # Listen 8080
      DocumentRoot /var/www
      Listen 443
    options:
      - id: a
        text: "`Listen 443`"
        rationale: Correct. The search starts after the cursor and lands on line 3; n moves on to line 5, which dd deletes.
      - id: b
        text: "`# Listen 8080`"
        rationale: Wrong. That is where /Listen lands; n then moves on to the next match.
      - id: c
        text: "`Listen 80`"
        rationale: Wrong. A forward search starts after the cursor position, so the match under the cursor is skipped at first.
      - id: d
        text: "`DocumentRoot /var/www`"
        rationale: Wrong. That line does not contain Listen, so neither the search nor n stops there.
    answer: [a]
    explanation: >
      A forward search looks for the next match after the cursor, so /Listen goes to line 3
      (`# Listen 8080`). n repeats the search forward to line 5, and dd deletes that line. Only
      after another n would the search wrap around to line 1.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, search]

  - id: 101-103.8-0027
    type: multi_choice
    difficulty: 5
    pool: holdout
    stem: >
      You made changes in vi that you do **not** want to keep. Which **TWO** commands exit the
      editor and leave the file on disk as it was?
    select_count: 2
    options:
      - id: a
        text: "`:q!`"
        rationale: Correct. :q! quits and discards unsaved changes.
      - id: b
        text: "`ZQ`"
        rationale: Correct. ZQ is the normal-mode equivalent of :q!.
      - id: c
        text: "`:w!`"
        rationale: Wrong. :w! forces the changes to be written to the file and does not exit.
      - id: d
        text: "`:e`"
        rationale: Wrong. :e does not exit; with unsaved changes it refuses to reload the file (E37).
      - id: e
        text: "`:wq!`"
        rationale: Wrong. :wq! forces the changes to be written and then quits.
    answer: [a, b]
    explanation: >
      :q! and its normal-mode equivalent ZQ abandon the buffer and exit, so the file keeps the
      content it had when it was last written. Any command containing w writes the changes, and :e
      never leaves the editor.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "verify block removed: vi is not installed in debian:stable-slim; behaviour checked with vim 9.1 -es instead." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Distractors ZZ, :x, :wq (shared with 0013) replaced by :w!, :e, :wq!; rationales checked in vim 9.1. Reviewer suggested difficulty 3 or 4; kept at 5 to hold the holdout split. Needs re-check." }
    tags: [vi, quit, ZZ]

  - id: 101-103.8-0028
    type: fill_in
    difficulty: 5
    pool: holdout
    stem: >
      An interface was renamed. Type the vi colon command that replaces every occurrence of `eth0`
      with `ens3` on every line of the open file, without asking for confirmation.
    fill_in:
      accepted: [':?\s*(%|1,\$)\s*s(u(b(s(t(i(t(u(te?)?)?)?)?)?)?)?)?(?P<d>[/#!@+,])eth0(?P=d)ens3(?P=d)g[eI]?']
      match: regex
      case_sensitive: true
    explanation: >
      `:%s/eth0/ens3/g` — % is the range for the whole file (the same as 1,$), s is substitute, and
      the g flag replaces all matches on each line. Adding c (gc) would ask for confirmation at each
      match. Another delimiter, such as #, works too.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Colon Commands }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "verify block removed: vi is not installed in debian:stable-slim; behaviour checked with vim 9.1 -es instead." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Regex no longer accepts | as delimiter (vim gives E492); optional e or I flag after g accepted. Reviewer suggested difficulty 4; kept at 5 to hold the holdout split." }
    tags: [vi, substitute]

  - id: 101-103.8-0029
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      In a 20-line file you want to replace **every** `a` with `A` on lines 2 and 3 only, leaving the
      other lines untouched. Which command does exactly that?
    options:
      - id: a
        text: "`:%s/a/A/g`"
        rationale: Wrong. % selects every line of the file, not just lines 2 and 3.
      - id: b
        text: "`:2,3s/a/A/`"
        rationale: Wrong. Without the g flag only the first a on each of the two lines is replaced.
      - id: c
        text: "`:2,$s/a/A/g`"
        rationale: Wrong. The range 2,$ runs from line 2 to the last line, not just to line 3.
      - id: d
        text: "`:2,3s/a/A/g`"
        rationale: Correct. The range 2,3 limits the substitution to those lines, and g replaces every match on them.
    answer: [d]
    explanation: >
      vi's substitute command accepts sed-style addresses: a single line number, a range such as
      2,3, or % for the whole file. The g flag is still needed to go past the first match on each line.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Colon Commands }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Distractor :2s replaced by :2,$s to avoid a longest-correct giveaway. verify block removed: vi is not installed in debian:stable-slim; behaviour checked with vim 9.1 -es instead." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked. Reviewer suggested difficulty 4; kept at 5 to hold the holdout split." }
    tags: [vi, substitute]

  - id: 101-103.8-0030
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      A line reads `one two three`, and the cursor is on its first character in normal mode. You
      type `dwwP`. What does the line read afterwards?
    options:
      - id: a
        text: "`two three one `"
        rationale: Wrong. P pastes before the cursor, not at the end of the line.
      - id: b
        text: "`two one three`"
        rationale: Correct. dw cuts "one ", w moves to "three", and P pastes "one " in front of it.
      - id: c
        text: "`one two three`"
        rationale: Wrong. That would happen with dwP, which pastes the word back where it came from.
      - id: d
        text: "`one two one three`"
        rationale: Wrong. dw removed "one " from the start of the line, so it is not there any more.
    answer: [b]
    explanation: >
      dw deletes from the cursor to the start of the next word, including the space, and keeps the
      text in a register. The cursor is then on "two"; w moves to "three"; P puts the deleted text
      before the cursor, giving `two one three`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Implausible distractor replaced. verify block removed: vi is not installed in debian:stable-slim; behaviour checked with vim 9.1 -es instead." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, delete, paste]

