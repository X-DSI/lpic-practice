  - id: 101-103.8-0011
    type: multi_choice
    difficulty: 2
    pool: holdout
    stem: >
      Which **TWO** terminal text editors insert every character you type directly into the file,
      giving commands through Ctrl (and Meta/Alt) key combinations instead of a separate command mode?
    select_count: 2
    options:
      - id: a
        text: vim
        rationale: Wrong. vim, like vi, starts in normal mode and needs an insertion command before typed text appears.
      - id: b
        text: GNU nano
        rationale: Correct. nano inserts keystrokes as text and uses Ctrl and Meta combinations for commands.
      - id: c
        text: GNU Emacs
        rationale: Correct. Emacs inserts typed text directly and uses key chords such as Ctrl-x Ctrl-s for commands.
      - id: d
        text: vi
        rationale: Wrong. vi is the classic modal editor, with separate normal and insert modes.
    answer: [b, c]
    explanation: >
      vi and vim are modal: keys are commands in normal mode and text only in insert mode. nano and
      Emacs are not modal in that sense; ordinary keys insert text and commands use modifier keys,
      e.g. Ctrl-O/Ctrl-X in nano and Ctrl-x Ctrl-s / Ctrl-x Ctrl-c in Emacs.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Alternative Editors }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [nano, emacs, vim]

  - id: 101-103.8-0012
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      You want to duplicate the current line somewhere else in the file. Which vi command copies the
      line into a register without changing the file?
    options:
      - id: a
        text: "`dd`"
        rationale: Wrong. dd also stores the line in a register, but it removes the line from the file.
      - id: b
        text: "`p`"
        rationale: Wrong. p pastes the register contents; it does not copy anything.
      - id: c
        text: "`yy`"
        rationale: Correct. yy yanks (copies) the current line and leaves the file unchanged.
      - id: d
        text: "`x`"
        rationale: Wrong. x deletes the character under the cursor.
    answer: [c]
    explanation: >
      y is vi's copy ("yank") operator and yy yanks the whole current line. Move to the target
      position and press p (after) or P (before) to paste it.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, yank]

  - id: 101-103.8-0013
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: Which **TWO** vi commands write the file to disk and then exit the editor?
    select_count: 2
    options:
      - id: a
        text: "`:wq`"
        rationale: Correct. :wq writes the buffer and quits.
      - id: b
        text: "`:q!`"
        rationale: Wrong. :q! quits without writing.
      - id: c
        text: "`ZZ`"
        rationale: Correct. ZZ writes the file if it was modified and quits.
      - id: d
        text: "`ZQ`"
        rationale: Wrong. ZQ quits without writing, like :q!.
      - id: e
        text: "`:w`"
        rationale: Wrong. :w writes the file but stays in the editor.
    answer: [a, c]
    explanation: >
      :wq, :x and ZZ all save and leave (ZZ and :x only write when there are changes). :q! and ZQ
      leave without saving, and :w saves without leaving.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Colon Commands }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, quit, ZZ]

  - id: 101-103.8-0014
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      The cursor is on the first character of the line `PermitRootLogin no`. You want to add a
      comment at the very end of that line. Which single vi key puts you in insert mode at the
      right place?
    options:
      - id: a
        text: "`A`"
        rationale: Correct. A enters insert mode at the end of the current line, wherever the cursor is.
      - id: b
        text: "`a`"
        rationale: Wrong. a inserts after the character under the cursor, here after the P.
      - id: c
        text: "`I`"
        rationale: Wrong. I inserts at the beginning of the line (before the first non-blank character).
      - id: d
        text: "`O`"
        rationale: Wrong. O opens a new empty line above the current one.
    answer: [a]
    explanation: >
      Lower-case i and a insert before and after the cursor; the capital versions I and A insert at
      the beginning and the end of the line.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, insert]

  - id: 101-103.8-0015
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: The cursor is on line 10 of a file. What does typing `3yy` in vi normal mode do?
    options:
      - id: a
        text: Copies line 10 three times into the file below the cursor
        rationale: Wrong. yy only copies into a register; nothing is added to the file until you paste.
      - id: b
        text: Copies line 3 into the register
        rationale: Wrong. The count says how many lines to yank, not which line number.
      - id: c
        text: Deletes lines 10 to 12 and keeps them in a register
        rationale: Wrong. Deleting lines is done with d (3dd); y only copies.
      - id: d
        text: Copies lines 10, 11 and 12 into a register
        rationale: Correct. The count 3 makes yy yank the current line and the two lines after it.
    answer: [d]
    explanation: >
      A number in front of a normal-mode command repeats it or extends it. 3yy yanks three lines
      starting at the cursor, ready to be pasted with p or P.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, yank, count]

  - id: 101-103.8-0016
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      Type a vi normal-mode command (not a colon command) that moves the cursor to the first line
      of the file.
    fill_in:
      accepted: ['gg|1G|1gg']
      match: regex
      case_sensitive: true
    explanation: >
      gg (vim) or 1G (classic vi and vim) jump to the first line; G alone jumps to the last line,
      and a number before G jumps to that line, for example 25G. The colon command :1 does the same
      from command-line mode.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
