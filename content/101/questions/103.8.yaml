  - id: 101-103.8-0035
    type: single_choice
    difficulty: 2
    pool: practice
    stem: You pressed `u` in vim once too often and undid a change you wanted. Which key brings that change back?
    options:
      - id: a
        text: "`Ctrl-U`"
        rationale: Wrong. In normal mode Ctrl-U scrolls the window up half a screen.
      - id: b
        text: "`.`"
        rationale: Wrong. . repeats the last change at the cursor; it does not redo an undone change.
      - id: c
        text: "`Ctrl-R`"
        rationale: Correct. Ctrl-R redoes the change that u undid.
      - id: d
        text: "`U`"
        rationale: Wrong. U undoes all recent changes on the last changed line; it is not redo.
    answer: [c]
    explanation: In vim, u undoes and Ctrl-R redoes, through several levels of history.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
