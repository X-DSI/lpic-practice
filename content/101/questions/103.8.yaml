  - id: 101-103.8-0019
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: Which **TWO** statements about vim compared with the original vi are true?
    select_count: 2
    options:
      - id: a
        text: vim needs a graphical desktop session to run
        rationale: Wrong. vim is a terminal program; a separate GUI version (gvim) exists but is optional.
      - id: b
        text: vim can undo a whole series of changes, not just the last one
        rationale: Correct. vim keeps a multi-level undo history, with Ctrl-R to redo.
      - id: c
        text: vim uses different keys, so vi commands do not work in it
        rationale: Wrong. vim keeps vi's commands, so a vi user can work in it straight away; only small details such as multi-level undo differ.
      - id: d
        text: vim can highlight the syntax of source code and configuration files
        rationale: Correct. Syntax highlighting is one of vim's additions over vi.
    answer: [b, d]
    explanation: >
      vim ("vi improved") keeps vi's commands and adds features such as syntax highlighting,
      multi-level undo/redo and editing several files at once. Many distributions install vim (or a
      minimal build of it) as their vi.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Introduction }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Option c rationale reworded. Reviewer suggested difficulty 2; kept at 3 to hold the holdout split." }
    tags: [vim]

  - id: 101-103.8-0020
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      A file contains the lines shown. The cursor is on line 2 (`server1`) in normal mode, and you
      type `ddp`. What does the file contain afterwards?
    exhibit: |
      # servers
      server1
      server2
      server3
    options:
      - id: a
        text: "`# servers`, `server2`, `server3`, `server1`"
        rationale: Wrong. p pastes after the line the cursor is on (server2), not at the end of the file.
      - id: b
        text: "`# servers`, `server1`, `server1`, `server2`, `server3`"
        rationale: Wrong. That would be the result of yyp; dd removed the original line first.
      - id: c
        text: "`server1`, `# servers`, `server2`, `server3`"
        rationale: Wrong. That would need P on line 1; ddp moves the line down, not up.
      - id: d
        text: "`# servers`, `server2`, `server1`, `server3`"
        rationale: Correct. dd deletes server1 and leaves the cursor on server2; p puts server1 below it.
    answer: [d]
    explanation: >
      dd cuts the current line into the unnamed register, and the cursor lands on the line that
      moved up. p then pastes the cut line below that line, so ddp swaps the current line with the
      next one.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "verify block removed: vi is not installed in debian:stable-slim; behaviour checked with vim 9.1 -es instead." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, delete, paste]

  - id: 101-103.8-0021
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      A file contains the five lines shown. The cursor is on line 2 (`b2`) in normal mode. You type
      `dd` and then press `.` once. Which lines remain?
    exhibit: |
      a1
      b2
      c3
      d4
      e5
    options:
      - id: a
        text: "`a1`, `d4`, `e5`"
        rationale: Correct. dd deletes b2; . repeats the deletion on the line now under the cursor, c3.
      - id: b
        text: "`a1`, `c3`, `d4`, `e5`"
        rationale: Wrong. That ignores the . key, which repeats the last change.
      - id: c
        text: "`a1`, `b2`, `c3`, `d4`, `e5`"
        rationale: Wrong. That would be the effect of u (undo), not . (repeat).
      - id: d
        text: "`a1`, `b2`, `e5`"
        rationale: Wrong. The deletion starts at the cursor line (b2), so b2 is removed first.
    answer: [a]
    explanation: >
      The . command repeats the last change. After dd removes b2, the cursor sits on c3, and . removes
      that line too.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
