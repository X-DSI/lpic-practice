  - id: 101-103.8-0034
    type: single_choice
    difficulty: 2
    pool: practice
    stem: >
      You yanked a line with `yy` and moved the cursor to another line. Which key pastes the copied
      line **above** the line the cursor is on?
    options:
      - id: a
        text: "`p`"
        rationale: Wrong. p pastes a yanked line below the current line.
      - id: b
        text: "`P`"
        rationale: Correct. P pastes a yanked line above the current line.
      - id: c
        text: "`yy`"
        rationale: Wrong. yy would yank the current line, replacing what you copied.
      - id: d
        text: "`O`"
        rationale: Wrong. O opens an empty line above and enters insert mode; it does not paste.
    answer: [b]
    explanation: p puts register contents after the cursor (below, for whole lines), P puts them before (above).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
