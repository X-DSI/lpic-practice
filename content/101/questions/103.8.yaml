  - id: 101-103.8-0001
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: You open `/etc/fstab` with `vi`. In which mode is the editor when the file first appears?
    options:
      - id: a
        text: Normal mode
        rationale: Correct. vi always starts in normal mode, where keys are commands rather than text.
      - id: b
        text: Insert mode
        rationale: Wrong. Insert mode has to be entered with a command such as i, a or o.
      - id: c
        text: Visual mode
        rationale: Wrong. Visual mode is only entered with v, V or Ctrl-V from normal mode.
      - id: d
        text: Replace mode
        rationale: Wrong. Replace mode is entered with R from normal mode.
    answer: [a]
    explanation: >
      vi opens every file in normal mode, also called command mode. Typing letters there runs
      commands, which is why new users are surprised when text does not appear. An insertion
      command switches to insert mode, and Esc returns to normal mode.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Option a shortened so the correct answer is not the longest." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, modes]

  - id: 101-103.8-0002
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: In vi normal mode, which key moves the cursor down by one line?
    options:
      - id: a
        text: "`h`"
        rationale: Wrong. h moves the cursor one character to the left.
      - id: b
        text: "`j`"
        rationale: Correct. j moves the cursor down one line.
      - id: c
        text: "`k`"
        rationale: Wrong. k moves the cursor up one line.
      - id: d
        text: "`l`"
        rationale: Wrong. l moves the cursor one character to the right.
    answer: [b]
    explanation: >
      The home-row keys h, j, k and l move the cursor left, down, up and right in normal mode. They
      work on any terminal, even one where the arrow keys are not mapped correctly.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, navigation]

  - id: 101-103.8-0003
    type: multi_choice
    difficulty: 1
    pool: holdout
    stem: Which **TWO** vi normal-mode keys move the cursor sideways within the current line?
    select_count: 2
    options:
      - id: a
        text: "`h`"
        rationale: Correct. h moves one character to the left.
      - id: b
        text: "`j`"
        rationale: Wrong. j moves down to the next line.
      - id: c
        text: "`k`"
        rationale: Wrong. k moves up to the previous line.
      - id: d
        text: "`l`"
        rationale: Correct. l moves one character to the right.
    answer: [a, d]
    explanation: >
      h and l are the horizontal movements (left and right); j and k are the vertical ones (down
      and up).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, navigation]

  - id: 101-103.8-0004
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      Programs such as `crontab -e` need to start a text editor for you. Which environment variable
      do they read to learn which editor you prefer?
    options:
      - id: a
        text: "`PAGER`"
        rationale: Wrong. PAGER names the program used to page through output, such as less.
      - id: b
        text: "`TERM`"
        rationale: Wrong. TERM describes the terminal type, not a preferred program.
      - id: c
        text: "`EDITOR`"
        rationale: Correct. EDITOR (or VISUAL, when set) names the user's preferred text editor.
      - id: d
        text: "`DISPLAY`"
        rationale: Wrong. DISPLAY tells graphical programs which X server to use.
    answer: [c]
    explanation: >
      Tools that open an editor on your behalf (crontab -e, sudoedit, git and others) look at
      VISUAL and EDITOR. Setting `export EDITOR=nano`, for example, makes them start nano.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Alternative Editors }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Distractor SHELL replaced by DISPLAY so the correct answer is not the longest." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [EDITOR]

  - id: 101-103.8-0005
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: You have finished typing a paragraph in vi insert mode. Which key brings you back to normal mode?
    options:
      - id: a
        text: "`Enter`"
        rationale: Wrong. In insert mode Enter just starts a new line of text.
      - id: b
        text: "`Tab`"
        rationale: Wrong. In insert mode Tab inserts a tab character (or spaces).
      - id: c
        text: "`:`"
        rationale: Wrong. In insert mode a colon is typed into the text like any other character.
      - id: d
        text: "`Esc`"
        rationale: Correct. Esc ends insert mode and returns to normal mode.
    answer: [d]
    explanation: >
      Esc leaves insert mode. Pressing it in normal mode does no harm, so many users press it
      whenever they are unsure which mode they are in.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Insert Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, modes]

  - id: 101-103.8-0006
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      You edited `/etc/hosts` in vi by mistake and want to leave without writing any of your changes
      to disk. Which command do you type in normal mode?
    options:
      - id: a
        text: "`:wq`"
        rationale: Wrong. :wq writes the changes to the file and then quits.
      - id: b
        text: "`:w!`"
        rationale: Wrong. :w! forces a write of the buffer; it saves the changes and does not quit.
      - id: c
        text: "`:q!`"
        rationale: Correct. :q! quits and throws away unsaved changes.
      - id: d
        text: "`:q`"
        rationale: Wrong. With unsaved changes, :q refuses to quit (E37 No write since last change).
    answer: [c]
    explanation: >
      The ! on :q! overrides the safety check that stops :q from abandoning a modified buffer. The
      file on disk keeps the content it had when it was last written.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Colon Commands }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, quit]

  - id: 101-103.8-0007
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: The cursor is on an obsolete line in a configuration file. Which vi command removes that whole line?
    options:
      - id: a
        text: "`dd`"
        rationale: Correct. dd deletes the current line (and keeps it in a register for pasting).
      - id: b
        text: "`x`"
        rationale: Wrong. x deletes only the character under the cursor.
      - id: c
        text: "`yy`"
        rationale: Wrong. yy copies (yanks) the line; the file is not changed.
      - id: d
        text: "`D`"
        rationale: Wrong. D deletes from the cursor to the end of the line and leaves the (possibly empty) line in place.
    answer: [a]
    explanation: >
      dd deletes the current line. A count in front deletes several lines, for example 3dd. The
      deleted text can be pasted elsewhere with p or P.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, delete]

  - id: 101-103.8-0008
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      You want to add a new line of text directly below the line the cursor is on and start typing
      on it. Which single vi normal-mode key does this?
    options:
      - id: a
        text: "`O`"
        rationale: Wrong. O opens the new line above the current line.
      - id: b
        text: "`o`"
        rationale: Correct. o opens a new line below the current one and enters insert mode.
      - id: c
        text: "`A`"
        rationale: Wrong. A enters insert mode at the end of the current line, without a new line.
      - id: d
        text: "`a`"
        rationale: Wrong. a enters insert mode just after the cursor, on the same line.
    answer: [b]
    explanation: >
      o opens a line below and O opens a line above; both switch to insert mode immediately.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, insert]

  - id: 101-103.8-0009
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      The cursor is near the end of a long Apache configuration file. Which vi command searches
      toward the **beginning** of the file for the word `Listen`?
    options:
      - id: a
        text: "`/Listen`"
        rationale: Wrong. / searches forward, toward the end of the file.
      - id: b
        text: "`:s/Listen`"
        rationale: Wrong. :s is the substitute command for the current line; it does not search the file.
      - id: c
        text: "`n`"
        rationale: Wrong. n repeats the previous search; it does not start a search for a new word.
      - id: d
        text: "`?Listen`"
        rationale: Correct. ? searches backward from the cursor.
    answer: [d]
    explanation: >
      /pattern searches forward and ?pattern searches backward. After either, n jumps to the next
      match in the same direction and N to the next match in the opposite direction.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, search]

  - id: 101-103.8-0010
    type: fill_in
    difficulty: 2
    pool: holdout
    stem: >
      Type the complete command that opens `/etc/hosts` in `vi` with the cursor already placed on
      line 12, using vi's `+` start-up option.
    fill_in:
      accepted: ['(sudo\s+)?((/usr)?/bin/)?vim?\s+(\+12\s+/etc/hosts|/etc/hosts\s+\+12)']
      match: regex
