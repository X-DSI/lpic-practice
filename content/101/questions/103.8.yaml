  - id: 101-103.8-0032
    type: single_choice
    difficulty: 1
    pool: practice
    stem: A colleague new to vim asks how to practise the basic commands. What does the `vimtutor` command provide?
    options:
      - id: a
        text: A hands-on lesson opened in vim, on a copy you can edit freely
        rationale: Correct. vimtutor opens a working copy of a tutorial file in vim for practice.
      - id: b
        text: A converter that turns a vi configuration into a ~/.vimrc file
        rationale: Wrong. No such conversion is done; vim reads ~/.vimrc as written.
      - id: c
        text: A tool that recovers files from vim swap files after a crash
        rationale: Wrong. Recovery is done with vim -r (or from the swap-file prompt).
      - id: d
        text: A viewer that shows vim's help pages without opening the editor
        rationale: Wrong. vim's help is read inside vim with :help.
    answer: [a]
    explanation: >
      vimtutor starts vim on a temporary copy of a step-by-step tutorial, so you can try every
      command on real text without risk.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Colon Commands }
    review:
