    tags: [vi, navigation]

  - id: 101-103.8-0017
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      The cursor is in the middle of a file that mentions `oldhost` several times on many of its
      lines. Which vi command replaces
      **every** occurrence with `newhost` throughout the file?
    options:
      - id: a
        text: "`:s/oldhost/newhost/g`"
        rationale: Wrong. Without an address, :s works on the current line only.
      - id: b
        text: "`:%s/oldhost/newhost/g`"
        rationale: Correct. % addresses every line and g replaces every match on each line.
      - id: c
        text: "`:%s/oldhost/newhost/`"
        rationale: Wrong. Without g, only the first match on each line is replaced.
      - id: d
        text: "`:.,$s/oldhost/newhost/g`"
        rationale: Wrong. The range .,$ runs from the cursor line to the end, so lines above the cursor are skipped.
    answer: [b]
    explanation: >
      The substitute command follows sed syntax: [range]s/pattern/replacement/[flags]. % means the
      whole file (the same as 1,$), and the g flag makes it replace all matches on a line, not just
      the first.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Colon Commands }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Distractor /oldhost/... replaced by a .,$ range (cursor position added to stem) to avoid a longest-correct giveaway." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, substitute]

  - id: 101-103.8-0018
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
