  - id: 101-103.8-0042
    type: multi_choice
    difficulty: 4
    pool: practice
    stem: Which **TWO** statements about the `EDITOR` variable in bash are true?
    select_count: 2
    options:
      - id: a
        text: "`export EDITOR=nano` is passed on to programs started from that shell"
        rationale: Correct. Exported variables reach child processes such as crontab, which use EDITOR when VISUAL is not set.
      - id: b
        text: "`export EDITOR=nano` at the prompt changes the editor for other users too"
        rationale: Wrong. It only affects the current shell and the processes it starts.
      - id: c
        text: "An `export EDITOR=nano` line in ~/.bash_profile applies it to later login sessions"
        rationale: Correct. bash reads ~/.bash_profile at each login, so the setting is re-applied every time.
      - id: d
        text: "EDITOR must hold a full path such as /usr/bin/nano, not just a name"
        rationale: Wrong. A plain command name is looked up in PATH like any other command.
    answer: [a, c]
    explanation: >
      Setting and exporting EDITOR changes the preferred editor for the current session only. To
      keep it, put the export line in a shell start-up file such as ~/.bash_profile.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Alternative Editors }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: fixed, notes: "Option a text and rationale reworded (VISUAL precedence)." }
    tags: [EDITOR]

  - id: 101-103.8-0043
    type: multi_choice
    difficulty: 5
    pool: practice
    stem: >
      The cursor is on line 1 of the four-line file shown. Which **TWO** key sequences put a copy of
      line 1 directly below line 2 (so the file becomes L1, L2, L1, L3, L4)?
    exhibit: |
      L1
      L2
      L3
      L4
    select_count: 2
    options:
      - id: a
        text: "`yyjP`"
        rationale: Wrong. On line 2, P pastes above it, giving L1, L1, L2, L3, L4.
      - id: b
        text: "`yyjp`"
        rationale: Correct. j moves to line 2 and p pastes the yanked line below it.
      - id: c
        text: "`yyjjP`"
        rationale: Correct. jj moves to line 3 and P pastes above it, which is the same place.
      - id: d
        text: "`yyGp`"
        rationale: Wrong. G moves to the last line, so p pastes after L4.
    answer: [b, c]
    explanation: >
      For whole lines, p pastes below the cursor line and P above it. Pasting below line 2 and
      pasting above line 3 put the text in the same place.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "verify block removed: vi is not installed in debian:stable-slim; behaviour checked with vim 9.1 -es instead." }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-26", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [vi, yank, paste]

