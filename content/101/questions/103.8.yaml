  - id: 101-103.8-0041
    type: multi_choice
    difficulty: 3
    pool: practice
    stem: Which **TWO** vi commands create a new empty line and put you in insert mode on it?
    select_count: 2
    options:
      - id: a
        text: "`A`"
        rationale: Wrong. A inserts at the end of the current line; no new line is created.
      - id: b
        text: "`o`"
        rationale: Correct. o opens a new line below the current one.
      - id: c
        text: "`i`"
        rationale: Wrong. i inserts before the cursor on the current line.
      - id: d
        text: "`O`"
        rationale: Correct. O opens a new line above the current one.
    answer: [b, d]
    explanation: o opens a line below, O a line above; both enter insert mode at once.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.8", lesson: 1, section: Normal Mode }
