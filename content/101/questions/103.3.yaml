  - id: 101-103.3-0024
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: >
      Which **TWO** commands produce a gzip-compressed copy of `access.log` and leave the
      uncompressed `access.log` in place?
    select_count: 2
    options:
      - id: a
        text: "`gzip access.log`"
        rationale: Wrong. By default gzip replaces access.log with access.log.gz.
      - id: b
        text: "`gzip -d access.log`"
        rationale: Wrong. -d decompresses; it refuses a file without a compression suffix.
      - id: c
        text: "`gzip -k access.log`"
        rationale: Correct. -k (--keep) writes access.log.gz and keeps the input file.
      - id: d
        text: "`bzip2 access.log`"
        rationale: Wrong. This uses bzip2, not gzip, and also removes the original.
      - id: e
        text: "`gzip -c access.log > access.log.gz`"
        rationale: Correct. -c writes the compressed data to standard output, so the input file is not touched.
    answer: [c, e]
    explanation: >
      gzip (like bzip2 and xz) deletes the input after compressing it. Keep it with -k, or send the
      output to standard output with -c and redirect it yourself.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Compressing with tar }
    verify:
      command: sh -c 'cd /tmp && seq 100 > a.log && gzip -k a.log && seq 100 > b.log && gzip -c b.log > b.log.gz && ls a.log a.log.gz b.log b.log.gz'
      expect: { exit_code: 0 }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [gzip]

  - id: 101-103.3-0025
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: >
      `old` is an **empty** directory in the current directory. Which **TWO** commands remove it?
    select_count: 2
    options:
      - id: a
        text: "`rm old`"
        rationale: Wrong. Without -r (or -d), rm refuses with "Is a directory", even if it is empty.
      - id: b
        text: "`rmdir old`"
        rationale: Correct. rmdir removes empty directories.
      - id: c
        text: "`unlink old`"
        rationale: Wrong. unlink removes a single file name; on a directory it fails with "Is a directory".
      - id: d
        text: "`rm -r old`"
        rationale: Correct. rm -r removes a directory whether or not it has contents.
      - id: e
        text: "`rm -f old`"
        rationale: Wrong. -f does not allow rm to delete directories; it still needs -r or -d.
    answer: [b, d]
    explanation: >
      rmdir handles empty directories only, while rm -r deletes a directory and anything in it.
      Plain rm, with or without -f, does not remove directories.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Recursive Deletion with rm -r }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [rm, rmdir]

  - id: 101-103.3-0026
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      You want to check the permissions and owner of the directory `/srv/www` itself, not of the
      files it contains. Which command shows them?
    options:
      - id: a
        text: "`ls -l /srv/www`"
        rationale: Wrong. Given a directory, ls lists its contents, so you see the files inside instead.
      - id: b
        text: "`ls -lR /srv/www`"
        rationale: Wrong. -R lists the contents and the contents of every subdirectory, still not the directory itself.
      - id: c
        text: "`ls -ld /srv/www`"
        rationale: Correct. -d lists the directory entry itself instead of its contents.
      - id: d
        text: "`ls -lh /srv/www`"
        rationale: Wrong. -h only formats sizes; the contents are still listed.
    answer: [c]
    explanation: >
      ls normally opens a directory and lists what is in it. -d treats a directory argument like
      any other file, so ls -ld shows its own permission string, owner, size and date.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Using ls to List Files }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [ls]

  - id: 101-103.3-0027
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      Given the directories shown, you run `cp -r site backup`. Where is the copy of `index.html`
      afterwards?
    exhibit: |
      $ ls -F
      backup/  site/
      $ ls site
      index.html
    options:
      - id: a
        text: "`backup/index.html`"
        rationale: Wrong. That happens only when backup does not exist yet, in which case backup becomes the copy of site.
      - id: b
        text: "`backup/site/index.html`"
        rationale: Correct. backup already exists, so cp copies the directory site into it.
      - id: c
        text: "`site/backup/index.html`"
        rationale: Wrong. The last argument is the destination; nothing is written into site.
      - id: d
        text: Nowhere; cp reports "omitting directory 'site'"
        rationale: Wrong. That message appears without -r; with -r the directory is copied.
    answer: [b]
    explanation: >
      When the destination is an existing directory, cp puts the source inside it under its own
      name. When the destination does not exist, the copy is created with the destination's name.
      To copy only the contents of site into backup, use `cp -r site/. backup` (or site/* if there
      are no hidden files to keep).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Recursive Copy with cp -r }
    verify:
      command: sh -c 'mkdir -p /tmp/c/site /tmp/c/backup && touch /tmp/c/site/index.html && cd /tmp/c && cp -r site backup && ls backup/site'
      expect: { exit_code: 0, stdout_contains: "index.html" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [cp, recursion]

  - id: 101-103.3-0028
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: >
      A directory contains exactly the files shown. Which **TWO** patterns, used with `ls`, list
      `report1.txt` and `Report2.txt` and no other file?
    exhibit: |
      $ ls
      Report2.txt  report.txt  report1.txt  report12.txt  reportA.txt
    select_count: 2
    options:
      - id: a
        text: "`?eport?.txt`"
        rationale: Wrong. The second ? accepts a letter as well, so reportA.txt is listed too.
      - id: b
        text: "`[rR]eport[0-9].txt`"
        rationale: Correct. One of r or R, then exactly one digit; report.txt, report12.txt and reportA.txt do not fit.
      - id: c
        text: "`[Rr]eport[12].txt`"
        rationale: Correct. Exactly one character from the set 1 or 2 matches report1.txt and Report2.txt only.
      - id: d
        text: "`*eport[0-9]*.txt`"
        rationale: Wrong. The trailing * lets report12.txt match as well.
      - id: e
        text: "`[Rr]eport*.txt`"
        rationale: Wrong. * also matches nothing, A or 12, so all five files are listed.
    answer: [b, c]
    explanation: >
      Bracket expressions match exactly one character from a set or range and can be combined with
      ? and *. Here the first character must be r or R and exactly one digit must follow "eport".
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Combining Wildcards }
    verify:
      command: sh -c 'mkdir -p /tmp/r && cd /tmp/r && touch Report2.txt report.txt report1.txt report12.txt reportA.txt && echo [rR]eport[0-9].txt && echo [Rr]eport[12].txt'
      expect: { exit_code: 0, stdout_regex: "^Report2\\.txt report1\\.txt\\nReport2\\.txt report1\\.txt\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [globbing, wildcards]

  - id: 101-103.3-0029
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      In a directory tree holding three PNG files, one of the commands below printed exactly the
      output shown. Which one?
    exhibit: |
      X ./z.png ./sub/x.png ./y.png
    options:
      - id: a
        text: "`find . -name '*.png' -exec echo X {} \\;`"
        rationale: Wrong. With \; the command runs once per file, giving three lines with one name each.
      - id: b
        text: "`find . -name '*.png' -exec echo X \\;`"
        rationale: Wrong. Without {} no file name is passed, so echo prints a bare X three times.
      - id: c
        text: "`find . -name '*.png' -exec echo X {} +`"
        rationale: Correct. Ending -exec with + passes as many names as fit to one run of the command.
      - id: d
        text: "`find . -name '*.png' -ok echo X {} \\;`"
        rationale: Wrong. -ok asks for confirmation before each run and still handles one file at a time.
    answer: [c]
    explanation: >
      In -exec, {} is replaced by the current file name. `\;` ends the command and runs it once per
      match; `+` ends it and collects many matches into a single run, much like xargs.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Acting on the Result Set }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [find, exec]

  - id: 101-103.3-0030
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      You try to add `new.log` to an existing archive and get the error shown. How do you get
      `new.log` into the archive?
    exhibit: |
      $ tar -rf logs.tar.gz new.log
      tar: Cannot update compressed archives
      tar: Error is not recoverable: exiting now
    options:
      - id: a
        text: Gunzip it, append with `tar -rf logs.tar new.log`, then gzip it again
        rationale: Correct. Appending only works on an uncompressed archive, so decompress, append, and compress again.
      - id: b
        text: Run `tar -rzf logs.tar.gz new.log` so tar knows the archive is gzip-compressed
        rationale: Wrong. Adding -z gives the same "Cannot update compressed archives" error.
      - id: c
        text: Run `tar -uf logs.tar.gz new.log`, because -u updates archives in place
        rationale: Wrong. -u has the same restriction as -r and fails on a compressed archive.
      - id: d
        text: Run the same command as root, because the archive belongs to another user
        rationale: Wrong. The message is about compression, not permissions; root gets the same error.
    answer: [a]
    explanation: >
      tar can append (-r) or update (-u) only an uncompressed archive, because it must write after
      the last member in place. A compressed archive has to be decompressed first, or recreated.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Compressing with tar }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Correct option shortened; it was the longest option." }
    tags: [tar, gzip]

  - id: 101-103.3-0031
    type: fill_in
    difficulty: 4
    pool: holdout
    stem: >
      Type a `dd` command that saves the first 512 bytes of `/dev/sda` (the boot sector) to the
      file `mbr.bin`. Set the block size explicitly to 512 bytes and copy exactly one block.
    fill_in:
      accepted:
