  - id: 101-103.3-0051
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      Which pattern matches the (non-hidden) files whose names do **NOT** begin with a digit?
    options:
      - id: a
        text: "`[!0-9]*`"
        rationale: Correct. [!0-9] is one character that is not a digit, and * accepts the rest of the name.
      - id: b
        text: "`[0-9]*`"
        rationale: Wrong. This matches names that do begin with a digit.
      - id: c
        text: "`*[!0-9]`"
        rationale: Wrong. This tests the last character, not the first.
      - id: d
        text: "`?[0-9]*`"
        rationale: Wrong. This requires the second character to be a digit and says nothing about the first.
    answer: [a]
    explanation: >
      An exclamation mark right after `[` negates a bracket expression (bash also accepts `^`).
      Placing it first in the pattern tests the first character of the name.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Bracketed Characters }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [globbing, wildcards]

  - id: 101-103.3-0052
    type: multi_choice
    difficulty: 3
    pool: practice
    stem: Which **TWO** `find` tests select files by when they were last modified?
    select_count: 2
    options:
      - id: a
        text: "`-mtime`"
        rationale: Correct. -mtime compares the modification time in days.
      - id: b
        text: "`-iname`"
        rationale: Wrong. -iname matches the name, ignoring case.
      - id: c
        text: "`-newer`"
        rationale: Correct. -newer FILE matches files modified more recently than FILE.
      - id: d
        text: "`-maxdepth`"
        rationale: Wrong. -maxdepth limits how deep find descends.
      - id: e
        text: "`-size`"
        rationale: Wrong. -size compares file sizes.
    answer: [a, c]
    explanation: >
      -mtime n (days) and -mmin n (minutes) compare against the current time; -newer FILE compares
      against another file's modification time. -atime and -ctime test access and status-change times.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Locating Files by Modification Time }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [find, mtime]

  - id: 101-103.3-0053
    type: fill_in
    difficulty: 3
    pool: practice
    stem: >
      Type a `tar` command that prints the names of the files stored in `site.tar` without
      extracting them.
    fill_in:
      accepted:
        - 'tar\s+(-?(t|tv|vt)f\s*(\./)?site\.tar|(-t|--list)(\s+(-v|--verbose))?\s+(-f\s*|--file(=|\s+))(\./)?site\.tar|(-f\s*|--file(=|\s+))(\./)?site\.tar\s+(-t|--list)(\s+(-v|--verbose))?)'
      match: regex
      case_sensitive: true
    explanation: >
      `tar -tf site.tar` (long form `tar --list --file=site.tar`) lists the members; add -v for
      permissions, owners, sizes and dates. GNU tar detects compression on its own when listing.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: The tar Command (Archiving and Compresssion) }
    verify:
      command: sh -c 'mkdir -p /tmp/l/site && cd /tmp/l && touch site/a && tar -cf site.tar site && tar -tf site.tar'
      expect: { exit_code: 0, stdout_contains: "site/a" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [tar]

  - id: 101-103.3-0054
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      Which command extracts the cpio archive `backup.cpio` into the current directory, creating
      subdirectories as needed?
    options:
      - id: a
        text: "`cpio -o < backup.cpio`"
        rationale: Wrong. -o is copy-out (create) mode; it would read the archive bytes as a list of file names.
      - id: b
        text: "`cpio -id < backup.cpio`"
        rationale: Correct. -i extracts the archive read from standard input and -d creates directories as needed.
      - id: c
        text: "`cpio -id > backup.cpio`"
        rationale: Wrong. The redirection points the wrong way; it truncates backup.cpio and cpio waits for input.
      - id: d
        text: "`cpio -t < backup.cpio`"
        rationale: Wrong. -t only lists the archive's contents.
    answer: [b]
    explanation: >
      cpio reads archives from standard input in copy-in mode (-i) and writes them to standard
      output in copy-out mode (-o). -d creates leading directories during extraction.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: The cpio Command }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [cpio]

  - id: 101-103.3-0055
    type: single_choice
    difficulty: 4
    pool: practice
    stem: A directory contains exactly the files shown. Which names does `ls [ab]?g*` print?
    exhibit: |
      $ ls
      abc  bag  bg  big  big2  bog.txt
    options:
      - id: a
        text: "`bag big`"
        rationale: Wrong. * also matches extra characters, so big2 and bog.txt match too.
      - id: b
        text: "`bag big big2`"
        rationale: Wrong. bog.txt also fits (b, then o for ?, then g, then .txt for *).
      - id: c
        text: "`bag big big2 bog.txt`"
        rationale: Correct. Each has a or b first, any second character, g third, then anything.
      - id: d
        text: "`bag bg big big2 bog.txt`"
        rationale: Wrong. bg has no character between b and g for ? to match.
    answer: [c]
    explanation: >
      Read the pattern one position at a time: [ab] is one of a or b, ? is exactly one character,
      g is literal, and * is anything (including nothing). abc fails at the third position.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Combining Wildcards }
    verify:
      command: sh -c 'mkdir -p /tmp/b && cd /tmp/b && touch abc bag bg big big2 bog.txt && echo [ab]?g*'
      expect: { exit_code: 0, stdout_regex: "^bag big big2 bog\\.txt\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [globbing, wildcards]

  - id: 101-103.3-0056
    type: multi_choice
    difficulty: 4
    pool: practice
    stem: >
      `docs` is an existing directory. Which **TWO** commands move both `a.txt` and `b.txt` into it?
    select_count: 2
    options:
      - id: a
        text: "`mv docs a.txt b.txt`"
        rationale: Wrong. The last argument is the destination; b.txt is not a directory, so mv fails.
      - id: b
        text: "`mv a.txt b.txt docs/`"
        rationale: Correct. With several sources, the last argument must be a directory, and docs is one.
      - id: c
        text: "`cp a.txt b.txt docs`"
        rationale: Wrong. This copies the files; the originals stay where they are.
      - id: d
        text: "`mv a.txt,b.txt docs`"
        rationale: Wrong. The shell passes a.txt,b.txt as one name, which does not exist.
      - id: e
        text: "`mv -t docs a.txt b.txt`"
        rationale: Correct. -t (--target-directory) names the destination first, followed by the sources.
    answer: [b, e]
    explanation: >
      mv SOURCE... DIRECTORY moves several files into a directory. With -t DIRECTORY the
      destination comes first, which is handy with xargs or find -exec … +.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Moving Files with mv }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [mv]

  - id: 101-103.3-0057
    type: single_choice
    difficulty: 4
    pool: practice
    stem: >
      An archive was created as shown. Later you run `cd /tmp/restore && tar -xf /root/etc-backup.tar`.
      Where is `hosts` written?
    exhibit: |
      # tar -cf /root/etc-backup.tar /etc/hosts
      tar: Removing leading `/' from member names
    options:
      - id: a
        text: "`/etc/hosts`, replacing the live file"
        rationale: Wrong. The leading / was removed, so the member name is relative.
      - id: b
        text: "`/tmp/restore/hosts`"
        rationale: Wrong. Only the leading slash is removed; the etc/ directory part stays in the name.
      - id: c
        text: Nowhere; tar refuses to extract an archive made from absolute paths
        rationale: Wrong. The archive holds the relative name etc/hosts and extracts normally.
      - id: d
        text: "`/tmp/restore/etc/hosts`"
        rationale: Correct. The member is stored as etc/hosts and extracted relative to the current directory.
    answer: [d]
    explanation: >
      GNU tar strips the leading / from member names by default, so extracting never overwrites
      system files by accident. The files land below the current directory (or the -C directory).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Extracting an Archive }
    verify:
      command: sh -c 'tar -cf /tmp/e.tar /etc/hostname 2>/dev/null; mkdir -p /tmp/rs && cd /tmp/rs && tar -xf /tmp/e.tar && ls etc'
      expect: { exit_code: 0, stdout_contains: "hostname" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [tar]

  - id: 101-103.3-0058
    type: single_choice
    difficulty: 4
    pool: practice
    stem: >
      Inside a web directory you build a cpio archive as shown. The directory `css` contains
      `style.css`. What is true about the archive?
    exhibit: |
      $ ls
      css  index.html
      $ ls | cpio -o > ../site.cpio
      1 block
      $ cpio -t < ../site.cpio
      css
      index.html
      1 block
    options:
      - id: a
        text: The archive is damaged, because cpio -t should list every file
        rationale: Wrong. The listing is complete; it shows exactly what was archived.
      - id: b
        text: "cpio -t hides files in subdirectories unless -v is given"
        rationale: Wrong. -v adds details to each line, but cpio -t never hides members.
      - id: c
        text: "style.css is included but stored without its css/ prefix"
        rationale: Wrong. style.css was never given to cpio, so it is not in the archive at all.
      - id: d
        text: "css is stored only as a directory entry, without style.css"
        rationale: Correct. ls printed only top-level names, and cpio archives exactly the names it is given.
    answer: [d]
    explanation: >
      cpio does not recurse. Feed it a complete list, e.g. `find . | cpio -o > ../site.cpio`, so
      that files inside subdirectories are included.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: The cpio Command }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [cpio]

  - id: 101-103.3-0059
    type: multi_choice
    difficulty: 5
    pool: practice
    stem: >
      Which **TWO** commands delete every regular file ending in `.tmp` anywhere under
      `/var/tmp/app` (including subdirectories at any depth) and nothing else, without prompting?
    select_count: 2
    options:
      - id: a
        text: "`find /var/tmp/app -type f -name '*.tmp' -delete`"
        rationale: Correct. The tests are evaluated first, so -delete only acts on matching files.
      - id: b
        text: "`rm -r /var/tmp/app/*.tmp`"
        rationale: Wrong. The glob only matches names directly in /var/tmp/app, not in subdirectories.
      - id: c
        text: "`find /var/tmp/app -delete -type f -name '*.tmp'`"
        rationale: Wrong. -delete comes first, so it runs on every file and directory before the tests are checked.
      - id: d
        text: "`find /var/tmp/app -type f -name '*.tmp' -exec rm {} +`"
        rationale: Correct. rm receives the matching files in batches and deletes them.
      - id: e
        text: "`rm /var/tmp/app/**/*.tmp`"
        rationale: Wrong. Without bash's globstar option, ** acts like *, matching one level of subdirectories only.
    answer: [a, d]
    explanation: >
      find evaluates its expression left to right, and actions such as -delete or -exec run only
      when the tests before them succeed. Putting -delete first removes everything below the
      starting point.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Acting on the Result Set }
    verify:
      command: sh -c 'mkdir -p /tmp/a/sub/deeper && cd /tmp/a && touch x.tmp sub/y.tmp sub/deeper/z.tmp keep.txt && find . -type f -name "*.tmp" -delete && find . -type f'
      expect: { exit_code: 0, stdout_regex: "^\\./keep\\.txt\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [find, delete]

  - id: 101-103.3-0060
    type: single_choice
    difficulty: 5
    pool: practice
    stem: >
      A colleague uses `find /etc -name '*.conf' -mtime 7` to list configuration files changed
      during the past week. A file edited yesterday is missing from the output. Why?
    options:
      - id: a
        text: -mtime counts in minutes, so 7 means the last seven minutes
        rationale: Wrong. -mtime counts in days; -mmin counts in minutes.
      - id: b
        text: -mtime 7 means exactly 7 whole days old; -mtime -7 is needed
        rationale: Correct. No sign means "exactly", so only files 7 to 8 days old match.
      - id: c
        text: -mtime tests the access time; -atime is needed for changes
        rationale: Wrong. -mtime is modification time; -atime is access time.
      - id: d
        text: The quotes around '*.conf' stop find from expanding the pattern
        rationale: Wrong. find expands the quoted pattern itself; the quotes only keep the shell from doing it.
    answer: [b]
    explanation: >
      For -mtime, -n means fewer than n whole days, +n more than n, and plain n exactly n (after
      dropping fractions). "Changed in the last week" is -mtime -7.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Locating Files by Modification Time }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Correct option shortened; it was the longest option." }
    tags: [find, mtime]
