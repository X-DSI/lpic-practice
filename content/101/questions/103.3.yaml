# 103.3 Perform basic file management — weight 4 → 40 holdout + 20 practice.
# Original questions written from LPI Learning Materials 101-500, objective 103.3, lessons 1 and 2.
schema_version: 1
exam: "101"
objective: "103.3"
questions:
  # ---------------------------------------------------------------- holdout (mock exams only)

  - id: 101-103.3-0001
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      You want a file called `notes.txt` to exist: if it is missing it should be created empty, and
      if it is already there only its timestamps should change. Which command does this?
    options:
      - id: a
        text: "`touch notes.txt`"
        rationale: Correct. touch creates a missing file with no content and otherwise just updates its timestamps.
      - id: b
        text: "`mkdir notes.txt`"
        rationale: Wrong. mkdir would create a directory named notes.txt, and fails if the name already exists.
      - id: c
        text: "`cat notes.txt`"
        rationale: Wrong. cat only reads a file; on a missing file it reports "No such file or directory".
      - id: d
        text: "`file notes.txt`"
        rationale: Wrong. file only reports what kind of data a file holds; it never creates or modifies one.
    answer: [a]
    explanation: >
      touch is the usual way to create empty files, and it can create several at once. When a named
      file already exists, its content is left alone and only its access and modification times are
      set to the current time.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Creating files with touch }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [touch]

  - id: 101-103.3-0002
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      In a shell file name pattern, which wildcard stands for exactly one character, whatever that
      character is?
    options:
      - id: a
        text: "`*`"
        rationale: Wrong. The asterisk matches any number of characters, including none.
      - id: b
        text: "`[0-9]`"
        rationale: Wrong. A bracket expression matches one character, but only one from the listed set (here a digit).
      - id: c
        text: "`?`"
        rationale: Correct. The question mark matches any single character.
      - id: d
        text: "`**`"
        rationale: Wrong. Without special shell options, two asterisks behave like one and match any number of characters.
    answer: [c]
    explanation: >
      The three globbing wildcards are `*` (any string, even an empty one), `?` (any one character)
      and `[...]` (one character from a set or range). `file?.txt` matches `file1.txt` and
      `fileA.txt` but not `file.txt` or `file10.txt`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: The Question Mark }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [globbing, wildcards]

  - id: 101-103.3-0003
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: What can the `rmdir` command remove?
    options:
      - id: a
        text: A directory together with all files and subdirectories inside it
        rationale: Wrong. That is rm -r; rmdir refuses a directory that still has entries.
      - id: b
        text: Only directories that are empty
        rationale: Correct. rmdir fails with "Directory not empty" if anything is left inside.
      - id: c
        text: Only regular files, never directories
        rationale: Wrong. Removing files is rm's job; rmdir works only on directories.
      - id: d
        text: Only symbolic links that point to directories
        rationale: Wrong. rmdir does not remove symbolic links; it reports "Not a directory" for one.
    answer: [b]
    explanation: >
      rmdir deletes empty directories and nothing else, which makes it a safe choice when you
      expect a directory to be empty. To delete a directory with its contents, use rm -r.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Removing Directories with rmdir }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [rmdir]

  - id: 101-103.3-0004
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      Which `find` test limits the results to directories, leaving out regular files and other
      kinds of files?
    options:
      - id: a
        text: "`-type f`"
        rationale: Wrong. -type f selects regular files.
      - id: b
        text: "`-empty`"
        rationale: Wrong. -empty selects empty files and empty directories, whatever their type.
      - id: c
        text: "`-type l`"
        rationale: Wrong. -type l selects symbolic links.
      - id: d
        text: "`-type d`"
        rationale: Correct. -type d is true only for directories.
    answer: [d]
    explanation: >
      find's -type test takes a one-letter file type: f for regular files, d for directories,
      l for symbolic links (and b, c, p, s for block devices, character devices, named pipes and
      sockets).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Using Criteria to Speed Search }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [find]

  - id: 101-103.3-0005
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      You want to see which files are stored in `backup.tar` without unpacking anything. Which
      command do you use?
    options:
      - id: a
        text: "`tar -xf backup.tar`"
        rationale: Wrong. -x extracts the members, writing them to disk.
      - id: b
        text: "`tar -cf backup.tar`"
        rationale: Wrong. -c creates an archive; with no files named, GNU tar refuses to create an empty one.
      - id: c
        text: "`tar -rf backup.tar`"
        rationale: Wrong. -r appends files to the end of an existing archive.
      - id: d
        text: "`tar -tf backup.tar`"
        rationale: Correct. -t (--list) prints the names of the members without extracting them.
    answer: [d]
    explanation: >
      tar needs exactly one operation: -c to create, -x to extract, -t to list (plus -r to append
      and others). -f names the archive file; adding -v to -t gives an ls -l style listing.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: The tar Command (Archiving and Compresssion) }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [tar]

  - id: 101-103.3-0006
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      A colleague sends you `notes.txt.gz`, a single text file compressed with gzip. Which command
      restores `notes.txt`?
    options:
      - id: a
        text: "`gunzip notes.txt.gz`"
        rationale: Correct. gunzip decompresses a .gz file and removes the .gz suffix from the name.
      - id: b
        text: "`bunzip2 notes.txt.gz`"
        rationale: Wrong. bunzip2 handles bzip2 data, not gzip; it would report that the file is not a bzip2 file.
      - id: c
        text: "`tar -xf notes.txt.gz`"
        rationale: Wrong. The file is a compressed text file, not a tar archive, so tar does not restore notes.txt from it.
      - id: d
        text: "`gzip notes.txt.gz`"
        rationale: Wrong. gzip refuses, saying the file already has the .gz suffix, and leaves it unchanged.
    answer: [a]
    explanation: >
      gzip compresses a file to name.gz and removes the original; gunzip (or gzip -d) reverses it.
      The bzip2 equivalents are bzip2 and bunzip2.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Compressing with tar }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Rationale for the tar option corrected: a tiny gzipped text file makes tar exit 0 with nothing extracted, so it now says tar does not restore the file." }
    tags: [gzip, gunzip]

  - id: 101-103.3-0007
    type: single_choice
    difficulty: 1
    pool: holdout
    stem: >
      Which command examines a file's contents and prints a description such as `ASCII text`,
      `gzip compressed data` or `ELF 64-bit LSB pie executable`?
    options:
      - id: a
        text: "`stat`"
        rationale: Wrong. stat prints metadata from the inode (size, owner, times, "regular file"), not what the data is.
      - id: b
        text: "`ls -l`"
        rationale: Wrong. ls -l shows the file type character and metadata, but does not look inside the file.
      - id: c
        text: "`touch`"
        rationale: Wrong. touch creates files or updates timestamps; it reports nothing about content.
      - id: d
        text: "`file`"
        rationale: Correct. file tests the data (magic numbers and other patterns) and describes its format.
    answer: [d]
    explanation: >
      Linux does not rely on file name extensions, so `file` is the tool for finding out what a
      file really contains. It also recognises directories, device files and symbolic links.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Introduction }
    verify:
      command: sh -c 'printf "hello\n" > /tmp/v.txt && gzip -c /tmp/v.txt > /tmp/v.gz && od -An -tx1 -N2 /tmp/v.gz'
      expect: { exit_code: 0, stdout_contains: "1f 8b" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [file]

  - id: 101-103.3-0008
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      `/srv` exists, but `/srv/app` does not. Which single command creates the directory
      `/srv/app/logs/2026`?
    options:
      - id: a
        text: "`mkdir /srv/app/logs/2026`"
        rationale: Wrong. Without -p, mkdir fails with "No such file or directory" because the parent directories are missing.
      - id: b
        text: "`mkdir -m 755 /srv/app/logs/2026`"
        rationale: Wrong. -m only sets the new directory's permissions; the missing parents still make it fail.
      - id: c
        text: "`mkdir -p /srv/app/logs/2026`"
        rationale: Correct. -p (--parents) creates every missing directory along the path.
      - id: d
        text: "`mkdir -v /srv/app/logs/2026`"
        rationale: Wrong. -v only prints a message for each directory created; it does not create parents.
    answer: [c]
    explanation: >
      mkdir -p creates any missing parent directories and does not complain if the target already
      exists, which also makes it handy in scripts.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Creating Directories with mkdir }
    verify:
      command: sh -c 'mkdir -p /tmp/v/app/logs/2026 && test -d /tmp/v/app/logs/2026 && echo created'
      expect: { exit_code: 0, stdout_contains: "created" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [mkdir]

  - id: 101-103.3-0009
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      In your current directory, you want the file `report.txt` to be called `report-old.txt`
      from now on, with no copy left under the old name. Which command does this?
    options:
      - id: a
        text: "`mv report.txt report-old.txt`"
        rationale: Correct. mv with a new name in the same directory renames the file.
      - id: b
        text: "`cp report.txt report-old.txt`"
        rationale: Wrong. cp makes a second file; report.txt is still there afterwards.
      - id: c
        text: "`mv -t report-old.txt report.txt`"
        rationale: Wrong. -t names a target directory; report-old.txt is not a directory, so mv fails.
      - id: d
        text: "`touch report-old.txt`"
        rationale: Wrong. touch just creates an empty report-old.txt and leaves report.txt as it was.
    answer: [a]
    explanation: >
      mv both moves and renames. If the destination is an existing directory, the file is moved
      into it; otherwise the destination is taken as the new name.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Moving Files with mv }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [mv]

  - id: 101-103.3-0010
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      Plain `ls` in your home directory does not show `.bashrc` or `.profile`, although both
      exist. Which option makes `ls` include them?
    options:
      - id: a
        text: "`-l`"
        rationale: Wrong. -l switches to the long format but still skips names that begin with a dot.
      - id: b
        text: "`-a`"
        rationale: Correct. -a lists every entry, including those whose names begin with a dot (and . and ..).
      - id: c
        text: "`-R`"
        rationale: Wrong. -R descends into subdirectories but still skips dot files.
      - id: d
        text: "`-h`"
        rationale: Wrong. -h only changes how sizes are printed (K, M, G) in long listings.
    answer: [b]
    explanation: >
      Names starting with a dot are hidden by convention. ls -a shows them, together with the `.`
      and `..` entries; ls -A shows them without `.` and `..`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Using ls to List Files }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [ls, hidden-files]

  - id: 101-103.3-0011
    type: multi_choice
    difficulty: 2
    pool: holdout
    stem: >
      Which **TWO** `cp` options make `cp` copy a directory together with everything inside it?
    select_count: 2
    options:
      - id: a
        text: "`-R`"
        rationale: Correct. -R copies directories recursively.
      - id: b
        text: "`-s`"
        rationale: Wrong. -s makes symbolic links instead of copies; without -r it still skips directories.
      - id: c
        text: "`-r`"
        rationale: Correct. -r is the same as -R (and --recursive) in GNU cp.
      - id: d
        text: "`-l`"
        rationale: Wrong. -l makes hard links instead of copies; without -r it still skips directories.
    answer: [a, c]
    explanation: >
      Without a recursive option, cp skips directories with "-r not specified; omitting directory".
      -r, -R and --recursive all copy the directory and its whole tree.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Recursive Copy with cp -r }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [cp, recursion]

  - id: 101-103.3-0012
    type: multi_choice
    difficulty: 2
    pool: holdout
    stem: >
      The archive `/root/backup.tar` must be unpacked into `/opt/build`, which already exists.
      Which **TWO** commands do this?
    select_count: 2
    options:
      - id: a
        text: "`tar -xf /root/backup.tar /opt/build`"
        rationale: 'Wrong. A name after the archive is read as a member to extract; tar reports "/opt/build: Not found in archive".'
      - id: b
        text: "`tar -xf /root/backup.tar -C /opt/build`"
        rationale: Correct. -C (--directory) makes tar change to /opt/build before extracting.
      - id: c
        text: "`tar -cf /opt/build /root/backup.tar`"
        rationale: Wrong. This tries to create a new archive named /opt/build containing backup.tar; it extracts nothing.
      - id: d
        text: "`cd /opt/build && tar -xf /root/backup.tar`"
        rationale: Correct. tar extracts into the current directory, so changing there first works too.
    answer: [b, d]
    explanation: >
      tar extracts into the current working directory. Either change into the target first, or
      let tar do it with -C DIR (long form --directory=DIR).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Extracting an Archive }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [tar]

  - id: 101-103.3-0013
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      Some projects name their file `README`, others `Readme` or `readme`. Which `find` expression
      matches all of these spellings?
    options:
      - id: a
        text: "`-name readme`"
        rationale: Wrong. -name is case-sensitive, so it matches only the all-lowercase spelling.
      - id: b
        text: "`-name '[Rr]eadme'`"
        rationale: Wrong. This covers readme and Readme but not README.
      - id: c
        text: "`-iname readme`"
        rationale: Correct. -iname compares names without regard to letter case.
      - id: d
        text: "`-type readme`"
        rationale: Wrong. -type takes a single file type letter such as f or d, not a name.
    answer: [c]
    explanation: >
      -iname works like -name, wildcards included, but ignores case. For example
      `find ~ -iname '*.jpg'` also finds photo.JPG.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Using Criteria to Speed Search }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [find]

  - id: 101-103.3-0014
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: Which command copies the contents of `in.img` to `out.img` using `dd`?
    options:
      - id: a
        text: "`dd if=in.img of=out.img`"
        rationale: Correct. dd takes its input and output as if= and of= operands.
      - id: b
        text: "`dd in.img out.img`"
        rationale: Wrong. dd does not take plain file names; it reports an unrecognized operand.
      - id: c
        text: "`dd -i in.img -o out.img`"
        rationale: Wrong. dd has no -i or -o options; files are given with if= and of=.
      - id: d
        text: "`dd < in.img out.img`"
        rationale: Wrong. dd would read standard input, but out.img is still an unrecognized operand.
    answer: [a]
    explanation: >
      Unlike most GNU tools, dd uses operand=value syntax: if= (input), of= (output), bs= (block
      size), count=, skip=, seek=, conv=, status=. Without if= it reads standard input and without
      of= it writes standard output.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: The dd Command }
    verify:
      command: sh -c 'printf abc > /tmp/in.img && dd if=/tmp/in.img of=/tmp/out.img status=none && cat /tmp/out.img'
      expect: { exit_code: 0, stdout_contains: "abc" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [dd]

  - id: 101-103.3-0015
    type: fill_in
    difficulty: 2
    pool: holdout
    stem: >
      `big.log.bz2` was compressed with bzip2. Type a command that decompresses it so that
      `big.log` is created.
    fill_in:
      accepted:
        - '(sudo\s+)?((/usr)?/bin/)?(bunzip2(\s+(-k|-v|--keep|--verbose))*|bzip2\s+(-d|--decompress|-d[kv]+|-[kv]+d[kv]*))(\s+(\./)?big\.log\.bz2)?'
        - '(sudo\s+)?((/usr)?/bin/)?bzcat\s+(\./)?big\.log\.bz2\s*>\s*(\./)?big\.log'
      match: regex
      case_sensitive: true
    explanation: >
      bunzip2 big.log.bz2 (or bzip2 -d big.log.bz2) writes big.log and, unless -k is given,
      removes the .bz2 file. bzcat big.log.bz2 > big.log does the same while keeping the original.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Compressing with tar }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [bzip2, bunzip2]

  - id: 101-103.3-0016
    type: single_choice
    difficulty: 2
    pool: holdout
    stem: >
      The directory `projects` holds several files and subdirectories that you no longer need. You
      get the error shown. Which command removes `projects` and everything in it?
    exhibit: |
      $ rm projects
      rm: cannot remove 'projects': Is a directory
    options:
      - id: a
        text: "`rmdir projects`"
        rationale: Wrong. rmdir only removes empty directories and fails with "Directory not empty".
      - id: b
        text: "`rm -r projects`"
        rationale: Correct. -r makes rm descend into the directory and delete its contents, then the directory.
      - id: c
        text: "`rm -f projects`"
        rationale: Wrong. -f suppresses prompts and errors for missing files, but rm still will not remove a directory without -r.
      - id: d
        text: "`rm -i projects`"
        rationale: Wrong. -i only asks before each removal; the directory is still refused.
    answer: [b]
    explanation: >
      rm deletes directories only when told to recurse with -r (-R, --recursive). Because a recursive
      delete cannot be undone, check the path first; -i adds a prompt for each item.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Recursive Deletion with rm -r }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [rm, recursion]

  - id: 101-103.3-0017
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      Type the `touch` option that sets a file's access time to now while leaving its
      modification time unchanged.
    fill_in:
      accepted:
        - '(-a|--time(=|\s+)(atime|access|use))'
        - '(sudo\s+)?((/usr)?/bin/)?touch\s+(-a|--time(=|\s+)(atime|access|use))(\s+(?!-)\S+)+'
      match: regex
      case_sensitive: true
    explanation: >
      touch normally updates both times. -a changes only the access time and -m only the
      modification time; --time=atime (or access, use) is the long equivalent of -a.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Creating files with touch }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [touch, timestamps]

  - id: 101-103.3-0018
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      The command `tar -c_f logs.tar.bz2 logs/` should create a bzip2-compressed archive. Type the
      letter that belongs in place of the underscore.
    fill_in:
      accepted: ['-?j', '--bzip2']
      match: regex
      case_sensitive: true
    explanation: >
      GNU tar compresses while it archives: -z uses gzip, -j uses bzip2 and -J uses xz. The full
      command is `tar -cjf logs.tar.bz2 logs/`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Compressing with tar }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [tar, bzip2]

  - id: 101-103.3-0019
    type: multi_choice
    difficulty: 3
    pool: holdout
    stem: >
      A directory contains exactly the files shown. Which **TWO** patterns, used with `ls`, list
      `data7.csv` and nothing else?
    exhibit: |
      $ ls
      data.csv  data7.csv  data77.csv  dataX.csv
    select_count: 2
    options:
      - id: a
        text: "`data[0-9].csv`"
        rationale: Correct. Exactly one digit between "data" and ".csv" matches only data7.csv here.
      - id: b
        text: "`data?.csv`"
        rationale: Wrong. ? accepts any character, so dataX.csv matches as well.
      - id: c
        text: "`data7*.csv`"
        rationale: Wrong. * can match the second 7, so data77.csv matches as well.
      - id: d
        text: "`data[!A-Z].csv`"
        rationale: Correct. One character that is not an uppercase letter excludes dataX.csv; data.csv and data77.csv have the wrong length.
      - id: e
        text: "`data*[0-9].csv`"
        rationale: Wrong. The * lets data77.csv match too.
    answer: [a, d]
    explanation: >
      A bracket expression always stands for exactly one character; `[!...]` (or `[^...]` in bash)
      negates the set. `?` is one character of any kind and `*` any number, so they also accept the
      other names here.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Bracketed Characters }
    verify:
      command: sh -c 'mkdir -p /tmp/g && cd /tmp/g && touch data.csv data7.csv data77.csv dataX.csv && echo data[0-9].csv data[!A-Z].csv'
      expect: { exit_code: 0, stdout_regex: "^data7\\.csv data7\\.csv\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [globbing, wildcards]

  - id: 101-103.3-0020
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: Which command lists the files under `/var/log` that are larger than 50 MiB?
    options:
      - id: a
        text: "`find /var/log -size -50M`"
        rationale: Wrong. A leading minus means less than, so this lists small files.
      - id: b
        text: "`find /var/log -size +50M`"
        rationale: Correct. A leading plus means greater than, and M is the mebibyte unit.
      - id: c
        text: "`find /var/log -size 50M+`"
        rationale: Wrong. The sign must come first; find rejects this with "invalid -size type".
      - id: d
        text: "`find /var/log -size +50m`"
        rationale: Wrong. Size units are case-sensitive and m is not one of them; find rejects it.
    answer: [b]
    explanation: >
      -size takes a number with an optional unit (c bytes, k KiB, M MiB, G GiB; the default is
      512-byte blocks). `+n` means more than n units, `-n` less than n units, plain `n` exactly n.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Locating Files by Size }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [find, size]

  - id: 101-103.3-0021
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      Which `find` test selects files whose contents changed less than 72 hours ago?
    options:
      - id: a
        text: "`-mtime 3`"
        rationale: Wrong. Without a sign, find matches files whose age in whole days is exactly 3 (72 to 96 hours).
      - id: b
        text: "`-mtime +3`"
        rationale: Wrong. +3 selects files at least four whole days old.
      - id: c
        text: "`-atime -3`"
        rationale: Wrong. -atime tests the last access time, not the last modification.
      - id: d
        text: "`-mtime -3`"
        rationale: Correct. -3 means fewer than three whole days, i.e. modified within the last 72 hours.
    answer: [d]
    explanation: >
      -mtime counts the time since the last modification in 24-hour periods, dropping any
      fraction. A minus sign means less than, a plus sign more than, and no sign exactly.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Locating Files by Modification Time }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [find, mtime]

  - id: 101-103.3-0022
    type: single_choice
    difficulty: 3
    pool: holdout
    stem: >
      Which command creates a cpio archive `docs.cpio` holding the directory `docs` and everything
      below it?
    options:
      - id: a
        text: "`find docs | cpio -o > docs.cpio`"
        rationale: Correct. cpio -o reads the list of names from standard input and writes the archive to standard output.
      - id: b
        text: "`cpio -o docs > docs.cpio`"
        rationale: Wrong. In copy-out mode cpio does not accept file names as arguments; it fails with "Too many arguments".
      - id: c
        text: "`cpio -o -F docs.cpio docs`"
        rationale: Wrong. -F does name the archive file, but the extra argument docs is still rejected; the names must come on standard input.
      - id: d
        text: "`find docs | cpio -i > docs.cpio`"
        rationale: Wrong. -i is copy-in (extract) mode; it expects an archive on standard input, not a list of names.
    answer: [a]
    explanation: >
      cpio never walks directories itself. It archives exactly the names it is fed on standard
      input, which is why find is its usual partner: `find DIR | cpio -o > FILE`.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: The cpio Command }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [cpio]

  - id: 101-103.3-0023
    type: fill_in
    difficulty: 3
    pool: holdout
    stem: >
      Type the `mkdir` option that creates any missing parent directories along the given path
      (and does not complain if the directory already exists).
    fill_in:
