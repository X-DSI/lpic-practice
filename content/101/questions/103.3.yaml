      match: regex
      case_sensitive: true
    explanation: >
      `dd if=/dev/sda of=mbr.bin bs=512 count=1` reads one 512-byte block from the start of the disk.
      The operands can be given in any order. bs sets the block size and count how many blocks to copy.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: The dd Command }
    verify:
      command: sh -c 'head -c 4096 /dev/urandom > /tmp/disk && dd if=/tmp/disk of=/tmp/mbr.bin bs=512 count=1 status=none && wc -c < /tmp/mbr.bin'
      expect: { exit_code: 0, stdout_regex: "^\\s*512\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [dd]

  - id: 101-103.3-0032
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      `draft.txt` should be renamed to `final.txt`, but if a `final.txt` already exists it must be
      left untouched and you must not be asked anything. Which command does this?
    options:
      - id: a
        text: "`mv -i draft.txt final.txt`"
        rationale: Wrong. -i asks for confirmation before overwriting, and you must not be asked.
      - id: b
        text: "`mv -f draft.txt final.txt`"
        rationale: Wrong. -f overwrites final.txt without asking, which is what you want to avoid.
      - id: c
        text: "`mv -v draft.txt final.txt`"
        rationale: Wrong. -v only reports what was done; an existing final.txt is still overwritten.
      - id: d
        text: "`mv -n draft.txt final.txt`"
        rationale: Correct. -n (--no-clobber) never overwrites an existing destination and does not prompt.
    answer: [d]
    explanation: >
      By default mv overwrites silently. -i prompts first, -f forces overwriting, and -n refuses to
      overwrite. If several of these are given, the last one wins.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Moving Files with mv }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [mv]

  - id: 101-103.3-0033
    type: multi_choice
    difficulty: 4
    pool: holdout
    stem: >
      Which **TWO** commands produce `site.tar.gz`, a gzip-compressed tar archive of the directory
      `site`?
    select_count: 2
    options:
      - id: a
        text: "`tar -czf site.tar.gz site`"
        rationale: Correct. -c creates the archive, -z compresses it with gzip and -f names the output file.
      - id: b
        text: "`tar -cjf site.tar.gz site`"
        rationale: Wrong. -j compresses with bzip2; the name ends in .gz but the content is bzip2 data.
      - id: c
        text: "`gzip -r site`"
        rationale: Wrong. gzip -r compresses each file inside site separately; no tar archive is made.
      - id: d
        text: "`tar -cf - site | gzip > site.tar.gz`"
        rationale: Correct. tar writes the archive to standard output (-f -) and gzip compresses the stream.
      - id: e
        text: "`tar -xzf site.tar.gz site`"
        rationale: Wrong. -x extracts from an existing archive; it does not create one.
    answer: [a, d]
    explanation: >
      tar -z is shorthand for piping the archive through gzip, so `tar -czf` and
      `tar -cf - … | gzip > …` give the same kind of file. The file name does not choose the
      compression; the option does.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Compressing with tar }
    verify:
      command: sh -c 'mkdir -p /tmp/s/site && echo hi > /tmp/s/site/index.html && cd /tmp/s && tar -cf - site | gzip > site.tar.gz && tar -tzf site.tar.gz'
      expect: { exit_code: 0, stdout_contains: "site/index.html" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [tar, gzip]

  - id: 101-103.3-0034
    type: single_choice
    difficulty: 4
    pool: holdout
    stem: >
      You expected `find` to report both PNG files below, but it reports only one. Why?
    exhibit: |
      $ ls
      diagram.png  img
      $ ls img
      logo.png
      $ find . -name *.png
      ./diagram.png
    options:
      - id: a
        text: find does not descend into subdirectories unless -R is given
        rationale: Wrong. find is recursive by default; it has no -R option.
      - id: b
        text: The shell replaced *.png with diagram.png before find ran
        rationale: Correct. The unquoted pattern matched a file in the current directory, so find received -name diagram.png.
      - id: c
        text: -name only matches files in the starting directory; -path is needed for subdirectories
        rationale: Wrong. -name tests the base name of every file at every depth.
      - id: d
        text: logo.png is a hidden file, which find skips unless -a is given
        rationale: Wrong. logo.png does not start with a dot, and find does not skip hidden files anyway.
    answer: [b]
    explanation: >
      The shell expands wildcards before a command starts. Quote patterns meant for find
      (`find . -name '*.png'`) so they reach find unchanged. With two matches in the current
      directory, the unquoted form even makes find fail with "paths must precede expression".
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: How to Find Files }
    verify:
      command: sh -c 'mkdir -p /tmp/f/img && cd /tmp/f && touch diagram.png img/logo.png && find . -name *.png'
      expect: { exit_code: 0, stdout_regex: "^\\./diagram\\.png\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [find, globbing, quoting]

  - id: 101-103.3-0035
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      You wanted every file under `/srv/data` smaller than one mebibyte, but `find` returns only
      the empty file. Why?
    exhibit: |
      $ ls -l /srv/data
      total 300
      -rw-r--r-- 1 ana ana      0 Oct 25 13:16 empty.dat
      -rw-r--r-- 1 ana ana 300000 Oct 25 13:16 mid.dat
      -rw-r--r-- 1 ana ana    512 Oct 25 13:16 small.dat
      $ find /srv/data -type f -size -1M
      /srv/data/empty.dat
    options:
      - id: a
        text: "-size -1M means \"exactly 1 MiB or less\", and only the empty file is listed by mistake"
        rationale: Wrong. A leading minus means less than, not "or less", and the output here is the expected behaviour.
      - id: b
        text: "M counts 512-byte blocks, so -1M is less than 512 bytes"
        rationale: Wrong. M is mebibytes; only a size with no unit (or b) counts 512-byte blocks.
      - id: c
        text: "-type f leaves out files smaller than one 512-byte block"
        rationale: Wrong. -type f selects regular files of any size.
      - id: d
        text: "Sizes are rounded up to whole MiB, so every non-empty file counts as 1M"
        rationale: Correct. Sizes are rounded up to the unit before comparing, so only a 0-byte file is below 1M.
    answer: [d]
    explanation: >
      find rounds a file's size up to whole units of the given suffix before comparing. With M, a
      1-byte file and a 1048576-byte file both count as 1, so -size -1M matches only empty files.
      Count in bytes for an exact limit: -size -1048576c.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Locating Files by Size }
    verify:
      command: sh -c 'mkdir -p /tmp/z && cd /tmp/z && true > e && head -c 512 /dev/zero > s && find . -type f -size -1M'
      expect: { exit_code: 0, stdout_regex: "^\\./e\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Correct option shortened (was longest); explanation now gives -1048576c as the exact form, since -1024k also rounds." }
    tags: [find, size]

  - id: 101-103.3-0036
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      An archive was made from a list of regular files only. Extracting it into an empty directory
      fails as shown. Which command extracts it correctly?
    exhibit: |
      $ find web -type f | cpio -o > ~/web.cpio
      1 block
      $ cd /tmp/restore
      $ cpio -i < ~/web.cpio
      cpio: web/index.html: Cannot open: No such file or directory
      cpio: web/css/s.css: Cannot open: No such file or directory
      1 block
    options:
      - id: a
        text: "`cpio -iv < ~/web.cpio`"
        rationale: Wrong. -v only lists names as they are processed; the missing directories still cause the same errors.
      - id: b
        text: "`cpio -it < ~/web.cpio`"
        rationale: Wrong. -t only prints the table of contents; nothing is extracted.
      - id: c
        text: "`cpio -id < ~/web.cpio`"
        rationale: Correct. -d makes cpio create the leading directories it needs, such as web and web/css.
      - id: d
        text: "`mkdir web && cpio -i < ~/web.cpio`"
        rationale: Wrong. That fixes web/index.html, but web/css is still missing, so s.css fails.
    answer: [c]
    explanation: >
      cpio only creates what is in the archive. When the list fed to cpio -o had no directory
      entries, extraction needs -d (--make-directories) to create the parent directories. With
      directories in the list (plain `find web`), they come first and are made from the archive.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: The cpio Command }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [cpio]

  - id: 101-103.3-0037
    type: multi_choice
    difficulty: 5
    pool: holdout
    stem: >
      `src` contains the file `main`, the hidden file `.env` and the directory `sub`, which holds
      the hidden file `.hidden`. The directory `dst` exists and is empty. After running
      `cp -r src/* dst/` in bash with default settings, which **TWO** statements are true?
    select_count: 2
    options:
      - id: a
        text: "`dst/.env` does not exist"
        rationale: Correct. src/* does not match names that start with a dot, so .env is never given to cp.
      - id: b
        text: "`dst/src` is created, holding a copy of the whole tree"
        rationale: Wrong. The shell passes src/main and src/sub, so cp copies the contents, not src itself.
      - id: c
        text: cp fails with "omitting directory" for sub
        rationale: Wrong. That only happens without -r; with -r sub is copied recursively.
      - id: d
        text: "`dst/.env` exists because -r includes hidden files"
        rationale: Wrong. The selection is done by the shell's glob, before cp runs; -r cannot add what was never passed.
      - id: e
        text: "`dst/sub/.hidden` exists"
        rationale: Correct. sub is copied recursively, and cp copies everything inside it, hidden or not.
    answer: [a, e]
    explanation: >
      A leading dot must be matched explicitly, so * skips hidden entries at the level where the
      glob is expanded. Once cp -r copies a directory, it copies all of that directory's entries.
      `cp -r src/. dst/` copies the contents including .env.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: The Asterisk }
    verify:
      command: sh -c 'mkdir -p /tmp/h/src/sub /tmp/h/dst && cd /tmp/h && touch src/main src/.env src/sub/.hidden && cp -r src/* dst/ && test ! -e dst/.env && test -e dst/sub/.hidden && echo ok'
      expect: { exit_code: 0, stdout_contains: "ok" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [cp, globbing, hidden-files]

  - id: 101-103.3-0038
    type: fill_in
    difficulty: 5
    pool: holdout
    stem: >
      Type the `find` test, with its argument, that matches files last modified 11 or more full
      days ago. A file modified 10½ days ago must **NOT** match.
    fill_in:
      accepted:
        - '(find(\s+(?!-)\S+)*\s+(-type\s+f\s+)?)?-mtime\s+\+10'
        - '(find(\s+(?!-)\S+)*\s+(-type\s+f\s+)?)?(!|\\!|-not)\s+-mtime\s+-11'
      match: regex
      case_sensitive: true
    explanation: >
      find drops the fraction of a day before comparing, so a file 10½ days old counts as 10 days.
      `-mtime +10` means more than 10 whole days, i.e. 11 or more; `-mtime +11` would require 12.
      `! -mtime -11` expresses the same condition.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Locating Files by Modification Time }
    verify:
      command: sh -c 'mkdir -p /tmp/m && cd /tmp/m && touch -d "10 days ago 12 hours ago" a105 && touch -d "11 days ago 12 hours ago" a115 && find . -type f -mtime +10'
      expect: { exit_code: 0, stdout_regex: "^\\./a115\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Regex also accepts the test after -type f in a full find command." }
    tags: [find, mtime]

  - id: 101-103.3-0039
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      The directory `s` contains one file, `f`. The name `t` does not exist yet. You run
      `cp -r s t` and then, by mistake, run exactly the same command again. What does `t` contain
      afterwards?
    options:
      - id: a
        text: Only `f`; the second run fails because `t` already exists
        rationale: Wrong. An existing destination directory is not an error for cp; it copies into it.
      - id: b
        text: Only `f`; the second run overwrites `t/f` with the same data
        rationale: Wrong. That would require copying the contents of s, but the second run copies s itself into t.
      - id: c
        text: "`f`, plus a subdirectory `s` holding another `f`"
        rationale: Correct. The first run creates t as a copy of s; the second finds t existing and creates t/s.
      - id: d
        text: Only a subdirectory `s` that contains `f`
        rationale: Wrong. The first run already put f directly in t, and the second run does not remove it.
    answer: [c]
    explanation: >
      cp -r SRC DEST behaves differently depending on whether DEST exists. If not, DEST becomes the
      copy of SRC. If it is an existing directory, the copy goes inside it as DEST/SRC. Running the
      same command twice therefore nests a second copy.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Recursive Copy with cp -r }
    verify:
      command: sh -c 'mkdir -p /tmp/w/s && cd /tmp/w && touch s/f && cp -r s t && cp -r s t && find t | sort'
      expect: { exit_code: 0, stdout_regex: "^t\\nt/f\\nt/s\\nt/s/f\\s*$" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: fixed, notes: "Correct option shortened; it was the longest option." }
    tags: [cp, recursion]

  - id: 101-103.3-0040
    type: single_choice
    difficulty: 5
    pool: holdout
    stem: >
      You need bytes 1024 to 2047 of `disk.img` (its third and fourth 512-byte sectors) in a file
      `part.bin`. Which command copies exactly those bytes?
    options:
      - id: a
        text: "`dd if=disk.img of=part.bin bs=512 seek=2 count=2`"
        rationale: Wrong. seek skips blocks of the output; this copies the first 1024 bytes of the input.
      - id: b
        text: "`dd if=disk.img of=part.bin skip=1024 count=1024`"
        rationale: Wrong. With the default 512-byte block size this skips 512 KiB and copies another 512 KiB.
      - id: c
        text: "`dd if=disk.img of=part.bin bs=1024 skip=2 count=1`"
        rationale: Wrong. Skipping two 1024-byte blocks starts at byte 2048, so this copies bytes 2048 to 3071.
      - id: d
        text: "`dd if=disk.img of=part.bin bs=512 skip=2 count=2`"
        rationale: Correct. It skips two 512-byte input blocks (bytes 0 to 1023) and copies the next two.
    answer: [d]
    explanation: >
      skip and count are measured in input blocks (bs, default 512 bytes), and seek in output
      blocks. Offset = skip × bs and length = count × bs; here 2 × 512 = 1024 for both.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: The dd Command }
    verify:
      command: sh -c 'cd /tmp && head -c 4096 /dev/urandom > disk.img && dd if=disk.img of=part.bin bs=512 skip=2 count=2 status=none && head -c 2048 disk.img | tail -c 1024 | cmp - part.bin && echo same'
      expect: { exit_code: 0, stdout_contains: "same" }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [dd]

