  - id: 101-103.3-0047
    type: multi_choice
    difficulty: 2
    pool: practice
    stem: Which **TWO** commands decompress `data.csv.gz` back to `data.csv`?
    select_count: 2
    options:
      - id: a
        text: "`gzip data.csv.gz`"
        rationale: Wrong. Without -d, gzip tries to compress again and refuses because of the .gz suffix.
      - id: b
        text: "`bunzip2 data.csv.gz`"
        rationale: Wrong. bunzip2 only understands bzip2 data.
      - id: c
        text: "`gunzip data.csv.gz`"
        rationale: Correct. gunzip decompresses gzip files.
      - id: d
        text: "`gzip -d data.csv.gz`"
        rationale: Correct. gzip -d is the same as gunzip.
      - id: e
        text: "`tar -xzf data.csv.gz`"
        rationale: Wrong. The file is a compressed CSV, not a tar archive, so tar does not restore data.csv from it.
    answer: [c, d]
    explanation: >
      gunzip and gzip -d (--decompress) do the same thing: restore the file and remove the .gz
      version.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Compressing with tar }
    review:
      status: pass1
