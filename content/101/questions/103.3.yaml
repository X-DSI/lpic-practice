    tags: [ls]

  - id: 101-103.3-0045
    type: single_choice
    difficulty: 2
    pool: practice
    stem: Which command creates a gzip-compressed archive `site.tar.gz` from the directory `site`?
    options:
      - id: a
        text: "`tar -cjf site.tar.gz site`"
        rationale: Wrong. -j selects bzip2, so the archive would be bzip2-compressed despite its name.
      - id: b
        text: "`tar -czf site.tar.gz site`"
        rationale: Correct. -c creates, -z compresses with gzip, -f names the archive.
      - id: c
        text: "`tar -xzf site.tar.gz site`"
        rationale: Wrong. -x extracts from an existing archive.
      - id: d
        text: "`tar -tzf site.tar.gz site`"
        rationale: Wrong. -t lists the contents of an existing archive.
    answer: [b]
    explanation: >
      Combine one operation (-c) with a compression option (-z gzip, -j bzip2, -J xz) and -f with
      the archive name, followed by what to archive.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: Compressing with tar }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [tar, gzip]

  - id: 101-103.3-0046
    type: single_choice
