  - id: 101-103.3-0041
    type: single_choice
    difficulty: 1
    pool: practice
    stem: Which pattern matches every file in the current directory whose name ends in `.conf`?
    options:
      - id: a
        text: "`?.conf`"
        rationale: Wrong. ? is exactly one character, so this only matches names like a.conf.
      - id: b
        text: "`*.conf`"
        rationale: Correct. * matches any leading text, so every name ending in .conf matches.
      - id: c
        text: "`[conf]`"
        rationale: Wrong. This matches a one-character name that is c, o, n or f.
      - id: d
        text: "`.conf*`"
        rationale: Wrong. This matches names that start with .conf, such as .config.
    answer: [b]
    explanation: >
      The asterisk matches any string of characters, including an empty one, so `*.conf` covers
      `a.conf`, `sshd.conf` and `.conf`-ending names of any length (hidden files excepted).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: The Asterisk }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [globbing, wildcards]

  - id: 101-103.3-0042
    type: single_choice
    difficulty: 1
    pool: practice
    stem: Which command is used to rename a file?
    options:
      - id: a
        text: "`cp`"
        rationale: Wrong. cp makes a copy and leaves the original under its old name.
      - id: b
        text: "`rm`"
        rationale: Wrong. rm deletes files.
      - id: c
        text: "`mv`"
        rationale: Correct. mv moves files, and moving to a new name in the same directory renames.
      - id: d
        text: "`touch`"
        rationale: Wrong. touch creates empty files or updates timestamps.
    answer: [c]
    explanation: >
      Linux has no separate basic rename command in the 103.3 toolset: `mv old new` renames, and
      `mv file dir/` moves a file into another directory.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Moving Files with mv }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [mv]

  - id: 101-103.3-0043
    type: single_choice
    difficulty: 1
    pool: practice
    stem: >
      Which command copies data using operands such as `if=`, `of=` and `bs=`, and is often used to
      image whole disks?
    options:
      - id: a
        text: "`dd`"
        rationale: Correct. dd copies from if= to of= in blocks of bs bytes.
      - id: b
        text: "`cpio`"
        rationale: Wrong. cpio builds and extracts archives from a list of names on standard input.
      - id: c
        text: "`tar`"
        rationale: Wrong. tar creates and extracts archives with options such as -c, -x and -f.
      - id: d
        text: "`cp`"
        rationale: Wrong. cp copies files and directories with ordinary options and arguments.
    answer: [a]
    explanation: >
      dd copies raw bytes, so it can copy disks, partitions or parts of files, and convert data on
      the way (conv=). Its operand=value syntax sets it apart from most commands.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 2, section: The dd Command }
    review:
      status: pass1
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
    tags: [dd]

  - id: 101-103.3-0044
    type: single_choice
    difficulty: 1
    pool: practice
    stem: In the listing shown, what does the `d` at the start of the `scripts` line tell you?
    exhibit: |
      $ ls -l
      drwxr-xr-x 2 maria maria 4096 Mar  3 09:12 scripts
      -rw-r--r-- 1 maria maria  220 Mar  3 09:10 todo.txt
    options:
      - id: a
        text: It is a regular file
        rationale: Wrong. Regular files show a - in that position, like todo.txt.
      - id: b
        text: It is a symbolic link
        rationale: Wrong. Symbolic links show an l.
      - id: c
        text: It is a character device
        rationale: Wrong. Character devices show a c, as /dev/null does.
      - id: d
        text: It is a directory
        rationale: Correct. A leading d marks a directory.
    answer: [d]
    explanation: >
      The first character of a long listing gives the file type: - regular file, d directory,
      l symbolic link, c character device, b block device, p named pipe, s socket.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "103.3", lesson: 1, section: Using ls to List Files }
