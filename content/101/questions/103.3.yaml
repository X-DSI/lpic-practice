        - '(sudo\s+)?((/usr)?/bin/)?mkdir\s+(-p|--parents|-pv|-vp)(\s+(?!-)\S+)+'
      match: regex
      case_sensitive: true
    explanation: >
      mkdir -p a/b/c creates a, a/b and a/b/c as needed. Without -p, mkdir fails if a parent is
