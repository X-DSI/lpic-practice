  - id: 101-102.6-0011
    type: single_choice
    difficulty: 1
    pool: practice
    stem: Which of these is a Type-2 hypervisor, running as an application on an existing operating system?
    options:
      - id: a
        text: Oracle VM VirtualBox
        rationale: Correct. VirtualBox is installed on Linux, macOS or Windows and needs that host OS to run.
      - id: b
        text: Xen
        rationale: Wrong. Xen is a Type-1 hypervisor that the machine boots into directly.
      - id: c
        text: VMware ESXi
        rationale: Wrong. ESXi is a bare-metal (Type-1) hypervisor installed directly on the server.
      - id: d
        text: LXC
        rationale: Wrong. LXC is a container technology, not a hypervisor; containers share the host kernel.
    answer: [a]
    explanation: >
      Type-2 (hosted) hypervisors run as software on a normal OS, which manages the hardware.
      Type-1 (bare-metal) hypervisors manage the hardware themselves.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.6", lesson: 1, section: Virtualization Overview }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [hypervisor, virtualbox, type-2]

  - id: 101-102.6-0012
    type: single_choice
    difficulty: 2
    pool: practice
    stem: >
      Your database instance in an IaaS cloud needs an extra 500 GB virtual disk that the guest can
      partition and format. Which kind of cloud resource do you add?
    options:
      - id: a
        text: A computing instance
        rationale: Wrong. A computing instance is a virtual machine itself, billed mainly for its CPU time and size.
      - id: b
        text: A VPN gateway
        rationale: Wrong. A VPN gateway links the cloud network to another network; it provides no storage.
      - id: c
        text: A block storage volume
        rationale: Correct. Block storage appears in the guest as a disk device it can partition, format and mount.
      - id: d
        text: A public DNS record
        rationale: Wrong. A DNS record gives a name to an address; it provides no storage.
    answer: [c]
    explanation: >
      IaaS planning covers computing instances (VMs and their CPU time), block storage (virtual disks,
      priced by size and speed) and networking (subnets, routes, firewalls, DNS, VPN links).
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.6", lesson: 1, section: Deploying Virtual Machines to the Cloud }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [iaas, block-storage]

  - id: 101-102.6-0013
    type: multi_choice
    difficulty: 2
    pool: practice
    stem: Which **TWO** statements about Linux containers are true?
    select_count: 2
    options:
      - id: a
        text: Containers rely on kernel features such as cgroups to limit an application's resources.
        rationale: Correct. cgroups limit memory, CPU and I/O; namespaces provide the isolation.
      - id: b
        text: An application container image includes its own Linux kernel.
        rationale: Wrong. Every container on a host runs on the host's kernel; the image holds only user-space files.
      - id: c
        text: Containers only run on CPUs with Intel VT-x or AMD-V enabled.
        rationale: Wrong. Containers need no CPU virtualization extensions; those are for hardware-assisted VMs.
      - id: d
        text: A system container such as LXC can run an init system and several services.
        rationale: Correct. A system (Linux) container runs a whole distribution's user space, much like a lightweight VM.
    answer: [a, d]
    explanation: >
      An application container (for example, Docker) usually runs one application; a system or Linux
      container (LXC/LXD, systemd-nspawn) runs a full user space with its own init. Both share the
      host kernel and are isolated with namespaces and cgroups.
    source: { material: LPI Learning Materials 101-500, material_version: "2025-03-12", objective: "102.6", lesson: 1, section: Containers }
    review:
      status: pass2
      history:
        - { stage: pass1, by: claude-writer, date: "2026-10-25", result: ok }
        - { stage: pass2, by: claude-reviewer, date: "2026-10-25", result: ok, notes: "Answered cold, matches key; checked." }
    tags: [container, cgroups, application-container, linux-container]

