  - id: 101-102.6-0015
    type: single_choice
    difficulty: 3
    pool: practice
    stem: >
      A script must find out whether it runs inside a container, and must not report VM-based
      virtualization. Which `systemd-detect-virt` option does that?
    options:
      - id: a
        text: "`-v`"
        rationale: Wrong. -v (--vm) does the opposite; it detects only VM virtualization and ignores containers.
      - id: b
        text: "`-c`"
        rationale: Correct. -c (--container) detects only container environments such as docker, lxc or systemd-nspawn.
      - id: c
        text: "`-r`"
        rationale: Wrong. -r (--chroot) checks whether the program runs in a chroot, not in a container.
      - id: d
        text: "`--list`"
        rationale: Wrong. --list prints every virtualization type systemd knows about; it detects nothing.
